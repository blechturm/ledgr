    evidence: ["4fcbc3e: ledgr_walk_forward() calls ledgr_walk_forward_refuse_gapped_carry() under carry_test_state before the session identity, any training sweep or store write. It reads the pulse calendar once over the test span (open-session closes for availability experiments, the universe's distinct bar timestamps for dense ones) and counts pulses between consecutive test windows with two findInterval() calls; the first gap raises ledgr_walk_forward_gapped_carry (also ledgr_walk_forward_invalid_fold_window) naming both windows, the pulse count and the two remedies. Single folds, contiguous and overlapping fold lists and flat_test_state are unchanged; the existing walk-forward suites pass unchanged.", "LTB-0204/LCL-0204 (fast, 0.9 s) pin the class, message, empty store, contiguous and single-fold acceptance and the dense calendar. Oracle group wfgap is 3/3 after the fix and invariance11 keeps flat_test_state over the same folds DONE; before it the session was PARTIAL with an INCOMPLETE test run after CCC delisted inside the gap. Help, contracts (Walk-forward, Gapped carry), the condition reference and NEWS describe the rule.", "Side finding, routed and not fixed here: ledgr_folds_rolling() started on the 31st of a month with a one-month step builds non-contiguous test windows (2020-05-01 falls between two test windows when starting 2019-12-31), because month arithmetic from day 31 overflows; the new check refuses such a list under carry_test_state. The fold constructor's month arithmetic needs its own ticket.", "725eb4e: the full local suite found LTB-0024 (heavy protocol) and the walk-forward article using test windows with a session between them under the default carry_test_state, now refused. LTB-0024 ends its first test window the day before the second starts, keeping both instrument gaps inside and its assertions unchanged; the article steps by one month (three folds instead of two), explains why carrying needs contiguous test windows, widens test_window and step together in its exercise and quotes the new Sharpe range. This is a user-visible behavior change for gapped fold lists, disclosed in NEWS.", "Close-review correction B1, maintainer Type 2 decision 2026-10-09 (9d31b4a): under carry_test_state consecutive test windows must be chronologically ordered and contiguous, each starting strictly after the previous one ends with no pulse between them. ledgr_walk_forward_refuse_noncontiguous_carry() (renamed from ledgr_walk_forward_refuse_gapped_carry()) first refuses a window that does not start after its predecessor ends, overlap or reverse order, with ledgr_walk_forward_overlapping_carry, using fold timestamps only, then counts pulses between windows as before; both classes share ledgr_walk_forward_invalid_fold_window and each message names the first offending pair and the two remedies. flat_test_state accepts any layout; reconstructing carried state at an overlapping window's start was rejected. LTB-0204 (fast) adds overlapping and reverse-ordered lists, and removing the ordering check fails two of its expectations; LTB-0208/LCL-0208 (review) run gapped, overlapping and reverse-ordered lists under flat_test_state to DONE. Contracts (Walk-forward, Contiguous carry, replacing the Gapped carry bullet that promised overlapping lists unchanged), help, the condition reference, NEWS and the walk-forward article describe the rule; the horizon entry is archived as horizon_archive.md#resolved-015. The full local suite ran 1,047 blocks with only the pre-existing demo-strategy error, and the continuity oracle still passes --expect post against evidence/pre_cut11_r2."]
