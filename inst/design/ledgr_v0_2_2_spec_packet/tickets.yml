    evidence: ["a4c90625. ledgr_valuation_stale() defaults to max_sessions = 5. An availability-aware experiment without valuation_policy runs under ledgr_valuation_stale(); that is the same record and config identity as declaring it (pinned by LTB-0233). A defaulted policy never activates availability: a snapshot without availability facts stays dense with no policy in its config. The plan, ledgr_valuation_summary() (max_sessions_default), summary() and print() mark a horizon of 5 as '(default)'.", "Deviation (maintainer decision on review F4, 2026-10-11): the default marker follows the value, as for every plan assumption, so an explicitly written ledgr_valuation_stale(5) also shows '(default)'; a declared horizon other than 5 carries no marker. LTB-0233 / LCL-0231; mutation-verified (policy not defaulted, plan flag off, summary flag off).", "Fixture lane (evidence/ladder15 to ladder17, from the Workstream 24 record ladder14/WS24-codex2): 73f71e22 and 397dc565 compare byte-identical (51 of 51 families) with their predecessor. a4c90625 differs only in intended families: the identity family (config hashes and the walk-forward session_id under identity rule 2), wf_folds and wf_scores (test run IDs and candidate labels derived from the session ID), the corporate-action summaries (one added price_basis_default row) and the valuation summaries (added max_sessions_default and point-in-time basis fields); fills, ledger, equity and positions are identical. b14eee85 and 2fbb24cd compare byte-identical with their predecessors. Paired clocks (evidence/clocks/ws25b, three pairs, be3aaf0a against 2fbb24cd): elapsed ratios 0.944 to 1.029 except dense at 1.085 (pairs 1.034, 0.999 and 1.101 on a 0.76 s phase), which exceeds the 1.05 rule; rerun alone (evidence/clocks/ws25-dense, five pairs) dense is 1.004 (per pair 0.997 to 1.018), so the excursion was noise. Peak ratios 0.964 to 1.053; the availability peak at 1.053 is a steady +62 MiB in every pair, inside the documented peak band of about 14 percent but above the 1.05 rule; the maintainer accepted it as an explicit exception to the rule for this workstream (decision 3). The first clocks (evidence/clocks/ws25, at a4c90625) showed promote at 1.06 (ledgr_promote() called ledgr_run_info() for one feature-set hash, which reads the run row, parses its config and reads completion and promotion context; the hash is already in the committed config) and the availability reader at 1.06 (assumption-basis reads the run-assumption flags discarded); 2fbb24cd fixed both (promote 0.996, availability 1.025). Reviews: agent close review CHANGES_REQUIRED (F1 blocking; F2 NEEDS_TYPE_2, decided by the maintainer), fixed in b14eee85; focused re-review PASS at 4b0710c8 (no code defect; evidence wording corrected in 863ce3c1). Codex close review of 863ce3c1 CHANGES_REQUIRED (no execution defect): three failure-sensitivity gaps (feature-set promotion variant, trading-status-only refusal, rule-1 walk-forward fork), fixed with mutation-verified tests; the availability peak and the fast-profile gate are decided by the maintainer (decisions 3 and 4)."]
