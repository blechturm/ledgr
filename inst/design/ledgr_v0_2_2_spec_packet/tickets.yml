    scope: "Before any production edit, commit a vendor-neutral public ledgr_run() runner and its checker. They measure fresh-process peak child RSS, peak-so-far per run phase (run start, hydration, feature series, setup, fold, finalize) and elapsed time at 1,514 sessions, 600 physical instruments, 500 members and three returns features. The oracle strategy is the trading, feature-reading monthly top-10 momentum strategy; one dense run of the same bars covers the dense fold. Persistence-on and persistence-off variants are both recorded. The runner may reuse the Workstream 11 harness. Fix in this ticket, before any candidate clock: at least five alternating baseline/candidate pairs; the median of per-pair ratios; a candidate/baseline peak-child-RSS gate of at most 0.90 and an elapsed ceiling of at most 1.05; and the Workstream 11 retry rule, under which a miss gets one complete fresh retry of the same pair count and stands only if the retry also misses. Then release bars_all, raw_bars_by_id, aligned bars_by_id, bars_cols_by_id, run_feature_series and run_feature_matrix, each at its last production read. Pass an empty compatible bars_by_id to the execution spec. Skip the full-range ledgr_projection_slice() copy when the persisted pulses equal the projection's pulses. Read ledger events in finalization only on the branch that uses them. Add no explicit gc(). If liveness, exactness, memory or runtime evidence fails, record rejection and leave production unchanged."
    acceptance: ["a committed source-liveness record names the last production read of each released object, proves no later read exists, and distinguishes retained static_bars_views, bars_mat, runtime_projection, fold state and persistence inputs from the six released intermediates", "fast-lane staged-release detectors capture the runner at the start of feature computation and at fold entry: bars_all, raw_bars_by_id and bars_cols_by_id are already absent or NULL while bars_by_id is still present at the feature boundary; all six released objects are absent or NULL and execution$bars_by_id is empty at fold entry; delaying the early releases until just before the fold or removing any release fails a detector", "the runner uses public ledgr APIs and records environment, commits, clean product-tree status per arm, arm order, phase timestamps, peak child RSS, elapsed time, completion and normalized public outputs for the registered pairs; the thresholds and retry rule appear in the ticket before the first candidate clock", "the median candidate/baseline peak-RSS ratio is at most 0.90 and the elapsed ratio at most 1.05 independently for persistence-on and persistence-off variants of the registered trading oracle, recomputed from unmarked raw rows; phase peaks come from separate paired marked runs using the same measurement in both arms or from non-perturbing external sampling aligned to phase timestamps; the record reports which phase sets each peak, keeps every measured row, and keeps an environment or harness failure visible rather than turning it into timing evidence", "on the trading oracle, the dense run and both persistence variants, completion, equity, fills, trades, diagnostics, decoded strategy state, persisted feature rows when persistence is on, and availability results are exact across arms; a deliberately changed normalized output makes the checker fail", "persisted feature rows and equity prove the full-range slice skip and finalization branch exact; separate call and query counters require that ledgr_projection_slice() is not called when persisted pulses equal all projection pulses and that availability finalization does not fetch ledger events it will not use, while the branches that need either operation still do so; restoring either discarded operation fails its counter", "adding an explicit gc(), removing an execution-spec field or releasing a live object fails a registered detector or semantic oracle", "the ordinary Workstream 11 suite and fast profile pass; the record makes no sweep, walk-forward, parallel-worker, peer or general memory-architecture claim", "tests/claims.yml registers every new load-bearing deterministic block with its independent oracle, smallest failing change, cheapest adequate lane and overlap; Cut 5, Workstream 12 and LDG-2951 reconcile before Type 1 close review"]
    evidence: ["The maintained runner, checker, same-tree calibration and preregistered gates landed before production edits in commits 6b0cee3 through 55e817d. The production change landed at f8080a7 and releases all six named intermediates at their last reads, preserves execution$bars_by_id as an empty list, avoids the full-range projection slice and reads ledger events only on the reconstruction branch. LCL-0155/LTB-0155 and LCL-0156/LTB-0156 are the staged-liveness and discarded-work detectors.", "The checked-in candidate record under dev/bench/v0_2_2_durable_run_memory/evidence/ldg_2951_candidate compares 55e817d with f8080a7 over five alternating unmarked pairs per persistence variant. Median peak-child-RSS ratios are 0.8566 off and 0.8683 on; elapsed ratios are 0.9981 and 0.9991. No retry was required. Separate marked runs show live memory falling from 483.8 to 361.9 MiB at the feature boundary and from 526.7 to 352.2 MiB at fold entry. Every registered public output and the dense witness match exactly, and the mutation self-test is detected.", "The fast profile passed 513 of 513 blocks in 85.61 seconds against 112 seconds at C:/tmp/ledgr-ws12-ldg2951-fast-explicit. The ordinary Workstream 11 suite completed in 610.10 seconds at C:/tmp/ledgr-ws12-ldg2951-lwreg-r461; cold paired-ratio medians are 0.996 to 1.009 and warm medians are 0.995 to 1.053, all below 1.10, with semantic and checker self-tests green."]
  - id: "LDG-2952"
    title: "Resolve strict built-in dispatch once per feature definition"
    workstream: 12
    status: "complete"
    priority: "P0"
    effort: "S"
    dependencies: ["LDG-2951"]
    scope: "ledgr_strict_builtin_kind() (R/features-engine.R) rebuilds ledgr_ind_sma(width) and ledgr_ind_returns(width) and deparse-fingerprints them on every call. ledgr_compute_feature_series_strict() calls it once per instrument per feature from the run hydration loop (R/backtest-runner.R) and the sweep and walk-forward precompute (R/precompute-features.R), although the result depends only on the feature definition. Resolve the dispatch kind once per feature definition per call site and reuse it for every instrument. Keep the existing dispatch rule exactly: canonical-fingerprint matching, custom and impersonating definitions on the scalar path, and the gap-contract and column guards. Before the production edit, fix this ticket's gate against the LDG-2951 runner and oracle. The baseline is the committed tree after LDG-2951 is accepted; the candidate differs from that exact tree only by LDG-2952. The candidate/baseline median cold elapsed ratio comes from unmarked runs and must be at most 1.00. The feature-phase peak-so-far ratio must be at most 1.00 under separate paired marked runs using the same method in both arms or non-perturbing external sampling aligned to phase timestamps. Both use the same retry rule and report the measured gains. Record the expected availability feature-engine digest change as provenance. Add no cache across runs and no change to feature values, masks, fingerprints or failure behavior."
    acceptance: ["a fast-lane counter around built-in kind resolution uses one canonical SMA and one canonical returns definition and shows exactly one resolution per definition in a public availability run at two instrument counts (for example 2 and 4 instruments), and the same through the sweep precompute path; exact values identify each kind, restoring per-instrument resolution fails the count and swapping the SMA and returns kind mapping fails the values", "LTB-0142, LTB-0143 and LTB-0144 pass with their existing oracles. Feature values, NA masks, dispatch splits and impersonation refusals are unchanged. The availability feature-engine digest change is recorded as expected provenance, with the dense digest and indicator fingerprints byte-identical", "on the LDG-2951 runner, oracle and dense run, all public outputs are exact across arms; the unmarked elapsed gate and symmetrically measured feature-phase gate pass, and the record reports the measured allocation and elapsed change without claiming more than the registered shape", "the ordinary Workstream 11 suite and fast profile pass", "tests/claims.yml registers the new counter block with its independent oracle, smallest failing change, cheapest adequate lane and overlap with LCL-0143 and LCL-0153; Cut 5, Workstream 12 and LDG-2952 reconcile before Type 1 close review"]
    evidence: ["The dispatch gate was committed at e849329 against accepted LDG-2951 baseline 9896a71 before the production implementation. The hoist and LCL-0157/LTB-0157 landed at 5f327a8. Two- and four-instrument public availability runs and the public sweep precompute path resolve exactly one SMA and one returns kind per definition; closed-form final-state values distinguish the two mappings. The pre-hoist implementation failed the counter with 4, 8 and 4 calls, and an independently mocked SMA/returns swap fails the value oracle.", "The checked-in dispatch record under dev/bench/v0_2_2_durable_run_memory/evidence/ldg_2952_candidate compares 9896a71 with 5f327a8 over five alternating unmarked pairs per persistence variant. Median elapsed ratios are 0.9466 off and 0.9504 on. Separately marked feature-phase peak ratios are 0.9570 and 0.9568. No retry was required. Supporting Rprofmem attribution reduces strict-kind resolution allocation from 270,552,976 bytes over 1,800 calls to 451,456 bytes over three calls; this is dispatch work only, not a whole-run claim.", "Every registered public output and dense witness match exactly. The availability feature-engine digest changes from 90e2932cc2794212119b60d7be4abd5ea7fd4ead28119adbc278247f2bad267e to 6bd61d705a94f2cd955b5eab2a526f65e36419393de0baef4d95c64718658a76; the dense digest and SMA and returns fingerprints remain byte-identical. LTB-0142 through LTB-0144 pass. The fast profile passed 514 of 514 blocks in 87.22 seconds at C:/tmp/ledgr-ws12-ldg2952-fast. The ordinary Workstream 11 suite completed in 605.94 seconds at C:/tmp/ledgr-ws12-ldg2952-lwreg; all cold and warm paired-ratio medians are 0.985 to 1.041, below 1.10, with semantic and checker self-tests green."]
  - id: "LDG-2953"
    title: "Version the terminal-outcome corporate-action policy"
    workstream: 13
    status: "complete"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2952"]
    scope: "Advance ledgr_corporate_actions() and its stored identity to policy_schema_version 2. Extend held_terminal_position with haircut and write_off, accept either one fallback choice or an ordered exact-label map with a required default entry, and record one finite haircut fraction when the map uses haircut. Add frozen_terminal_position with the closed menu write_off, last_mark and refuse. The research preset defaults to last_permissible for an ordinary terminal and write_off for a frozen terminal; the strict preset refuses both. Mint v002 identities for the widened held-terminal meanings. Preserve v001 as historical meaning, but do not silently accept a schema-1 identity as schema 2. Stored runs whose config carries the schema-1 corporate-action identity remain readable: ledgr_run_open(), ledgr_run_info() and result readers succeed and report the recorded schema-1 identity unchanged. Resume, rerun and promotion of such a run under schema 2 refuse with a typed condition rather than reinterpreting it. This ticket owns constructors, validators, identity and help only; it emits no events."
    acceptance: ["scalar and ordered exact-label policy shapes construct with deterministic identities, unmatched labels resolve to the required default, and changing label text, label order, choice, haircut or frozen fallback changes identity", "haircut requires exactly one finite fraction in the closed interval zero to one when used and is rejected when malformed; duplicate labels, missing default, unknown choices, unnamed maps and vendor-synonym interpretation fail with the existing corporate-action policy condition vocabulary", "research and strict presets resolve to the accepted ordinary and frozen defaults, every widened choice carries a v002 identity, and a schema-1 stored identity with the old fixed field set is not accepted as schema 2", "removing ordered-map identity, permitting one malformed policy shape or restoring the v001 identity fails a registered detector", "a stored run created before this ticket, with a schema-1 corporate-action identity, reopens and returns its results with that identity unchanged, while resume, rerun and promotion of it refuse with a typed condition; making reopen fail with invalid config_json, or letting resume or promotion proceed by reinterpreting the identity, fails a registered witness", "the public help distinguishes evidence from each modeled choice and states that exact label normalization belongs upstream", "each new load-bearing block is registered in tests/claims.yml with the five review obligations and Cut 6, Workstream 13 and LDG-2953 reconcile before review"]
    evidence: ["Corporate-action policy schema 2 lands in R/corporate-action-policy.R. held_terminal_position is stored as ordered parallel labels and v002 policy_ids arrays, so key-sorted canonical JSON keeps map order; one scalar choice is the map with only its default entry, and haircut_fraction enters identity only when a haircut choice is used. frozen_terminal_position is a new field with v001 ids; cash_amount, cash_posting and unsupported_quantity keep v001. ledgr_corporate_action_resolve_terminal() matches exact labels and sends unmatched or missing labels to default. Readers in R/corporate-action-results.R decode both schemas through ledgr_corporate_action_identity_decode(), which builds the named policy once per call: a schema-1 run reports its recorded v001 identity unchanged, and disposition counts accept both id versions.", "Execution requires schema 2 through ledgr_policy_schema_require_current(): run preparation checks the submitted config, and registration checks the stored config of an existing run id before the hash check. The refusal is ledgr_policy_schema_mismatch, a subclass of ledgr_run_hash_mismatch documented in ledgr_condition_classes. Branch-internal window until LDG-2955: a scheduled acquisition disposition whose default is haircut or write_off refuses with ledgr_corporate_action_unsupported and emits no event, rather than settling at a mark; last_permissible and last_mark still settle and record their v002 id.", "LTB-0158 (LCL-0158, fast) covers construction, exact-label resolution, identity movement for label text, label order, default position, choice, haircut and frozen fallback, 24 malformed shapes, presets, v002 ids and schema-1 refusal. LTB-0160 (LCL-0160, fast) is the C2 witness shared with LDG-2954: a run rewritten to the schema-1 policy records from the reviewed v0.2.0.1 fixture reopens through ledgr_run_open(), ledgr_run_info() and the corporate-action summary with those records unchanged, while rerun, promotion into it, interrupted resume and direct execution refuse typed, call no strategy and leave every run-keyed table unchanged. LTB-0161 (LCL-0161, fast) pins the help. LTB-0032, LTB-0034, the v0.2.0.1 identity witness (now with a documented schema exception) and the rendered corporate-action-cash vignette were updated for v002 and the new field; the summary setting and identity columns widened by one character to fit frozen_terminal_position.", "Mutations in a disposable clone each fail the intended block: identity reduced to the default id, labels sorted, missing default accepted, unused haircut accepted, haircut dropped from identity, v001 held id restored, research frozen default changed, a relabeled schema-1 identity accepted as schema 2, reopen rejecting schema 1, the registration gate removed, the preparation gate removed and the help normalization sentence removed. Suite results are recorded once under LDG-2954."]
  - id: "LDG-2954"
    title: "Version valuation-horizon exhaustion policy"
    workstream: 13
    status: "complete"
    priority: "P0"
    effort: "S"
    dependencies: ["LDG-2953"]
    scope: "Advance ledgr_valuation_stale() and its stored identity to schema_version 2 and add exhausted = freeze or refuse, defaulting to freeze. Keep max_sessions mandatory and unchanged in meaning: it is the maximum age of an ordinarily permissible carried mark. This ticket owns construction, validation, identity and help only; it does not yet change fold behavior. Until LDG-2956 lands, the fold still applies today's horizon stop even though identity records exhausted = freeze; this branch-internal window is never released. Pre-release schema-1 policy artifacts are not silently reinterpreted. Stored runs with a schema-1 valuation policy stay readable through ledgr_run_open(), ledgr_run_info() and result readers, reporting the recorded identity unchanged. Resume, rerun and promotion of such a run under schema 2 refuse with a typed condition."
    acceptance: ["the omitted exhausted argument resolves to freeze, an explicit refuse remains distinct, and both choices enter deterministic run and experiment identity beside max_sessions", "max_sessions validation and the no-default-horizon contract remain unchanged, and unknown, missing or malformed exhaustion values fail with the existing valuation-policy condition vocabulary", "a schema-1 identity is rejected where schema 2 is required rather than receiving an implicit exhausted value", "a stored run created before this ticket, with a schema-1 valuation policy, reopens and returns its results with that identity unchanged, while resume, rerun and promotion of it refuse with a typed condition; failing reopen with invalid config_json, or resuming it with an implicit exhausted value, fails a registered witness", "removing exhausted from identity, changing its default or accepting the old schema as current fails a registered detector", "the public help explains that max_sessions separates ordinarily stale valuation from either explicit freezing or refusal and does not establish an economic terminal", "each new load-bearing block is registered in tests/claims.yml with the five review obligations and both Workstream 13 tickets reconcile before close review"]
    evidence: ["ledgr_valuation_stale(max_sessions, exhausted = \"freeze\") records schema_version 2 with exhausted beside max_sessions; refuse is distinct, partial matches and other values fail with ledgr_invalid_valuation_policy, and max_sessions keeps its validation and has no default. ledgr_valuation_policy_record_version() accepts only the exact schema-1 shape or schema 2, so a schema-1 record never receives an implicit exhausted value and schema 1 plus exhausted is invalid. Config validation keeps schema-1 records readable; execution, resume, rerun and promotion refuse them through the same ledgr_policy_schema_require_current() gate as LDG-2953. No fold change: until LDG-2956 the fold still applies the horizon stop while identity records freeze, a branch-internal window that is never released.", "LTB-0159 (LCL-0159, fast) covers defaults, invalid values, run-config and walk-forward experiment hashes for freeze against refuse, and schema-1 refusal. LTB-0160 covers the stored schema-1 valuation record. LTB-0161 pins the help, which separates ordinary stale valuation from freeze or refuse and states that neither establishes an economic terminal. The API formals pin for ledgr_valuation_stale() now lists exhausted. Mutations that drop exhausted, change its default, accept a partial match or treat schema 1 as current each fail LTB-0159.", "Workstream 13 verification on the working tree over 00b6887: the full suite ran 1000 blocks and 10384 expectations, and its only failure was that intended API formals pin, which then passed. The fast profile passes 518 of 518 blocks with tests/claims.yml reconciled. Its cost was measured with alternating fresh-process runs from same-location clones: baseline 00b6887 took 87.93 and 87.36 seconds, the candidate 87.95 and 88.56 seconds. The four new blocks add 2.35 seconds of census time and the 514 shared blocks are unchanged. A single earlier 97.86 second run contained a one-off 10.9 second stall in LTB-0014 that did not recur in eight later runs (0.90 to 1.01 seconds). After the decode-once cleanup the profile passed in 88.40 seconds. The documentation-contract suite passed 23 blocks and 995 expectations. R CMD build (with QUARTO_PATH set) and R CMD check --no-manual --no-build-vignettes ran in a disposable clone: Rd, codoc and usage checks passed, and all 24 vignettes ran. The status was 1 ERROR and 1 NOTE, neither from this workstream. The NOTE names two existing over-100-byte paths, ws7_explicit_map_micro_evidence/explicit_map_conformance.csv and ws6_diagnostic_sequence_evidence/incremental_query_clocks.csv. The ERROR is the LDG-2950 long-window control test, which runs a dev/bench script that the built tarball excludes. The Type 1 close review reproduced the check and confirmed both causes exist at 00b6887."]
  - id: "LDG-2955"
    title: "Apply modeled outcomes to sealed lifetime terminals"
    workstream: 14
    status: "complete"
    priority: "P0"
    effort: "L"
    dependencies: ["LDG-2954"]
    scope: "Widen the existing held-terminal disposition trigger from scheduled corporate-action rows to held instruments covered by an effective sealed known_inactive lifetime row with a nonempty terminal_event. Supported settlement evidence runs first. Resolve the exact sealed label through the version-2 corporate-action policy and post one atomic DISPOSITION at the effective pulse before the strategy decision; it is never a fill. Implement last_permissible, last_mark, haircut, write_off and refuse. An unlabeled known-inactive holding and a modeled choice without its required qualifying mark stop INCOMPLETE with typed reasons and a preserved accepted prefix; replace the current no-mark abort without swallowing unrelated errors."
    acceptance: ["a table-driven public run covers all five ordinary choices, exact-label override and unmatched default with exact event count, event ordering, price, cash delta, quantity delta, realized result, final position, completion and policy identity", "supported settlement evidence pre-empts every modeled terminal choice, and deleting that precedence produces a second or wrong event and fails the detector", "an empty terminal label takes the unsupported-terminal typed stop, a missing qualifying mark takes the new no-mark typed stop, both preserve the accepted prefix, and neither aborts nor silently writes off", "the terminal DISPOSITION is visible identically from memory and durable event readers and runs before the terminal pulse strategy call; moving it after the call or converting it to a FILL fails the registered witness", "failure before append leaves cash, lots, positions and event sequence unchanged, and the existing compiled-event envelope still refuses any unsupported pulse event", "each new load-bearing block is registered in tests/claims.yml with the five review obligations and LDG-2955 evidence names every exercised synthesis gate"]
    evidence: ["R/terminal-outcomes.R adds ledgr_terminal_resolve() and the atomic ledgr_disposition_post() writer, shared by scheduled corporate-action rows and sealed lifetime terminals. In the fold, scheduled-row settlement runs first. A held known_inactive holding then resolves its exact sealed terminal_event through the version-2 policy and posts one DISPOSITION at the effective pulse, before the strategy call and never as a fill. The event carries source lifetime_terminal_disposition, the winning lifetime fact id (now carried by the prepared provider), the label, matched label, choice, basis, policy id and, for haircut, the fraction. last_permissible, last_mark, haircut, write_off and refuse are implemented; a write-off disposes at zero, which lot accounting and replay now accept for DISPOSITION only.", "An unlabeled known-inactive holding stops terminal_settlement_unsupported (reasons terminal_settlement_unsupported|terminal_label_missing) and a choice without its qualifying mark stops terminal_mark_unavailable, both INCOMPLETE with the accepted prefix. After the Workstream 14 close review returned NEEDS_TYPE_2, the maintainer adjudicated on 2026-10-05 (Cut 6 decision 9, synthesis section 3.2 amendment) that a scheduled corporate-action row is evidence: ledgr_terminal_resolve_scheduled() disposes it at the permissible mark, or the frozen last close when frozen, changed only by an explicit last_mark default or refuse, and never applies haircut, write_off or frozen_terminal_position. A refused or unpriceable scheduled row now stops typed and blocks the lifetime path for that holding on that pulse, closing the review's refusing-default precedence hole. A holding that never had a mark stops valuation_horizon_exhausted: its diagnostic detail omits missing values instead of failing canonical JSON. Replay now rejects a DISPOSITION whose persisted qty or price differs from its metadata. Availability runs still cannot use compiled spot-FIFO (ledgr_compiled_availability_unsupported) and the plan event-kind envelope is unchanged.", "Gates: synthesis section 7 case 1 (LTB-0163 fast, LTB-0168), case 2 (LTB-0162 review table, LTB-0170 fast canary) and case 3 (LTB-0164 fast; LTB-0171 review for a failure before the append). Existing blocks that encoded the old stops now declare their choices: the economics and parity fixtures pin exhausted = refuse or a refusing terminal policy, the v0.2.0.1 witness helper declares both refusing choices with a documented identity exception, LTB-0051 asserts the typed no-mark stop, the unlabeled-inactivity economics block asserts the immediate typed stop, and the provider witnesses compare every frozen field with lifetime_fact_id as the only addition."]
  - id: "LDG-2956"
    title: "Carry exhausted marks without inventing transactions"
    workstream: 14
    status: "complete"
    priority: "P0"
    effort: "L"
    dependencies: ["LDG-2955"]
    scope: "Implement the version-2 valuation exhaustion choice. Under freeze, continue the last reference after max_sessions with mark_source frozen_close and increasing age while leaving cash and quantity unchanged. Record freeze entry and exit as diagnostics, never accounting events. With refuse, retain valuation_horizon_exhausted. Freeze only holdings not covered by an effective known_inactive lifetime fact: labeled inactive holdings route to terminal disposition and unlabeled inactive holdings stop. A missing execution bar produces no fill; a persistent target may fill only after a real bar resumes, while a one-shot target is not queued."
    acceptance: ["a public current to stale to frozen to resumed fixture asserts every pulse's mark, source, age, cash, quantity, event count, diagnostics, completion and resumed execution price; freeze produces no CASHFLOW, DISPOSITION or FILL", "a persistent zero target fills only at the resumed execution bar and realizes the observed move, while a one-shot zero target remains unqueued; allowing a missing-bar fill or queued order fails the witness", "the same fixture under exhausted refuse preserves the existing typed horizon stop and has zero frozen exposure because no frozen state occurred", "labeled and unlabeled effective known_inactive holdings never enter freeze; removing terminal precedence or the inactive exclusion fails with carried fabricated value", "multiple frozen holdings enter and leave independently, and resume and pulse ordering remain deterministic across an interruption boundary", "each new load-bearing block is registered in tests/claims.yml with the five review obligations and LDG-2956 evidence records the public freeze probe as orientation rather than an expected-output literal"]
    evidence: ["ledgr_availability_valuation_state() now takes the exhaustion choice and the held axis. Under freeze, a held holding past max_sessions keeps its last close as a priced mark with source frozen_close and rising age, and cash and quantity are untouched. The fold stops only a holding with no mark at all, or any aged holding under refuse, as valuation_horizon_exhausted. Known-inactive holdings resolve as terminals before freezing applies. Freeze entry (valuation_frozen) and exit (valuation_freeze_exited) are diagnostics, never accounting events. Finalization's equity rebuild and the availability result reader apply the same rule. A resume rebuilds the previous pulse's frozen set from committed ledger events (ledgr_availability_frozen_at), so diagnostics match an uninterrupted run. A missing execution bar still records execution_bar_missing and no order is queued. The LDG-2954 branch window is closed.", "LTB-0165 (fast) reproduces the public freeze probe as exact per-pulse marks, ages, equity and executions rather than probe output, with a persistent exit filling at the resumption bar, a one-shot exit never filling, and an exhausted = refuse control that keeps the typed horizon stop with no frozen state. LTB-0166 (review) covers two independent freezes and an interrupted resume. The survivorship-bias and missing-data-and-sessions articles teach the horizon stop, so their examples now declare exhausted = refuse; the re-rendered outputs are unchanged apart from those lines, and the articles still need a Workstream 15 rewrite to teach freeze."]
