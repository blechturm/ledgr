      The reconciliation in AC3 cites the section for every rule, and a rule with no section fails it", "the condition reference and public documentation distinguish evidence, modeled terminal disposition, stale valuation, frozen valuation, refusal and the frozen-at-end bound without calling assumption-backed equity exact", "a checked-in reconciliation maps every synthesis Section 3 through 7 rule and all eight gate cases to exactly one owning ticket and one failure-sensitive block, with no unowned or duplicate authority", "the vendor-neutral release fixture crosses a held terminal, freeze, resume and frozen-at-end case using public APIs and asserts exact normalized outputs; the existing release-only invocation boundary is preserved", "the reference Sharadar release claim is present only with linked accepted upstream untraded-bar evidence and a passing end-to-end record. Otherwise an exact release-note and teaching boundary states that zero-volume carried bars may still fill and bypass ageing. That boundary sentence is pinned by a documentation-contract test, and the condition is registered in the macro plan's release definition of done and the release CI playbook, so a later edit that adds the claim without evidence, or deletes the boundary, fails", "documentation contracts, the fast profile, ordinary Workstream 11 suite and release-only semantic suite pass; tickets.yml, the packet README, decisions.md and RFC routing reconcile before Type 1 close review"]
    evidence: ["contracts.md now states every accepted terminal-outcomes rule in the section that owns it. Config: both version-2 policy schemas, choices, defaults, identity and schema-1 read-only behavior. Availability: terminal triggers and label matching, settlement precedence and the scheduled-row barrier, freeze and refuse exhaustion, the frozen fallback, the typed stops, and the four new reason-table rows. Execution: the atomic DISPOSITION and its meta. Context: the frozen projection and tradability. Strategy: frozen preservation and reservation and zero targets. Persistence: completion_json flags and rebuilt freeze state. Result: summary fields, the estimate wording, headline, warning and comparison disclosure. Sweep Promotion: selection counts, incomplete exclusion and frozen DONE eligibility. Verification: unchanged completed-panel math and the gate registry. Documentation: the evidence and assumption distinctions and the Sharadar boundary. The decisions.md bridge row is removed and the synthesis header points to its standing homes. The condition reference gains an Evidence, assumptions and refusals section separating settlement evidence, modeled disposition, stale and frozen valuation, refusal and the frozen-at-end bound.", "inst/design/ledgr_v0_2_2_spec_packet/terminal_outcomes_reconciliation.md maps 33 synthesis rules (Sections 2 to 7) and the eight gate cases, with case 7 split as cut review C1 assigned it, to exactly one ticket, block and contract section. Building it showed that an unlabeled terminal reached while the holding is already frozen was correct but unpinned; LTB-0164 now covers it and LCL-0164 records the case.", "The vendor-neutral release fixture dev/bench/v0_2_2_long_window_regression/terminal_release.R runs only through run_release.R --release terminal. A 504-session, 30-instrument availability run crosses a freeze that resumes, a bankruptcy reached while frozen (default write-off), a declared last_mark terminal, a default last_permissible terminal, a short stale gap and a holding frozen at the end. It runs straight, reopened, and interrupted during the freeze then resumed, requires the three to agree exactly, checks disposition prices and the frozen-at-end value against fixture bars and ledger rows, and compares normalized outputs with evidence/terminal_release/expected.json. It passes in about 11 seconds. A committed mutant that changes the frozen fallback to last_mark fails with three named reasons. LTB-0182 (fast) keeps the fixture out of tests and hosted CI, checks the flag guard precedes package load and checks the record's promised cases; LTB-0154 is unchanged and still passes.", "The Sharadar boundary is a standing claim gate. The exact sentence is in the Documentation Contract, both rewritten articles and their renders, and the release CI playbook's new Standing release-claim gates section, which also registers the terminal fixture; macro-plan definition-of-done item 9 already named LDG-2961. LTB-0181 (fast) pins the sentence, requires it in the v0.2.2 release notes once that NEWS heading exists, rejects any other Sharadar sentence in README, NEWS, articles or help, and rejects any sentence calling frozen or freeze equity exact without a negation. Five mutations were each detected: boundary removed from an article, a Sharadar ageing claim added to the README, frozen equity called exact, the fixture flag guard removed, and an unlabeled frozen terminal allowed to keep going. The first exact-equity mutation survived because sentences spanned code chunks; the scanner now drops code fences and splits paragraphs first.", "The survivorship-bias and missing-data-and-sessions articles were rewritten to teach freeze-and-carry, terminal choices and the LDG-2959 warning, with refusal as the explicit alternative; the incomplete-prefix summary teaching moved to missing-data-and-sessions and its documentation pins moved with it. Two survivorship-bias figures changed: the comparison now shades the frozen