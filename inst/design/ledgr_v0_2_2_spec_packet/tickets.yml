    evidence: ["ledgr_corporate_action_summary() now covers scheduled and lifetime dispositions under the single corporate_action_fidelity authority. It adds a terminal_outcomes table: source, fact id, sealed label, matched label, choice, basis, assumption (evidence, declared or default, per the maintainer's definition that default means the map default entry or the frozen fallback), label, policy id, quantity, price, proceeds, realized result and haircut fraction. Choice counts include frozen_terminal_position keys, and older events derive their choice from the policy id. A defaulted write-off reads exactly default: assumed worthless.", "New exported ledgr_valuation_summary() aggregates the durable decision diagnostics in SQL: stale and frozen instrument-sessions, distinct holdings, longest stale age, longest continuous freeze, maximum frozen gross value and equity weight, frozen-at-end count, value and weight, and total_return_if_frozen_worthless. The bound subtracts frozen-at-end long value from final equity and never changes stored equity or metrics. Dense runs report not_applicable. print() and summary() open with one warning before metrics whenever a holding froze or a terminal outcome rested on an assumption. There is no materiality threshold. The warning names the argument and whether it is the default. Availability runs gain a valuation headline (current, stale or frozen), and summary() a Valuation Evidence section. The survivorship-bias article re-renders with that section. Help, NAMESPACE, the pkgdown index and the API lock list the new export.", "Blocks: LTB-0172 (fast) reconciles terminal outcomes to DISPOSITION rows and pins the warning text and its position before metrics in print and summary. LTB-0173 (fast) checks every valuation field against a hand-computed pulse oracle. LTB-0174 (review) is the warning matrix: a frozen holding under 0.01 percent of equity still warns, while refused exhaustion, clean, evidence-only and dense runs do not. LTB-0175 