    evidence: ["Commit 75e58ae applies the rule. ledgr_precompute_scoring_range() returns warmup_start equal to the scoring start, so ledgr_precompute_features() and every sweep fetch bars, compute features and execute from the scoring start; precompute fetches its bars once instead of twice. The Workstream 18 sweep slicing could no longer fire and was removed, leaving one two-pulse refusal. ledgr_experiment_window() stores an omitted hydration_start_utc as the scoring start and refuses any other value with ledgr_unsupported_hydration_start; the now-redundant hydration-before-execution check is gone. A windowed sweep refuses a precomputed payload whose feature state starts at another time with ledgr_precomputed_hydration_mismatch. The stale R/backtest.R LDG-2615 comment is deleted. The durable run path needed no change: it already fetched from its start.", "The oracle record at evidence/after_ldg2971 from clean tree 75e58ae passes both groups: all 45 boundary and 19 value assertions, including run, backtest, sweep, precomputed sweep, promotion and window parity at 1001, walk-forward training 1000 under the test rule, precompute warmup and stored hydration at the scoring start, the earlier hydration start refused, and the recursive TTR EMA sweep at 1001. The runner now selects walk-forward candidates by annualized_return, because a restarted three-day training window cannot trade and leaves Sharpe undefined. LTB-0196 (SMA and recursive TTR EMA across every entry point, fixture-derived values) and LTB-0197 (stored hydration, refusal, precompute warmup and window refusal) are registered as LCL-0196 and LCL-0197. Six mutations are detected: precompute and sweeps warming from the snapshot start, hydration stored as the snapshot start, an earlier hydration start accepted, a window accepting earlier precomputed state, only windowed (training) sweeps hydrating, and a one-pulse sweep accepted. Three existing tests changed under Cut 9 decisions (3) and (4): fold hydration, precompute warmup and the full-history payload a window now refuses.", "Contracts gain Scoring start and Feature start bullets in the Execution Contract; ledgr_opening(), ledgr_precompute_features() and ledgr_walk_forward() help, a development-version NEWS section, the walk-forward article and the roadmap record the restart and the LDG-2615 handover; the released v0.1.9.4 packet is byte-unchanged. The re-rendered walk-forward article shows fold 2 training Sharpe 1.79 with features restarted; the quoted test figures are unchanged. The full local suite ran 1,036 blocks with only the pre-existing demo-strategy error; the fast profile passed 533/533 in 105.16 seconds; the ordinary Workstream 11 suite compared 72267c2 with 75e58ae and passed without retry in 606.41 seconds, cold ratios 0.993 to 1.005 and warm 0.987 to 1.052, exact semantic hashes and checker self-test, recorded under evidence/ldg2971_long_window.", "Post-cut phase-memory baseline input for the WS3 budget, evidence/post_cut_memory: probe_churn.R Run A on the 757-pulse, 600-instrument orientation fixture at 75e58ae. Phase peaks: run start 429 MiB, bar hydration 427, feature series 499, projection 277, strategy and spec 359, fold 504 (live 276 at entry plus 228 churn), finalize 298. Markers force collections, so these are attribution figures; the earlier ff04a32 attribution peaked at 593 MiB in the fold. Setting the WS3 representation budget remains the next prerequisite.", "An agent-run adversarial close review of 7fe26f5..4b94d8e returned CHANGES_REQUIRED with three findings, corrected at 3043657 and 5009278. Major: an unwindowed sweep accepted a precomputed payload whose scoring range matched but whose feature state started earlier, as a payload built before Cut 9 does (engine version unchanged); ledgr_precompute_validate_window_coverage() now refuses it with ledgr_precomputed_hydration_mismatch in both branches. Major: help, contracts, NEWS and the walk-forward article now state that when no candidate trades in a training window Sharpe has no finite value and ledgr_walk_forward() stops with ledgr_walk_forward_no_selection. Minor: LTB-0196 adds an SMA strategy whose run, sweeps, precomputed and window sweeps and walk-forward training score depend on the feature start (restart 1001 and 1000, carried 1003 and 1001), and asserts the stale-payload refusal through ledgr_sweep(); LTB-0197 asserts it at the validator. A seventh mutation, the ordinary-sweep refusal removed, is detected by both blocks.", "Asserting the stale-payload refusal through ledgr_sweep() inside fast-lane LTB-0197 made LTB-0164 stall about ten seconds later in the same fast-profile process (three-run median 116.49 s against 112, with a same-host 75e58ae control at 108.40 s). Bisection showed the stall disappears when that call is removed, when only the validator is called, or when a gc() follows it; no ledgr store registration or option survives the refused call and ledgr_snapshot_close() shuts its driver down. The focused re-review could not reproduce the stall at 3043657 (106.13 s, LTB-0164 3.02 s), found no open-retry loops when instrumenting ledgr_open_duckdb_with_retry(), and saw no connection, held store or garbage-collection warning survive the refused call. The cause is unidentified; it stays an open observation, and the wording in the 5009278 commit message that attributes it to DuckDB driver finalization is unproven. With the sweep-level assertion moved to review-lane LTB-0196, the fast profile passed 533/533 in 105.82 seconds and the full suite ran 1,036 blocks with only the pre-existing demo-strategy error. The oracle record at evidence/after_ws19_review_correction from clean tree 3043657, product-identical to 5009278, passes both groups; walk-forward.md re-renders fresh."]
  - id: "LDG-2972"
    title: "Register real-data continuity oracles"
    workstream: 20
    status: "complete"
    priority: "P0"
    effort: "S"
    dependencies: []
    scope: "Before production changes, commit one maintained runner and checker under dev/bench/v0_2_2_real_data_continuity/ that reproduce LFB-017, LFB-023 and LFB-018 through public APIs on vendor-neutral fixtures derived from the ledgr-research reproducer, and that state the expected post-cut behavior of each from fixture arithmetic, not from another engine path. The checker has three named groups, one per later ticket, plus an invariance group that must stay green throughout: dense warn-and-zero sizing, raw numeric targets, a run with no gap, a walk-forward whose every fold selects, an uninterrupted run, the ledgr.interrupt soft stop returning RUNNING, and resume of an interrupted run to the uninterrupted result. A simulated interrupt is a signalled condition of class interrupt. The runner refuses a dirty tracked tree and records environment, commit, fixtures and commands."
    acceptance: ["on the clean LDG-2972 commit, product-identical to 0c1fe2b, every LFB group fails for the source-table reason (abort class, CREATED row, session-ending no_selection) and the invariance group passes", "the LFB-017 group asserts exact target quantities on a one-session gap of a held member with no change to the priced member's target, a fixture in which the cap binds with the exact scaled quantities, unallocated skipped weight, and one sizing_unavailable decision diagnostic per skipped instrument and pulse even when the strategy returns c(target) or target[ctx$universe]", "the LFB-023 group asserts per-fold selection source, test-run presence, fold status and session status for a session in which a later fold has no selection after an earlier fold selected and for one in which no fold ever selects, the degradation and candidate-extraction behavior on previous and none folds, and that no_selection = \"fail\" reproduces the pre-cut refusal and FAILED fold", "the LFB-018 group asserts FAILED with a non-empty error message after an elapsed-time interruption during feature computation, after a simulated interrupt, and after an interruption of a resumed row that started FAILED, with the original condition still reaching the caller", "the checker fails, rather than silently passing, if any asserted table is empty, any expected row is missing or the fixture does not produce its gap, empty fold or interruption; fixtures are deterministic, need no private data and run in under one minute; LDG-2972 reconciles before LDG-2973 to LDG-2975 start"]
    evidence: ["Commits 016c6e1 and d247dc3 add dev/bench/v0_2_2_real_data_continuity/run_record.R, check_record.R and README.md with three LFB groups and a seven-arm invariance group. Every arm records its condition instead of stopping. Expected values are fixture arithmetic stated in the README and the checker; a missing observation fails. evidence/pre_cut, recorded from clean d247dc3 (product-identical to 0c1fe2b), passes --expect pre: lfb017 0/12, lfb023 0/9, lfb018 2/5 (only the propagation checks pass), invariance 7/7; the LFB-017 arms fail with ledgr_target_sizing_unavailable, the LFB-018 rows stay CREATED and the no_selection arms refuse.", "During LDG-2973 two fixture defects were corrected in the runner, not the expectations: the flattened-target strategies inlined the pipeline (an outer helper is a tier-3 preflight refusal) and the cap fixture read closes by universe position. evidence/after_ws20 from clean bb98258 passes --expect post: invariance 7/7, lfb017 12/12, lfb018 5/5, lfb023 11/11; the pre-cut record still passes --expect pre.", "Close-review correction a478551: the LFB-018 group gains dense and availability mid-loop interrupt arms with resume to an uninterrupted reference, the resumed arm exits differently so a rewrite is distinguishable, and the LFB-018 and soft-stop fixtures use moving prices so equity comparisons have power. evidence/pre_cut was re-recorded from clean d247dc3 with that runner (--expect pre: invariance 7/7, lfb017 0/12, lfb018 3/10, lfb023 0/9; the dense mid-loop arm finishes DONE and cannot resume) and evidence/after_ws20 from clean ecb00e5 (--expect post: invariance 7/7, lfb017 12/12, lfb018 10/10, lfb023 11/11)."]
  - id: "LDG-2973"
    title: "Skip and record unpriced members in the rebalance helper"
    workstream: 20
    status: "complete"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2972"]
    scope: "Implement Cut 10 decision (1) in ledgr_target_rebalance(), the pulse context and the fold's decision diagnostics. In the availability path, determine the skipped set once, vectorized: positive-weight eligible members whose current close is missing, non-finite or non-positive. Keep each at its current quantity. Let A be allocatable equity after the existing reservations, V the sum of w_p * f * A over priced positive-weight members (unfloored, valued at current close), and E the sum of abs(q_s * risk_mark_s) over held skipped members. If V + E <= A the scale factor s is 1; otherwise s = max(0, A - E) / V. Each priced target is floor(s * w_p * f * A / close_p). A held skipped member whose risk mark is not finite fails with ledgr_target_sizing_unavailable. Unheld skipped members contribute nothing to E, so the cap cannot bind for them; when V = 0 there is nothing to scale. Add the skipped IDs to the fold's per-pulse note slot in ctx when present (the union over every call in the pulse; the fold resets it each pulse) and attach them to the returned ledgr_target. The fold reads the slot after the strategy returns and writes sizing_unavailable as the decision reason for those instruments, keeping any restriction reasons in reasons. A preserved holding, or a held skipped member, with no finite mark still fails with ledgr_target_sizing_unavailable. Update the helper's roxygen and Rd, the condition reference, the contracts paragraph on availability-aware rebalance helpers (including the dense/availability divergence), any article that teaches the close filter as a requirement, and NEWS."
    acceptance: ["the LDG-2972 LFB-017 group is green and the invariance group stays green", "a held skipped member without a finite risk mark fails with ledgr_target_sizing_unavailable", "on the gap fixture the default pipeline reaches DONE; the priced member's target is unchanged from a fully priced pulse unless the cap binds, the unpriced member targets its current quantity, and cash holds the skipped weight; no sell-and-rebuy of priced members occurs across a one-session gap", "when the cap binds the priced quantities equal floor(s * w_p * f * A / close_p) with s = max(0, A - E) / V and total sized plus held skipped exposure does not exceed allocatable equity", "a sizing_unavailable decision row appears through ledgr_results(bt, \"diagnostics\") for each skipped instrument and pulse whether the strategy returns the ledgr_target, c(target) or target[ctx$universe]", "removing the skip, the cap, the note slot or reintroducing a full reservation of held skipped exposure each makes a named check fail", "the change adds no per-instrument R loop and no per-pulse frame construction; the seven shapes are walked on ledgr_target_rebalance() and the decision-trace code", "focused helper, availability, run and sweep suites, the fast profile and the ordinary Workstream 11 suite pass; each new load-bearing block is registered in tests/claims.yml"]
    evidence: ["Commits cf30e53 and 2979227 implement decision (1): ledgr_target_rebalance() skips unpriced positive-weight eligible members at their current quantity, sizes priced members as on a fully priced pulse and scales them by s = max(0, A - E) / V only when V + E > A; a held skipped member without a finite mark still raises ledgr_target_sizing_unavailable. The fold allocates one per-run note environment, resets its sizing_skipped slot each pulse and places it in ctx$.notes; the decision diagnostic writes sizing_unavailable for those IDs, so c(target) and target[ctx$universe] still record. Dense warn-and-zero is unchanged.", "LTB-0199/LCL-0199 (fast) pin the unheld skip, the held skip below the cap, the binding cap at s = 0.2 (AAA 10), the fail-closed unmarked member and a durable run with c(target) whose fills are AAA 45 and BBB 22 and whose skip rows are BBB on days 1 and 4. Two existing tests that pinned the old abort now assert the skip. Mutations: restoring a full reservation of held skipped exposure fails six oracle checks (sell-and-rebuy returns); recording through the target attribute only fails four.", "Seven-shape walk: no per-instrument R loop or per-pulse frame is added; sizing reuses one weight * fraction * A vector for the cap and the floor (2979227); the per-pulse slot write replaces a whole short vector, not a growing one. Focused helper, availability, context, types and sweep suites pass. The ordinary Workstream 11 suite (17b9dee) compared d247dc3 with 43224b1 over five pairs in 608.32 s: cold ratios 0.994 to 1.025, warm 0.991 to 1.021, no retry, LWREG_CHECK_OK. Contracts (Strategy Contract, Unpriced members, including the dense divergence), help, condition reference and NEWS updated; Rd edited by hand because the available roxygen2 differs from 7.3.3."]
  - id: "LDG-2974"
    title: "Add the walk-forward no-selection fold policy"
    workstream: 20
    status: "complete"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2972"]
    scope: "Implement Cut 10 decision (2). Add no_selection = c(\"previous\", \"fail\") to ledgr_walk_forward(), validated, stored in session meta_json and included in session identity; a reopened pre-cut session without the key reads as \"fail\". In the fold loop, a ledgr_walk_forward_no_selection condition under \"previous\" uses the candidate most recently selected from a training window and runs the test window with its parameters; the fold's selected_candidate_key is the current fold's train key for those parameters, so score joins still resolve; the degradation and candidate train metric for a previous fold is reported as NA because it was not a selection score, and the stored train score row is unchanged. With no earlier training selection the fold runs no test window, records no test run and leaves the carried opening unchanged. A previous fold follows the same status rules as a train fold (DONE, PARTIAL on an INCOMPLETE test run, FAILED on a failed test run); a none fold is DONE. None folds are omitted from selected rows; ledgr_candidate(fold_seq = \"latest\") may return a previous-sourced fold and its provenance says so. Add selection_source TEXT NULL CHECK (selection_source IS NULL OR selection_source IN ('train','previous','none')) to walk_forward_folds through a schema migration from experiment store version 117 to 118 following ledgr_experiment_store_upgrade_walk_forward_scores(), keyed on column presence; backfill 'train' where selected_candidate_key is not NULL, else NULL; FAILED folds without a selection store NULL; the rebuild preserves the status and opening_state_policy CHECKs, the primary key and UNIQUE (session_id, fold_id); update the schema validator's constraint introspection. ledgr_walk_forward_folds(), the degradation table and the selected rows carry selection_source; ledgr_candidate() on a previous fold adds selection_source = \"previous\" and the source fold to its walk_forward provenance and refuses on a none fold with ledgr_walk_forward_candidate_not_found; the printed session shows the fold counts by source and a health line when any fold ran no test window. Update help, the condition reference entry for ledgr_walk_forward_no_selection, contracts and NEWS."
    acceptance: ["the LDG-2972 LFB-023 group is green and the invariance group stays green", "a session in which a later fold has no selection completes with that fold's test run executed under the previously selected candidate and recorded as previous; a session in which no fold ever selects completes with no test runs, every fold recorded as none and the print flagging it; no_selection = \"fail\" reproduces the pre-cut refusal and FAILED fold with NULL source", "the policy changes the session ID and is read back from a reopened session; an all-train session's results are identical under both policies apart from identity; a store at schema 117 migrates to 118 with selected folds recorded as train and unselected folds NULL, and all CHECKs and keys survive", "degradation, selected rows and ledgr_candidate() provenance carry the source; ledgr_candidate() refuses on a none fold; none folds are absent from selected rows; a previous fold whose candidate's current train row is INCOMPLETE with a finite metric still reports an NA train metric", "removing the fallback, the source column, the identity term or the provenance field each makes a named check fail", "the fold loop gains no per-fold full-table rescans or repeated store reads; focused walk-forward, schema and inspection suites and the fast profile pass; each new load-bearing block is registered in tests/claims.yml"]
    evidence: ["Commits 29a315d and 2979227 implement decision (2): ledgr_walk_forward(no_selection = c(\"previous\", \"fail\")), selection_source on every fold row, none folds that run no test window and keep the carried opening, previous folds that reuse the latest training selection under this fold's train key with an NA selection metric, and the train-fold status rules for previous folds. Experiment-store schema 118 rebuilds walk_forward_folds with a nullable selection_source CHECK, backfilling selected folds to train and unselected to NULL, keeping rows, keys and CHECKs; the validator checks the new enum. The policy is stored in session meta (absent reads as fail) and enters identity only when it is not fail, so fail sessions keep their pre-cut payload.", "Selected rows omit none folds; degradation, selected rows and candidate provenance carry the source; provenance names the source fold; a none fold refuses candidate extraction; print counts folds by source and warns when folds ran no test window. LTB-0200/LCL-0200 (fast) pin the inspection rules including an INCOMPLETE train row with a finite metric, the identity payload and the migration from a hand-written schema 117 table; LTB-0201/LCL-0201 (review) run three public sessions. Mutations: removing the fallback drops the oracle's LFB-023 group to 4/9 at 47f739b (3/9 when first measured before the shape walk); removing the identity term fails LTB-0200.", "Existing tests were updated for the 118 version literals, the schema fingerprint (LTB-0040), the degradation column and an explicit fail policy in the persisted-failure test; the frozen v0.2.0.1 identity fixture moves 117 -> 118 as LDG-2818 moved it to 117. The long-window suite harness now builds its fixture with the accepted arm (43224b1), because the accepted arm refuses a newer store. Contracts, help, condition reference and NEWS updated; Rd by hand.", "Close-review correction a478551: LTB-0201 now uses a fixture in which fold 1 selects AAA and fold 2 selects BBB, and asserts that previous folds reuse BBB (selection_source_fold_seq 2) and that in-memory selected rows report NA; the previous-fold row is built by ledgr_walk_forward_previous_selection(), unit-tested in LTB-0200 with an INCOMPLETE row carrying a finite metric. Mutations keeping the first selection or dropping the NA each fail. The walk-forward article describes the policy and is re-rendered; only the new print line, session ID and hidden column change. Shape walk addendum: ledgr_walk_forward_selected_from_rows() and ledgr_walk_forward_degradation_table() already built one-row frames per fold with a scores-table subset per fold (shapes 1 and 2) before this cut; the cut adds columns to them, not iterations, and they stay bounded by fold count."]
  - id: "LDG-2975"
    title: "Record early run exits as FAILED"
    workstream: 20
    status: "complete"
    priority: "P1"
    effort: "S"
    dependencies: ["LDG-2972"]
    scope: "Implement Cut 10 decision (3) in ledgr_run_fold(). After registration, observe the exit condition with calling handlers for error and interrupt without catching it. Run the guard from an exit handler registered so that it executes before the existing DuckDB disconnect handler and after any transaction rollback, for example on.exit(after = FALSE). When the call exits by a condition, this invocation wrote no terminal status, and the row is CREATED, RUNNING or FAILED, record FAILED through the existing output handler, or a direct status update if the handler does not exist yet, overwriting error_msg with the condition's message or a named interruption message for a condition of class interrupt. DONE and INCOMPLETE rows are never touched; existing failure paths keep their messages and classes; the ledgr.interrupt soft stop keeps returning normally with RUNNING. Update help, contracts and NEWS."
    acceptance: ["the LDG-2972 LFB-018 group is green and the invariance group stays green", "an elapsed-time interruption during feature computation, a simulated interrupt and an interruption of a resumed row that started FAILED each leave status FAILED with that attempt's error message, and the caller still receives the original condition", "a run that ends DONE or INCOMPLETE, a classed failure already recorded before the fold, and the ledgr.interrupt soft stop keep exactly their pre-cut status and message", "rerunning the same experiment and run_id after an interrupted attempt resumes and finishes with the same equity, fills and ledger as an uninterrupted run", "removing the exit guard, or registering it after the disconnect handler, makes a named check fail", "focused run, persistence and resume suites and the fast profile pass; each new load-bearing block is registered in tests/claims.yml, and Workstream 20 and Cut 10 reconcile before Type 1 close review"]
    evidence: ["Commit 001a7a4 implements decision (3): ledgr_run_fold() is a wrapper that observes error and interrupt conditions with calling handlers and calls ledgr_run_fold_impl(); after registration the body registers an exit guard with after = FALSE, so it runs before the DuckDB disconnect and after any rollback. Normal returns set a flag; the output handler reports whether it wrote a terminal status; otherwise the guard updates a CREATED, RUNNING or FAILED row to FAILED with the condition message or Run interrupted before completion. by direct SQL, never touching DONE or INCOMPLETE.", "LTB-0198/LCL-0198 (fast) pin an error during feature computation, an rlang::interrupt() exit, a resumed FAILED row taking the new attempt's message, an untouched DONE run and the ledgr.interrupt soft stop staying RUNNING; registering the guard with after = TRUE fails three expectations. The oracle adds an R time limit and the resumed case on an availability snapshot. bb98258 points LTB-0155's source check and the durable-run memory bench's phase markers at ledgr_run_fold_impl(); all five markers resolve uniquely. Focused run, store, persistence, finalization, acceptance and snapshot suites pass.", "Workstream close: the fast profile passed 536 blocks in 106.29 s against the 112 s bound; the full local suite ran 1,040 blocks with the pre-existing demo-strategy error and one fixture schema literal, corrected in 2979227. Contracts (Persistence Contract, Early exit), ledgr_run() help and NEWS updated. Workstream 20 awaits its Type 1 close review.", "Close-review correction a478551 (finding F1, blocking): DBI::dbWithTransaction() rolls back on an interrupt and returns normally, so a user interrupt during the pulse loop finished a dense run DONE without its rolled-back pulses and an availability run FAILED with a terminal-evidence error; this predates the cut but contradicted its contract. The persistent handler's run_transaction() observes the interrupt and re-raises it after the rollback, so the guard records FAILED, the caller sees the interrupt and a rerun resumes to the reference fills and equity. LTB-0202/LCL-0202 (review) pin the mid-loop interrupt with resume and that an INCOMPLETE row whose resume fails after registration stays INCOMPLETE (the guard's status filter); removing the re-raise fails five expectations and dropping the status filter fails one. NEWS and the Persistence Contract describe the re-raise. Fast profile 536 blocks in 106.70 s."]
