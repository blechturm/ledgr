packet: "v0.2.2"
cuts:
  - id: 1
    name: "Design-memory authority and discoverability"
    cut: "2026-10-03"
    opening: "The maintainer accepted the revised design-memory overhaul plan and instructed the ticket cut on 2026-10-03. This cut entry, the five workstream review claims and LDG-2923 through LDG-2934 are the operative implementation brief. The accepted plan remains the design authority; tickets.yml is the sole ticket and sequencing authority. No implementation starts before the independent cut review is accepted."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-03. The independent combined Type 1 and Type 2 review found eleven bounded ownership, ordering and honesty corrections and no design defect. This cut incorporates them without changing the twelve-ticket, five-workstream shape. One cut review plus five planned close reviews is 6 invocations over 12 tickets, 0.500 against the review gate; maintainer acceptance still opens Workstream 1."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/design_memory_overhaul_plan.md, accepted for ticket cut by the maintainer on 2026-10-03; inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS0; inst/design/rfc/rfc_governance_review_post_v0_2_0_1_synthesis_v2.md D4 through D7"
    source_table: "Current tree at a93e7e3 plus the uncommitted v0.2.2 planning artifacts: contracts.md has thirteen H2 contract sections and a stale v0.1.9.5 authority handoff; horizon.md has 171 Open and 14 Resolved entries plus one example heading; inst/design/README.md has two roles and a stale current-release state; rfc/README.md mixes pipeline and decision catalogue; ledgr_roadmap.md and AGENTS.md retain stale or duplicated current-state material."
    decisions: "Maintainer, 2026-10-03. (1) Keep RFC cycles, spec packets, tickets, spikes, audits, the roadmap and the horizon. (2) contracts.md is normative for current-release public behavior and internal invariants after a bounded census supports removing its stale packet handoffs; code disagreement is provisionally a code defect. (3) decisions.md is a temporary bridge using exact accepted-source sections, never a second authority or implementation ledger. (4) Accepted unscheduled obligations live only in the RFC pipeline as Obligations open until a ticket cut owns them or the maintainer drops them. (5) Horizon is non-binding parking; migrated bodies are never deleted and exact headings remain as redirects. (6) No mandatory spike index, audit ledger, closed metadata vocabulary or semantic governance checker is added. (7) Existing historical RFCs and released packets are not rewritten. (8) The lifecycle rules bind only when written into the existing gate documents: contracts.md, rfc_cycle.md and release_ci_playbook.md."
    sequencing: "Workstreams are serial because each supplies the safe input of the next: Workstream 1 establishes the contract baseline; Workstream 2 creates the front door and decision bridge; Workstream 3 amends RFC stage 9 and the pipeline; Workstream 4 can then drain horizon obligations without losing them; Workstream 5 compacts current context and verifies the whole route. Within a workstream, only the dependencies below bind."
    out_of_scope: "Package behavior, production code, test semantics, RFC stages 1 through 8, review modes, the spike protocol, ticket authority, ADR revival, per-decision files, a database or generated registry, mass renaming of historical artifacts, rewriting released packets or syntheses, deleting horizon bodies, and every other v0.2.2 product or optimization topic."
    workstreams: [1, 2, 3, 4, 5]
    closeout: "design_memory_overhaul_closeout.md"
    accepted: "2026-10-03 by the maintainer for ticket cut; all five workstreams and Cut 1 accepted 2026-10-03 after the focused Workstream 5 correction at 79363fb"
    close_review: "Workstreams 1 through 4 accepted after Type 1 review. Workstream 5 close review at 8c05e6e returned CHANGES_REQUIRED; correction ebd5dd2; focused re-review returned three factual residuals; record-only correction 79363fb accepted by the maintainer without a ninth review. Actual count 8/12 = 0.667, recorded as a historical gate breach."
    status: "closed"
  - id: 2
    name: "Proven long-window optimizations"
    cut: "2026-10-03"
    opening: "The accepted v0.2.2 macro plan WS1 and the maintained roadmap authorize a direct cut for bounded internal optimizations whose public boundary stays unchanged. This cut remeasures every candidate on the current tree before implementation. A candidate that misses its preregistered materiality or structural gate closes honestly as measured and rejected; old spike results do not authorize code by themselves. No implementation starts before independent cut review and maintainer acceptance."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-03. The combined Type 1 and Type 2 review accepted the eleven-ticket, four-workstream shape and required bounded fidelity and detector corrections P1 through P10. The draft now separates SMA and returns gates, fingerprints built-ins, records the expected availability feature-engine provenance change, preserves complete-set omission evidence and set-less overlays, binds the writer and accessor invariants, names the no-op flush behavior, makes every clock paired and public-path, adds the missing isolation, OHLC and timezone witnesses, and uses the four workstream closeouts instead of an unowned cut closeout. Maintainer acceptance still opens the workstreams."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS1 is authority for all seven mechanisms and the sole planning authority for LDG-2936 and LDG-2941 through LDG-2944. The maintained roadmap row v0.2.2 opening fold-writer and accessor optimization additionally authorizes LDG-2935, LDG-2938 and LDG-2939; it does not authorize the strict availability-feature path. Evidence: inst/design/spikes/fold_writer_accessor_levers_spike/summary_report.md; dev/bench/notes/long_window_scaling_findings.md; inst/design/exact_parity_internal_optimization_proof_template.md."
    source_table: "Current tree e5d4769. The writer/accessor spike measured at b14579f and checked drift only through f96b495, so LDG-2935, LDG-2938 and LDG-2939 must reproduce current-tree baselines. The long-window record measures the production paths still present at e5d4769: strict bounded-feature computation at 393-543x slower than its vector candidate, session construction at 42.8 seconds for 10,473 New York dates, membership resolution from 0.20 seconds at 6,000 rows to 11.33 seconds at 300,000 rows, and a diagnostic MAX scan whose direct wall contribution remains unmeasured."
    decisions: "Maintainer, 2026-10-03. (1) Stage one pulse's fill events and flush once through the persistent and memory R handlers; preserve the existing durable transaction boundary and do not invent block-failure semantics. (2) Prepare scalar feature-accessor indexes and the normalized active alias map once per run; the active alias map is fixed for that run. (3) Validate explicit maps once and keep an exact, run-local last-map memo keyed by identical content. (4) Accelerate only ledgr's own bounded strict SMA and returns indicators in this cut; each has an independent gate and outcome, while custom, external and TTR indicators stay with the indicator-design workstream. (5) Session and membership changes preserve exact fact rows, order, errors, evidence and snapshot identity. (6) No public API, schema, run or snapshot identity, snapshot hash, tolerance, default, persistence contract, verification-policy or failure-semantics change is authorized. The availability feature-engine-version digest is provenance for the implementation body, so LDG-2941's expected digest change is required rather than forbidden; dense provenance stays unchanged unless a shared helper changes, and precomputed-object compatibility is disclosed. db_live and compiled accounting behavior remain unchanged. (7) Every candidate first registers a current-tree baseline, semantic oracle, failure-sensitive structural detector and materiality threshold. If the gate fails, record the rejection and do not implement it. (8) Performance gates use public paths and interleaved paired arms on one commit that differ only by the candidate, with one measurement process at a time and a retry rule declared before the run. Internal clocks support but never replace the public-path gate."
    sequencing: "Workstreams 6 through 9 are independent and may open after this cut is accepted. Within each workstream the optimization tickets precede its closeout. Workstream 6 may land either writer candidate independently; rejection of diagnostic sequence tracking does not block the fill-event change. tickets.yml is the sole sequencing authority."
    out_of_scope: "Public API or condition changes; schema, snapshot-hash or run-identity changes; new numerical tolerances; db_live or compiled-accounting changes; custom, external or TTR indicator semantics; recursive-indicator gap and warmup design; feature-cache lifecycle; snapshot verification policy; write-only feature persistence; collapse::rsplit; and any mechanism that fails its registered current-tree gate."
    workstreams: [6, 7, 8, 9]
    closeout: "The four owned workstream closeouts under LDG-2937, LDG-2940, LDG-2942 and LDG-2945 form the Cut 2 record; no separate cut-level closeout is created."
    accepted: "2026-10-03 by the maintainer after PASS_AFTER_PATCHES and the bounded P1 through P10 ticket corrections"
    close_review: "Workstreams 6 through 8 were accepted after Type 1 review and their recorded correction rounds. Workstream 9 close review returned PASS on 2026-10-04 after independently reproducing exact session and membership semantics, clocks and five mutations. The maintainer accepted Workstream 9 the same day, with its Linux DST repetition retained as a pre-release confirmation on the next branch push. Actual Cut 2 review count 8/11 = 0.727, recorded as a historical gate breach."
    status: "closed"
  - id: 3
    name: "Exact fact-integrity verification"
    cut: "2026-10-04"
    opening: "The independent spike review passed the exact fact-integrity result and invalidated the DuckDB membership result on a mixed-case tied-complete-set counterexample. Cut 3 therefore contains only the bounded exact-verification optimization. Membership pushdown returns to macro WS5 until its boundary order, gut and scope guard are corrected and it is remeasured after this workstream. This draft still awaits independent cut review and maintainer acceptance before implementation."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-04. The combined Type 1 and Type 2 review accepted the content, exclusion and four-ticket grain after requiring three bounded gate corrections: a public ledgr_facts_resolve() materiality gate, formatter work counted by elements rather than calls, and a calibrated five-pair low-repetition gate. The split is valid only because LDG-2946 must commit its tests and machine-readable oracle record before LDG-2947 begins. One cut review plus one planned workstream close review is 2 invocations over 4 tickets, 0.500 against the review gate. Maintainer acceptance still opens Workstream 10."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS5; inst/design/spikes/fact_integrity_verification_spike/charter.md and closeout.md as independently reviewed on 2026-10-04; inst/design/exact_parity_internal_optimization_proof_template.md. The DuckDB membership spike is a corrected future input, not Cut 3 authority."
    source_table: "Current implementation baseline a3f54cc after accepted Workstream 9. The reviewed spike measured the 300,000-row in-memory assertion at 3.06 versus 0.58 seconds and a rule-2 snapshot with 300,000 fact rows and 500 bars at 3.25 versus 0.73 seconds, with identical hashes and corruption failure. Independent review measured a low-repetition bundle at 0.34 versus 0.38 seconds, found no gain, and required a no-regression gate plus timestamp and persisted-table tamper witnesses."
    decisions: "Maintainer, 2026-10-04. (1) Exact verification may format each distinct non-missing instant once only through the retained token formatter; canonical bytes, hashes, schema, identity and corruption failure cannot change. (2) Both repeated-clock and low-repetition fact shapes are gated; this optimization may not buy the membership gain by regressing ordinary fact families materially. (3) A public sealed-snapshot ledgr_facts_resolve() gate is binding; internal assertion and hash clocks cannot authorize implementation alone. (4) In-memory timestamp and persisted-table timestamp corruption must fail closed through the same public verification boundaries. (5) No stored-hash trust, component-hash policy, schema change, public API or general R-to-DuckDB migration is authorized. (6) The reviewed DuckDB membership candidate is excluded because its SQL collation disagreed with the retained R resolver for tied mixed-case set IDs. (7) A failed current-tree materiality, no-regression or exactness gate records rejection and leaves production unchanged."
    sequencing: "Workstream 10 depends on accepted Workstream 9. LDG-2946 registers and commits exact semantic, identity and corruption oracles plus its machine-readable proof record before LDG-2947 starts. LDG-2947 independently registers the internal, public-path and low-repetition gates. Only then may LDG-2948 change production; LDG-2949 closes the proof. tickets.yml is the sole sequencing authority."
    out_of_scope: "DuckDB membership pushdown until its spike is corrected and rerun after Workstream 10; verification-policy or component-hash design; trusting stored digests; hash-version, canonical-byte, schema, snapshot-identity or run-identity changes; new database indexes; SQL for in-memory fact families; provider-run semantics; public API or error changes; general data-layer migration; strategy callbacks; accounting semantics; residual writer work routed to macro WS8; scalar-accessor call-count work routed to macro WS3; indicator residuals routed to macro WS4; and any candidate that misses its registered current-tree gate."
    workstreams: [10]
    closeout: "The LDG-2949 workstream closeout forms the Cut 3 record; no separate cut-level evidence essay is created."
    accepted: "2026-10-04 by the maintainer after PASS_AFTER_PATCHES and the P1 through P3 gate corrections"
    close_review: "Workstream 10 Type 1 close review at ff995ae returned PASS after independently reproducing four mutations, recomputing all three gates from raw evidence and running the affected suites. The maintainer accepted Workstream 10 and closed Cut 3 on 2026-10-04. Actual review count 2/4 = 0.500."
    status: "closed"
  - id: 4
    name: "Long-window regression evidence"
    cut: "2026-10-04"
    opening: "The accepted macro plan requires a current long-window availability baseline and one internal regression-suite chore after Cut 3 and before further optimization cuts. The baseline at d08c8f4 is recorded in long_window_cut3_baseline.md. This draft turns it into one maintained local evidence path without making host timing a hosted-CI gate. No implementation starts before independent cut review and maintainer acceptance."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-04. The combined Type 1 and Type 2 review independently recomputed the baseline and accepted the one-workstream, one-ticket grain after requiring P1 through P7: a live paired comparison and retry rule; reuse of existing counters plus one public linear-growth gap; explicit terminal and gap policy; stable normalized outputs and an authorized re-baseline rule; public facts-reader and sweep coverage; a numeric local budget and enforced release-only entry point; and a durable in-repository record with checkout-independent digests. One cut review plus one planned workstream close review is 2 invocations over 1 substantive ticket, 2.000 against the review gate. The breach is inherent in reviewing a one-ticket cut twice and is recorded rather than repaired by padding the cut. The maintainer accepted the corrected cut and opened Workstream 11."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md, WS8 early item Long-window baseline and regression suite; inst/design/ledgr_v0_2_2_spec_packet/long_window_cut3_baseline.md; dev/bench/notes/long_window_scaling_findings.md for the original registered shapes"
    source_table: "Accepted Cut 3 tree d08c8f4. The rerun records five momentum lengths from 252 through 6,056 pulses, four fact-volume levels through 300,000 membership rows, 500 lifetime terminals, 600- and 2,300-instrument physical axes, feature-persistence-off orientation, four-candidate sweep and three-fold walk forward. Cold momentum is 2.76x to 11.67x faster than the 2026-10-02 record. The older and newer records were not paired, so the 2% to 7% warm and flat differences are not attributed to code. At 3,028 pulses the residual inclusive profile leaders are fold execution 46.33%, snapshot hashing 26.78%, DBI append 20.78% and finalization 17.89%."
    decisions: "Maintainer, 2026-10-04. (1) Preserve the accepted baseline and register one local regression suite before further optimization cuts. (2) The ordinary suite has fixed availability shapes covering declared sessions, membership churn, lifetime terminals, isolated and consecutive gaps, built-in returns and built-in SMA. Terminal ownership, gap length and expected status are explicit so the suite does not pre-empt the terminal-outcome RFC. (3) Performance compares live candidate and accepted-commit arms in alternating fresh processes in one session. Cold and warm are separate; each uses at least five pairs and the median candidate/accepted per-pair ratio. A ratio above 1.10 reruns once with fresh pairs and stands only when the retry also exceeds 1.10. Stored seconds select the accepted commit and shapes but are not the decision denominator. (4) One EXP-0003-scale synthetic shape and walk forward are release-only behind an explicit flag. (5) CI checks stable semantic outputs, the inventory of existing optimization detectors and one missing public-boundary linear-growth property, not wall clocks. (6) No product behavior, public API, schema, identity, persistence policy or optimization is changed by this cut."
    sequencing: "Workstream 11 depends on accepted Workstream 10 and is one chore ticket as the macro plan directs. LDG-2950 owns the runner, checker, structural detectors, accepted record and close evidence. Later optimization cuts depend on maintainer acceptance of Workstream 11. tickets.yml is the sole sequencing authority."
    out_of_scope: "Any production optimization; changing snapshot verification or feature-persistence policy; DuckDB membership pushdown; public benchmark or peer claim; hosted-CI wall-time enforcement; widening the fast test lane with measured long-window runs; deciding held-terminal or out-of-budget gap behavior; licensed data; changing the accepted 10% threshold after seeing a candidate; and padding this cut to satisfy review arithmetic."
    workstreams: [11]
    closeout: "LDG-2950's checked-in accepted record and ticket evidence form the Cut 4 closeout; no separate prose closeout ticket or essay is created."
    accepted: "2026-10-04 by the maintainer after the focused Type 1 re-review passed the C1 through C4 corrections"
    close_review: "The first Type 1 close review at ff04a32 returned CHANGES_REQUIRED. C1 found all ordinary strategies semantically vacuous for feature changes; C2 found missing-shape, missing-pair, partial-retry, raw-timing and missing-measurement holes; C3 found product-tree cleanliness unrecorded; C4 corrected the assumed public strategy-state reader. Focused re-review of the correction tree returned PASS after independently exercising feature-value and alignment mutants, eleven checker mutations, product-tree contamination and the documented strategy-state read boundary. The maintainer accepted Workstream 11 and closed Cut 4 on 2026-10-04. Actual count is 3/1 = 3.000, recorded rather than padded."
    status: "closed"
  - id: 5
    name: "Durable-run preparation memory"
    cut: "2026-10-04"
    opening: "The maintainer promoted the bounded dead-hydration cleanup after a phase-level current-tree profile measured a material peak-memory reduction without a runtime tradeoff. After the cut review and a follow-up churn attribution, the maintainer widened the cut on 2026-10-04 to two exact preparation tickets: LDG-2951 releases dead and duplicate durable-run copies, and LDG-2952 resolves strict built-in dispatch once per feature definition instead of once per instrument. Neither is a representation redesign. No implementation starts before maintainer acceptance and acceptance of Workstream 11."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-04 for the original one-ticket draft. The review verified that the five named objects are dead before the fold and that an empty bars_by_id is spec-compatible. It required P1 through P6: add the dead run_feature_matrix copy; a trading, feature-reading oracle strategy plus one dense run; a preregistered retry rule; a deterministic liveness detector instead of an RSS-only branch; draft status; and per-phase peak reporting with release at last read. It recommended R1, no full-range projection slice copy during feature persistence, and R2, no unused ledger-event read on availability finalization. The maintainer adopted all of them on 2026-10-04 and added LDG-2952 from dev/spikes/ctx_frame_views/churn_findings.md. A focused review of the broadened draft required failure-sensitive R1 and R2 detectors, an isolated post-LDG-2951 baseline, a narrowed phase claim and corrected review arithmetic. The readiness review returned PASS_AFTER_PATCHES and required unmarked gate runs, a staged-release detector and independent gates for both persistence variants; its recommended exact SMA/returns kind-mapping witness is also adopted. Three cut-review invocations plus one planned workstream close review over two tickets is 4/2 = 2.000 against the 0.5 gate, recorded rather than padded."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS5's phase-level memory prerequisite and WS8's residual peak-working-memory item; macro-plan decision 5 for direct exact optimizations; inst/design/horizon.md entry 2026-10-04 Long-window memory and parallel workers; the bounded 2026-10-04 current-tree phase and fresh-process probes described in this cut; dev/spikes/ctx_frame_views/probe_findings.md and churn_findings.md"
    source_table: "Current tree ff04a32. At 1,514 sessions, 600 physical instruments, 500 members and three returns features, the phase probe found that bars_all, raw_bars_by_id, aligned bars_by_id, bars_cols_by_id and run_feature_series remained reachable after their runtime consumers were built. Their reported object sizes sum to about 264 MiB before shared-object caveats. In two clean fresh-process comparisons without forced collection, clearing only those dead references reduced peak child RSS from 1,219.2 and 1,223.9 MiB to 1,048.4 and 1,050.3 MiB, about 14%, while elapsed time remained 32.20-32.26 seconds baseline and 32.25-32.43 seconds candidate. An explicit gc() arm gave no further benefit. The exploratory harness had a post-run completion-field assertion defect after ledgr_run() returned; reopening confirmed DONE, so the ticket must reproduce the result in a maintained runner before implementation is accepted. The cut review found run_feature_matrix also dead after projection: tracemem shows ledgr_runtime_projection() copies it when setting dimnames, 20.8 MiB at this shape. Finalization's full-range ledgr_projection_slice() copies every feature matrix again when persisting features. The 2026-10-04 churn attribution at 757 sessions found that peak is the highest of the run's phases: fold 593 MiB, feature series 529, hydration 452 and run start 427 by gc() max used. In the feature phase, ledgr_strict_builtin_kind() rebuilds and deparse-fingerprints the built-in SMA and returns definitions on each of 1,800 per-instrument calls. That is about 1.26 GiB of allocation and about 12% of sampled run time, for a result that depends only on the feature definition."
    decisions: "Maintainer, 2026-10-04. (1) Release only intermediates proven dead. These are bars_all, raw_bars_by_id, aligned bars_by_id, bars_cols_by_id, run_feature_series and run_feature_matrix, each released at its last production read rather than all at once after projection. Do not change their construction or any retained consumer. (2) Preserve the internal execution-spec shape in this cut and pass an empty compatible bars_by_id value rather than removing the field. (3) Finalization does not copy the runtime projection for a full-range persistence slice, and availability finalization does not read ledger events it does not use. (4) Strict built-in dispatch is resolved once per feature definition for every strict call site, in runs and in sweep and walk-forward precompute, with identical dispatch results. (5) Do not call gc() in production. (6) The peak-RSS and elapsed gates use unmarked runs. Phase peaks use separate paired marked runs with the same method in both arms or non-perturbing external RSS samples aligned to phase timestamps; an R gc() peak may not be read inside a gate run. Peak is the maximum over phases, so a lower process peak alone is not the claim. (7) Acceptance thresholds and the retry rule are fixed in the ticket before any candidate clock. (8) Exact completion, equity, fills, trades, diagnostics, decoded strategy state and availability outputs remain binding. (9) No public API, schema, run identity, hash, feature-persistence policy, cache policy, numerical rule or failure behavior changes. The one expected exception is the availability feature-engine digest: ledgr_compute_feature_series_strict() and ledgr_strict_builtin_kind() participate in it (LCL-0144), so LDG-2952 records that digest change as expected provenance, as Cut 2 LDG-2941 did, while the dense digest and indicator fingerprints stay unchanged."
    sequencing: "Workstream 12 depends on maintainer acceptance of Workstream 11. LDG-2951 first commits the maintained runner, current-tree baseline, exact oracle and preregistered thresholds; only then may it change production and record its candidate. LDG-2952 depends on accepted LDG-2951 and reuses its runner and oracle. Its baseline is the committed post-LDG-2951 tree, and its candidate differs from that exact tree only by LDG-2952, so LDG-2951's gain cannot hide a dispatch regression. tickets.yml is the sole sequencing authority."
    out_of_scope: "Removing or lazily rebuilding static pulse views (scheduled for the next release: inst/design/rfc/README.md#ctx-frame-retirement); changing bars_mat or runtime-projection representation; per-pulse fold churn (asset-state normalization, diagnostic JSON, context helpers), which the next-release memory pass owns; snapshot re-hash churn, which the WS5 verification session owns; feature-persistence or cache policy; sweep, walk-forward or parallel-worker memory beyond LDG-2952's shared dispatch; worker-count defaults; explicit garbage collection; removing execution-spec fields; public or peer performance claims; and any candidate that misses its registered memory, runtime or exactness gate."
    workstreams: [12]
    closeout: "LDG-2951's and LDG-2952's checked-in records and ticket evidence form the Cut 5 closeout; no separate prose closeout ticket or essay is created."
    accepted: "2026-10-04 by the maintainer for implementation after the readiness review patches; Workstream 12 and Cut 5 accepted and closed on 2026-10-04 after the Type 1 PASS and record-only correction 4edd4b3"
    close_review: "The Type 1 close review at 26ac946 returned PASS after independently reproducing both gains, exact outputs, source-liveness and dispatch mutations. Its required record-only correction narrowed LCL-0155 to the two inspected boundaries; the records now also name the fold as the peak-setting phase and refresh the LDG-2951 summary under the current checker. The maintainer accepted Workstream 12 and closed Cut 5 after correction 4edd4b3. Actual review count is 4/2 = 2.000, recorded rather than padded."
    status: "closed"
  - id: 6
    name: "Terminal outcomes and frozen holdings"
    cut: "2026-10-05"
    opening: "The maintainer accepted the terminal-outcomes synthesis on 2026-10-05 after Type 1 final review returned PASS_AFTER_PATCHES and both precision patches were applied. This cut implements macro-plan WS2 in three serial workstreams: versioned policies, execution economics, then reporting and contract consolidation. No implementation starts before independent cut review and maintainer acceptance of this cut."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-05. The combined Type 1 and Type 2 review accepted the three serial workstreams and nine-ticket grain and required these patches, all incorporated:
      - C1: section 7 gate cases owned where they become testable. Cases 1-6 and case 7 economics go to LDG-2958, case 7 summary parity to LDG-2959, case 8 to LDG-2960.
      - C2: stored schema-1 runs stay readable, while resume, rerun and promotion under schema 2 refuse with a typed condition (LDG-2953, LDG-2954).
      - C3: contract consolidation extends to the Config, Context, Strategy, Persistence and Sweep Promotion sections (LDG-2961).
      - C4: the Sharadar claim gate becomes a standing release condition, macro-plan section 6 item 9, pinned by a documentation-contract test (LDG-2961).
      - P5: the literal 'default: assumed worthless' label is asserted (LDG-2959).
      Record-only: LDG-2958 retitled to name its resolver, the LDG-2954 branch window stated, and synthesis section 3.3 paragraph order fixed. One cut review plus three planned close reviews is 4 invocations over 9 tickets, 0.444 against the 0.5 gate."
    authority: "inst/design/rfc/rfc_terminal_outcomes_v0_2_2_synthesis.md, accepted by the maintainer on 2026-10-05 after inst/design/rfc/rfc_terminal_outcomes_v0_2_2_final_review.md returned PASS_AFTER_PATCHES; inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS2; inst/design/contracts.md for shipped behavior until each implementing ticket consolidates its accepted change"
    source_table: "Current tree 00b6887 plus the accepted uncommitted RFC artifacts. The public freeze probe proves that in-budget stale valuation already carries quantity, refuses fills without a bar and realizes a persistent exit at the resumed price. The gap census shows that the reference Sharadar workflow encodes untraded sessions as zero-volume carried bars that bypass mark ageing and can fill today. Current production has scalar schema-1 corporate-action and valuation policies, stops held lifetime terminals and exhausted marks as INCOMPLETE, aborts a modeled disposition without a qualifying mark, and omits or under-describes incomplete candidates on several selection surfaces."
    decisions: "Maintainer, 2026-10-05. (1) Evidence-backed settlement always outranks a modeled terminal outcome. (2) Extend the existing corporate-action policy; exact sealed labels select overrides and ledgr interprets no vendor synonyms. Ordinary terminal default is last_permissible; a terminal reached while frozen defaults to disclosed write_off in the research preset and refuse in the strict preset. (3) Corporate-action and valuation policy objects and identities advance to schema version 2; pre-release schema-1 artifacts are not silently reinterpreted. (4) Horizon exhaustion defaults to non-transactional freeze-and-carry; known-inactive holdings never freeze. (5) Frozen holdings stay visible, target-restricted, preserved and reserved; explicit zero may attempt an exit but no order is queued. (6) Accounting is exact under the declared model while frozen equity and path metrics are assumption-backed. Every freeze and assumed disposition warns; there is no 5% threshold. (7) DONE frozen runs remain selectable with exposure fields. Incomplete prefixes never enter completed return panels, effective-trial counts or DSR mathematics, but attempted, done, incomplete and failed counts and reasons stay visible. (8) The reference Sharadar carried-bar issue is a release-claim gate, not behavior silently absorbed into this cut. (9) Type 2 adjudication after the Workstream 14 close review, 2026-10-05: a scheduled corporate-action disposition is evidence and disposes at the permissible mark, or the frozen last close when frozen, changed only by an explicit last_mark default or refuse; haircut, write_off and frozen_terminal_position apply only to terminals without settlement evidence; a refused or unpriceable scheduled row stops typed and blocks lifetime resolution for that holding on that pulse (synthesis section 3.2 amendment). (10) Type 2 adjudication after the Workstream 15 close review, 2026-10-06: shipped diagnostic extraction of FAILED candidates through explicit ledgr_candidate(..., allow_failed = TRUE) survives; FAILED and INCOMPLETE candidates never enter ranking, filtering, promotion or full-run comparison, and INCOMPLETE is never extracted. The synthesis and LDG-2960 exclude only incomplete candidates, so retiring the diagnostic path would be a new API decision outside this cut."
    sequencing: "Workstream 13 versions and closes both policy identities before behavior consumes them. Workstream 14 depends on accepted Workstream 13 and implements terminal and freeze economics, strategy behavior, persistence and replay. Workstream 15 depends on accepted Workstream 14 and owns results, selection visibility, standing-contract consolidation and the conditional Sharadar release-claim gate. Within each workstream the ticket dependencies below bind. tickets.yml is the sole sequencing authority."
