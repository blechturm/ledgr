  - id: "LDG-3018"
    title: "Remember schema validation by catalogue content"
    workstream: 26
    status: "complete"
    priority: "P2"
    effort: "S"
    dependencies: ["LDG-3016"]
    scope: "Maintainer, 2026-10-12 (amends LDG-2916's per-path cache rule). ledgr_validate_schema_once() keys its session cache by store path, marker timestamp and catalogue fingerprint, so every new store, and every in-memory store, gets a full validation: 100 full validations take 10.1 s of the fast lane at 586bf2c9, and every user's first run on a new store pays about 0.1 s. The full validator's only database read is ledgr_schema_catalogue(), whose tables, column types, nullability, order and constraints the fingerprint already covers, so the result is a function of the version marker and the fingerprint. The cache is keyed by those alone and remembers successes only: a copied or replaced store with an identical catalogue is not validated again, while a changed catalogue, a weakened constraint or a different marker value still is, and a failing store fails on every call. The public ledgr_validate_schema() stays a full check."
    acceptance: ["a second store, a copy at another path, a replaced store and an in-memory store with a catalogue already validated in the session are not validated again", "a changed catalogue, a constraint weakened on the same columns and a different marker value are validated again, and a failing store fails on every call with the same condition class", "LTB-0130 and LCL-0130 state the content rule and fail when the path or timestamp returns to the key or failures are remembered", "fixture-lane byte identity and no public-path clock regression; the fast-profile effect is measured"]
