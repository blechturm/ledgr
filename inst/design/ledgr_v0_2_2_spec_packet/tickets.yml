96 (+480 to +492 MiB across the three pairs), explain 1.070 and readers 1.051, while run_momentum and promote fall to 1.022 and 0.927. Explain elapsed is 1.298 there (1.277 to 1.314 across pairs) against 0.934 in the default-heap clock; the focused re-review timed build, run_momentum and explain alone under the preset heap, alternating trees, and reported 1.52 and 1.52 s against 1.41 and 1.54 s (no raw record kept). The preset-heap cycle is a diagnostic outside the 1.05 rule (Workstream 26 decisions). Running build and run_equal_weight (with its readers) under the preset heap at four WS26 code commits against 01acd4cd, three pairs each (7c86514c contains LDG-3006's 5dc47b3d) (evidence/clocks/ws26b_bisect: 7c86514c 1.011, 0ee44c33 1.012, 586bf2c9 1.007, 1c8df889 1.016), shows no rise; the +480 MiB appears only after the earlier phases of the full cycle. R's own max-used heap per phase (r_heap_probe.R, evidence/clocks/ws26b_heap/r_heap.csv, two repeats) rises at most 3 percent (run_momentum 658.5 to 678.1 MB, explain 521.2 to 534.6, availability 470.9 to 480.5); the close review reran it under a preset heap and reported the momentum increase at +8.6 MB (no raw record kept), so that measure also moves with collection timing. The peak excursions exceed the registered rule and are accepted by maintainer exception (Workstream 26 decisions); no cause is asserted. The intermediate clocks at 7c86514c (evidence/clocks/ws26) were 0.942 to 1.013 elapsed and 0.934 to 1.055 peak. Constructor clocks (evidence/clocks/ws26b_store, five pairs, 01acd4cd against 1c8df889): ledgr_db_init() 0.224, a small ledgr_snapshot_from_df() 0.577; LDG-3016 alone gave 0.678 and 0.629 (evidence/clocks/ws26_store). Ordinary fast profile medians (local, evidence/fast_profile_ws26): 147.65 s at 5dc47b3d, 128.30 s at 7c86514c, 110.59 s at 2c389dea, 108.34 s at 586bf2c9 (one run) and 100.48 s at 1c8df889 (101.98, 100.31, 100.48; check-test-gate LEDGR_TEST_GATE_OK, bound 112). Isolated CRAN fast profile at 1c8df889 (local, isolated dependency library, read-only working directory): 102.83, 101.77 and 101.82 s, check-test-gate LEDGR_TEST_GATE_OK at median 101.82 s against its 105 s bound; complete review profile: 330 blocks, 0 failed, 1 skipped (the documented missing-quantmod path), 278 s (evidence/fast_profile_ws26/cran and review). Reviews: agent close review CHANGES_REQUIRED (F1 peak-rule disposition and wording; F2 LTB-0239 order dependence; F3 stale claim fields; F4 the fixture lane never reaches the dense reconstruction; F5 constraint order in the validation key; F6 store-specific trigger probe; F7 bookkeeping), fixed in ba754286 with the maintainer exception for F1; ba754286 is 51/51 identical to 1c8df889 (evidence/ladder21), the full local suite has no failures (1087 blocks), and the ordinary fast profile passes at a median of 102.93 s over three runs (112.25, 102.93, 102.47; evidence/fast_profile_ws26/ba754286-*)."]
