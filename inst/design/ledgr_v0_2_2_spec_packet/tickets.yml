    authority: "inst/design/rfc/rfc_feature_map_read_surface_v0_2_x_synthesis.md, accepted by the maintainer on 2026-10-06 after Type 1 final review; inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS3; inst/design/contracts.md for shipped behavior until LDG-2965 consolidates the accepted change; inst/design/rfc/rfc_strategy_callback_contract_addendum_v0_1_8_10_synthesis.md Future obligations for the alias-map interaction and feature-map vector-output obligations this cut consumes; its conditional ctx$feature_at() shortcut remains in the strategy-callback follow-up route"
    source_table: "Current tracked tree at 83e8376 plus the uncommitted accepted synthesis and acceptance-routing edits. The registered product shape is 500 instruments by 1,260 pulses: an active-alias strategy using ctx$features(id) performs 630,000 per-instrument bundle reads because no singular whole-axis alias read exists. The prepared run-local feature lookup and exact explicit-map memo shipped in Workstream 7. Public pulse inspection already uses aliases as mapped wide keys, while contracts.md still says engine IDs; explicit maps can currently redefine an active alias or registered engine ID at read time. Parameterized inspection still refuses without accepting concrete feature_params. The stale no-alias-read sentence appears in Indicators, Strategy Authoring Tools, Sweeps and Missing Data and Sessions plus their rendered copies and two documentation-contract pins; ledgr_signal_return() help still teaches concrete registration without the active-alias alternative."
    decisions: "Maintainer, 2026-10-06. (1) Every singular strategy read resolves an active alias first, then a registered engine ID, otherwise ledgr_unknown_feature_id; ctx$vec$feature(), ctx$feature() and ledgr_signal_feature() share the rule. (2) No plural plane accessor, requested-subset bulk reader or separate alias accessor is added. (3) All three explicit-map consumers refuse a local map that redefines an active alias or registered engine ID; unrelated local names and own-name same-feature mappings remain valid. (4) Mapped ledgr_pulse_wide() columns use aliases and unmapped columns use engine IDs; the long view keeps both names. (5) Signals preserve raw values, eligibility and the author-supplied origin. (6) Both inspection helpers accept feature_params and use the same validator and resolver as a run and ledgr_pulse_snapshot(); no resolver is exported. (7) Scalar and active-map bundle loops warn only when the axis has at least 100 instruments and one accessor's calls in one pulse reach the axis size; explicit-map loops remain unrecorded. (8) Lookup state is run- or candidate-local, prepared once and reused by dense and availability reads. Identity, computation, warmup, fingerprints, no-lookahead, axis membership and eligibility do not change. (9) The addendum's conditional ctx$feature_at(feature_id, idx) shortcut remains an untriggered strategy-callback follow-up; this cut neither implements nor drops it."
    sequencing: "Workstream 16 is one serial implementation claim. LDG-2962 establishes the shared singular resolver and runtime evidence. LDG-2963 then applies the accepted explicit-map and wide-view boundary. LDG-2964 adds parameterized inspection through the same resolver. LDG-2965 consolidates contracts, teaching, routing and the preregistered performance and parity record. tickets.yml is the sole sequencing authority."
