packet: "v0.2.2"
cuts:
  - id: 1
    name: "Design-memory authority and discoverability"
    cut: "2026-10-03"
    opening: "The maintainer accepted the revised design-memory overhaul plan and instructed the ticket cut on 2026-10-03. This cut entry, the five workstream review claims and LDG-2923 through LDG-2934 are the operative implementation brief. The accepted plan remains the design authority; tickets.yml is the sole ticket and sequencing authority. No implementation starts before the independent cut review is accepted."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-03. The independent combined Type 1 and Type 2 review found eleven bounded ownership, ordering and honesty corrections and no design defect. This cut incorporates them without changing the twelve-ticket, five-workstream shape. One cut review plus five planned close reviews is 6 invocations over 12 tickets, 0.500 against the review gate; maintainer acceptance still opens Workstream 1."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/design_memory_overhaul_plan.md, accepted for ticket cut by the maintainer on 2026-10-03; inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS0; inst/design/rfc/rfc_governance_review_post_v0_2_0_1_synthesis_v2.md D4 through D7"
    source_table: "Current tree at a93e7e3 plus the uncommitted v0.2.2 planning artifacts: contracts.md has thirteen H2 contract sections and a stale v0.1.9.5 authority handoff; horizon.md has 171 Open and 14 Resolved entries plus one example heading; inst/design/README.md has two roles and a stale current-release state; rfc/README.md mixes pipeline and decision catalogue; ledgr_roadmap.md and AGENTS.md retain stale or duplicated current-state material."
    decisions: "Maintainer, 2026-10-03. (1) Keep RFC cycles, spec packets, tickets, spikes, audits, the roadmap and the horizon. (2) contracts.md is normative for current-release public behavior and internal invariants after a bounded census supports removing its stale packet handoffs; code disagreement is provisionally a code defect. (3) decisions.md is a temporary bridge using exact accepted-source sections, never a second authority or implementation ledger. (4) Accepted unscheduled obligations live only in the RFC pipeline as Obligations open until a ticket cut owns them or the maintainer drops them. (5) Horizon is non-binding parking; migrated bodies are never deleted and exact headings remain as redirects. (6) No mandatory spike index, audit ledger, closed metadata vocabulary or semantic governance checker is added. (7) Existing historical RFCs and released packets are not rewritten. (8) The lifecycle rules bind only when written into the existing gate documents: contracts.md, rfc_cycle.md and release_ci_playbook.md."
    sequencing: "Workstreams are serial because each supplies the safe input of the next: Workstream 1 establishes the contract baseline; Workstream 2 creates the front door and decision bridge; Workstream 3 amends RFC stage 9 and the pipeline; Workstream 4 can then drain horizon obligations without losing them; Workstream 5 compacts current context and verifies the whole route. Within a workstream, only the dependencies below bind."
    out_of_scope: "Package behavior, production code, test semantics, RFC stages 1 through 8, review modes, the spike protocol, ticket authority, ADR revival, per-decision files, a database or generated registry, mass renaming of historical artifacts, rewriting released packets or syntheses, deleting horizon bodies, and every other v0.2.2 product or optimization topic."
    workstreams: [1, 2, 3, 4, 5]
    closeout: "design_memory_overhaul_closeout.md"
    accepted: "2026-10-03 by the maintainer after PASS_AFTER_PATCHES"
    status: "active"
review_gate:
  max_review_invocations_per_ticket: 0.5
sequencing: >-
  Within this cut, a workstream opens only when the previous workstream's
  close review is accepted by the maintainer. Ticket dependencies are
  intra-workstream only. tickets.yml is the sole sequencing authority.
review_obligations: >-
  Each workstream receives one Type 1 close review. The reviewer independently
  checks that the inputs are the right inputs, that every stated migration is
  complete, that no binding rule or obligation was lost, and that an index has
  not become a second authority. This documentation-only cut requires no
  production hot-path clock or seven-shape walk; the reviewer records that as
  not applicable rather than silently omitting it. A correction review counts
  as another invocation and any breach of 0.5 is recorded rather than hidden
  by merging or padding tickets.
workstreams:
  - id: 1
    name: "Contract authority baseline"
    cut: 1
    status: "complete"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 1", reason: "One claim joins LDG-2923 and LDG-2924: contracts.md can safely become the normative current-release source without losing a rule that lives only in an older packet or making a code defect authoritative. The review independently recounts the thirteen H2 sections, inspects every authority handoff and future-reference disposition, samples the test comparisons, checks the v0.1.8 and v0.1.9.5 outbound reconciliation and the later released packets, confirms the H2-only contents links resolve, and verifies that every semantic disagreement was routed rather than editorially rewritten."}
  - id: 2
    name: "Front door and decision bridge"
    cut: 1
    status: "complete"
    depends_on_workstream: 1
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 2", reason: "One claim joins LDG-2925 through LDG-2927: a reader starting at inst/design/README.md reaches current contract behavior or an accepted pending decision within two links, without relying on either old decision catalogue or a prose summary that became authoritative. The review samples real public-behavior and internal-invariant topics, checks every bridge row against exact accepted sections, verifies pending and partial-supersession links in both directions, and confirms no implementation-state ledger or permanent architecture catalogue was created."}
  - id: 3
    name: "RFC pipeline and obligation routing"
    cut: 1
    status: "review_pending"
    depends_on_workstream: 2
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 3", reason: "One claim joins LDG-2928 and LDG-2929: accepted unscheduled obligations have exactly one durable operational home and speculation remains non-binding. The review compares both amended stage-9 passages with stages 1 through 8, traces every Obligations open item to an exact accepted section, trigger and route, checks that decisions.md links rather than copies obligation text, and confirms accepted cycles with neither active work nor open obligations no longer clutter the pipeline."}
  - id: 4
    name: "Horizon migration"
    cut: 1
    status: "pending"
    depends_on_workstream: 3
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 4", reason: "One claim joins LDG-2930 through LDG-2932: every horizon body survives, every old heading still resolves, and no accepted obligation or operative binding citation remains hidden in parking-lot prose. The review recounts entries from the pre-migration file, reconciles each heading to one active body or one redirect plus archive body, samples bodies from every disposition, independently searches obligation language and operative citations, verifies pipeline ownership, and confirms historical packets and syntheses were not rewritten."}
  - id: 5
    name: "Current context and migration closeout"
    cut: 1
    status: "pending"
    depends_on_workstream: 4
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 5", reason: "One claim joins LDG-2933 and LDG-2934: after migration, the roadmap, AGENTS.md, packet, consumer links and front door describe one current state and a human or agent can follow the documented routes without reconstructing history. The review runs the scenario walk from the accepted plan on real topics, checks released narrative remains recoverable, verifies the bounded deterministic evidence sample and any one-time routing without a new ledger, checks the optional-link-check decision against the least-machinery rule, and reconciles all twelve tickets and five workstreams in the closeout."}
