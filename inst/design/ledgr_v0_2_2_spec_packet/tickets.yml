  - id: 11
    name: "Real-data continuity II"
    cut: "2026-10-08"
    opening: "Cut 10's close routed three confirmed real-data problems to the maintainer: LFB-019, walk-forward carry across gapped test windows, and resume of interrupted walk-forward test runs. The maintainer decided on 2026-10-08 to fix all three, together with whatever the 1998-2026 Sharadar run exposes, in one cut rather than two, so the cut opens with the run that measures them. The eight Sharadar adapter patches (inst/design/ledgr_v0_2_2_spec_packet/sharadar_adapter_survey.md, section 2) live in ledgr-research and are an external prerequisite of LDG-2976, not ledgr tickets. This draft is incomplete by design: LDG-2976 may add tickets through a recorded cut amendment, and no implementation starts before that amendment, independent cut review and maintainer acceptance."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-08. An independent Codex cut review (Type 1 with input check) of dfde5b3..8febb92 confirmed S1 and F1 to F8, F10, F12 and F13, classified F9 (row-wise formatting is on the facts-active availability path only) and F11 (provider and corporate-action plan carry mutable cursors; full-axis bar views are read, only over-wide) as overstated, found two missed siblings (the dense result reader repeats the F1 replay shape; the execution planner grows its entries and rejected lists inside the target loop) and required nine bounded patches, incorporated here: complete LDG-2976 input evidence before the oracles; a family-complete LDG-2982 equivalence oracle; the dense reader branch in LDG-2983; LDG-2985 kept to F4; per-repair materiality in LDG-2986; the planner accumulators in LDG-2988; corrected F9/F10 scope in LDG-2989; candidate isolation in LDG-2990; and spike-protocol conformance for LDG-2992. Should-fix items adopted: costs before LDG-2982 are labelled estimates or loaded-host measurements that locate shapes but do not gate; every gate is re-measured on quiet, fresh, paired processes; F3 and decision-trace volume stay routed. Review accounting unchanged at 3/17 = 0.176 before any correction review. Maintainer acceptance opens the workstreams."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS2 (ordinary gaps must not abort the helper pipeline; availability-aware state reconstruction once a vendor-neutral reproducer confirms the gap; interruptions become resumable or classed failures), WS8 (the integrated end-to-end record) and its 2026-10-08 change-control amendment; release definition of done items 7 and 8; Cut 10 out_of_scope and close_review; inst/design/rfc/rfc_history_wave_v0_2_2_decisions.md, section Cut goal (the 1998-2026 Sharadar goal and the carried-bar decision); inst/design/ledgr_v0_2_2_spec_packet/sharadar_adapter_survey.md"
    source_table: "Current tree 6ade195. LFB-019: on the ledgr-research reproducer's gap fixture, ledgr_state_reconstruct() on a completed availability run whose member misses a bar fails with ledgr_missing_bars (reproduced on 0c1fe2b during Cut 10). Walk-forward carry: with opening_state_policy = carry_test_state and rolling folds whose step exceeds the test window, an instrument that delists between two test windows makes the next test run INCOMPLETE with terminal_mark_unavailable and the session PARTIAL; flat_test_state completes (reproduced on 0c1fe2b and in the Cut 10 cut review). Walk-forward resume: ledgr_walk_forward_run_or_open() (R/walk-forward.R) opens any existing test run ID with ledgr_run_open(), which refuses a run that is not DONE or INCOMPLETE with ledgr_run_not_complete (R/run-store.R), so after Cut 10 records an interrupted test run FAILED a rerun of the session fails that fold (read, not yet executed). Fast profile: 536 blocks in 106.29 to 111.92 seconds against the 112-second bound across Cut 10 runs. EXP-0003 on ledgr 0.2.1.0 ran about 25 minutes cold and peaked at 7.0 GB; no v0.2.2 record exists at this scale."
    decisions: "Maintainer, 2026-10-08. (1) Fix LFB-019, the gapped-window carry and walk-forward test-run resume in this cut, together with stoppers found by the Sharadar run. (2) Run the Sharadar census and end-to-end run first, on the patched adapter over 1998-2026 with carried zero-volume bars dropped, and log every stop; each stop is fixed in this cut through a recorded amendment, or routed with a durable reason. (3) Executor drafts, for acceptance at cut review: carry_test_state with test windows that leave sessions between them is refused when the walk-forward is set up, naming contiguous folds or flat_test_state, rather than carrying positions through unobserved sessions; an existing walk-forward test run that is not DONE or INCOMPLETE is resumed through the ordinary run path rather than opened; reconstruction follows the run's own expected-session and availability rules instead of requiring a bar for every instrument at every pulse. (4) Trim the fast profile so it keeps at least ten seconds of headroom, moving blocks to the review lane rather than weakening them."
    amendment: "2026-10-08, from the LDG-2976 Sharadar run (ledgr dfde5b3, adapter policy sharadar_ledgr_snapshot_adapter_v003 at ledgr-research 6be0b99; record under dev/bench/v0_2_2_sharadar_run/evidence/). Run facts: 1,166 instruments, 7,213 sessions, 5,481,906 bars; snapshot build 297 s at 7.6 GB process peak and verified reopen 59 s; ledgr_run() monthly top-20 momentum DONE in 155 s at 4.8 GB with 8,798 fills and about 3.6 million diagnostic rows; monthly equal-weight DONE in 240 s at 3.6 GB with 155,402 fills, 11 sizing_unavailable skips and 527 terminal dispositions; a three-candidate ledgr_sweep() DONE in 1,380 s at 5.8 GB, about 460 s per candidate, three times one run. Stops and defects found. S1: ledgr_walk_forward() refuses rolling folds that start on the snapshot first date, because fold boundaries are UTC midnight while the sealed range starts at the first close (21:00 UTC), and the message omits the valid range; new ticket LDG-2991 in Workstream 21. The sweep cost and a clean-context read-only review of the snapshot, experiment, sweep, promote, run and reader cycle at dfde5b3 found these scaling defects, all on paths no dense benchmark exercises at scale: F1 the availability results plane (ledgr_results(bt, availability) and ledgr_run_explain()) replays the ledger from the database once per pulse and grows its mark axis with c(), extrapolated (estimate) to about 27 minutes for momentum and hours for equal-weight, and the dense result branch repeats the replay-per-pulse shape; F2 the fill recording-pulse lookup (R/execution-timing.R) scans all filled diagnostics per fill after reading every diagnostic row, quadratic in fills and paid by fills, trades, summary, metrics and walk-forward scoring, about 140 s after the equal-weight run; F3 every ledgr_run() recomputes the full snapshot hash, estimated 50 to 60 s of the 155 s run and paid again by promote and every walk-forward test run; F4 the sweep memory handler appends diagnostics with rbind over the accumulated table, measured 468 s for 3.7 million rows with the real handler, only to derive assumption flags and stopped IDs, with siblings in write_exception_diagnostic and the durable per-pulse strategy-state rows; F5 asset-state normalisation loops over the decision axis twice per pulse, measured 2.2 ms per pulse at 500 members; F6 finalize persists features with one append per instrument; F7 durable diagnostics are written in 4,096-row chunks, about 900 appends per run; F8 the fill-heavy path calls the execution view per target, grows its accepted and rejected plan lists inside the target loop, hashes each fill meta through a cache that rarely hits and copies lot-state vectors per fill; F9 the facts-active availability validation formats every bar timestamp as text (dense ingest already formats distinct values) and F10 facts-active builds paste two bar-length duplicate keys; F11 the sweep rebuilds availability preparation, feature views and corporate-action schedules per candidate, of which only the immutable parts can be shared because provider and plan carry mutable cursors, and builds over-wide full-axis pulse bar views; F12 strategy state is serialised every pulse including when the sweep handler discards it; F13 minor per-pulse work (full-universe close marks, ctx$vec built twice, character-column copies, canonical_json cache misses). No correctness bug was confirmed. Every cost in this amendment is an estimate or a loaded-host measurement: it locates a shape but sets no effect size; LDG-2982's quiet paired baselines are the only gate. Routing. F1, F2 and F4 to F13 become Workstream 22, tickets LDG-2982 to LDG-2990, under the Cut 2 rule that outputs stay byte-identical and each change is measured on public paths. F3 is routed to the open snapshot-verification design session (planned at d38f364): when and how often ledgr verifies a sealed snapshot is that session's decision and this cut already excludes re-hash cost, so its measured share is recorded for it. The maintainer routed it there on 2026-10-08 together with the walk-forward evidence (every test fold re-hashes the whole unchanged snapshot, an estimated 26 of 42.5 minutes), recorded in the session's row in inst/design/ledgr_roadmap.md and its Due entry in inst/design/rfc/README.md so the session rethinks when verification happens. The one-row-per-member-per-pulse decision trace (about 3.6 million rows per run) is routed to the maintainer as a diagnostic-verbosity design question, because changing it changes what users read. Peak memory is recorded for history-wave Session E; structural memory reduction stays out of scope. The compiled spot-FIFO accelerator refuses availability-aware experiments by contract; whether it should support them is measured, not decided, by spike LDG-2992 after Workstream 22. Harness defects, not ledgr: a reason label of 1 in the stage JSON is jsonlite naming the empty reason_code of plain fills, and the sweep stage exit status 1 came from editing the stage script while it ran, after the sweep had finished and recorded. LDG-2976 stays open until its walk-forward and phase-profile records land; any further stop amends this cut again."
    sequencing: "LDG-2976 first; its record and any cut amendment precede the cut review. LDG-2977 then commits the oracle, red on the current tree. LDG-2978, LDG-2979 and LDG-2980 are mutually independent and each turns its own oracle group green; any amended stopper tickets follow the same pattern, including LDG-2991. LDG-2977 and LDG-2982 may not start until LDG-2976's walk-forward and phase-profile follow-up is committed, reconciled against its acceptance criteria, and any newly discovered stop has amended this cut. Workstream 22 is independent of Workstream 21: LDG-2982 records the oracle and pre-cut baselines first, on quiet, fresh, paired processes; the vendor-neutral fixture lane is the repeatable implementation gate and the private Sharadar measurement is a confirmation recorded as aggregates; LDG-2983 to LDG-2990 then land one at a time, each measured with paired arms against its predecessor commit with one measurement process at a time; LDG-2985 precedes LDG-2990 (both change sweep setup and its handler) and LDG-2986 precedes LDG-2988 (both change the fold pulse loop). LDG-2990 follows LDG-2988 (both touch execution planning state). LDG-2992 runs after LDG-2983 to LDG-2990. LDG-2981 runs last, after every new test exists. One cut review and two planned workstream close reviews over seventeen tickets is 0.176. tickets.yml is the sole sequencing authority."
    out_of_scope: "The Sharadar adapter code in ledgr-research; settlement of acquisitions and spin-offs; snapshot re-hash cost (WS5); feature reuse across calls (LFB-026); the WS3/WS4 history wave and its register; memory reduction beyond the bounded holders Workstream 22 removes; the default volume of decision-trace diagnostics; compiled accounting for availability-aware runs beyond the LDG-2992 measurement; NEWS entries for Cuts 6 and 7 (WS8 release gate); and any change to fills, costs, accounting, terminal outcomes or valuation policy not required by a recorded stopper."
    workstreams: [21, 22]
    closeout: "LDG-2976's run record, the two oracle records and baselines, the implementation tickets' evidence, the LDG-2992 spike closeout and the two accepted close reviews form the Cut 11 closeout."
    accepted: "2026-10-08 by the maintainer after the PASS_AFTER_PATCHES cut review, the incorporated patches and the routing of F3 with the walk-forward rehash evidence to the WS5 verification session. Workstream 21 was accepted on 2026-10-09 after correction 8044db1. Workstream 22 (LDG-2982 to LDG-2990) was accepted on 2026-10-10. The separately executed LDG-2992 spike passed independent review at c07de2d5; its evidence was integrated without its production fork, and the maintainer closed Cut 11 on 2026-10-12."
    close_review: "Workstream 21: an independent Codex Type 1 close review of 8eb7dbf..4811c5f (2026-10-09) returned NEEDS_TYPE_2. B1 (Type 2; decided by the maintainer on 2026-10-09 and implemented in 9d31b4a: carry_test_state requires ordered, contiguous test windows, overlap and reverse order refuse with ledgr_walk_forward_overlapping_carry, flat_test_state accepts any layout): carry_test_state accepts overlapping and reverse-chronological test windows, so a test run can open from the closing state of a window that ends after it starts; the fold-list validator checks sequence numbers but not chronology, and contracts.md (Gapped carry) promises overlapping lists unchanged. B2 (fixed in 3a181b0): a resumed row with no ledger event (CREATED, RUNNING or FAILED before its opening append) ran without its opening positions; LTB-0207/LCL-0207 pin it. S1 (not a defect): the cited pkgdown article outputs are under the gitignored docs/ (only docs/AGENTS.md and docs/pkgdown.yml are tracked), and the site rebuilds from the corrected article on push to main. S2 (fixed in 6567b73): lfb019 gains a stopped run, so rebuilding past the last fully valued pulse fails the oracle; evidence/pre_cut11_r2 and evidence/after_ws21_r2 replace the first pair. N1 (recorded): the reviewer measured one ordinary fast run at 102.40 s, 9.60 s below the bound, against the three registered runs at 98.47 to 98.87 s. The reviewer cleared the mutations, arithmetic, mark equivalence, dense extraction, gap calendars, boundary identity, NEWS, moved blocks and long-window ratios.  The focused Codex re-review of 4811c5f..b618cc0 (2026-10-09) returned CHANGES_REQUIRED with one detector gap: the implementation refuses a test window starting exactly at the previous end, but changing <= to < left every test green. LTB-0204 now pins the equal-boundary case (class, shared parent and message), and the < mutation fails it; the re-review otherwise cleared B1, B2 and S2 by mutation (ordering check, first-attempt-only opening posting, last-valued cut) and confirmed the docs, archive and accounting. Review accounting: one cut review, one close review and one focused re-review, 3/17 = 0.176 before Workstream 22. Workstream 22 (LDG-2982 to LDG-2990; the maintainer split LDG-2992 out on 2026-10-10): an agent-run adversarial Type 1 close review of 8475da8..1df4d3f returned CHANGES_REQUIRED with no byte-identity defect and evidence or acceptance gaps: unresolved Sharadar peak-memory ratios, three scope items dropped without a measured rejection, F7 admitted on aggregate, an empty ticket record without after-probes, two claims stronger than their tests, an instruments-by-pulses is.null() pass and two edge guards. d07e607, e5b0f1a, 354c9db and b3af3ff corrected them; the Sharadar process-peak rise was the 500,000-row feature blocks, now 50,000. The focused agent re-review returned PASS on 2026-10-10 after re-running the LTB-0214 mutation, with three items for the maintainer: F7 and the in-place character write as one dependent unit, the F2 two-point probe (1.17 under a concurrent orphaned queue, 1.09 when rerun quietly against the 1.10 threshold; four-point slope 1.03), and metrics no longer opening the snapshot. Review accounting: two more invocations, 5/17 = 0.294 before the final Codex review. The maintainer then decided materiality on effective end-to-end speedups and the F12 state-JSON reuse and single ctx$vec build were reinstated (5c32255). The independent Codex Type 1 close review of 8475da8..983d15c returned CHANGES_REQUIRED: F12 persisted stale state when a strategy changes its state list in place (reproduced through ledgr_run()), the dense results plane had no failure-sensitive detector and a 'decreasing' fixture was a tie, and the 4.4 percent was an attributed estimate, not a measured gain; everything else checked clean. e12c950 reverts F12, adds LTB-0215 (fails on 5c32255) and LTB-0216 (fails with the per-time loop forced), a decreasing-timestamp ledger in LTB-0209, and relabels the estimate. Review accounting: 6/17 = 0.353. The focused Codex re-review of 983d15c..10e2869 returned PASS on 2026-10-10 with no new finding: restoring the 5c32255 cache fails LTB-0215 with five stale values, forcing the per-time loop fails LTB-0216, the decreasing ledger reaches the timeline guard, the F13-only ratios reproduce exactly, and the F5 skip and the F13 partial update were checked against the F12 aliasing class and found safe. Review accounting: 7/17 = 0.412. The maintainer accepted Workstream 22 (LDG-2982 to LDG-2990) on 2026-10-10. Cut 11 stays open for LDG-2992, the split-out spike."
    spike_close_review: "LDG-2992: independent Type 1 spike review returned PASS at c07de2d5 on 2026-10-12. The reviewer reran the checker; verified three exact-parity cases and all three gutted-path detections; confirmed the aggregate-only Sharadar record, required-artifact and source-scope guards, 740/1500-line harness budget and one-page closeout; and found no private data or product change. Final Cut 11 review accounting is 8 invocations over 17 tickets, 0.471. The release branch integrates only dev/spikes/compiled_availability_accounting/; the experimental changes to R/ remain on the spike branch and bind no public or default behavior."
