    dependencies: ["LDG-2959"]
    scope: "Carry compact freeze and terminal-assumption flags plus attempted, done, incomplete and failed counts through run lists, ledgr_run_compare(), sweep print and tables, ledgr_sweep_review(), walk-forward scores and print, and ledgr_experiment_plan(). Keep typed completion reasons and affected IDs inspectable. Frozen DONE runs remain eligible under their declared policy with exposure fields beside ranking output. Named incomplete runs remain non-comparable full results. Effective trials, retained comparable return panels and DSR mathematics remain byte-for-byte semantically unchanged; attempted and excluded counts are disclosure only."
    acceptance: ["synthesis Section 7 case 8: one mixed public sweep and one walk-forward session assert exact attempted, done, incomplete and failed counts, IDs, typed reasons, freeze flags and terminal-assumption flags on every named surface", "DONE frozen candidates remain rankable and carry their exposure fields, while incomplete candidates remain excluded from ranking, filtering, promotion and full-run comparison without disappearing from inventory or review", "effective-trial and DSR numerical inputs and outputs are identical to the pre-ticket completed-panel oracle; adding attempted or incomplete prefixes to either input fails an exact structural detector", "ledgr_sweep_review() issue rows show canonical completion reason and affected IDs rather than NA, and a named incomplete run returns its typed refusal instead of prefix metrics presented as full results", "removing one candidate from an attempted count, hiding one reason or ranking one incomplete prefix fails a registered detector", "each new load-bearing block is registered in tests/claims.yml with the five review obligations and LDG-2960 changes no terminal or valuation economics"]
    evidence: ["Selection counts and compact valuation flags now travel through every named surface. ledgr_completion_json() writes affected IDs as an array and, for availability runs, an assumptions object with valuation_state, frozen_instrument_sessions, max_frozen_equity_weight, frozen_at_end_value and assumed_terminal_outcomes. Live and reopened sweep tables and walk-forward scores derive stop_reason, affected_instrument_ids and the five flags into the columns directly after completion_json. ledgr_run_list() appends the flags from one grouped diagnostics query (ledgr_run_assumption_flags_many(); only frozen runs read their frozen rows and equity). ledgr_run_compare() carries the flags and a selection_counts attribute disclosing excluded statuses, and a named incomplete run still raises ledgr_run_not_complete. Sweep, review, run-list, comparison and walk-forward prints report attempted, done, incomplete and failed counts, walk-forward per window over distinct fold-candidate evaluations; review issue rows show stop_reason and affected IDs. ledgr_experiment_plan() gains an assumptions table with default markers. No terminal or valuation economics changed.", "LTB-0176 to LTB-0179 (review) and LTB-0180 (fast) share one hand-derived four-candidate fixture: clean, frozen with the default write-off, a refused delisted terminal, and a failing strategy. They assert exact counts, IDs, reasons and flags on the live, printed, saved, reopened, reviewed, run-list, comparison and walk-forward surfaces. The frozen DONE candidate is ranked and extractable; incomplete and failed candidates are excluded from filtering and comparison but stay in review issues; an incomplete candidate is refused extraction even with allow_failed, while a failed one is extractable only with allow_failed = TRUE and never promotable (decision 10). The mixed sweep's panel, effective-trial membership, distances and counts, and DSR summary equal those of a completed-only oracle sweep apart from sweep identity and the excluded-ID disclosure, and naming an incomplete or failed candidate fails ledgr_sweep_returns_candidate_not_completed. Eight mutations in a disposable clone were each detected: attempted count minus one, hidden stop reason, review ranking an incomplete candidate, comparison hiding exclusions, stale counted as frozen in run flags, walk-forward counting long rows, the plan marking an added label as default, and a panel admitting an incomplete candidate.", "Rendering the articles exposed two printer defects, fixed before acceptance: optional columns read with $ warned once a user selected them away (now read with [[ ]], and count lines are omitted without status), and the added comparison columns broke the curated comparison view (the complete-names attribute is now refreshed; LTB-0178 pins the curated footer). Missing completion evidence now reads as NA affected IDs on sweep rows, matching ledgr_run_list(). Quickstart, sweeps, experiment-store, research-workflow, strategy-authoring-tools and walk-forward were re-rendered. The full suite passed 1019 blocks with 0 failures."]
  - id: "LDG-2961"
