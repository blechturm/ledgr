review_gate:
  status: "retired"
  authority: "inst/design/rfc/rfc_governance_lifecycle_v0_2_2_synthesis.md Section 5, accepted 2026-10-14"
  accounting: "For each open cut, record once at cut close the independent verdicts over completed tickets; dropped tickets enter neither count. Record findings by mode and whether each changed an outcome, plus maintainer decision turns. The ratio is measured, not gated, and is not restated in ticket or workstream fields."
  independence: "An invocation is one verdict at cut review, workstream close, focused re-review or final review from a session other than the implementing agent. Own-session agent reviews are labelled and counted separately."
  findings_home: "A review returning findings writes a file in the owning packet named for its review point. Its tickets.yml review result holds verdict, link and one line on what changed. A finding-free PASS is one line and creates no file. Closed tickets and past fields remain records."
  escalation: "A third correction round on one workstream stops for maintainer disposition of whether the ticket, implementation or brief is wrong."
sequencing: >-
  Each cut entry states whether its workstreams are serial or independent.
  Ticket dependencies bind within a workstream. tickets.yml is the sole
  sequencing authority.
review_obligations: >-
  Each workstream receives one Type 1 close review against its recorded claim.
  The reviewer independently checks that the inputs are the right inputs and
  applies the evidence obligations appropriate to the cut. Optimization work
  uses the exact-parity proof template, a current-tree clock, a failure-sensitive
  structural detector and walks, verbatim, the seven shapes named in
  optimization_coding_style.qmd, The Seven Shapes And Their Replacements:
  One-row frame per element, bound at the end; Full-table subset inside a loop
  over ids; Per-element parsing or formatting where a vectorised call exists;
  Per-row JSON on repetitive strings; Work computed and discarded, or
  recomputed on every call; Quadratic validators; Scalar writes into an
  environment-held vector. Independent review verdicts and correction rounds
  follow the review_gate accounting, findings-home and escalation rules above.
  Once LDG-2950 is accepted, every later
  optimization-cut close runs its ordinary local long-window suite and every
  release gate runs both the ordinary suite and the explicitly enabled
  release-only shape; hosted CI never uses their wall clocks as a gate.
