    scope: "Add the namespace-private process-local verified set and one ensure helper from synthesis Sections 3.2 to 3.4. Key entries by stable snapshot-store key, snapshot id, stored root and rule under a PID-checked process generation. Populate only after seal's in-transaction check and successful COMMIT, or after a complete recomputation equals the stored root; remove the matching entry after any failed status or verification check; never serialize it. A NULL or :memory: key never enters the set. The key always names the snapshot store: split-mode reconstruction obtains it from the run config's snapshot_db_path, and dbGetInfo(con)$dbname may key a raw connection only when that connection is itself the snapshot store and resolves a stable non-memory path. Derive from source a complete classification of every snapshot_* reader and enclosing public entry: class 1 metadata needs no proof, class 2 durable-result-only needs no proof, and class 3 ensures before rows affect output. Replace current recomputations with ensure except verify = TRUE and ledgr_snapshot_validate(), which always recompute. Sweep and walk-forward ensure at their first content-dependent outer read; candidate and fold guards hit the entry."
