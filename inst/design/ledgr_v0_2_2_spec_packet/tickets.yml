  - id: 12
    name: "Point-in-time consistency"
    cut: "2026-10-10"
    opening: "The point-in-time universe audit (inst/design/audits/v0_2_2_pit_universe_audit/, frozen commit 289d57c) passed Gates 1 to 3 on 2026-10-10. Stage 2 found code defects and contract errors in recovery, silently ignored inputs and entry-point consistency; the challenger reproduced every probe and kept 17 of 18 findings and added two. Stage 3 found the point-in-time core sound against the external yardstick and added two disclosure defects and one design debt this cut takes. The maintainer routed the code defects and contract fixes here, with the five maintenance items held since Cut 11 (macro plan, 2026-10-08 and 2026-10-09 amendments), as one review cycle."
    cut_review: "NEEDS_TYPE_2 on 2026-10-10. An independent Codex cut review (Type 1 with input check) of draft c6631cc confirmed that every challenged Stage 2 finding, M1, M2 and the five held items are owned or routed, and reproduced S2C_backtest, S2C_dense_acquisition, S2_nonpositive, S2C_session_posix and S2_calendar_short on the frozen tree. It returned two product decisions left to the executor (ledgr_backtest() refusal versus routing; the identity migration of existing stores) and Type 1 patches: separate LDG-2996 and LDG-2997 ownership, economic meaning of 'Sharadar results unchanged', a Sharadar non-positive preflight and a zero-volume detector, independent session-instant detectors, promotion-context compatibility, exact gates for the held items with LDG-3007 decided, a separate held-maintenance workstream, and byte identity carved out for intended changes. The maintainer took both decisions (decisions 6 and 7) and the patches are incorporated. The focused Codex re-review of a7d97dd returned CHANGES_REQUIRED: decisions 6 and the Type 1 patches resolved; LDG-3011 still delegated refusal versus reporting (maintainer decision 10); LDG-3010, LDG-3012 and LDG-3004 needed failure-sensitive acceptance for every promised surface, a concrete price-basis witness with its documentation migration, and identity-rule persistence; all are incorporated. Review accounting: one cut review, one focused re-review and four planned close reviews over 20 tickets, 6/20 = 0.300; the final focused Codex re-review of 310aac4 and f0dcd78 returned PASS on 2026-10-10 with all five items resolved (decision 10 binds seal-and-report for LDG-3011). Review accounting: 7/20 = 0.350 including four planned close reviews."
    authority: "inst/design/audits/v0_2_2_pit_universe_audit/charter.md (Routing of results; Gate 2 and Gate 3 records); stage2/findings.md, stage2/challenge.md and gap_analysis.md for each finding's evidence, probe and falsification line; macro_plan.md 2026-10-08 and 2026-10-09 amendments for the five held items; inst/design/contracts.md for the behavior each fix restores."
    source_table: "Frozen audit commit 289d57c; current tree at cut time 78977ef (contracts.md, R/ and tests/ unchanged since 289d57c). Every behavioral ticket names its audit probe in dev/audit/pit_universe/probes/ (S2_*, S2C_*, I_*); each probe must show the defect on the pre-cut tree and its absence after the fix. LDG-3006 and LDG-3008 record current-tree baselines before implementation."
    decisions: "Maintainer, 2026-10-10. Gate 2: (1) S2-009: a corporate-action refusal declared by policy (strict preset) becomes a typed INCOMPLETE stop with its accepted prefix, like terminal refusals; the research preset is unaffected. (2) S2-010: non-positive prices are refused at ingest. (3) S2-014: ledgr_compute_metrics() follows completion evidence and withholds annualized metrics where summary() does. (4) S2-006: promotion records the candidate's strategy, universe and policy identities and warns on a mismatch; it does not refuse. (5) S2-003 D1 and M1 take the policy route of the equity-settlement synthesis (s3.3, s3.5): an unmodeled held corporate action reports fidelity unsupported under research and stops under strict; ingest keeps the subtype vocabulary open. After the cut review and Gate 3: (6) ledgr_backtest() refuses availability-aware snapshots with a classed error naming ledgr_experiment() and ledgr_run(); it is not routed through availability semantics. (7) Identity binds snapshot_hash under a versioned identity rule without migration: stored runs stay readable under their recorded rule; resuming an old-rule run or rerunning an old-rule walk-forward session refuses with a classed error. (8) An availability-aware experiment must declare its price basis, and the contract states that ledgr's accounting assumes split-adjusted share units (gap G-009). (9) Results label assumption-backed knowledge and the universe kind (G-007), and off-session bars are reported (G-008). (10) Off-session bars keep sealing and runtime exclusion and are recorded with a reason in the snapshot's observation evidence, counted in snapshot info and the run summary; they are not refused, per availability synthesis s4.4. Routed elsewhere: S2-007, S2-011 and the Gate 3 history-wave scope changes (G-013, G-014, G-015, Session E) to the history-wave register; S2-012 with LFB-006 and LFB-022; S2-003 D2 with history-wave decision C and LFB-013; dividends for the Sharadar adapter (G-016) as a ledgr-research adapter task, with Sharadar results and the WS7 proof stating 'dividends excluded' until it lands; WS7 and WS8 acceptance additions (G-013, G-016, G-025) in the macro plan. Maintainer, 2026-10-11: decision 8 is amended. ledgr's philosophy is good, disclosed defaults rather than forced declarations; an undeclared price basis is assumed split_adjusted and disclosed as a default (LDG-3013) instead of refused, and availability-aware experiments gain a disclosed default stale horizon (LDG-3014)."
    sequencing: "Workstream 23 (recovery) first, as it holds the high-severity defects and LDG-3004 touches the finalization paths LDG-2994 changes; then 24; then 25; then 26 (held maintenance; LDG-3006 after LDG-2995)."
    out_of_scope: "Design questions routed at Gates 2 and 3 (S2-007, S2-011, S2-012, S2-003 D2, G-013, G-014, G-015); the snapshot verification policy (WS5 session); the ledgr-research adapter changes (dividend facts, G-016); the peer-benchmark harness parity drift (dev/bench, not point-in-time); LDG-2992; exact-quantity settlement (G-010, G-019)."
    workstreams: [23, 24, 25, 26]
    closeout: "Every audit probe named by a ticket flips on the final tree; fills, ledger, equity and positions stay byte-identical on the fixture and Sharadar lanes for runs no finding touches, and every intended change (config identity, promotion evidence, metrics, corporate-action and result summaries) is listed by its ticket; fast profile within its bound; contracts, NEWS and the audit charter record each finding's resolution."
    accepted: "2026-10-10 by the maintainer after the cut review (NEEDS_TYPE_2), maintainer decisions 6 to 10, and two focused Codex re-reviews ending in PASS. Workstream 26 was accepted on 2026-10-12 at 0c753e86, closing Cut 12."
    close_review: "Cut 12 closed after every workstream's recorded review loop and maintainer acceptance. Review accounting is 21 invocations over 26 tickets = 0.808: three cut-review invocations; five for Workstream 23; four for Workstream 24; four for Workstream 25; and five for Workstream 26. This is a historical breach of the 0.5 gate, recorded rather than hidden by merging, padding or dropping evidence. Twenty-five tickets completed and LDG-3008 was dropped only after 17 runs did not reproduce its alleged stall."
    status: "closed"
  - id: 13
    name: "Snapshot verification and sweep persistence"
    cut: "2026-10-12"
    opening: "The maintainer accepted the snapshot-verification-policy synthesis on 2026-10-12 after a GREEN cross-platform conformance spike and a Type 1 final review that passed after three in-place patches. The synthesis binds two ordered WS5-A tickets: rule-3 snapshot identity first, then a PID-guarded process-local verified set. The macro plan separately routes the pre-existing ledgr_sweep_save() single-fingerprint defect into this cut under its own correctness claim and close review. No implementation starts before independent cut review and maintainer acceptance."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-12. The independent combined Type 1 and Type 2 review confirmed that synthesis decisions D1 through D9, all five contract changes and all eight detecting gates have owners and failure-sensitive criteria. Its four required patches are incorporated: LDG-3021 covers every exactly-one-feature sweep representation; LDG-3019 owns the LCL-0015 / LTB-0018 rule-3 re-pin; LDG-3020 always keys the snapshot store, including split reconstruction; and the owning WS7 ledgr-research cut records the deferred private-lake rebuild time. The cut also adopts the bounded should-fix items: Workstream 28 may open independently; Workstream 27 can record LDG-3019 evidence before LDG-3020 closes; the two future obligations are routed; the benchmark before arms are named; the one-thread host is explicit; and the unsupported-rule condition remains reserved for future unknown markers. One cut review plus two planned Type 1 workstream close reviews is 3 invocations over 3 tickets, 1.000 against the 0.5 review gate. The breach follows from the accepted two-workstream claim boundary and is recorded rather than repaired by padding, dropping evidence or merging unrelated persistence and verification claims. Maintainer acceptance still opens the workstreams."
    authority: "inst/design/rfc/rfc_snapshot_verification_policy_v0_2_2_synthesis.md, accepted 2026-10-12; inst/design/rfc/rfc_snapshot_verification_policy_v0_2_2_seed_v2.md Section 5 for the exact rule-3 bytes; inst/design/spikes/snapshot_hash_rule_3_conformance_spike/closeout.md and the recorded cross-platform spike evidence; inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS5 and its 2026-10-12 amendments. The ledgr_sweep_save() defect is authorized by the macro-plan amendment and the accepted Workstream 25 review routing."
    source_table: "Current tree 8e0d7f81 after accepted Cut 12 housekeeping. The spike recorded ten portable deterministic roots on Windows and Ubuntu, a covered-value mutation that changes the root, hostile-order refusal and a gut that the checker detects. At five million bars the scratch encoder measured 0.676 microseconds per bar on Windows and 0.999 on Ubuntu, endpoint growth exponents 1.038 and 1.001, and streaming peak RSS 149 MB and 130 MB. The retained 300,000-row fact projection measured 65.7 MB of JSON and 418 MB to 474 MB peak. The current text hash was separately measured near 56.6 seconds at 5.5 million bars. The sweep defect reproduces on both pre-Cut-12 be3aaf0a and current 8e0d7f81 for every sweep whose candidates resolve to exactly one feature fingerprint: the registered parameterized feature map, a concrete one-feature map and a plain one-feature list all fail in ledgr_sweep_save() with canonical_json() received a character input that is not valid JSON; zero-feature and two-feature sweeps save."
    decisions: "Maintainer, 2026-10-12. (1) Rule 3 is exactly seed v2 Section 5: R-owned column-major binary blocks of 10,000 logical rows, bytewise UTF-8 key order asserted in R, little-endian typed payloads, domain-separated block, section and root SHA-256, and the existing exact fact projection with the three named changes. (2) Rule 3 has one whole-snapshot root; no component hash, Merkle tree, hash registry, DuckDB-defined byte or public bypass. (3) Missing, rule-1 and rule-2 markers stay metadata-readable but every class-3 use refuses with ledgr_snapshot_rebuild_required; ledgr_snapshot_hash_rule_unsupported keeps its unrecognized-future-marker meaning and does not handle legacy markers. Hostile order refuses with ledgr_snapshot_hash_order_invalid; a failed complete verification retains LEDGR_SNAPSHOT_CORRUPTED and removes any matching verified entry. (4) ledgr_snapshot_info() exposes hash_rule_version and verified_in_process; print states Hash rule: 3 (verified in this process) or not verified in this process. The process generation keeps PID binding and may keep an opaque private nonce, but exposes no nonce. (5) The verified key always names the snapshot store. In split mode reconstruction derives that store from the run config's snapshot_db_path. dbGetInfo(con)$dbname may key a raw connection only when that connection is itself the snapshot store and the path is stable and non-memory; otherwise the call verifies without entering the set. :memory: never enters the set. (6) Sweep and walk-forward establish proof at the first content-dependent outer read before candidate or fold execution; inner guards hit that entry. Explicit validation and verify = TRUE always recompute. (7) The sweep persistence repair changes no public schema, identity rule, retention meaning or canonical_json() contract; if implementation requires any of those, stop for Type 2."
    sequencing: "Workstreams 27 and 28 may open independently after Cut 13 acceptance because they share no production file or correctness claim. Inside Workstream 27, LDG-3019 implements and proves rule 3 while retaining every current complete-verification call; it lands alone before LDG-3020 starts. LDG-3020 then introduces the verified set from a source-derived consumer census, and both tickets receive one workstream close review. Workstream 28 may land before or alongside Workstream 27; after Workstream 27 lands, its focused persistence suite reruns against rule-3 identity without reopening LDG-3021. The claims remain separately reviewed. tickets.yml is the sole sequencing authority."
    out_of_scope: "WS5-B feature-artifact policy; WS3 and WS4 history, hydration and recursive-indicator semantics; DuckDB-computed snapshot identity or the persisted-data execution-placement RFC; component hashes, Merkle trees or a hash registry; a public verification cadence, bypass, trust or scope knob; in-place migration or resealing of legacy roots; reducing the retained fact-projection memory peak; making ledgr_sweep_open() class 2 by persisting its universe; any saved-sweep schema or identity migration; private Sharadar rows; the ledgr-research lake rebuild and dividend-facts adapter work, which follow implementation. The owning WS7 ledgr-research lake-rebuild cut records the one rule-3 rebuild time together with the dividend-facts rebuild rather than making Cut 13 rebuild private data."
    workstreams: [27, 28]
    closeout: "Workstream 27 closes with the production golden-root, refusal, source-census, counter, cost, memory and end-to-end records required by LDG-3019 and LDG-3020. Workstream 28 closes with the public feature-map sweep save, reopen and promotion oracle. No separate cut-level evidence essay is created."
    accepted: "2026-10-12 by the maintainer after the independent cut review returned PASS_AFTER_PATCHES and every required and adopted bounded patch was incorporated; Workstream 27 opened the same day. Workstreams 27 and 28 and Cut 13 were fully accepted and closed by the maintainer on 2026-10-13 after their final focused Type 1 reviews returned PASS."
    close_review: "Workstream 27 Type 1 close review at 9b8b552d returned CHANGES_REQUIRED. F1 found that ledgr_run_open() rebuilt an INCOMPLETE availability provider from snapshot facts without first verifying them; F2 found no production-path split-store key detector; F3 found checkout/install claim guards that passed when their suite was absent; F4 found no Ubuntu review-profile reproduction of the ten golden roots; F5 found two over-claimed detectors; F6 corrected the memory attribution to DuckDB retrieval at about 125 MB per million bars and routed that evidence to the placement RFC and WS7 lake rebuild; F7 corrected the seal count, binding host, seven-shape record and long-window reproducibility. The first focused re-review left bounded record and detector residue, corrected through fa41283d. The final focused Type 1 re-review returned PASS at fa41283d: all original and residual findings were closed, every named mutation failed, 31 suites and both record checkers passed, radix quarantine ordering preserved the pinned bytes across the tested locales, and GitHub run 38371833556 exercised the production rule-3 roots on all three jobs. Three alternating scratch pairs put fa41283d at a 108.04-second median against 107.84 for 57270199, so the checked-in 131.70-second timing miss remains recorded as a failed loaded-host record rather than a regression or a pass. The maintainer accepted Workstream 27 on 2026-10-13. Workstream 28 Type 1 close review at d3e4425e returned CHANGES_REQUIRED: F1 found an AsIs class on reopened singleton fingerprints, F2 required dual in-memory/reopened promotion-context parity and the pre-cut multi-feature byte oracle, and F3 required a passing quiet-host fast record or explicit maintainer adjudication. Correction 3691f5f8 closes F1 and F2 with a failure-sensitive exact-list oracle, dual promotions and the pre-cut multi-feature encoder. Two P-core-pinned three-run fast records remain red at 113.91 and 115.05 seconds against 112; the maintainer accepted that narrow miss as an explicit WS28 exception without changing the gate or moving tests, because no fast block was added and same-host evidence found no regression. The focused Type 1 re-review returned PASS at 901325af, confirming every finding closed and no new defect. Final review accounting is six invocations over three Cut 13 tickets = 2.000, a historical breach of the 0.5 gate recorded rather than hidden."
    status: "closed"
  - id: 14
    name: "Pre-CRAN legacy removal and structural hygiene"
    cut: "2026-10-13"
    opening: "The maintainer accepted the pre-CRAN legacy-removal synthesis on 2026-10-12 after its Type 1 final review returned PASS_AFTER_PATCHES. Cut 13 is closed, so this draft takes the next macro-plan slot. It removes backward-compatibility machinery before ledgr's first CRAN release, centralizes current-store creation and validation, rebuilds the private research lake once under the resulting format, and installs the bounded codebase-hygiene instruments from the macro-plan amendment. No implementation starts before independent cut review and maintainer acceptance."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-13. The independent combined Type 1 and Type 2 review accepted the contract edits, routing, three-workstream claims, linear order and aggregate-only lake evidence, but its current-tree recount found eleven ownership and detector gaps. The revised draft incorporates all eleven: every connection source and an existing-connection gate; an independent literal fingerprint oracle and radix serializer; complete catalogue normalization and cache identity; claim rewrites landing with their deleting ticket; safe schema-119 creation at the gate commit; exact current validator errors; all six retiring conditions; a separately sized hygiene backlog before its permanent gates; residual contract clauses; both future-obligation routes; and a named lake build with mandatory peak evidence. The focused re-review required four further ownership and census corrections plus four wording clarifications; all are incorporated without changing the cut's design. One cut review, one focused re-review and three planned Type 1 workstream close reviews is five invocations over fourteen tickets, 0.357 against the 0.5 review gate. The added LDG-3035 separates a measured 228-class and helper backlog from the permanent structural gate; it is not review padding. The maintainer accepted the patched cut and opened LDG-3022."
    authority: "inst/design/rfc/rfc_pre_cran_legacy_removal_v0_2_2_synthesis.md, accepted 2026-10-12 after its final-review patches; inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md change-control amendments of 2026-10-12 for pre-CRAN removal, the interim lake rebuild and codebase hygiene; inst/design/contracts.md as amended at this ticket cut; AGENTS.md and inst/design/manual/optimization_coding_style.qmd for every ingest, seal, fold, hydration, finalisation or result-reader path touched."
    source_table: "Current tree c7911eea after accepted Cut 13. The synthesis code citations were verified at 164e15ba, but Cut 13 changed snapshot verification and readers. The cut review re-derived: path openers plus held, cached and eight caller-supplied connection entries; 20 candidate format bindings before replacement; 29 non-exported non-S3 functions without an R/ reference, of which 19 are referenced by tests and 10 nowhere; 363 literal abort classes, 228 undocumented non-internal and 149 asserted in tests; and two additional legacy claims, LCL-0248 and LCL-0210. LDG-3022 re-derives these from its own implementation commit before deletion; review counts are sizing inputs, not acceptance targets. Current stores use schema 118 and saved-sweep schema 4. Rule-3 snapshot identity and the process-local verified set are complete."
    decisions: "Maintainer and accepted-synthesis decisions, 2026-10-12 to 2026-10-13. (1) Before the first CRAN release ledgr supports only the current stored format; there is no migration, legacy reader, missing-marker fallback or compatibility argument. (2) The sole current experiment-store schema is 119. ledgr_store_open(path, mode) is the package-owned persistent-store gate. mode open accepts only the current marker pair; mode create additionally initializes a proven-empty file transactionally with the marker last. ledgr_db_init() keeps its public name and means create-empty-or-open-current; no second exported opener is added. (3) The marker pair is experiment_store_schema_version plus format_fingerprint. A namespace-private radix serializer writes the fingerprint from radix-ordered binding names while preserving each length-one atomic scalar's R type; this is not canonical_json(). It contains the synthesis's eighteen named constants plus new atomic ledgr_availability_execution_timing_rule_version = 2L and ledgr_snapshot_content_hash_rule_version = 3L; the old function-shaped timing version and rule3-named constant are replaced, not retained as aliases. (4) ledgr_store_rebuild_required has parent ledgr_invalid_store; cause is exactly one of older, newer, missing_marker, invalid_marker or fingerprint_mismatch. It carries normalized path, recorded_version, recorded_fingerprint and radix-sorted differing_constants, using typed missing values when unavailable. Every message starts Store '<path>' is not current for this ledgr build (cause: <cause>). and ends Recreate it with the current package. Cause-specific detail may appear between those sentences and is pinned by tests. (5) R/db-schema-current.R is the only current DDL. Strict validation compares a normalized current-store catalogue with a reference rendered from that DDL by the running DuckDB; extra schema is a difference. (6) Current-store outputs, rows, identity and conditions outside the expressly removed legacy surfaces remain exact. No schema redesign, ledgr_backtest() removal, factory change, current-result reinterpretation or backward-compatibility shim is authorized. (7) The private ledgr-research lake is rebuilt after the final format-changing ticket, under rule 3 without dividends; the rebuild records time and aggregate/native provenance only. (8) The codebase-hygiene workstream begins report-only, gives lint one cut of advisory operation, then installs only the accepted uncalled-internal and condition-class structural gates and makes lint blocking after the one styler pass. Export and unregistered-test enforcement remain deferred."
    draft_resolutions: "Cut-review resolutions for maintainer acceptance. (1) ledgr_validate_schema() preserves the exact existing unclassed messages for every existing catalogue defect; the new class belongs only to the store gate. New index/default dimensions get pinned unclassed messages. No exception to current-condition parity is taken. (2) A helper call site is a static or resolved dynamic reference in R/ or tests/testthat; exports, registered S3 methods and hooks such as .onLoad are classified separately. Test-only seams remain visible in the report and require a named testing contract; only a function with no code or test reference is uncalled at the executable floor. (3) A condition is documented only by an alias and description in the condition reference; every recoverable public element of a class vector, including parents, is documented. Existing current-surface classes are documented rather than renamed. Internal-prefix renaming is limited to a newly introduced class not named by code, tests, contracts, articles or help. (4) The measured helper and condition backlog is reconciled in LDG-3033 before LDG-3034 installs the permanent gates."
    evidence_paths: "Source censuses live under dev/bench/v0_2_2_pre_cran_removal/census/. Per-ticket fixture-ladder records live under dev/bench/v0_2_2_pre_cran_removal/ladder/LDG-<id>/. Timing and lake summaries use sibling directories named for their owning ticket. Private rows and paths never enter these records."
    sequencing: "LDG-3022 lands first, alone, so its source-derived report can serve both product workstreams; LDG-3023 then starts the advisory lint interval. Workstream 29 is serial from LDG-3024 through LDG-3027. Workstream 30 is serial from LDG-3028 through LDG-3031, with focused-correction ticket LDG-3036 last because it changes the current format fingerprint and repeats the interim lake rebuild. Workstream 30 begins only after Workstream 29 is accepted. After Workstream 30 is accepted, Workstream 31 resumes with LDG-3037 through LDG-3040: exclude the design tree, restore seeded-run RNG state, classify inline schema-version literals and rename three test helpers. Those edits land before the styler-only commit and lint promotion in LDG-3032, backlog reconciliation in LDG-3033, structural detectors in LDG-3034 and standing-rule consolidation in LDG-3035. No product ticket runs in parallel with another because the build boundary, runtime, fingerprint, census and whole-tree style pass overlap broadly. tickets.yml is the sole sequencing authority."
    out_of_scope: "Any compatibility migration, legacy read-only inspection, old marker fallback or stored-artifact converter; schema redesign beyond consolidation of the current schema; public store-version diagnostics; removal of ledgr_backtest() or function(params) factories; changing current-store output; the WS3/WS4 history design; feature-artifact persistence; dividend-fact mapping; execution-core consolidation; enforcing export usage or registration of every test block; the parked documentation-generation locale entry point; and any private Sharadar row leaving its owning environment."
    workstreams: [29, 30, 31]
    closeout: "Each workstream closes through its own ticket evidence and Type 1 review. Workstream 29 proves one current schema and one store gate. Workstream 30 proves that no supported record or call surface retains a legacy version branch and records the interim lake rebuild. Workstream 31 reconciles the measured helper and condition backlog, proves the two source-derived structural gates, and records the one-cut lint transition and helper rule. No separate cut-level evidence essay is created. At Cut 14 close, record once the M1 count of independent verdicts over completed tickets, findings by review mode and whether each changed an outcome, and maintainer decision turns; this is measurement, not a gate."
    review_lifecycle: "Governance-lifecycle synthesis accepted 2026-10-14, Section 5. M1 retires the 0.5 gate. One invocation is one independent verdict at cut review, workstream close, focused re-review or final review from a session other than the implementing agent; own-session reviews are labelled and counted separately. Completed tickets form the denominator and dropped tickets enter neither count. Counts and the ratio appear once at Cut 14 close, not in ticket or workstream fields, together with findings by mode, whether they changed an outcome and maintainer decision turns. A third correction round on one workstream stops for maintainer disposition. M2 applies prospectively from the first review after acceptance: a review with findings writes a packet file named for its review point and the tickets.yml review result records verdict, link and one line on what changed; a finding-free PASS is one line with no file. Closed tickets and past fields remain historical records."
    accepted: "2026-10-13 by the maintainer after the focused cut re-review patches were incorporated and the YAML, documentation-contract and diff checks passed; Workstream 31 opened at LDG-3022. Workstreams 29, 30 and 31 and Cut 14 were fully accepted and closed by the maintainer on 2026-10-14."
    close_review: "M1 close accounting, recorded once for Cut 14 after all nineteen tickets completed. Eight independent verdicts count: one combined Type 1/Type 2 cut review and seven Type 1 verdicts at the focused cut re-review, three workstream closes and three focused workstream re-reviews. The measured ratio is 8/19 = 0.421; it is not a gate. All eight verdicts returned findings and changed an outcome: the cut reviews changed ticket ownership, sequencing and detectors without reopening the accepted design; the workstream reviews changed product correctness, failure-sensitive tests, evidence or acceptance handling. There were no finding-free independent PASS verdicts and no own-session verdicts in the M1 count. The preparatory Workstream 31 checkpoint and its confirmation are not additional M1 verdicts because they were not a cut review, workstream close, focused re-review or final review point. Four maintainer review-disposition turns are recorded: acceptance of the patched cut resolutions; acceptance of Workstream 29's measured store-gate cost and bounded residues; acceptance of Workstream 30's mechanical corrections without a third review; and acceptance of Workstream 31's final record and dead-code corrections without a third review."
    status: "closed"
  - id: 15
    name: "Pre-history foundations"
    cut: "2026-10-14"
    opening: "Cut 14 is closed. The one-execution-mode, growth-shape and feature-keeping probes have now answered the three measurements that stood between the current package and the WS3/WS4 history wave. The maintainer chose one bounded cut to apply the accepted governance lifecycle, delete both failed feature-retention mechanisms, remove two semantics-neutral costs from the strict TTR path, extract named fold phases and rebuild the private research lake under the resulting current format. No implementation starts before independent cut review and maintainer acceptance."
    cut_review: "CHANGES_REQUIRED in cut_review_15_rereview_2.md after cut_review_15.md and cut_review_15_rereview.md. The final focused confirmation closed the capture-identity, dependency and named-clock residues but found one remaining forgeable strict-TTR environment check. The exact local-shadow exclusion is incorporated. This was the third correction turn, so no fourth review was requested; the maintainer accepted the corrected cut under M1 on 2026-10-14."
    authority: "inst/design/rfc/rfc_governance_lifecycle_v0_2_2_synthesis.md Sections 2 through 7, accepted 2026-10-14; inst/design/spikes/feature_keeping_spike/charter.md and closeout.md; dev/spikes/feature_keeping/ runnable evidence; inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md amendments for the one-execution-mode result, fold-phase extraction, growth-shape matrix, strict TTR path and feature-keeping result; inst/design/contracts.md for current behavior; AGENTS.md and inst/design/manual/optimization_coding_style.qmd for necessity and the seven optimization shapes; inst/design/rfc/rfc_fold_execution_phase_ownership_v0_2_2_synthesis.md Sections 3 through 8 and 11, accepted 2026-10-15, for Workstream 38."
    source_table: "Accepted product tree f262e77a plus the registered spike artifacts in this draft and the independent cut-review probe. The one-execution-mode probe is RED: dense and availability economics match, but dense missing-bar strictness has no availability equivalent and the availability path is materially slower, so history must support both modes. The growth-shape matrix is GREEN for asymptotic shape but measures the availability TTR wrapper at about 130 times dense preparation, custom fn indicators at about 17 times the built-in and result replay at about 2.1 seconds for roughly 40,000 fills; only the two value-neutral TTR costs enter this cut. The feature-keeping spike is RED: the in-process cache saves 38.6 percent only on a second identical run, silently reuses stale values after a captured dependency changes, gives no reuse across the measured repeated five-fold walk-forward and retains 67,749,472 bytes at the 1,166 by 7,213 shape; durable persistence writes 40,000 rows, changes the fixture median from 3.52 to 3.56 seconds and has no named public consumer. The cut-review probe found the same capture-blind fingerprint on surviving precomputed-feature objects and reproduced stale sweep equity of 100000 against 99995.43 from a fresh computation. Cut 14 excludes inst/design from built packages, so moving about 900 repository references has no product-size benefit."
    decisions: "Maintainer, 2026-10-14 to 2026-10-15. (1) The governance lifecycle is applied through its four accepted workstreams; its guard ships only in report mode. Check mode cannot activate in this cut. (2) The design tree stays under inst/design. Cut 14 already removed it from built packages; this cut records the decision and does not spend risk on a repository-wide path move. (3) Both current feature-retention mechanisms are deleted rather than repaired: the process-local cache, its public clear function and cache telemetry; and persist_features, durable feature-row writes and the features table. (4) Removing the persisted surface creates experiment-store schema 120, a new current format fingerprint and identity rule 3 because features$persist leaves the identity payload. Schema-119 stores refuse through ledgr_store_rebuild_required and rule-2 configs refuse through the current invalid-config path. There is no migration, legacy reader, missing-field fallback, ignored compatibility argument or old-format test path. (5) LFB-028 remains a separate later design for opt-in factor or prediction evidence after history panels exist; it does not preserve or rename the current features table. (6) The strict TTR work removes only a self-comparison and repeated completeness calculation whose outputs are already determined; user indicators declaring both fn and series_fn keep the parity validation, while segment-level recursive computation remains WS4. (7) Fold extraction is a pure refactor into named phases over one typed fold-state carrier. It changes no execution, accounting, event, valuation, missing-bar or mode semantics and fixes no discovered defect in passing. (8) The private research lake is rebuilt once after the final format and refactor commit, with aggregate and native provenance only. (9) The history-wave RFC deliberately resumes only after all eight workstreams close: Cut 15 was chosen as the full pre-history boundary, so stage 2 consumes the final fold structure and current private-lake evidence as well as the governance result; it designs for both dense and availability modes. (10) Surviving indicator and feature fingerprints bind deterministic captured values using the same capture semantics as strategy fingerprints. A changed capture changes feature identity and invalidates stale precomputed payloads; unsupported or non-serializable captures refuse through the existing deterministic-config condition. Parameters remain the preferred explicit varying input, and no compatibility fingerprint or stale-payload fallback is added. (11) The 2026-10-15 pre-edit Workstream 38 inventory found that a literal context-build boundary would carry public context data frames and that a literal accounting/event split would reorder the existing per-fill atomic sequence. The maintainer therefore binds the eight phases as inputs and corporate actions; availability decision; context preparation over typed primitives; local public-context materialization, strategy invocation and target validation; fill planning; atomic fill application in the exact lot accounting, event write, accounting-fact and cash/position order; event finalization, flush and post-fill reconciliation; and valuation/state update. The public context and its data frames never enter the carrier or cross a phase boundary. Maintainer, 2026-10-15: decisions (7) and (11) are amended by the accepted fold-phase RFC synthesis, inst/design/rfc/rfc_fold_execution_phase_ownership_v0_2_2_synthesis.md Section 3; the historical text above is preserved. Decision (11) is superseded in part: equity and valuation marks are produced before the strategy call, so an eight-phase extraction ending in valuation would reorder a recorded fact; the extraction binds one fold envelope E and five pulse stages, P1 observe and settle, P2 decide, P3 plan execution, P4 apply economic events atomically and P5 commit the pulse (synthesis Section 4), over one locked fold-state environment, declared stateful services and typed short-lived results (Section 5). Its two retained rules stand: the public context and its data frames are created and consumed inside P2 and never enter the carrier or cross a stage boundary, and canonical fills keep the lot transition, event write, accounting fact, cash/position mutation order. Decision (7) receives one named exception, accepted explicitly: the fold returns live state, state_prev and next_event_seq (synthesis Section 5.5), repairing the stale private return that the registered compiled-parity blocks LTB-0006 and LTB-0013 read; every other discovered defect stays recorded and routed, and a failing block keeps the Workstream 38 close gate red (Section 8)."
    current_state: "Later accepted release-line authority 4397f58f supersedes decision (9)'s both-modes wording for current implementation planning without rewriting that historical decision: history is built on the availability path only, dense is frozen, and execution-core consolidation is committed before the first CRAN release. The current owner and downstream routes are macro_plan.md#execution-core-consolidation and #post-gate-live-routes."
    sequencing: "Workstreams 32 and 36 may open independently after Cut 15 acceptance. Workstream 34 follows 32; Workstream 37 follows 36. Workstream 33 joins the tracks after both 32 and 36 because the present-tense contract pass must see the schema-120 feature-retention deletion. Workstream 35 follows 33 and 34. Product continues through Workstreams 38 and 39 after 37. Workstream 36 establishes schema 120 before later exactness baselines; Workstream 38 extracts fold phases on the final pre-history engine; Workstream 39 rebuilds the research lake from that exact tree. WS3/WS4 resumes only after Workstreams 35 and 39 are accepted. tickets.yml is the sole sequencing authority."
    out_of_scope: "History-panel semantics, the public history API, causal hydration, recursive convergence, reset or gap semantics, session narrowing, calling TTR once per gap-free segment, custom-indicator acceleration, availability fast-context work, result-reader replay, execution-core unification, output-handler consolidation, compiled kernels, governance-guard check mode, relocation of inst/design, LFB-028 factor evidence, the later ML lifecycle and any compatibility path for schema 119 or the deleted feature-retention API."
    workstreams: [32, 33, 34, 35, 36, 37, 38, 39]
    closeout: "Each workstream receives one Type 1 close review against its recorded claim. Findings follow M2; a third correction round on one workstream stops for maintainer disposition. At cut close record once the M1 count of independent verdicts over completed tickets, findings by mode and whether each changed an outcome, and maintainer decision turns. No ratio is a gate and no separate cut-level evidence essay is created."
    review_lifecycle: "The retired review gate and M1/M2 rules below govern this cut from its first review. Past ratio language is not copied into new ticket or workstream fields. A finding-free PASS is one line; a review with findings gets a packet artifact named for its review point. From the first Cut 15 ticket, evidence follows governance-synthesis Section 5: every acceptance item gets a record pointer and one-line result, and empirical evidence also records input identity, environment, source commit, reproduction command, result and clock where applicable."
    accepted: "2026-10-14 by the maintainer after the exact local-shadow exclusion from the third cut-review correction turn was incorporated; no fourth review was requested under M1. All eight workstreams and Cut 15 were fully accepted and closed by the maintainer on 2026-10-15 after Workstreams 35 and 39 cleared the joint gate and M1 close accounting was recorded."
    close_review: "M1 close accounting, recorded once for Cut 15 after all sixteen tickets completed. Twenty-five independent Type 1 verdicts count: three in the Cut 15 review sequence; nineteen across the eight workstream closes and their focused or final follow-ups; and three in the fold-execution-phase RFC final-review sequence that supplied Workstream 38 authority. The measured ratio is 25/16 = 1.5625; it is not a gate. Eighteen verdicts returned findings—sixteen CHANGES_REQUIRED and two PASS_AFTER_PATCHES—and every one changed an outcome by correcting cut or RFC design, product behavior, detectors, evidence, records or acceptance handling. Seven finding-free independent PASS verdicts and no own-session verdicts are recorded. The Type 2 RFC response is not an M1 invocation because it was not a cut review, workstream close, focused re-review or final review. Seven maintainer review-disposition turns are recorded: Cut 15 acceptance; combined acceptance of Workstreams 32 and 36, including the explicit Workstream 36 timing exception; combined acceptance of Workstreams 33, 34 and 37; fold-execution-phase RFC acceptance; and separate acceptance of Workstreams 38, 35 and 39. The separate availability-only release-line decision at 4397f58f is current authority but not a Cut 15 review-disposition turn. Historical ratio text remains a record and creates no gate."
    status: "closed"
  - id: 16
    name: "Causal history foundation"
    cut: "2026-10-16"
    opening: "The maintainer accepted historical-projection synthesis v12 after the H0 current-tree reconciliation, H1 real-data input record, H2 decision wave, H3 synthesis and H4 Type 1 review. This cut is H5: it implements one availability-only causal history system, then closes H6 with integrated correctness, resource and real-data proof. It does not reopen portfolio construction, ML lifecycle, factor persistence, scheduling, dense execution or shared-memory design."
    cut_review: "PASS_AFTER_PATCHES in cut_review_16_rereview_1.md after the initial CHANGES_REQUIRED review in cut_review_16.md. R1-R12 and the Type 2 question are closed. The maintainer bound ledgr_pulse_snapshot() as external experiment-derived inspection rather than strategy callback API; the final nine ownership and wording patches close rule-4 contract routing, data-start language, ticket-local parity and exclusion witnesses, the corporate-action condition, evidence contributors, receiver enforcement and empty shapes without changing the accepted architecture."
    authority: "inst/design/rfc/rfc_point_in_time_historical_projection_v0_2_x_synthesis_v12.md, accepted 2026-10-16, especially Sections 2 through 10 and 12; inst/design/rfc/rfc_history_wave_v0_2_2_decisions.md for the completed H0-H2 dispositions; inst/design/contracts.md for shipped behavior until each pending receiver is consolidated; inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md#history-wave-execution-plan for order; inst/design/manual/optimization_coding_style.qmd for the seven shapes; AGENTS.md for necessity, native-capability and evidence boundaries."
    source_table: "Current package baseline 99a3b067 after accepted Cut 15. H0 is the reviewed v11 drift map at 16f415cd. H1 is the reviewed aggregate research record at e07e89d and the accepted WS39 schema-120/rule-3 lake record; no private vendor row enters this packet. H2's evidence wave and two focused peer reviews are incorporated by the decision register. H4 returned CHANGES_REQUIRED on eight document findings and then PASS_AFTER_PATCHES; both review artifacts are retained beside v12."
    decisions: "Maintainer, 2026-10-16. (1) History ships only on the availability path; dense stays frozen. (2) One preparation owns bars, facts, the common venue axis, expected-session masks and feature inputs from the data start (the first session of the experiment's snapshot); no second history reader or hidden fetch is introduced. (3) The public surface is one immutable history result, ledgr_history_frame() and ledgr_history_matrix() as an adapter over that result; defaults are full causal lookback, admissible instruments, keep missing values and wide layout. (4) One public ledgr_history_policy() is experiment-level config. Defaults are price_carry = 5L expected sessions, output_carry = NULL (off) and segment_limit = NULL; a finite positive output_carry age is required when output carry is enabled. Missingness, carry, calculation validity, readiness and estimator admission remain distinct evidence; return and volatility families never consume carried prices. (5) Indicators declare bounded or history-dependent behavior; bounded fn windows use requires_bars, recursive work restarts by treated-input segment and stable_after remains first-valid. (6) Config identity advances from rule 3 to rule 4; older run, sweep and walk-forward artifacts refuse without migration, fallback or inference. Civil-time fact storage advances snapshot hash rule 3 to 4 and the current store format; later removal of the stored hydration seam advances the current store format again. No intermediate or final format receives compatibility code. (7) Parallel support is staged ordinary R over one immutable substrate for one or two persistent local workers. Larger local worker counts still run but are explicitly unmeasured. mori is rejected for v1 and reopens only at the accepted 10 percent private-commit trigger. (8) carry_test_state is one economic chain, with boundary decisions, fills, marks and entitlements preserved; flat and standalone windows keep their terminal rule. (9) H6 resource gates are exact and separate for single-run parent, two-worker parent and parent-plus-daemon private commit; a miss requires correction or explicit maintainer disposition. (10) ledgr_pulse_snapshot() is an external development and inspection surface, not a function called by a strategy. Availability-aware inspection is derived from a ledgr_experiment plus its concrete parameters and cutoff, so snapshot, universe, features, history policy, data start and opening state come from the same experiment configuration rather than duplicated public arguments. The produced pulse is the ctx that may be passed manually to the strategy. Strategy callbacks read history only through ctx |> ledgr_history_frame(...). The existing low-level snapshot-and-universe form remains the dense inspection branch until execution-core consolidation and does not acquire a partial availability-history contract. (11) A corporate-action row with an event clock and no knowledge clock is known when that event becomes effective in every execution mode. The maintainer accepts the resulting dense economic correction; preserving the pre-cut dense audit-only behavior would create the prohibited execution-mode branch. This does not authorize availability history on dense runs. At cut acceptance the Date-backed corporate-action event edge remained for LDG-3060. (12) Maintainer, 2026-10-16: a Date-valued corporate-action entitlement, effective or payment event names the declared venue session close; a Date-valued knowledge time names session open. This aligns executable events with availability pulses while preserving a distinct causal knowledge cutoff."
    sequencing: "Workstream 40 lands first and binds the facts prerequisite plus rule-4 policy identity. Workstream 41 follows and installs the only shared substrate and worker transport. Workstreams 42 and 43 begin in parallel: public history/continuity and indicator history semantics. LDG-3067 joins after LDG-3063 because both touch production precompute; the earlier indicator tickets remain parallel. Workstream 44 begins only after both product branches are accepted and owns integrated H6 proof, contract consolidation and release teaching. Ticket dependencies are the executable order; workstream numbers are labels."
    out_of_scope: "Any dense history implementation; ctx-frame retirement; durable factor or prediction evidence; portfolio-construction helpers; ML fitting, labels, embargo or model lifecycle; schedule decorators; more than two local workers; mori or another shared-memory dependency; convergence readiness beyond first-valid; span-labelled bridged returns; lifetime-fact correction semantics; durable feature rows, feature caches or persist_features; schema migration, legacy readers or compatibility fallbacks; dividend-adapter work; broad RAM restructuring; liquidity, capacity, OMS or compiled execution."
