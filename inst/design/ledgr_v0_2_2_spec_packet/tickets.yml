  - id: 7
    name: "Feature-map read surface"
    cut: "2026-10-06"
    opening: "The maintainer accepted the feature-map read-surface synthesis on 2026-10-06 after Type 1 final review returned PASS_AFTER_PATCHES and all four in-place corrections were applied. This draft implements the accepted naming rule as the first bounded slice of macro-plan WS3. It does not implement historical projection. No implementation starts before independent cut review and maintainer acceptance."
