  - id: 9
    name: "Scoring boundaries and temporary feature starts"
    cut: "2026-10-07"
    opening: "The maintainer identified inconsistent dated and windowed execution while preparing macro-plan WS3 and required the present defect to be separated from the later historical-projection design. A smallest public-path probe on 2639949 uses ten daily bars, SMA(3), an opening date and scoring start at day 6, and a strategy that targets one share once SMA is finite. Direct and windowed runs start on day 6 and finish at 1001; ordinary and windowed sweeps finish at 1006 because they consume and act on pre-scoring history. An end-to-end walk-forward fold records hydration at day 1 and training scoring at day 6, reaches training final equity 1004, while its day-9 test run restarts and finishes at 1000. No implementation starts before independent cut review and maintainer acceptance."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-07. The independent Type 1 then Type 2 review reproduced every source-table observation, including walk-forward training time in market 0.625 over five of eight pulses, and accepted the two-claim shape. Its seven required patches are incorporated here: scoring is the sole temporary execution boundary; distinct execution or hydration starts refuse; sweep checks use public observables; the checker separates boundary from value failures; ledgr_backtest() and promotion are covered; ledgr_ind_ema() is the recursive witness; and the 0.750 review ratio is recorded as a chosen grain. See cut_review_9.md."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS3 and WS4 shared history-start boundary; inst/design/rfc/rfc_point_in_time_historical_projection_v0_2_x_synthesis_v11.md Sections 3 and 7; inst/design/ledgr_roadmap.md v0.2.2 leakage-boundary and historical-projection rows; inst/design/contracts.md for current run, sweep and walk-forward parity; archived v0.1.9.4 LDG-2615 as evidence only, never reopened authority"
    source_table: "Current tree 2639949 after accepted Cut 8 plus merged remote planning commit 4fddfd8. Public probe: snapshot days 1-10, opening and scoring day 6, SMA(3), next-open execution, initial equity 1000. ledgr_run(), ledgr_backtest(start = day 6) and ledgr_run_window() expose days 6-10, values NA, NA, 7, 8, 9, one fill and final equity 1001. ledgr_sweep() and ledgr_sweep_window() both report final equity 1006 despite the latter recording scoring_range day 6 through day 10; promoting that ordinary sweep candidate through ledgr_promote() produces durable final equity 1001, so its reproduction path disagrees. An end-to-end ledgr_walk_forward() fold records hydration_start day 1, train_scoring_start day 6 and test_scoring_start day 9; the train sweep reports final equity 1004, Sharpe 16.97 and time in market 0.625 over five of eight pulses, while its test run covers days 9-10, has no fill and finishes at 1000. ledgr_precompute_features(start = day 6) records warmup_range from day 1 through day 6. R/backtest.R:448-450 explicitly defers hydration fetching to archived LDG-2615; R/walk-forward-folds.R defaults hydration_start_utc to snapshot start; ledgr_opening() help says a NULL date starts after indicator warmup although current execution starts at snapshot start."
    decisions: "Maintainer direction, 2026-10-07, reviewed PASS_AFTER_PATCHES. (1) scoring_start_utc is the sole temporary evaluation, execution and result boundary. No strategy evaluation, fill-producing execution, event, equity row or metric input occurs before it. Omitted execution_start_utc normalizes to scoring_start_utc; any explicit different value refuses before execution, rather than inventing semantics for targets between two clocks. (2) Until the joint WS3/WS4 design binds causal hydration, every run, backtest, sweep, promotion and walk-forward feature state restarts at scoring_start. This is an explicit temporary semantic choice, not a neutral refactor: fixed-window and recursive features re-warm in every window. (3) Retain hydration_start_utc as the future identity seam, but do not record an ignored value. Omitted hydration normalizes to scoring_start; any explicit different value refuses with one classed actionable condition. Generated fold windows store hydration_start equal to their scoring start. (4) Public ledgr_precompute_features() follows the same temporary rule and cannot smuggle pre-scoring state into a sweep. (5) Run, backtest, sweep and promotion agree for the same experiment and window, and walk-forward training and testing use the same rule. (6) Update contracts, help and NEWS; record that windowed sweep and walk-forward results can change. (7) The new packet and roadmap take ownership of unfinished LDG-2615 substance; the released v0.1.9.4 packet is not edited, and the stale R/backtest.R comment is removed with implementation. (8) The current-tree memory baseline and WS3 budget are measured after this cut."
    sequencing: "Workstream 18 first registers and then repairs scoring-boundary execution. Workstream 19 starts only after Workstream 18 is accepted; it registers and implements the temporary feature-start and hydration refusal contract. LDG-2968 and LDG-2970 land maintained failure-sensitive evidence before their production tickets. One cut review and two planned workstream close reviews are three invocations over four tickets, 0.750 against the review gate. This is a chosen breach: one combined workstream would meet 0.500, but the cut keeps the defect repair and the temporary product-semantic choice independently closeable and records the cost rather than padding the cut. tickets.yml is the sole sequencing authority."
    out_of_scope: "The permanent causal hydration rule; recursive-indicator convergence, reset or gap semantics; the WS3 two-clock carrier and semantic fixture; ctx$window(), ledgr_history_frame() or ledgr_history_matrix() implementation; missingness treatment; instrument-specific session narrowing; model or estimator APIs; parallel-worker sharing; choosing a history representation; changing fills, costs, accounting or opening-state carry after scoring begins; and editing any released packet."
