    scope: "Replace ledgr_snapshot_hash() with the exact R-owned rule-3 byte contract in rfc_snapshot_verification_policy_v0_2_2_seed_v2.md Section 5: column-major 10,000-row blocks, typed little-endian fields with presence bytes, radix byte order asserted in R, the existing exact fact projection with the three synthesis changes, and domain-separated block, section and root hashes. Write hash_rule_version = 3 on new sealed snapshots. Keep every current complete-verification call in place. Missing, rule-1 and rule-2 snapshots remain metadata-readable, while every current complete-verification call and seal-time continuation refuses with ledgr_snapshot_rebuild_required; LDG-3020's source census adds the guard to any class-3 reader that lacks one. Unknown future rules retain ledgr_snapshot_hash_rule_unsupported. Hostile source order refuses with ledgr_snapshot_hash_order_invalid. Expose hash_rule_version in snapshot information and print. Re-pin the LCL-0015 / LTB-0018 checked-in bars fixture to its rule-3 root under the accepted synthesis, update its claim entry and name the deciding synthesis in the implementation commit. No migration, fallback encoder, component hash, public bypass or DuckDB-owned identity."
