cent but above the 1.05 rule; the maintainer accepted it as an explicit exception to the rule for this workstream (decision 3). The first clocks (evidence/clocks/ws25, at a4c90625) showed promote at 1.06 (ledgr_promote() called ledgr_run_info() for one feature-set hash, which reads the run row, parses its config and reads completion and promotion context; the hash is already in the committed config) and the availability reader at 1.06 (assumption-basis reads the run-assumption flags discarded); 2fbb24cd fixed both (promote 0.996, availability 1.025). Reviews: agent close review CHANGES_REQUIRED (F1 blocking; F2 NEEDS_TYPE_2, decided by the maintainer), fixed in b14eee85; focused re-review PASS at 4b0710c8 (no code defect; evidence wording corrected in 863ce3c1). Codex close review of 863ce3c1 CHANGES_REQUIRED (no execution defect): three failure-sensitivity gaps (feature-set promotion variant, trading-status-only refusal, rule-1 walk-forward fork), fixed with mutation-verified tests; the availability peak and the fast-profile gate are decided by the maintainer (decisions 3 and 4)."]
