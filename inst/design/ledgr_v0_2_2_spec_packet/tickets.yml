  - id: "LDG-3015"
    title: "Rebalance fast-profile evidence under the accepted testing architecture"
    workstream: 26
    status: "complete"
    priority: "P1"
    effort: "M"
    dependencies: ["LDG-3016"]
    scope: "Maintainer, 2026-10-12. The ordinary fast profile is over its fixed 112 s ceiling from accumulated test cost, not from the LTB-0164 stall: median 147.65 s over three local runs at 5dc47b3d (147.72, 145.97, 147.65); test-pit-consistency.R alone takes 37.9 s and the 20 fast blocks above 1.5 s take 56.2 s. Under the testing-architecture synthesis (rfc_testing_architecture_v0_2_0_2_synthesis.md: fast stays the default membership, review holds extended or redundant integration evidence, slower evidence justifies its cheapest adequate lane, and the ceiling is a fixed budget), every fast block above 1.5 s is audited; 1.5 s is an audit trigger, not a gate. Each audited block is shrunk; split into a cheap failure-sensitive fast detector plus a review differential; moved to review only when equivalent fast evidence protects the ordinary edit path; or kept fast with a recorded reason when no cheaper adequate oracle exists. Every major claim family keeps at least one representative public-path integration in fast; repeated variants, cross-surface matrices, sweep and walk-forward combinations and recovery permutations go to review. No mutable snapshot or live handle is shared between blocks; reusing an immutable fixture or consolidating overlapping runs inside one block is allowed. Not changed: the 112 s bound, the fast default and the profile rule; a default-to-review rule or an enforced per-block budget would be an architecture change needing Type 2 review. Engineering target: at most 100 s (non-binding), so the gate regains headroom."
    acceptance: ["check-test-gate passes the ordinary fast profile over three local runs, with the median at or near the 100 s target", "the isolated CRAN fast profile passes its gate and the complete review profile passes", "every audited block has a recorded disposition (shrunk, split, moved, or kept with its reason)", "every moved or split block's claim in tests/claims.yml names its detecting blocks and promised profile, and every major claim family keeps at least one fast public-path block", "no two blocks share a mutable snapshot or live handle"]
    evidence: ["f6f894d1 and 2c389dea. Audit of every fast block above 1.5 s (at 5dc47b3d, remeasured after LDG-3016): split into a failure-sensitive fast detector plus a review block: LTB-0224 to LTB-0240, LTB-0131 to LTB-0241, LTB-0235 to LTB-0242, LTB-0234 to LTB-0243, LTB-0236 to LTB-0244, LTB-0218 to LTB-0245, LTB-0233 to LTB-0246 and LTB-0226 to LTB-0247, each parent claim narrowed to its fast detector and LCL-0238 to LCL-0245 registering the review blocks. Shrunk: LTB-0181, whose scanner now splits sentences only in files that can hold a flagged sentence and vectorises the split (identical findings on the repository and on a planted-violation tree; 3.3 s to 0.5 s).", "Kept fast with a reason: LTB-0082 (its claim justifies the subprocess boundary and runner exit status has no other detector), LTB-0164 (three of its four stops are its claim; 2.0 to 3.3 s in every run), LTB-0227 (its unknown-subtype and dense facets are the cores of LCL-0225 and LCL-0226), LTB-0220 (three distinct binding boundaries, no cheaper oracle), LTB-0231 (two refusals; its still-runs cases are cheap and one is the only corporate-action-only detector), LTB-0232 (two core basis facets), LTB-0221 (the per-price refusal reasons and zero volume are LCL-0220), LTB-0093 (one run), LTB-0225 and LTB-0091 (single facets near 1.5 s). Reshaped by product tickets: LTB-0130 (LDG-3018) and the lifecycle blocks, which now build the once-per-session schema template before counting connections, so the count no longer depends on test order (LDG-3016).", "Every claim family keeps at least one fast public-path block; no block shares a mutable snapshot or live handle; the 112 s bound, the fast default and the profile rule are unchanged. The lane went from 147.65 s to 100.48 s in measured steps: LDG-3016 19.4 s (to 7c86514c), the trigger cache and these splits together 17.7 s (to 2c389dea; the trigger attempts had cost 2.6 s in the lane profile), LDG-3017 2.3 s (one run) and LDG-3018 7.9 s.", "Fixture lane (evidence/ladder19 from a fresh WS25-accepted record ladder18, and ladder20 from ladder19/LDG-3016): b5ab2a9e (LDG-3007), 2e63d64c (LDG-3009), 5dc47b3d (LDG-3006), 7c86514c (LDG-3016), 0ee44c33 (LDG-3016 trigger cache), 586bf2c9 (LDG-3017) and 1c8df889 (LDG-3018) each compare byte-identical (51 of 51 families) with their predecessor. Paired clocks, 01acd4cd against 1c8df889 (evidence/clocks/ws26b, three pairs): elapsed ratios 0.749 (dense) to 1.008. Peak RSS ratios 0.872 to 1.117: readers 1.117, run_momentum 1.116, promote 1.061 and explain 1.058 exceed the 1.05 rule, with the candidate varying 1488 to 1658 MiB on run_momentum against 1438 to 1439. Under a preset heap (evidence/clocks/ws26b_heap, R_VSIZE=4Gb) different phases exceed: run_equal_weight 1.096 (+480 to +492 MiB across the three pairs), explain 1.070 and readers 1.051, while run_momentum and promote fall to 1.022 and 0.927. Explain elapsed is 1.298 there (1.277 to 1.314 across pairs) against 0.934 in the default-heap clock; the focused re-review timed build, run_momentum and explain alone under the preset heap, alternating trees, and reported 1.52 and 1.52 s against 1.41 and 1.54 s (no raw record kept). The preset-heap cycle is a diagnostic outside the 1.05 rule (Workstream 26 decisions). Running build and run_equal_weight (with its readers) under the preset heap at four WS26 code commits against 01acd4cd, three pairs each (7c86514c contains LDG-3006's 5dc47b3d) (evidence/clocks/ws26b_bisect: 7c86514c 1.011, 0ee44c33 1.012, 586bf2c9 1.007, 1c8df889 1.016), shows no rise; the +480 MiB appears only after the earlier phases of the full cycle. R's own max-used heap per phase (r_heap_probe.R, evidence/clocks/ws26b_heap/r_heap.csv, two repeats) rises at most 3 percent (run_momentum 658.5 to 678.1 MB, explain 521.2 to 534.6, availability 470.9 to 480.5); the close review reran it under a preset heap and reported the momentum increase at +8.6 MB (no raw record kept), so that measure also moves with collection timing. The peak excursions exceed the registered rule and are accepted by maintainer exception (Workstream 26 decisions); no cause is asserted. The intermediate clocks at 7c86514c (evidence/clocks/ws26) were 0.942 to 1.013 elapsed and 0.934 to 1.055 peak. Constructor clocks (evidence/clocks/ws26b_store, five pairs, 01acd4cd against 1c8df889): ledgr_db_init() 0.224, a small ledgr_snapshot_from_df() 0.577; LDG-3016 alone gave 0.678 and 0.629 (evidence/clocks/ws26_store). Ordinary fast profile medians (local, evidence/fast_profile_ws26): 147.65 s at 5dc47b3d, 128.30 s at 7c86514c, 110.59 s at 2c389dea, 108.34 s at 586bf2c9 (one run) and 100.48 s at 1c8df889 (101.98, 100.31, 100.48; check-test-gate LEDGR_TEST_GATE_OK, bound 112). Isolated CRAN fast profile at 1c8df889 (local, isolated dependency library, read-only working directory): 102.83, 101.77 and 101.82 s, check-test-gate LEDGR_TEST_GATE_OK at median 101.82 s against its 105 s bound; complete review profile: 330 blocks, 0 failed, 1 skipped (the documented missing-quantmod path), 278 s (evidence/fast_profile_ws26/cran and review). Reviews: agent close review CHANGES_REQUIRED (F1 peak-rule disposition and wording; F2 LTB-0239 order dependence; F3 stale claim fields; F4 the fixture lane never reaches the dense reconstruction; F5 constraint order in the validation key; F6 store-specific trigger probe; F7 bookkeeping), fixed in ba754286 with the maintainer exception for F1; ba754286 is 51/51 identical to 1c8df889 (evidence/ladder21), the full local suite has no failures (1087 blocks), and the ordinary fast profile passes at a median of 102.93 s over three runs (112.25, 102.93, 102.47; evidence/fast_profile_ws26/ba754286-*)."]
  - id: "LDG-3016"
    title: "Avoid legacy migration work when creating a proven-empty current store"
    workstream: 26
    status: "complete"
    priority: "P1"
    effort: "S"
    dependencies: []
    scope: "Maintainer, 2026-10-12. A fresh store is classified as schema version 0, so ledgr_create_schema() creates the current tables and then enters the legacy migration and ensure pipeline meant for existing stores, which repeats DDL and schema inspection; the current-version marker is written only through that path. LDG-2819's shared ledgr_schema_catalogue() read already serves schema creation; the remaining duplication is this migration pass on a fresh store. Measured on the fast lane at 5dc47b3d: 215 fresh-store creations take 41 s and the migration inside them 17 s (instrumented run); one fresh creation takes about 0.16 s, 0.10 s of it in the migration and a second ensure pass. A proven-empty store (no table at all) receives the complete current schema and the version marker without entering the legacy migration path; every other store keeps the existing path. Repeated opening and validation of existing stores is out of scope unless the post-change profile still shows it material (its catalogue fingerprint, kept by LDG-2819, guards out-of-band damage). Internal exact-parity optimization under established invariants; no RFC. LDG-3015 waits for this ticket and the remeasured lane."
    acceptance: ["a proven-empty store receives the complete current schema and version marker without entering the legacy migration path", "the marker is written only after every current-schema DDL operation succeeds, and an interrupted creation cannot leave a falsely current marker", "unmarked stores containing ledgr artifacts still follow the legacy migration path; older stores still migrate; future-version stores still refuse", "a damaged store carrying the current marker still fails validation rather than being silently repaired", "fresh-store tables, columns, types, constraints, default values and indexes are identical to the legacy-path result", "snapshot rows, hashes and public results are identical (fixture-lane byte identity)", "a DBI or call-count detector fails if the redundant migration pass returns", "paired clocks cover at least ledgr_db_init() and ledgr_snapshot_from_df(), and the public-path improvement meets the materiality rule", "the seven optimization shapes are reviewed on every changed function"]
    evidence: ["7c86514c, with 0ee44c33. A store with no table receives the current schema by replaying DuckDB's own CREATE statements, captured once per session by building the schema through the legacy path on an empty in-memory store, in one transaction with the version marker written last; any store that holds a table keeps the legacy path. Trigger support is probed once per session on the template's own in-memory store (review F6: no store-specific failure decides it); when it is absent, stores skip the two unsupported CREATE TRIGGER statements. The fresh and legacy catalogues are identical except DuckDB's internal constraint numbering, which the validation key no longer orders by (review F5). A fresh creation went from about 0.16 s to 0.07 s; the fast-lane profile at 5dc47b3d had attributed 41 s to 215 fresh creations, 17 s of it to the migration.", "LTB-0239 / LCL-0237 pin catalogue identity with the legacy path (tables, columns with defaults, constraints, indexes, marker), zero migration calls, no trigger statement once support is recorded absent, rollback of an interrupted creation and the legacy path for an unmarked store with a table; mutation-verified (fresh path off, every store treated as empty, no transaction, trigger cache ignored). Existing tests keep older-store migration, failed-migration markers, future-version refusal and validation of damaged stores. Fast profile 147.65 s to 128.30 s.", "Fixture lane (evidence/ladder19 from a fresh WS25-accepted record ladder18, and ladder20 from ladder19/LDG-3016): b5ab2a9e (LDG-3007), 2e63d64c (LDG-3009), 5dc47b3d (LDG-3006), 7c86514c (LDG-3016), 0ee44c33 (LDG-3016 trigger cache), 586bf2c9 (LDG-3017) and 1c8df889 (LDG-3018) each compare byte-identical (51 of 51 families) with their predecessor. Paired clocks, 01acd4cd against 1c8df889 (evidence/clocks/ws26b, three pairs): elapsed ratios 0.749 (dense) to 1.008. Peak RSS ratios 0.872 to 1.117: readers 1.117, run_momentum 1.116, promote 1.061 and explain 1.058 exceed the 1.05 rule, with the candidate varying 1488 to 1658 MiB on run_momentum against 1438 to 1439. Under a preset heap (evidence/clocks/ws26b_heap, R_VSIZE=4Gb) different phases exceed: run_equal_weight 1.096 (+480 to +492 MiB across the three pairs), explain 1.070 and readers 1.051, while run_momentum and promote fall to 1.022 and 0.927. Explain elapsed is 1.298 there (1.277 to 1.314 across pairs) against 0.934 in the default-heap clock; the focused re-review timed build, run_momentum and explain alone under the preset heap, alternating trees, and reported 1.52 and 1.52 s against 1.41 and 1.54 s (no raw record kept). The preset-heap cycle is a diagnostic outside the 1.05 rule (Workstream 26 decisions). Running build and run_equal_weight (with its readers) under the preset heap at four WS26 code commits against 01acd4cd, three pairs each (7c86514c contains LDG-3006's 5dc47b3d) (evidence/clocks/ws26b_bisect: 7c86514c 1.011, 0ee44c33 1.012, 586bf2c9 1.007, 1c8df889 1.016), shows no rise; the +480 MiB appears only after the earlier phases of the full cycle. R's own max-used heap per phase (r_heap_probe.R, evidence/clocks/ws26b_heap/r_heap.csv, two repeats) rises at most 3 percent (run_momentum 658.5 to 678.1 MB, explain 521.2 to 534.6, availability 470.9 to 480.5); the close review reran it under a preset heap and reported the momentum increase at +8.6 MB (no raw record kept), so that measure also moves with collection timing. The peak excursions exceed the registered rule and are accepted by maintainer exception (Workstream 26 decisions); no cause is asserted. The intermediate clocks at 7c86514c (evidence/clocks/ws26) were 0.942 to 1.013 elapsed and 0.934 to 1.055 peak. Constructor clocks (evidence/clocks/ws26b_store, five pairs, 01acd4cd against 1c8df889): ledgr_db_init() 0.224, a small ledgr_snapshot_from_df() 0.577; LDG-3016 alone gave 0.678 and 0.629 (evidence/clocks/ws26_store). Ordinary fast profile medians (local, evidence/fast_profile_ws26): 147.65 s at 5dc47b3d, 128.30 s at 7c86514c, 110.59 s at 2c389dea, 108.34 s at 586bf2c9 (one run) and 100.48 s at 1c8df889 (101.98, 100.31, 100.48; check-test-gate LEDGR_TEST_GATE_OK, bound 112). Isolated CRAN fast profile at 1c8df889 (local, isolated dependency library, read-only working directory): 102.83, 101.77 and 101.82 s, check-test-gate LEDGR_TEST_GATE_OK at median 101.82 s against its 105 s bound; complete review profile: 330 blocks, 0 failed, 1 skipped (the documented missing-quantmod path), 278 s (evidence/fast_profile_ws26/cran and review). Reviews: agent close review CHANGES_REQUIRED (F1 peak-rule disposition and wording; F2 LTB-0239 order dependence; F3 stale claim fields; F4 the fixture lane never reaches the dense reconstruction; F5 constraint order in the validation key; F6 store-specific trigger probe; F7 bookkeeping), fixed in ba754286 with the maintainer exception for F1; ba754286 is 51/51 identical to 1c8df889 (evidence/ladder21), the full local suite has no failures (1087 blocks), and the ordinary fast profile passes at a median of 102.93 s over three runs (112.25, 102.93, 102.47; evidence/fast_profile_ws26/ba754286-*)."]
  - id: "LDG-3017"
