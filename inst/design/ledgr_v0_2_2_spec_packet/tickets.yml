  - id: 10
    name: "Real-data run continuity"
    cut: "2026-10-08"
    opening: "The maintainer set the v0.2.2 goal of running the full available Sharadar S&P history, 1998-2026, without a run or evaluation stopping on something that happens often in real data, and directed that the WS2 remainder be finished before the WS3/WS4 cut (macro plan change control, 2026-10-08). EXP-0003 registered three ledgr-side stoppers in the ledgr-research feedback log: LFB-017, LFB-023 and LFB-018. Cut 6 closed WS2's terminal-outcome half; this cut closes these three. No implementation starts before independent cut review and maintainer acceptance."
    cut_review: "PASS_AFTER_PATCHES on 2026-10-08. The clean-context combined Type 1 and Type 2 review reproduced every source-table claim (LFB-017 abort and close-filter DONE, LFB-018 CREATED, LFB-023 all-cash refusal, resume of FAILED and CREATED rows to identical equity, schema 117 and its CHECKs) and confirmed the out-of-scope routings. Its patches are incorporated: P1 sizes priced members as on a fully priced pulse and caps only when held skipped exposure would push the total above allocatable equity, after a probe showed the drafted reservation sells and rebuys priced members around every one-session gap; P2 records skips through a per-pulse note slot the strategy cannot drop; P3 states sweep and training visibility; P4 specifies previous and none folds on every downstream walk-forward surface; P5 corrects the migration backfill; P6 fixes the exit-guard ordering, resumed rows and the soft-stop boundary; P7 routes walk-forward test-run resume; P8 adds the standard closing items; P9 to P11 correct wording. Focused re-review of ec5d216: CHANGES_REQUIRED with six text-precision findings (R1 the exact cap formula and the unmarked held member; R2 the train metric of previous folds; R3 previous-fold status; R4 none folds in selected rows and latest extraction; R5 the stale close-review reason; R6 review accounting) and three nits, all applied. Second focused re-review of 04543c1: PASS; R1-R6 and N1-N3 verified."
    authority: "inst/design/ledgr_v0_2_2_spec_packet/macro_plan.md WS2 (ordinary gaps must not abort the helper pipeline; a pre-loop interruption must not leave CREATED) and its 2026-10-08 change-control amendment; release definition of done item 7; inst/design/rfc/rfc_history_wave_v0_2_2_decisions.md, section Cut goal, for the maintainer's three decisions; inst/design/ledgr_v0_2_2_spec_packet/sharadar_adapter_survey.md for the EXP-0003 status; inst/design/contracts.md for current helper, walk-forward and run-status behavior"
    source_table: "Current tree 0c1fe2b. The ledgr-research vendor-neutral reproducer (scripts/sharadar/reproduce_exp0003_ledgr_findings.R), loaded against this branch, still shows: LFB-017, two members with BBB missing its first-session bar, ctx |> ledgr_selection() |> ledgr_weight_equal() |> ledgr_target_rebalance(ctx, equity_fraction = 0.9) aborts the run at 2020-01-06 with ledgr_target_sizing_unavailable, while the same pipeline with where = is.finite(ctx$vec$close) & ctx$vec$close > 0 reaches DONE; the abort is the availability branch of ledgr_target_rebalance() (R/strategy-helpers.R, the invalid_price check). LFB-018, a feature that sleeps under setTimeLimit(elapsed = 1) leaves the run row CREATED: ledgr_run_fold() (R/backtest-runner.R) records FAILED only on its classed failure paths and around ledgr_execute_fold(), so an uncaught condition elsewhere, such as during feature computation, leaves the row CREATED. LFB-023: the reproducer's buy-and-hold grid no longer reaches the abort on this branch, but a grid whose candidates all hold cash makes every train Sharpe non-finite and ledgr_walk_forward() stops with ledgr_walk_forward_no_selection (R/walk-forward-selection.R) on its first fold; one such fold ends the session FAILED. Run registration resumes any non-DONE row with a matching config hash, so a FAILED status does not block resume. Fold rows persist in the experiment store table walk_forward_folds (schema version 117) whose CHECKs admit status DONE, FAILED, INTERRUPTED and PARTIAL and the two opening-state policies."
    decisions: "The maintainer decided on 2026-10-08 that LFB-017 skips and records, LFB-023 gets an explicit per-fold policy instead of aborting the session, and LFB-018 ends FAILED. The executable form below, including the no_selection name, its \"previous\" default, the sizing cap and the recording surfaces, is the executor's draft accepted at this cut. (1) LFB-017: in an availability-aware run, ledgr_target_rebalance() skips an eligible member with a positive weight but no positive accepted current close for that rebalance. It opens no new position; an existing holding keeps its quantity. Let A be allocatable equity after the existing reservations, V the sum of w_p * f * A over priced positive-weight members (unfloored, valued at current close), and E the sum of abs(q_s * risk_mark_s) over held skipped members. If V + E <= A the scale factor s is 1; otherwise s = max(0, A - E) / V. Each priced target is floor(s * w_p * f * A / close_p). A held skipped member whose risk mark is not finite fails with ledgr_target_sizing_unavailable. Unheld skipped members contribute nothing to E, so the cap cannot bind for them; when V = 0 there is nothing to scale. The skipped weight is never redistributed. The skip is recorded durably: ledgr_target_rebalance() adds the skipped IDs to a per-pulse note slot that the fold places in ctx (the union over every call in that pulse, reset each pulse), and also attaches them to the returned ledgr_target; the fold reads the slot, so the record survives whatever the strategy does to the target afterwards. The decision diagnostic for each skipped instrument carries reason_code sizing_unavailable, visible through ledgr_results(bt, \"diagnostics\") on durable runs. Memory sweep candidates and walk-forward training windows record skips only in their in-memory diagnostics; no candidate-level skip reader is added in this cut. ledgr_target_sizing_unavailable remains only for a preserved holding with no permissible mark at all. Availability runs now skip while dense runs keep their warn-and-zero path; contracts state this divergence. Raw numeric target vectors and ledgr_selection() eligibility are unchanged. (2) LFB-023: ledgr_walk_forward() gains no_selection = c(\"previous\", \"fail\"). Under the default \"previous\", a fold whose train window has no selectable candidate runs its test window with the parameters of the candidate most recently selected from a training window; before any training window has selected, the fold runs no test window and the carried opening is unchanged, which is safe because nothing has been carried yet. \"fail\" keeps today's session-ending refusal. Every fold records its selection source (train, previous or none; NULL for a failed fold without a selection); the policy is stored in session meta and enters session identity; a previous fold follows the same status rules as a train fold (DONE, PARTIAL on an INCOMPLETE test run, FAILED on a failed test run), and a none fold is DONE; inspection, degradation, candidate extraction and the printed session state the source (detail in LDG-2974). (3) LFB-018: when ledgr_run_fold() exits by a condition after the run row exists, and this invocation wrote no terminal status, a row that is CREATED, RUNNING or FAILED is recorded FAILED (through the output handler, or a direct status update if the handler does not exist yet) with the condition's message, or a named interruption message for a condition of class interrupt; the original condition still propagates. DONE and INCOMPLETE rows are never touched, and the ledgr.interrupt soft stop keeps returning normally with RUNNING, as the Persistence Contract requires. (4) No public condition class is removed, and no fill, cost, accounting or terminal semantics change. (5) Update help, the condition reference, contracts and NEWS for each behavior change."
    sequencing: "One workstream. LDG-2972 commits the maintained oracle, red on the current tree, before any production change. LDG-2973, LDG-2974 and LDG-2975 then each turn their own oracle group green and are mutually independent. One cut review, two focused cut re-reviews and one planned workstream close review over four tickets is 1.000 against the 0.5 review gate, recorded rather than hidden by padding the cut. tickets.yml is the sole sequencing authority."
    out_of_scope: "LFB-019, confirmed again on 0c1fe2b: ledgr_state_reconstruct() fails with ledgr_missing_bars on a completed gap-bearing availability run (macro WS2 includes it only if a reproducer confirms it; it is routed to the maintainer as the next WS2 decision, not silently added). Walk-forward with carry_test_state and non-contiguous test windows, where an instrument delists between two test windows and the next test run ends INCOMPLETE with terminal_mark_unavailable (observed on 0c1fe2b; routed to the maintainer). Resuming an interrupted walk-forward test run: ledgr_walk_forward_run_or_open() opens an existing run ID and ledgr_run_open() refuses a non-terminal run, before and after this cut alike (routed to the maintainer with release definition of done item 7). A candidate-level reader for skips inside memory sweeps and walk-forward training (routed to the maintainer). LFB-020, LFB-021 and LFB-022; redistributing skipped weight or changing ledgr_selection() eligibility; dense-run behavior; the Sharadar adapter patches in ledgr-research; the WS3/WS4 history wave; NEWS entries for Cuts 6 and 7, routed to the WS8 release gate; and any change to fills, costs, accounting, terminal outcomes or valuation policy."
    workstreams: [20]
    closeout: "LDG-2972's oracle record, the three implementation tickets' evidence and the accepted close review form the Cut 10 closeout; no separate cut-level essay is created."
    accepted: "2026-10-08 by the maintainer, who instructed implementation once the cut review is green."
    close_review: "Workstream 20: an agent-run adversarial Type 1 close review of 21eae89..47f739b returned CHANGES_REQUIRED with one blocking finding (F1: DBI::dbWithTransaction() rolled back a user interrupt in the pulse loop and returned normally, so a dense run finished DONE without its rolled-back pulses and could not resume; pre-existing but contrary to the new Early exit contract) and six should-fix or nit findings (stale walk-forward article, three behaviours without a detector, a weak resumed arm, an evidence count, an unnamed pre-existing shape, a flat-price comparison). a478551, ecb00e5 and b203b80 corrected them; the focused agent re-review of 47f739b..b203b80 returned PASS after rerunning the oracle, the F1 probes and the F3 mutations. Review accounting: one cut review, two focused cut re-reviews, one close review and one focused close re-review over four tickets, 1.250 against the 0.5 gate, recorded rather than padded. Maintainer acceptance of Workstream 20 and Cut 10 is pending."
    status: "open"
review_gate:
  max_review_invocations_per_ticket: 0.5
sequencing: >-
  Each cut entry states whether its workstreams are serial or independent.
  Ticket dependencies bind within a workstream. tickets.yml is the sole
  sequencing authority.
review_obligations: >-
  Each workstream receives one Type 1 close review against its recorded claim.
  The reviewer independently checks that the inputs are the right inputs and
  applies the evidence obligations appropriate to the cut. Optimization work
  uses the exact-parity proof template, a current-tree clock, a failure-sensitive
  structural detector and walks, verbatim, the seven shapes named in
  optimization_coding_style.qmd, The Seven Shapes And Their Replacements:
  One-row frame per element, bound at the end; Full-table subset inside a loop
  over ids; Per-element parsing or formatting where a vectorised call exists;
  Per-row JSON on repetitive strings; Work computed and discarded, or
  recomputed on every call; Quadratic validators; Scalar writes into an
  environment-held vector. A correction review counts as
  another invocation and any breach of 0.5 is recorded rather than hidden by
  merging or padding tickets. Once LDG-2950 is accepted, every later
  optimization-cut close runs its ordinary local long-window suite and every
  release gate runs both the ordinary suite and the explicitly enabled
  release-only shape; hosted CI never uses their wall clocks as a gate.
