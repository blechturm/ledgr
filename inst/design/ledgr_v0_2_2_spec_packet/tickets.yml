    scope: "Maintainer, 2026-10-11: good, disclosed defaults rather than forced declarations. Today ledgr_valuation_stale(max_sessions) has no default and an availability-aware experiment without valuation_policy refuses (ledgr_valuation_policy_required). Give max_sessions a default of 5 sessions (maintainer, 2026-10-11, decided empirically: on the Sharadar S&P 500 snapshot 1998-2026, holding every member, 4 internal missing-bar runs exceed 5 sessions (25 member-sessions past the horizon) and 2 trailing runs do; under the existing exhausted = 'freeze' default no run stops; runner dev/bench/v0_2_2_real_data_scale/sharadar_gaps.R, record evidence/sharadar_gaps/horizons.csv), and when snapshot facts make an experiment availability-aware and no valuation_policy is supplied, use ledgr_valuation_stale() with that default. A defaulted policy must not itself activate availability: dense experiments (no availability fact family) stay dense and their identity is unchanged. ledgr_experiment_plan() marks the horizon as a default (its assumptions table already carries a default flag), and the valuation summary and print() disclose an assumed horizon. Decide whether the defaulted policy enters identity exactly as the same policy declared explicitly, and state it. Intended change: availability-aware experiments without a valuation policy now run with a disclosed default horizon; the Availability Contract sentence 'The package supplies no default stale horizon' is revised."
