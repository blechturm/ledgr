  - id: "LDG-3011"
    title: "Record and report off-session bars"
    workstream: 24
    status: "complete"
    priority: "P2"
    effort: "S"
    dependencies: []
    scope: "Audit Stage 3 G-008, cut decision 10. A valid bar not at a declared open-session close seals, is excluded at runtime and appears in no retrospective view; the ingest report is discarded on success, against availability synthesis s4.4. Sealing and runtime exclusion stay as they are; each such bar is recorded with a reason in the snapshot's observation evidence (the quarantine table), and its count is exposed in snapshot info and in the run summary. Intended changes: snapshot observation evidence, snapshot info and result summaries; the snapshot hash rule is unchanged unless the record is part of hashed facts, which the ticket states."
    acceptance: ["the named audit probe shows the defect on the pre-cut tree and its absence on the candidate tree", "a registered block in tests/claims.yml fails when the fix is removed", "fills, ledger, equity and positions stay byte-identical on the fixture lane for every run the finding does not touch, and the ticket lists its intended changes; affected public paths show no clock regression beyond the declared noise rule", "contracts.md and NEWS describe the behavior; focused suites and the fast profile pass", "I_paths P11: after sealing, the off-session bar is listed with its reason in the observation evidence and counted in snapshot info and the run summary", "removing the record makes the bar invisible again and fails the registered block", "the bar stays excluded from runtime input on every path, and a snapshot without off-session bars reports a zero count"]
    evidence: ["34b9fdeb, with review fixes be7b20e7, dff09211 and 437c666c. A valid bar on no declared open-session close stays sealed and is never a pulse of an availability-aware run. Ingest records it in the quarantine table under reason off_session_bar, in either ingest mode. ledgr_snapshot_quarantine() lists it, with a new disposition column (excluded or sealed_not_a_pulse). ledgr_snapshot_info() gains off_session_bar_count (0 when absent). summary() of an availability-aware result reports the snapshot-wide count when it is not zero. The record is derived from hashed bars and sessions, so it is outside the snapshot hash, the quarantine acknowledgement and the seal JSON checks: the hash rule is unchanged. Records are built column-wise (NDJSON rows, byte-identical to the per-row form, written as UTF-8).", "Probe I_paths P11, extended to read the evidence surfaces: on the pre-cut tree the bar is sealed and excluded but no surface shows it (no count, 0 quarantine rows, no summary line); on the candidate snapshot info counts 1, the quarantine reader lists it as off_session_bar / sealed_not_a_pulse, summary() reports it, and it stays excluded. Ingest of 52,200 bars with 34,000 off-session takes 1.13 s, and 1.50 s with an Inf in an extra column on every row, against 22.87 s and 25.99 s at 02837f13 (runner dev/bench/v0_2_2_real_data_scale/offsession_ingest.R, record evidence/offsession_ingest/offsession_ingest.csv). The serializer never visits a row on its own: a structural witness in LTB-0226 matches the per-row bytes with the per-row form disabled (Codex close review finding 1). LTB-0226 / LCL-0224; mutation-verified (record not written, hashed, counted in the acknowledgement, disposition, row content, latin1 and Inf handling, summary gate). Sharadar (aggregates): 0 off-session bars.", "Fixture lane (evidence/ladder9 to ladder12): 247c2a04, 45f34728, 7721aa30, 02837f13, be7b20e7, dff09211 and 437c666c each compare byte-identical (51 of 51 families) with their predecessor, starting from the Workstream 23 record. 34b9fdeb differs in one family only, the intended LDG-3011 change: the recorder's bar on a closed session now leaves 1 quarantine-table row (off-session record) instead of 0. Fills, ledger and equity are identical throughout. Paired clocks (evidence/clocks/ws24, three pairs, e91b80c1 against 437c666c, the same family difference in every pair): elapsed ratios are 0.908 to 1.048, except explain at 1.081 (+0.11 s on a 1.4 s phase whose code path WS24 does not change); peak ratios are 0.90 to 1.075, within the declared noise. The whole cycle is slightly faster. Reviews: close review CHANGES_REQUIRED (F1 coverage start, F2 per-row off-session build); two focused re-reviews CHANGES_REQUIRED (N1 bar-range coverage, N2 latin1 crash; then detectors for the encoding and Inf fixes); a confirming review PASS at 437c666c. The open maintainer decisions are recorded on workstream 24."]
