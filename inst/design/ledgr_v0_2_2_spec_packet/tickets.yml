ever-marked holding; LTB-0162 and LTB-0170 assert persisted and metadata quantities. Five further mutations each fail an intended block: a scheduled row using the loss default (0163, 0168), a refused row stepping aside (0163, 0168), a halved event qty (0162, 0163, 0168-0170), unsafe detail JSON (0164) and frozen evidence left unpriced (0168). Verification on the working tree over 00b6887: the full suite ran 1010 blocks with 10,785 passed expectations, one expected skipped block (quantmod installed) and no failures, errors or warnings, as reproduced twice by the focused re-review; the fast profile passed 522 of 522 blocks in 96.53 seconds (earlier runs 99.51 and 100.00 seconds, all under the 112-second bound), with the four WS14 fast blocks at 5.70 seconds by census. The LTB-0154 warning seen in two fast runs was caused by a testthat-problems.rds artifact that the implementer's own runs left under tests/; that block reads every tests file, and it passed once the artifact was removed. The review's 131.42 and 127.35 second fast runs are retained as recorded overruns; reruns on a quiet host stayed under the bound. The ordinary Workstream 11 suite compared 00b6887 with disposable candidate 1c694f3 in five alternating pairs per shape in 631.76 seconds; median paired ratios were 1.007 to 1.031 cold and 0.978 to 1.052 warm with no retry, and check_record passed. The review's single feature_gaps pair (1.113 cold, 1.119 warm) is retained beside this record. The documentation-contract suite passed 23 blocks."]
