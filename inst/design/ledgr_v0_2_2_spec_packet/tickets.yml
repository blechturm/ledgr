tes pass; the correction ordinary fast record is recorded separately before focused re-review.", "The registered ordinary long-window suite compares d4d3c06b with 40df12d0 over five alternating pairs per shape, completes in 506.96 seconds and passes its self-checker. Candidate/LDG-3019 median ratios are 0.901 to 1.009 cold and 0.910 to 0.961 warm, with no retry and exact semantic records for all three shapes. The complete machine-readable record is now checked in under evidence/ldg3020/long_window_record and passes the suite's self-checker.", "The aggregate-only vendor-neutral record in dev/bench/v0_2_2_snapshot_hash_rule3/evidence/ldg3020 repeats the LDG-3019 50-instrument, 1,260-session, 30-candidate population. All 31 family row counts and digests are identical. Phase clocks are 2.041 seconds build, 5.761 run, 3.288 readers, 13.668 sweep and 9.550 walk-forward against LDG-3019 values 2.017, 5.812, 3.225, 13.635 and 10.442. The private rule-2 Sharadar lake is neither read, migrated nor resealed; its one rule-3 rebuild, peak RSS and post clock remain with the routed WS7 ledgr-research owner. No migration, legacy reader or missing-marker fallback was added."]
