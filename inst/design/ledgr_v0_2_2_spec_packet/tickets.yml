d post clock remain with the owning WS7 ledgr-research cut. Focused hash, seal, fact and adapter suites pass. The intermediate ordinary fast profile has 563 of 563 blocks green but a three-run median of 118.89 seconds against 112; an adjacent accepted-base run is 105.45 seconds. This expected repeated-verification cost remains red until LDG-3020, whose accepted claim removes per-run, per-candidate and per-fold recomputation; Workstream 27 does not close on this intermediate record."]
  - id: "LDG-3020"
