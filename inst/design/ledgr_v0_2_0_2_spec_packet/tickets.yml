    dependencies: ["LDG-2824"]
    scope: "inst/design/release_ci_playbook.md is the authority and is read before any gate is run or updated; the playbook requires every release-gate ticket to name it and the exact local gates, which this ticket does. Before the first gate, verify LDG-2824's promotion invariant: DESCRIPTION Version, NEWS heading, checked-out branch, remote release branch, active governance pointers, intended tag and GitHub Release target all agree on v0.2.1.0, while surviving v0.2.0.2 names are explicitly historical. Execute the playbook's Release Order for v0.2.1.0 and record the evidence. Local gates, each run and each recorded with its result: full package tests; Rscript --vanilla tools/check-readme-example.R; R CMD check --no-manual --no-build-vignettes; tools/check-coverage.R; a pkgdown build, which the tiered CI no longer performs inside R-CMD-check so this local build is now the first place a documentation break surfaces; and the local WSL or Ubuntu DuckDB gate named in the playbook, since this version changed schema creation and validation, persistence, snapshots and CI. Use release-gate timeouts, not exploratory ones. Verify the agent-facing release context per the playbook: AGENTS.md names the active historical packet and the v0.2.1.0 release target, and inst/design/README.md reflects every design document added, moved or retired this version, including the two pre-ticket notes and the cut closeouts. Because branch CI is now the quick tier, dispatch the full tier on v0.2.1.0 and wait for it before the merge. Then main CI on both workflows, then the v0.2.1.0 tag run, as three separate evidences. Create or update the GitHub Release from the existing tag only after tag CI is green, with curated notes rather than a dump of NEWS.md. If the gate uncovers a design problem, the playbook's stop rule applies: open a blocker ticket, do not perform live surgery inside the gate."
    acceptance: ["before any gate runs, one recorded version-consistency check proves DESCRIPTION, NEWS, checked-out branch, remote branch, active governance pointers and intended tag all name v0.2.1.0, and lists every retained historical v0.2.0.2 path or narrative class", "the closeout names each local gate listed in the scope with its command, its result, and its wall time where the playbook asks for a release-gate timeout; a gate that was skipped carries an explicit accepted reason and a gate that failed then passed records both runs", "the full-tier CI run dispatched on the v0.2.1.0 release branch is green and recorded by run id before the merge; a quick-tier branch run is never cited as the merge gate", "main R-CMD-check, main pkgdown, and the v0.2.1.0 tag R-CMD-check are recorded as three separate run ids; no single run is cited for more than one of them", "AGENTS.md and inst/design/README.md are verified and, where stale, corrected within this ticket; the closeout states which of the two needed a correction", "the release notes from LDG-2824 are in the tagged commit, and the GitHub Release entry for v0.2.1.0 is created from the existing tag after tag CI is green", "no gate is weakened and no threshold is lowered to reach green; any blocker found is ticketed with the playbook's required fields and the tag does not move until it is resolved", "the closeout states the cut's review ratio and, if a correction round was needed, records the honest figure rather than omitting it"]

  # -------------------------------- 16 Availability and evidence accessors
  - id: "LDG-2826"
    title: "ctx$tradable(): the instruments a strategy may size now"
    workstream: 16
    status: "open"
    priority: "P0"
    effort: "S"
    dependencies: []
    scope: "Every availability-aware strategy has to compute the same predicate before it can set a single target, and today it does so by hand: intersect the admissible plane with the priced plane and index the id plane by the result. Add ctx$tradable(), a context method beside the existing ctx$flat() and ctx$hold(), returning the character vector of instrument identifiers the strategy may size at this pulse. Availability-aware: admissible and priced, which is member, not target_restricted, and carrying a mark the run's valuation policy accepts. Dense: the instruments whose current close is finite and positive, the same predicate ledgr_target_rebalance() already applies before it warns or aborts. An empty decision axis returns character(0) so that targets[ctx$tradable()] <- x is a no-op and no strategy needs a special case. The method derives its answer from the planes the fold already computed; it does not recompute eligibility and it does not consult facts directly. No plane, contract, schema or error class changes."
    acceptance: ["in availability-aware mode ctx$tradable() equals the ids where admissible and priced are both true, checked against the planes on the same pulse for a fixture containing a halted instrument, an unpriced instrument, a held nonmember and an ordinary member", "in dense mode it equals the ids with a finite positive current close, and a fixture with a non-positive close excludes exactly that instrument", "an empty decision axis returns a zero-length character vector, and a strategy that only writes targets[ctx$tradable()] runs unchanged on that pulse", "ledgr_weight_equal(ctx$tradable()) composes into ledgr_target_rebalance(ctx) without raising ledgr_target_sizing_unavailable on a fixture where an unpriced or halted member would otherwise be weighted", "vignettes/missing-data-and-sessions.qmd uses the method and its strategy chunk loses the id-indexing lines; the rendered sibling is regenerated", "no change to ctx$vec planes, the strategy contract, schema, hashes or error classes"]

  - id: "LDG-2827"
    title: "Read the quarantined observations of a snapshot"
    workstream: 16
    status: "open"
    priority: "P1"
    effort: "S"
    dependencies: []
    scope: "invalid_observations = \"quarantine\" sets rows aside with a reason into snapshot_observation_quarantine, and nothing exposes them, so a user who admits a panel that way cannot see what was excluded without knowing the table name. Add a reader taking a snapshot and returning the quarantined rows with their supplied identifiers, timestamps and reasons, alongside the existing ledgr_snapshot_info(). It reports the persisted rows and adds no judgement of its own."
    acceptance: ["a snapshot sealed with invalid_observations = \"quarantine\" returns exactly the persisted quarantine rows, with the same identifiers, timestamps and reasons a direct query returns", "a snapshot with no quarantined rows returns a zero-row result of the same shape rather than NULL or an error", "a snapshot sealed under the default policy, where an invalid row fails the seal, is unaffected", "the missing-data article reads quarantined rows through the accessor and no longer opens the store with SQL"]

  - id: "LDG-2828"
    title: "ledgr_run_explain() over a whole instrument history"
    workstream: 16
    status: "open"
    priority: "P1"
    effort: "S"
    dependencies: []
    scope: "ledgr_run_explain(bt, instrument_id, ts_utc) requires one timestamp, so the ordinary diagnostic question, what happened to this instrument across the run, needs a loop over sessions. Make ts_utc optional and return every recorded decision row for the instrument in pulse order when it is omitted. The per-timestamp answer is unchanged, and the full history is the same rows the single-timestamp call already returns, not a recomputation."
    acceptance: ["omitting ts_utc returns one row per pulse for the instrument, in pulse order", "for any pulse in that history, the single-timestamp call returns an identical row", "an instrument absent from the run returns a zero-row result of the same shape rather than an error", "the missing-data article shows a full-history call and keeps at least one single-timestamp call, so both forms are taught"]

  - id: "LDG-2829"
    title: "One completion answer for a run"
    workstream: 16
    status: "open"
    priority: "P1"
    effort: "S"
    dependencies: []
    scope: "A stopped run reports status, completion_status, stop_reason and complete_performance as four fields among the fifty-two ledgr_run_info() returns, so the question a user actually asks, did this run cover the window I asked for and if not why, is assembled by hand every time. Add one accessor that answers it: the intended and achieved window, whether performance is complete, the stop reason when there is one, and the affected exposure the completion record already carries. It reads the persisted completion record and derives nothing new."
    acceptance: ["a complete run and a run stopped by an exhausted valuation horizon are distinguishable from the accessor alone, without reading ledgr_run_info() fields individually", "every value the accessor reports matches the persisted completion record, including the affected exposure and its basis", "a run with no completion record returns a typed absent result rather than an error", "the missing-data article reports completion through the accessor instead of printing three fields in sequence"]

  - id: "LDG-2830"
    title: "Workstream 16 and cut 9 closeout"
    workstream: 16
    status: "open"
    priority: "P1"
    effort: "S"
    dependencies: ["LDG-2826", "LDG-2827", "LDG-2828", "LDG-2829", "LDG-2831", "LDG-2832"]
    scope: "Close workstream 16 and cut 9. Record what each accessor reads, the detector for each and its smallest breaking change, the article changes the accessors made possible, the review invocations against the 0.5 gate, and any accessor considered and declined. Owner: the maintainer; the draft is agent-provisional."
    acceptance: ["each accessor is named with its detector and the observed failure when its rule is broken", "the closeout states that no contract, schema, hash or error class changed, with the evidence for that claim", "the cut ratio is stated and is at most 0.5", "the article diff is named as evidence, since removing the clutter it documented is what the cut is for"]

  - id: "LDG-2831"
    title: "Remove the scalar fallbacks the helpers no longer use"
    workstream: 16
    status: "open"
    priority: "P2"
    effort: "S"
    dependencies: []
    scope: "Hygiene, not performance; the acceptance says so explicitly so that no later record cites this ticket as a speed win. ledgr_signal_return() falls back to vapply(universe, function(id) ctx$feature(id, feature_id)) when ctx$vec$feature is unavailable. A measured scan on 2026-09-25 found ctx$vec$feature is a function in both the dense and the availability-aware context, so the branch never executes in a shipped path while preserving the per-instrument accessor loop inside a helper users read as a model. Delete it and let the vector accessor be the contract. In the same file, replace the per-selected-name loop in ledgr_target_rebalance() that calls ctx$idx(id) per element with one vectorized match() against the universe; the same scan measured that loop flat at 367 to 467 microseconds from ten to a thousand selected names, so this is readability and consistency, not speed. vignettes/strategy-authoring-tools.qmd states that the signal helper falls back to the scalar path; that sentence goes with the branch."
    acceptance: ["ledgr_signal_return() returns identical values before and after on the dense and the availability-aware fixtures, including the all-warmup pulse where every value is NA and the availability pulse where a non-admissible member is masked", "ledgr_target_rebalance() returns identical targets before and after across the registered fixtures, including an empty selection, a single name, and a selection covering the whole universe", "no ctx$feature() or ctx$idx() call remains inside a loop over instruments anywhere in R/strategy-helpers.R", "the sentence describing the scalar fallback is removed from the strategy-authoring-tools article and its rendered sibling is regenerated", "the closeout records this as hygiene with no performance claim attached, and no interleaved clock is requested for it"]

  - id: "LDG-2832"
    title: "Warn when a strategy loops a scalar accessor over the universe"
    workstream: 16
    status: "open"
    priority: "P1"
    effort: "M"
    dependencies: []
    scope: "The measured scan on 2026-09-25 found the largest self-inflicted cost available to a strategy is calling a scalar accessor once per instrument instead of reading the plane. At two thousand instruments the per-pulse cost is tens of milliseconds against effectively nothing for the plane, and it is invisible in the result because the numbers are correct and only the clock moves. Nothing warns. Count scalar accessor calls per pulse inside the context and raise one classed warning, once per run rather than once per pulse, when a run's per-pulse count crosses a threshold proportional to the universe, naming the accessor, the count, and the plane to read instead. The warning is a diagnostic: it never changes targets, fills, identity or any stored value, and it must not fire for ordinary single-instrument use or for a strategy that touches a handful of names. Whether the threshold is configurable is part of the ticket; if it is, its value enters no hash."
    acceptance: ["a strategy that loops a scalar accessor over a universe of at least the threshold size raises the warning exactly once per run with its class, the accessor name, the observed per-pulse count, and the vector form to use instead", "a strategy that reads only planes, and a strategy that calls a scalar accessor for a small fixed set of instruments, raise nothing", "the warning changes no target, fill, equity row, run identity, config hash or stored artifact: a run with the warning and the same run with it suppressed produce byte-identical outputs", "the counting itself costs less than the thing it measures: an interleaved before-and-after clock on a plane-only strategy at the registered universe shape shows no regression outside noise", "vignettes/strategy-authoring-tools.qmd documents the warning in its planes section, and vignettes/strategy-development.qmd cross-links it; both rendered siblings are regenerated"]

  # ------------------------- 17 Indicator source parity and timing attribution
  - id: "LDG-2833"
    title: "Attribute the TTR-versus-built-in timing gap before changing code"
    workstream: 17
    status: "open"
    priority: "P0"
    effort: "M"
    dependencies: []
    scope: "Run the measurement already requested by the 2026-09-15 horizon entry before changing any indicator or benchmark code. The 2026-09-23 record reports the durable TTR wrapper at 61.54 seconds and built-in SMA at 51.97: 0.25 seconds of snapshot preparation, 0.02 of experiment setup, 8.71 of engine and 0.59 of results make up the 9.57-second difference. That is not attribution: the TTR row always ran first, the built-in row later in one process, earlier releases changed the sign, and the horizon's isolated 1,000-call comparison explained only about 0.04 seconds. At the registered 500-instrument by 1,260-pulse shape with fast 5 and slow 10, compare exactly three arms: native ledgr_ind_sma(), the existing peer_sma_ttr wrapper, and public ledgr_ind_ttr('SMA'). Build and close one sealed base snapshot, give each arm a byte-identical copied store, clear the process-local feature cache before every arm, and run the six order permutations ABC, ACB, BAC, BCA, CAB and CBA in six fresh child processes. Every arm therefore occupies the first, second and third position twice. Record the three position cells separately; do not pool first-process-cold observations with either later process-warm position. Capture experiment, ledgr_run, t_pre, t_loop and required-result clocks, run-to-run spread, cache hits and misses, and one Rprof decomposition per arm. Outputs remain part of the record: feature values at every pulse, equity, fills and realized trades. This ticket changes no production, test or benchmark source. Its probe follows spike_protocol.md section 1: executable probe first, raw CSV from execution, then a one-page finding; no expected performance table is authored before the run."
    acceptance: ["the record contains one measured fresh process for each of the six three-arm order permutations at 500 by 1,260, with every arm represented twice in each position and with package, R, TTR, DuckDB and collapse versions plus fixture seed and snapshot hash recorded", "each arm starts from a copied store with the same verified snapshot hash and zero prior runs, the feature cache is empty before it starts, and first, second and third position observations are never pooled into one median", "all three arms have identical feature NA masks and pass the existing numerical tolerance on feature values, equity, fills and realized trades; any difference is reported rather than normalized away", "a pairwise structural difference is declared only if it has the same direction in all three arm positions, exceeds both one second and five percent of the faster arm, exceeds the largest within-position spread, and is localized by the phase clocks or profile; a sign change, a below-threshold result or an unlocalized difference is recorded as order/warm or inconclusive and authorizes no optimization", "the findings distinguish the native-versus-wrapper, native-versus-public-TTR and wrapper-versus-public-TTR comparisons and state whether the old 9.57-second chart gap was warm/order-confounded, wrapper-specific, public-adapter-specific, structural, or inconclusive; if structural, this workstream may continue with semantic tickets but no production optimization is added without a mechanism-specific ticket amendment", "git diff proves the ticket wrote only dev/spikes/indicator-source-attribution and the packet evidence field"]

  - id: "LDG-2834"
    title: "Carry strict-window identity through direct, sweep, resume and cache paths"
    workstream: 17
    status: "open"
    priority: "P0"
    effort: "S"
    dependencies: ["LDG-2833"]
    scope: "Fix the reproduced execution-path defect before broadening availability-aware indicator support. ledgr_run() accepts ledgr_ind_sma(2) on a declared expected-session calendar, but ledgr_sweep() fails with ledgr_indicator_gap_unsupported because ledgr_precompute_feature_def_from_indicator() omits gap_contract before ledgr_precompute_payload(..., availability_active = TRUE) calls the strict engine. Preserve the declared contract through feature maps, resolved candidates, parameterized feature factories, precompute payloads, sequential and parallel sweeps, resume reconstruction and cache identity without changing dense fingerprints or dense output. One independent expected-session matrix owns the oracle: a closed date creates no pulse; a missing observation on an open session makes every overlapping strict window NA; the feature recovers on the first complete window; and a late-start instrument stays unavailable until its first complete window. Valuation marks never enter this matrix."
    acceptance: ["one table-driven detector compares the complete per-pulse feature matrices from a concrete direct run, a one-candidate sequential sweep, a parameterized feature factory resolved to at least two distinct window lengths in a multi-candidate sequential sweep, the same multi-candidate sweep in parallel where mirai is available, interrupted resume, and cold then warm feature-cache runs against independently calculated expected-session matrices for those window lengths", "the matrices include a closed civil date, one missing expected-session observation, recovery, and a late-start instrument; they assert pulse timestamps, candidate-specific resolved window lengths and exact NA positions before numeric values", "deleting gap_contract from the precompute conversion or from parameterized candidate resolution makes the relevant sweep assertions fail with ledgr_indicator_gap_unsupported or an incorrect matrix while the direct-run control still passes", "letting a stale valuation mark enter a missing feature cell, compressing the window to observed rows, or creating a pulse on the closed date each fails a named assertion", "dense indicator fingerprints, dense feature-engine identity, config hashes and outputs are byte-identical before and after; active identity changes only where the existing contract already includes the strict engine", "the changed hydration code contains no new loop over bars, instruments times pulses or candidates without the closeout naming and measuring it"]

  - id: "LDG-2835"
    title: "Certify public TTR SMA under the source-independent gap contract"
    workstream: 17
    status: "open"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2834"]
    scope: "Make mathematical capability, not implementation source, decide availability support. In v0.2.0.2 the external certification predicate is deliberately exact and is applied after parameter resolution: normalized TTR function name is 'SMA'; input is 'close'; output is NULL; forwarded arguments contain exactly one positive-integer n; and requires_bars and stable_after both equal n. A matching public ledgr_ind_ttr() result declares gap_contract = 'strict_window' automatically. ledgr_ind_ttr_outputs() certifies no SMA bundle or other bundle in this release. Do not add a switch that lets arbitrary TTR functions claim certification. Built-in SMA, the certified public TTR SMA and a custom finite-window SMA receive the same expected-session windows and expose the same NA/recovery mask; values agree within the existing numerical tolerance. Built-in returns remains certified. EMA, RSI and every other TTR family remain unsupported in availability mode until their recursive or finite-window semantics are separately evidenced; name-based similarity is not evidence. Amend the Availability Contract in inst/design/contracts.md from its v0.2.0.0 initial list to this exact certified set, and keep it checked against the executable support matrix. Dense TTR output, ids, warmup, fingerprints and existing public behavior do not change."
    acceptance: ["built-in SMA, a public TTR SMA satisfying the exact post-resolution predicate, and a custom strict-window SMA have identical pulse axes and NA masks on complete, missing-session, recovery and late-start cases, and their finite values pass the existing numerical tolerance", "public TTR SMA succeeds through ledgr_run(), ledgr_sweep(), resume and a cache hit for concrete and parameter-resolved n; input other than close, non-NULL output, extra forwarded arguments, mismatched requires_bars or stable_after, and ledgr_ind_ttr_outputs remain uncertified", "removing the TTR SMA certification makes the public TTR arm fail, and falsely certifying TTR EMA, RSI or an excluded SMA shape makes a source guard or support-matrix assertion fail", "a dense public TTR SMA series and all existing TTR adapter tests remain unchanged, including generated ids, warmup inference, bundles and parameterized construction", "availability errors for uncertified built-in and TTR indicators name the indicator and the missing strict-window capability rather than its source", "inst/design/contracts.md and the support matrix state the same exact certified set and a documentation-contract detector fails when either side changes alone; the matrix is generated from executable cases or asserted directly against constructors rather than maintained as an untested second list"]

  - id: "LDG-2836"
    title: "Measure the peer TTR row through the public adapter in isolated processes"
    workstream: 17
    status: "open"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2833", "LDG-2835"]
    scope: "Correct the peer boundary after the attribution result is known. canonical_features is currently built once from peer_sma_ttr() and feeds six published rows: ledgr_ttr_canonical, ledgr_ttr_canonical_sweep, ledgr_ttr_canonical_sweep_with_costs, ledgr_ttr_canonical_sweep_with_cost_risk, ledgr_ttr_ephemeral_legacy_costs and ledgr_ttr_compiled_spot_fifo_sweep. Move all six to exported ledgr_ind_ttr('SMA') after LDG-2835; use exported ledgr_ind_sma() for built-in rows. Remove the private wrapper or retain it only as a clearly labelled internal diagnostic excluded from peer claims. The durable public TTR and built-in rows run in separate fresh R processes with the same source CSV, library paths, seed and phase definitions, so row order in peer_main cannot warm one arm for the other. Keep cold end to end and warm research iteration separate. The published fresh-process cold comparison is evaluated only against LDG-2833's first-position cells; any intentionally warmed comparison is evaluated only against its matching later-position cell, never against a different clock. Rerun the record after LDG-2835, regenerate its CSVs, report and ggplot figure, and report separately whether the old wrapper gap reproduced and what changed when the public adapter replaced it. No peer ranking uses the diagnostic wrapper."
    acceptance: ["the feature constructors for all six published TTR-labelled rows resolve to exported ledgr_ind_ttr calls and a source guard fails if any published peer claim reaches peer_sma_ttr again", "the durable public TTR and built-in rows execute in separate fresh R processes with recorded and equal R and package-library metadata; reversing their launch order leaves the interpretation unchanged", "phase clocks reconcile exactly, NULL engines remain NULL in the plot, stacked factors retain their registered order, and every retained public TTR row produces its required equity, fills and trade surfaces", "the report compares fresh-process cold results only to LDG-2833's first-position cells and any warm result only to its matching later-position cell; it labels the old 9.57-second difference as reproduced, order-confounded, wrapper-specific, public-adapter-specific or inconclusive and does not call a boundary correction a package speedup", "feature, equity, fill and realized-trade parity between public TTR and built-in SMA is reported under the correct exact or tolerance rule", "if LDG-2833 found a structural production cost, this ticket records it without optimizing it unless a separately reviewed mechanism-specific ticket was added"]

  - id: "LDG-2837"
    title: "Document expected sessions, indicator gaps and the certified support matrix"
    workstream: 17
    status: "open"
