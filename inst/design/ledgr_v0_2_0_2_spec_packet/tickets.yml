  - id: "LDG-2866"
    title: "Report the shipped feature session axis in the live contract"
    workstream: 22
    status: "complete"
    priority: "P1"
    effort: "S"
    dependencies: []
    scope: "Four accepted authorities state that an instrument's expected sessions exclude accepted `known_inactive` intervals for features: the availability synthesis (\"expected sessions, which drive feature windows... are the venue open sessions minus those inside an accepted `known_inactive` lifetime interval\"), `contracts.md:803`, the v0.2.0.0 packet (\"instrument expected sessions exclude known inactivity for features\"), and availability gate 21 (\"those sessions leave the feature and classification expected set\"). The engine narrows nowhere. Feature hydration builds one frame per instrument on the venue pulse axis and fails the run if any per-instrument axis differs (`R/backtest-runner.R:873-907`, gate at `:904-905`), ingestion classifies observations against venue closes without removing inactive sessions, and `known_inactive` reaches trading restriction (`R/availability-provider.R:195-203`) and terminal handling (`R/fold-engine.R:505`). The two feature behaviours differ in value rather than coverage: across an inactive interval narrowing reaches back past it and returns a number, while the engine applies the general missing-observation rule and returns `NA`. This shipped in v0.2.0.0 and v0.2.0.1 because gate 21's expected-set clause has no joined test coverage; `known_inactive` appears in eleven test files and none assert a feature value, and `tests/testthat/test-availability-features.R` had no lifetime reference. Maintainer decision 2026-09-27: the documentation reports what the engine does, and instrument-narrowed expected sessions are scheduled for the next release in the roadmap with the reasoning kept in the 2026-09-27 horizon entries. This ticket therefore amends the live contract and adds the missing fixture; it changes no engine behaviour. Scope boundary, because it is a decision rather than a consequence: the live authority is `contracts.md`, while the availability synthesis, the v0.2.0.0 packet spec and gate 21 are accepted records that keep their original text under the LDG-2851 convention that RFC artifacts and closeouts \"continue to describe the surface they were written against\". The supersession of gate 21's entire feature-and-classification expected-set clause is recorded in the closeout rather than by editing the gate. Real observations remain feature inputs wherever they exist, including inside an accepted inactive interval, while the availability plane separately restricts target changes."
    acceptance: ["`contracts.md` states that feature windows count venue open sessions, preserves the general rule that any missing required observation makes the affected window `NA_real_`, and does not assert that lifetime facts narrow either a feature or classification expected set", "a new fixture pins the shipped axis: with an accepted `known_inactive` interval declared, those sessions remain on the instrument's axis and a feature window overlapping the interval is `NA` rather than bridging across it; the fixture fails if the axis is narrowed and passes against the engine as shipped", "the same block pins both that a real observation inside an accepted `known_inactive` interval remains a feature input and that the lifetime restriction is active on that pulse, so masking observations or ignoring the lifetime family fails", "the accepted availability synthesis, the v0.2.0.0 packet spec and availability gate 21 are unchanged; the diff touches no accepted RFC artifact or prior closeout", "no vignette, README example, rendered article or help page states that lifetime inactivity removes an instrument from the decision axis or an inactive session from a feature or classification expected set, and the check is recorded rather than asserted", "no engine change: feature values, warm-up `NA`, alias behaviour, run identity and per-pulse cost are unchanged; unrelated existing availability and feature tests pass unchanged"]
    evidence: ["`contracts.md` now binds venue open sessions as the shared feature axis, restores the general missing-required-observation rule, states that accepted lifetime facts do not remove sessions, and distinguishes retained feature inputs from trading admissibility.", "LTB-0093 runs one public five-pulse experiment over two instruments sharing an accepted inactive interval. AAA omits both interval prints and remains `NA` after the interval instead of bridging; BBB supplies both prints and exposes exact SMA values 23 and 25 inside it. A public explanation on the first inactive pulse proves BBB is target-restricted for `lifetime_inactive`, so dropping the lifetime family cannot satisfy the detector. A temporary bridge-across-gaps mutation made LTB-0093 fail on the full matrix and the post-interval `NA` assertion; the source was restored before commit.", "The focused availability-feature file passed before review; the correction run is recorded in the closeout. The pre-review ordinary fast profile passed 466 of 466 blocks in 87.500 seconds, and `tools/check-test-gate.R` returned `LEDGR_TEST_GATE_OK` against the 112-second bound from `C:/tmp/ledgr-ws22-fast`.", "README.md, README.Rmd, the articles and the help pages contain no claim that lifetime inactivity removes an instrument from the decision axis or a session from an expected set. The missing-data article states that lifetime facts restrict targets and terminal handling without removing an instrument from the decision axis. No production file, accepted RFC artifact, earlier packet or prior closeout changed."]
