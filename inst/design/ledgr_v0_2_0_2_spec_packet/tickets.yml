  # ------------------------- 18 Point-in-time input model
  - id: "LDG-2839"
    title: "A parametrized point-in-time input-bundle generator"
    workstream: 18
    status: "complete"
    priority: "P1"
    effort: "L"
    dependencies: []
    scope: "Add one exported ledgr_sim_pit_inputs() for a complete synthetic point-in-time input unit, rather than a fact-only generator that cannot represent observation gaps. It takes explicit instrument_ids, from and to bounds, a seed, one explicit synthetic calendar convention including venue, timezone and session times, and one plain inspectable cases specification. It does not take bars and does not infer sessions from observations. It returns one ordinary unclassed named list containing matching bars, optional instrument metadata, sessions, membership, lifetime, trading_status, corporate_actions, an explicit construction recipe for scope ids and per-family knowledge modes, and a case manifest naming the type, instrument and date of each applied case. The calendar is declared first and matching bars are generated from it: closure dates have no bars, an open-session missing-observation case removes only the named observation, and the bars use the declared session-close timestamps. Deterministic defaults include a venue closure beyond ordinary weekends, one instrument missing an observation on an open session, one delisting inside the window, one halt and one ordinary cash dividend with a validated gross amount. Sessions obey their stricter knowability rule; other families preserve the package contract that knowledge may be late, and the default cases include one late-known non-session fact. Missing knowledge remains audit-only unless the recipe explicitly selects assume_effective. Intervals are half-open. A request whose instruments or window cannot contain its requested cases fails with a classed error before returning partial output."
    acceptance: ["the returned object is an ordinary named list with no class or hidden attributes; its bars, optional instruments, five fact frames, recipe and case manifest are directly inspectable", "each fact frame passes its own ledgr_facts_* constructor unchanged using only the arguments named in the returned recipe, and the five constructed families are accepted together by ledgr_facts()", "two calls with identical arguments and seed return identical list elements; a changed seed changes generated numeric content without changing the list contract, columns or requested case placements", "the session calendar is created before observations and never read back from bars; removing every bar on one declared open session after generation leaves that session declared open", "every default teaching case is locatable through the case manifest and an independent filter over the affected bars or fact frame, and disabling one case leaves the others valid", "closure dates have no bars, open observations equal the declared session close exactly, and the missing-observation case is absent from bars while its session remains open", "session knowledge satisfies the session constructor while at least one non-session case has knowledge after effective time and remains unavailable until known", "the whole returned bundle seals without undocumented filtering or timestamp rewriting, activates availability and runs a trivial strategy to DONE with a declared valuation policy", "insufficient instruments or window length raises the documented classed error and returns no partial bundle", "the function is exported, documents its determinism, calendar and knowledge contracts, and R CMD check reports no new note"]
    evidence: ["Exported ledgr_sim_pit_inputs() returns the nine plain elements named by the cut. Its calendar is built before bars; default cases are anchored to fixed weekdays and instruments; the cash case emits the recognized ordinary_cash_dividend subtype; a changed seed changes numeric bars only; and the recipe carries the exact public-constructor arguments and enabled-family state.", "LTB-0076 independently locates all five cases, matches observations to normalized session-close timestamps, proves the late-known halt through a higher-precedence override, rejects post-delisting and in-halt observations, constructs all five default families together, and constructs the remaining families after each case is disabled alone.", "LTB-0077 passes the raw outputs unchanged through public constructors, seal, verified reopen and ledgr_run(). Public decision evidence is unrestricted before halt knowledge, halted once known and active at the interval end. Independently removing all bars on a declared open session preserves the pulse and yields a stale mark rather than deleting the session."]

  - id: "LDG-2840"
