packet: "v0.2.0.2"
cuts:
  - id: 1
    name: "Test-suite cleanup"
    cut: "2026-09-21"
    cut_review: "cut_review.md; PASS_AFTER_PATCHES at 6d37eeb; patched in place"
    authority: "inst/design/rfc/rfc_testing_architecture_v0_2_0_2_synthesis.md"
    source_table: "inst/design/audits/post_v0_2_0_1_test_suite_audit_blocks.csv"
    workstreams: [1, 2, 3, 4, 5]
    closeout: "test_cleanup_closeout.md"
    status: "closed"
  - id: 2
    name: "Accounting-core consolidation"
    cut: "2026-09-22"
    cut_review: "pending"
    authority: "inst/design/rfc/rfc_accounting_core_consolidation_v0_2_0_2_synthesis.md"
    source_table: "inst/design/audits/post_v0_2_0_1_accounting_core_inventory_sites.csv"
    workstreams: [6]
    closeout: "pending"
    status: "cut"
review_gate:
  max_review_invocations_per_ticket: 0.5
sequencing: >-
  A workstream opens only when the previous workstream's review is accepted
  by the maintainer. Ticket dependencies are intra-workstream only; this
  file is the sole sequencing authority.
review_obligations: >-
  Every workstream review answers, for each new load-bearing claim and each
  new review or heavy block (synthesis D5): what contract or defect it
  protects; whether its oracle is independent enough; what smallest change
  makes it fail; why this is the cheapest adequate lane; which existing
  evidence overlaps it. No block carries these as boilerplate.
workstreams:
  - id: 1
    name: "Oracle repair"
    cut: 1
    status: "complete"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 1", reason: "Repairs precede every other change so the baseline is trustworthy before anything is moved."}
  - id: 2
    name: "Control plane"
    cut: 1
    status: "complete"
    depends_on_workstream: 1
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 2", reason: "The runner, census, and gates must prove their own failure sensitivity before shrink or merge is measured against them."}
  - id: 3
    name: "Shrink"
    cut: 1
    status: "complete"
    depends_on_workstream: 2
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 3", reason: "Fixture reduction is where the time is and where a defect can be lost; each reduction must still fail on its condition."}
  - id: 4
    name: "Merge"
    cut: 1
    status: "complete"
    depends_on_workstream: 3
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 4", reason: "Merging by claim family answers the overlap question the registry cannot; the reviewer asks it per merge."}
  - id: 5
    name: "Delete and closeout"
    cut: 1
    status: "complete"
    depends_on_workstream: 4
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 5", reason: "Deletion is last so every replacement is named and executable in a bound lane first; the closeout is reviewed with it."}
  - id: 6
    name: "Accounting core"
    cut: 2
    status: "pending"
    depends_on_workstream: 5
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 6", reason: "The synthesis chose the architecture; the workstream implements it. One review at close checks parity on every surface, that the D5 detector fails on a reintroduced scan, and that no cash or position write entered the lot kernel. The maintainer may call one extra check after LDG-2776 before the replay is built on the new carrier."}

