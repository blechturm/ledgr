review_gate:
  max_review_invocations_per_ticket: 0.5
sequencing: >-
  Within a cut, a workstream opens only when the previous workstream's
  review is accepted by the maintainer. Cuts are independent of one another
  unless a workstream names a dependency in another cut. Ticket dependencies
  are intra-workstream only; this file is the sole sequencing authority.
review_obligations: >-
  Every workstream review answers, for each new load-bearing claim and each
  new review or heavy block (synthesis D5): what contract or defect it
  protects; whether its oracle is independent enough; what smallest change
  makes it fail; why this is the cheapest adequate lane; which existing
  evidence overlaps it. No block carries these as boilerplate.
  Maintainer rule, 2026-09-24, after the v0.2.0.0 regressions: every close
  review also walks the changed code against the seven shapes and the
  maintainer checklist in inst/design/manual/optimization_coding_style.qmd,
  naming each loop whose iteration count grows with bars, fact rows,
  instruments x pulses, events, diagnostics or candidates, with its stated
  reason or a finding; and no workstream is accepted before its performance
  is measured on the registered shape it touches, before and after,
  interleaved, with the clock named as cold or warm per spike_protocol.md
  section 10. This binds the review, not the tickets; ticket text is
  unchanged.
workstreams:
  - id: 1
    name: "Oracle repair"
    cut: 1
    status: "complete"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 1", reason: "Repairs precede every other change so the baseline is trustworthy before anything is moved."}
  - id: 2
    name: "Control plane"
    cut: 1
    status: "complete"
    depends_on_workstream: 1
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 2", reason: "The runner, census, and gates must prove their own failure sensitivity before shrink or merge is measured against them."}
  - id: 3
    name: "Shrink"
    cut: 1
    status: "complete"
    depends_on_workstream: 2
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 3", reason: "Fixture reduction is where the time is and where a defect can be lost; each reduction must still fail on its condition."}
  - id: 4
    name: "Merge"
    cut: 1
    status: "complete"
    depends_on_workstream: 3
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 4", reason: "Merging by claim family answers the overlap question the registry cannot; the reviewer asks it per merge."}
  - id: 5
    name: "Delete and closeout"
    cut: 1
    status: "complete"
    depends_on_workstream: 4
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 5", reason: "Deletion is last so every replacement is named and executable in a bound lane first; the closeout is reviewed with it."}
  - id: 6
    name: "Accounting core"
    cut: 2
    status: "complete"
    depends_on_workstream: 5
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 6", reason: "The synthesis chose the architecture; the workstream implements it. One review at close checks parity on every surface, that the D5 detector fails on a reintroduced scan, and that no cash or position write entered the lot kernel. The maintainer may call one optional check after LDG-2777, so the carrier and its scaling detector are reviewed together before the preparer and replay are built on them."}

  - id: 7
    name: "Ingestion consolidation"
    cut: 3
    status: "complete"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 7", reason: "The maintainer chose the surface; the workstream removes the other and makes the kept one exactly faster. One review at close checks that the pinned snapshot hash did not move, that every timestamp branch is identical before and after, that no contract case was lost in test migration, and that the harness record discloses its phase change."}
  - id: 8
    name: "Exact-parity and workflow corrections"
    cut: 4
    status: "complete"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 8", reason: "Every ticket claims exact parity on a measured surface or fixes a public-boundary defect. One review at close checks each parity witness against its smallest breaking change, that the source guard fails on a reintroduced identity call, that the availability read's oracle cases cover point-in-time, terminal-event, reopen and missing-evidence shapes, and that availability input validation retains one fail-closed facts assertion while eliminating only duplicate parsing, tokenization and assertion work. Workstream 8 has no dependency on workstream 7; staffing decides which opens first."}
  - id: 9
    name: "Ingestion reader"
    cut: 3
    status: "complete"
    depends_on_workstream: 7
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 9", reason: "A reader substitution changes inferred types, accepted inputs and error timing, which OPT-L03 put on the RFC side of its line. The maintainer decided it directly, so the review carries the weight the cut review would have: it checks the registered compatibility matrix against the tree, that every behaviour change in it is intended rather than inherited from DuckDB's defaults, and that the pinned snapshot hash moved only where the old reader was wrong."}

  - id: 10
    name: "Boundary and sealed facts"
    cut: 6
    status: "in_progress"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 10", reason: "The compiled refusal is the prerequisite every seed since v4 named and nobody owned; it lands first by ticket dependency so the first new economic event kind cannot be silently dropped. The fact family is architecture the synthesis bound after Type 2 review, so the workstream implements it. One review at close checks that the constructor and validator decode no vendor, that the fictional adapter is a witness rather than a demo, that the activation exclusion is defended by a detecting block rather than a comment, and that the double-counting refusal fires on a declared distribution-adjusted basis."}
  - id: 11
    name: "Policy, fidelity and cash"
    cut: 6
    status: "open"
    depends_on_workstream: 10
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 11", reason: "Entitlement and posting are the rules the second final review found the gate could not see violated. One review at close runs the table-driven cases against their ordering claims at R/fold-engine.R:458 and :506, checks the policy's identity behaviour in both directions (a changed value changes the hash; an omitted argument equals the explicit preset), and that not_supplied cannot be confused with none in the ordinary result. Type 1 because the public semantics were bound after Type 2 review of seed v7; the research default may not become the default before strict mode, identity, fidelity and ordinary reporting exist, which the dependency order enforces."}
  - id: 12
    name: "Disposition, composition and gate"
    cut: 6
    status: "open"
    depends_on_workstream: 11
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 12", reason: "DISPOSITION is the only new event type and the only path that consumes lots outside a fill. One review at close checks that the schema migration recreates existing stores without loss, that zero position means zero live lots rather than opposing ones, that the four-row composition witness reconciles numerically to the 3.5 formula rather than asserting field presence, that durable recovery and memory failure containment are asserted as the different guarantees they are, and that all fourteen gate cases are registered claims each naming the synthesis clause it protects. The cut closeout is reviewed with it."}

