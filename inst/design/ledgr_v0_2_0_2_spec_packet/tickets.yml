      - "Deleted the DuckDB-driver source-text pin because it asserted implementation spelling rather than behavior; snapshot ownership and connection behavior remain covered by executable tests. The merged runnable examples, installed paths, rendered artifacts, public result semantics, and public survivorship journey remain detecting blocks."
      - "The ten merged blocks identified across the two independent-review rounds no longer use skip_if_not() for differing source prerequisites. Each affected prerequisite is an explicit review-lane expectation followed by a guarded read, so an absent source fails its own witness without suppressing runnable siblings."

