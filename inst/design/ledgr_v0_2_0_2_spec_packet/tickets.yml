.54/0.55 before and 0.39/0.25/0.26 after. The shared scalar helper adds about 4% to the run's scalar-series loop on the reviewer's 2,000-bar by 25-repetition clock. These are interactive or component clocks, not release gates.", "Strategy Authoring Tools, Indicators and TTR And Adapter Indicators now state that pulse inspection uses the dense run feature path; all three source/render pairs execute and their focused freshness check is part of the ticket verification."]
