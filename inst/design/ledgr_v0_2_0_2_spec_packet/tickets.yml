  - id: "LDG-2801"
    title: "Read the ingestion CSV with DuckDB"
    workstream: 9
    status: "pending"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2800"]
    scope: "ledgr_read_csv_strict() reads with duckdb::read_csv_auto() instead of utils::read.csv(). duckdb is already an Import, so no dependency moves. The reader stays a reader: instrument_id, ts_utc and symbol are forced to VARCHAR so ledgr keeps owning instrument identity and all six accepted timestamp forms, and DuckDB never parses a timestamp. Columns are sniffed first so the type map names only columns that exist, which keeps ledgr's own missing-column message instead of a DuckDB binder error. Every DuckDB failure is caught and re-raised with the ledgr_invalid_args class the surface already uses. Two consequences are intended: a leading-zero instrument id is preserved rather than silently becoming an integer, which fixes a live defect; and numeric columns are always double, which makes ledgr_csv_normalize_numeric_columns() from LDG-2788 dead and it is deleted. The encoding argument is validated as UTF-8 rather than passed through, because that is the only encoding the surface now supports."
    acceptance: ["every row of the LDG-2800 matrix is re-recorded, and each difference is listed with a reason; an unlisted difference fails the ticket", "a leading-zero instrument id survives to the sealed snapshot", "LTB-0018 still holds: the pinned fixture hash is unchanged", "ledgr_csv_normalize_numeric_columns is deleted and no caller remains", "the release-shape read is measured before and after"]

