  - id: "LDG-2872"
    title: "Rebalance around positions the strategy keeps"
    workstream: 23
    status: "complete"
    priority: "P1"
    effort: "M"
    dependencies: []
    scope: "`ledgr_target_rebalance()` sizes chosen members from the whole allocatable capital, so keeping one existing position by hand asks for more than the account holds: with equity 100, a kept position worth 40 and full weight on the rest, the targets add up to 140, and ledgr fills them anyway because affordability is not automatic. The helper already solves this exact problem for held nonmembers: it keeps their quantity and reserves their marked exposure before sizing (`R/strategy-helpers.R:266-281`, `contracts.md:405-416`). Add `keep = NULL`, a vector of instrument IDs treated the same way: their quantity is preserved, their marked exposure is reserved, and weights and `equity_fraction` apply to what remains (decision 3). A kept ID must not appear in the weights at all, not even with weight zero: `weights = c(AAA = 0)` with `keep = 'AAA'` would otherwise turn an explicit sale into a hold silently, erasing the bound distinction between zero, omission and hold. A held nonmember named in `keep` is accepted and reserved once, because the helper already preserves it; rejecting it would make `keep = held` fail only in availability-aware runs (decision 8). Because `equity_fraction` applies to the remainder, an author migrating from the hand-shrunk budget must drop that shrinking or quietly underinvest; the help and the article say so."
    acceptance: ["with equity 100, a kept member worth 40 and one other member at weight 1, the kept quantity is unchanged and the other member is sized from 60; with `equity_fraction = 0.5` it is sized from 30, that is (100 - 40) * 0.5, not 100 * 0.5 - 40, for total exposure 70", "`keep = NULL`, `keep = character()` and omitting `keep` give identical output, identical to today's in dense and availability contexts, and held-nonmember reservation is unchanged", "a held nonmember named in `keep` is accepted and reserved exactly once: the targets equal those produced without naming it", "an ID in both `keep` and the weight names fails with `ledgr_invalid_strategy_helper` even when its weight is zero; so do an ID outside the decision axis, and duplicate or missing IDs", "a kept member whose exposure cannot be valued fails with `ledgr_target_sizing_unavailable`, as a held nonmember does", "a mutation that preserves the kept quantity but skips its reservation fails a registered detector", "`contracts.md` states the budget with kept members in the same sentence family as held nonmembers, and the help states the residual formula with the 100, 40, 0.5 example and the migration from a hand-shrunk `equity_fraction`"]
    evidence: ["`ledgr_target_rebalance(..., keep = NULL)` now validates kept decision-axis IDs, preserves their quantities, unions them with held nonmembers and reserves each nonzero exposure once before applying weights and `equity_fraction` to residual capital.", "LTB-0097 fixes the 100-equity, 40-kept-exposure example: full residual sizing produces AAA=4 and BBB=6, while `equity_fraction = 0.5` produces AAA=4 and BBB=3. It also protects omitted/NULL/empty parity, held-nonmember non-duplication, zero-weight overlap, malformed IDs and unavailable valuation.", "Close-review correction `5382a7d` restores the pre-cut dense mock contract: without `keep`, no position plane is required or read; an active binding detects any read. With `keep` or availability active, a missing or wrong-length plane fails with `ledgr_invalid_strategy_helper`.", "The implementation is vector-indexed with no instrument loop. The contract and help state the residual formula and that callers migrating from hand-shrunk budgets must apply `equity_fraction` to the remainder."]
  - id: "LDG-2873"
    title: "An explicit missing-decision policy for rule selections"
    workstream: 23
    status: "complete"
    priority: "P1"
    effort: "M"
    dependencies: []
    scope: "`ledgr_selection(ctx, where = ...)` refuses a missing decision for a current member (`contracts.md:645`, `R/strategy-types.R:227`). The refusal is deliberate: 'not chosen' and 'could not tell' are different statements. But every rule over features must then spell out `!is.na()` for every input by hand, including the close; forgetting one fails the run at the first warmup pulse, or in an availability run whenever a member has no current close. `ledgr_passed_warmup()` cannot help because it returns one TRUE or FALSE for a whole vector. Add `missing = c('error', 'exclude')` to the context entrance, with `'error'` as the default (decision 5), so a missing decision counts as not chosen only when the author says so at the call. A policy argument covers missing decisions from any rule; a per-feature usability helper would solve only the feature case and still leave the conjunction to the author. `'exclude'` means not chosen, and in a rebalance pipeline not chosen means a zero target: it sells a held position, where the warmup guard that returns `ctx$hold()` keeps it. The refusal message and the help must say so, because an author can easily read 'exclude' as 'leave alone'. The help also cross-references `ctx$idx(id, missing = c('error', 'na'))`, whose vocabulary differs because it returns an index rather than resolving a decision."
