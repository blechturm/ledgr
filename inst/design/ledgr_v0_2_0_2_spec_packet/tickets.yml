review_gate:
  max_review_invocations_per_ticket: 0.5
sequencing: >-
  Within a cut, a workstream opens only when the previous workstream's
  review is accepted by the maintainer. Cuts are independent of one another
  unless a workstream names a dependency in another cut. Ticket dependencies
  are intra-workstream only; this file is the sole sequencing authority.
review_obligations: >-
  Every workstream review answers, for each new load-bearing claim and each
  new review or heavy block (synthesis D5): what contract or defect it
  protects; whether its oracle is independent enough; what smallest change
  makes it fail; why this is the cheapest adequate lane; which existing
  evidence overlaps it. No block carries these as boilerplate.
workstreams:
  - id: 1
    name: "Oracle repair"
    cut: 1
    status: "complete"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 1", reason: "Repairs precede every other change so the baseline is trustworthy before anything is moved."}
  - id: 2
    name: "Control plane"
    cut: 1
    status: "complete"
    depends_on_workstream: 1
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 2", reason: "The runner, census, and gates must prove their own failure sensitivity before shrink or merge is measured against them."}
  - id: 3
    name: "Shrink"
    cut: 1
    status: "complete"
    depends_on_workstream: 2
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 3", reason: "Fixture reduction is where the time is and where a defect can be lost; each reduction must still fail on its condition."}
  - id: 4
    name: "Merge"
    cut: 1
    status: "complete"
    depends_on_workstream: 3
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 4", reason: "Merging by claim family answers the overlap question the registry cannot; the reviewer asks it per merge."}
  - id: 5
    name: "Delete and closeout"
    cut: 1
    status: "complete"
    depends_on_workstream: 4
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 5", reason: "Deletion is last so every replacement is named and executable in a bound lane first; the closeout is reviewed with it."}
  - id: 6
    name: "Accounting core"
    cut: 2
    status: "pending"
    depends_on_workstream: 5
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 6", reason: "The synthesis chose the architecture; the workstream implements it. One review at close checks parity on every surface, that the D5 detector fails on a reintroduced scan, and that no cash or position write entered the lot kernel. The maintainer may call one optional check after LDG-2777, so the carrier and its scaling detector are reviewed together before the preparer and replay are built on them."}

  - id: 7
    name: "Ingestion consolidation"
    cut: 3
    status: "complete"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 7", reason: "The maintainer chose the surface; the workstream removes the other and makes the kept one exactly faster. One review at close checks that the pinned snapshot hash did not move, that every timestamp branch is identical before and after, that no contract case was lost in test migration, and that the harness record discloses its phase change."}
  - id: 8
    name: "Exact-parity and workflow corrections"
    cut: 4
    status: "pending"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 8", reason: "Every ticket claims exact parity on a surface the horizon measured. One review at close checks each parity witness against its smallest breaking change, that the source guard fails on a reintroduced identity call, and that the availability read's oracle cases cover point-in-time, terminal-event, reopen and missing-evidence shapes. Workstream 8 has no dependency on workstream 7; staffing decides which opens first."}
  - id: 9
    name: "Ingestion reader"
    cut: 5
    status: "pending"
    depends_on_workstream: 7
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 9", reason: "A reader substitution changes inferred types, accepted inputs and error timing, which OPT-L03 put on the RFC side of its line. The maintainer decided it directly, so the review carries the weight the cut review would have: it checks the registered compatibility matrix against the tree, that every behaviour change in it is intended rather than inherited from DuckDB's defaults, and that the pinned snapshot hash moved only where the old reader was wrong."}

