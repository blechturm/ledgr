    dependencies: []
    scope: "The maintainer promoted the accumulated release from v0.2.0.2 to v0.2.1.0 on 2026-09-25 because its public capability and architecture changes are no longer patch-sized. Make that promotion before any release-gate run: set DESCRIPTION and the NEWS heading to 0.2.1.0; rename the local and remote release branch to v0.2.1.0 before branch CI; update AGENTS.md, inst/design/README.md, the roadmap's active release row and section, the horizon's active/future boundary labels, and every other current release pointer. Inventory every tracked occurrence of v0.2.0.2 and classify it rather than replacing blindly. Historical RFC, audit, spike, synthesis, packet-directory and ticket identifiers keep the version under which they were authored; the packet README gains a short promotion note explaining that its v0_2_0_2 path is historical while its release target is v0.2.1.0. Future work previously described as post-v0.2.0.2 becomes post-v0.2.1.0 where the phrase denotes the release boundary rather than an artifact name. NEWS.md currently says that nothing has shipped; replace that placeholder under the v0.2.1.0 heading with user-facing changes across the release: the test control plane and its lanes; accounting-core consolidation; ingestion consolidation and the reader; the exact-parity and workflow corrections; equity corporate actions, meaning sealed vendor-neutral facts with tiered provenance, the corporate_action_policy object with its research and strict presets in run identity, gross cash distributions, the DISPOSITION event, and corporate_action_fidelity in ordinary results; schema-ceremony maintenance; and all later accepted workstreams. State the release's non-claims with the same prominence as its claims: corporate actions are not complete, exact quantity settlement is out of this release, and declared distribution-adjusted bars are refused as execution bars. Entries are written for a reader upgrading from v0.2.0.1, not for the packet. No ticket identifiers, workstream numbers, cut numbers, or block ids appear in the user-facing text."
    acceptance: ["DESCRIPTION reports Version 0.2.1.0, NEWS opens with ledgr 0.2.1.0, the checked-out and remote release branch are v0.2.1.0 before branch CI, and no active release pointer names v0.2.0.2", "a tracked-occurrence inventory classifies every surviving v0.2.0.2 reference as historical artifact identity or historical narrative; the packet path and historical RFC, audit, spike, synthesis and ticket identifiers are not renamed, and the packet README explains the promotion", "the v0.2.1.0 NEWS section no longer states that nothing has shipped, and every user-visible change in the version appears in it", "each NEWS entry names the public function, argument, or result field it changes, in user terms; no entry cites a ticket id, workstream, cut, block id, or internal helper", "the non-claims are stated explicitly: not corporate-action complete, no exact quantity settlement, distribution-adjusted bars refused as execution bars", "the breaking surface changes from workstream 20 each have an entry naming the removed or renamed public name and its replacement, so no rename reaches a reader only through a diff", "a reader upgrading from v0.2.0.1 can tell from the section alone whether any existing strategy or workflow code must change, and every such change is named", "R CMD check parses NEWS.md with no new note, and the section is consistent with the cut closeouts it summarizes; where a closeout and the notes disagree, the disagreement is resolved before this ticket closes", "the README's capability claims and non-claims agree with these release notes; a disagreement is resolved in the README or the notes before this ticket closes"]

  - id: "LDG-2825"
    title: "Run and record the v0.2.1.0 release gate"
    workstream: 15
    status: "open"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2824"]
    scope: "The dependency is necessary but not sufficient to open this ticket. Workstream 15 opens only after the maintainer accepts workstream 26, which corrects the README and every article and records each routed finding's release disposition; LDG-2825 does not start automatically, and it corrects no documentation beyond the release pointers named below. `inst/design/release_ci_playbook.md` is the authority and is read before any gate is run or updated; the playbook requires every release-gate ticket to name it and the exact local gates, which this ticket does. Before the first gate, verify LDG-2824's promotion invariant: DESCRIPTION Version, NEWS heading, checked-out branch, remote release branch, active governance pointers, intended tag and GitHub Release target all agree on v0.2.1.0, while surviving v0.2.0.2 names are explicitly historical. Execute the playbook's Release Order for v0.2.1.0 and record the evidence. Local gates, each run and each recorded with its result: full package tests; Rscript --vanilla tools/check-readme-example.R; tools/render-vignettes-gfm.R --check --all, which proves no article's tracked Markdown went stale after workstream 26 closed; R CMD check --no-manual --no-build-vignettes; tools/check-coverage.R; a pkgdown build, which the tiered CI no longer performs inside R-CMD-check so this local build is now the first place a documentation break surfaces; and the local WSL or Ubuntu DuckDB gate named in the playbook, since this version changed schema creation and validation, persistence, snapshots and CI. Use release-gate timeouts, not exploratory ones. After those gates are green and before release-branch CI, run the registered same-host peer record from the release commit with dev/bench/peer_benchmark/run_record.ps1, Release v0.2.1.0 and LedgrOrder ttr-first. Keep the registered 500-instrument, 1,260-session, fixed-seed all-engine shape, including the public canonical and compiled spot-FIFO ledgr sweeps, Backtrader, Zipline and quantstrat; an unavailable optional peer remains an explicit unavailable result rather than fabricated evidence. Record the exact command, source commit, environment and dependency sidecars, record prefix, parity and retention results, phase clocks and sampled peak working set, then render the tracked peer report and figure from that record. Correctness, ledgr differential parity, surface-retention and registered peer-parity failures block release. Timing is characterization evidence, not a threshold invented at the gate: compare every ledgr row with the last promoted record under its declared boundaries, disclose boundary or environment changes, and route a suspected material regression to an explicit maintainer decision before tagging rather than omitting or explaining it post hoc. Verify the agent-facing release context per the playbook: AGENTS.md names the active historical packet and the v0.2.1.0 release target, and inst/design/README.md reflects every design document added, moved or retired this version, including the two pre-ticket notes and the cut closeouts. Because branch CI is now the quick tier, dispatch the full tier on v0.2.1.0 and wait for it before the merge. Then main CI on both workflows, then the v0.2.1.0 tag run, as three separate evidences. Create or update the GitHub Release from the existing tag only after tag CI is green, with curated notes rather than a dump of NEWS.md. If the gate uncovers a design problem, the playbook's stop rule applies: open a blocker ticket, do not perform live surgery inside the gate."
    acceptance: ["the maintainer's acceptance of workstream 26, including its final audit artifact and every routed product finding's release disposition, is recorded before the first gate command", "before any gate runs, one recorded version-consistency check proves DESCRIPTION, NEWS, checked-out branch, remote branch, active governance pointers and intended tag all name v0.2.1.0, and lists every retained historical v0.2.0.2 path or narrative class", "the closeout names each local gate listed in the scope with its command, its result, and its wall time where the playbook asks for a release-gate timeout; a gate that was skipped carries an explicit accepted reason and a gate that failed then passed records both runs", "one release-shaped peer record is produced from the same commit that enters release-branch CI with the registered 500-instrument, 1,260-session, fixed-seed all-engine command; its exact command, source commit, record prefix, environment and dependency sidecars, phase clocks and sampled peak working set are recorded", "the peer record's correctness, canonical-versus-compiled differential parity, surface-retention and registered peer-parity checks pass; unavailable optional peers are reported explicitly, and no timing is interpreted when its correctness or parity prerequisite failed", "the tracked peer report and figure are rendered from the new record, distinguish default canonical ledgr from the opt-in compiled row, compare every ledgr row with the last promoted record under declared boundaries, and disclose any environment or measurement-boundary change; timing has no newly invented pass threshold, but a suspected material regression requires an explicit maintainer disposition before the tag", "the full-tier CI run dispatched on the v0.2.1.0 release branch is green and recorded by run id before the merge; a quick-tier branch run is never cited as the merge gate", "main R-CMD-check, main pkgdown, and the v0.2.1.0 tag R-CMD-check are recorded as three separate run ids; no single run is cited for more than one of them", "AGENTS.md and inst/design/README.md are verified and, where stale, corrected within this ticket; the closeout states which of the two needed a correction", "the release notes from LDG-2824 are in the tagged commit, and the GitHub Release entry for v0.2.1.0 is created from the existing tag after tag CI is green", "no gate is weakened and no threshold is lowered to reach green; any blocker found is ticketed with the playbook's required fields and the tag does not move until it is resolved", "the closeout states the cut's review ratio and, if a correction round was needed, records the honest figure rather than omitting it"]

  # -------------------------------- 16 Availability and evidence accessors
  - id: "LDG-2826"
    title: "ctx$tradable(): the instruments a strategy may size now"
    workstream: 16
    status: "complete"
    priority: "P0"
    effort: "S"
    dependencies: []
    scope: "Every availability-aware strategy has to compute the same predicate before it can set a single target, and today it does so by hand: intersect the admissible plane with the priced plane and index the id plane by the result. Add ctx$tradable(), a context method beside the existing ctx$flat() and ctx$hold(), returning the character vector of instrument identifiers the strategy may size at this pulse. Availability-aware: admissible and priced, which is member, not target_restricted, and carrying a mark the run's valuation policy accepts. Dense: the instruments whose current close is finite and positive, the same predicate ledgr_target_rebalance() already applies before it warns or aborts. An empty decision axis returns character(0) so that targets[ctx$tradable()] <- x is a no-op and no strategy needs a special case. The method derives its answer from the planes the fold already computed; it does not recompute eligibility and it does not consult facts directly. No plane, contract, schema or error class changes."
    acceptance: ["in availability-aware mode ctx$tradable() equals the ids where admissible and priced are both true, checked against the planes on the same pulse for a fixture containing a halted instrument, an unpriced instrument, a held nonmember and an ordinary member", "in dense mode it equals the ids with a finite positive current close, and a fixture with a non-positive close excludes exactly that instrument", "an empty decision axis returns a zero-length character vector, and a strategy that only writes targets[ctx$tradable()] runs unchanged on that pulse", "ledgr_weight_equal(ctx$tradable()) composes into ledgr_target_rebalance(ctx) without raising ledgr_target_sizing_unavailable on a fixture where an unpriced or halted member would otherwise be weighted", "vignettes/missing-data-and-sessions.qmd uses the method and its strategy chunk loses the id-indexing lines; the rendered sibling is regenerated", "no change to ctx$vec planes, the strategy contract, schema, hashes or error classes"]
    evidence: ["LCL-0061 registers LTB-0061. The availability fixture derives the expected axis independently from ctx$vec$admissible and ctx$vec$priced and includes a halted member, unpriced member, held nonmember and ordinary member; only the ordinary member is returned and composes through equal weights and target rebalancing. The dense fixture excludes zero, negative and infinite closes. A pulse with no eligible members returns character(0) and leaves a full hold target unchanged.", "The focused pulse-context and test-control-plane files passed under R 4.6.1. The source and rendered missing-data article now use ctx$hold() plus ctx$tradable(), and the strategy-context help names both dense and availability-aware semantics."]

