  # ------------------------------------------------ 11 Policy, fidelity and cash
  - id: "LDG-2809"
    title: "The corporate_action_policy object and presets"
    workstream: 11
    status: "open"
    priority: "P0"
    effort: "M"
    dependencies: []
    scope: "Synthesis 3.3. A constructor-built policy object joining the six ledgr_experiment() already takes. Omission resolves to the versioned research preset: gross, effective_close, last_permissible, report_only. ledgr_corporate_actions_strict() sets every choice to refuse. Values are drawn from closed sets; arbitrary callbacks are not accepted. The resolved policy including defaults enters experiment and run identity, so a historical run never acquires a default implicitly. Each value carries a versioned identifier bound to its scope as well as its behaviour (the synthesis-only decision in 3.3); the identifier is what is hashed, the user-facing spelling is a short word. Argument and preset spellings are promoted to spec-cut; this ticket decides and records them."
    acceptance: ["two experiments differing only in one policy value have different config hashes", "an experiment with the argument omitted has the same identity as one passing the research preset explicitly", "a run store written before the policy existed does not acquire it on reopen", "an out-of-set value or a callback is rejected at construction with a named class", "the strict preset resolves every choice to refuse", "the hashed identifier is the versioned form, not the user-facing word"]

  - id: "LDG-2810"
    title: "Headline fidelity and the ordinary summary"
    workstream: 11
    status: "open"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2809"]
    scope: "Synthesis 3.5. corporate_action_fidelity with exactly four values: not_supplied, none, modeled, unsupported; severity monotone across the last three; not_supplied outside the ladder and printed in the ordinary result as \"Corporate actions: NOT SUPPLIED - returns may omit distributions\". The ordinary summary shows selected settings and identities, counts by exercised choice and refusal reason, the late-arrival count, aggregate affected marked exposure, gross cash posted, modeled terminal proceeds as a figure, positions disposed, realized model PnL and unsupported facts, with zero printed as zero. The field speaks only about supplied facts and never claims the source was complete. Summary layout is promoted to spec-cut; this ticket decides it."
    acceptance: ["a bars-only run prints not_supplied with the bound wording; a run with facts none of which affect a holding prints none", "an exact ordinary-summary witness asserts the exact expected values, not only the presence, of the selected settings and their versioned identities, the counts by exercised choice and the counts by refusal reason, with exact zeros for every unexercised choice and reason; a wrong nonzero count or a wrong identity fails the block", "the same witness covers every remaining listed field (late-arrival count, affected marked exposure, gross cash posted, modeled terminal proceeds, positions disposed, realized model PnL, unsupported facts) for presence and explicit zero rendering, with their exact values owned by LDG-2811, LDG-2814 and LDG-2815; omitting any field fails the block", "a run over bars with an undeclared price basis names the undeclared basis in the ordinary result", "gutting the fidelity path changes the ordinary result and a block detects the change", "the ordinary print method carries the field; it is not confined to a specialist reader", "the field cannot take a fifth value"]

  - id: "LDG-2811"
    title: "Gross cash distributions with fixed entitlement and explicit posting"
    workstream: 11
    status: "open"
    priority: "P0"
    effort: "L"
    dependencies: ["LDG-2809", "LDG-2810"]
    scope: "Synthesis 3.4, rules 1 through 7, and the maintainer's posting decision. Entitlement is the eligible holding immediately before the ex-dividend boundary taken from the validated entitlement clock, never a generic effective date, and is not recomputed at posting. effective_close means the ex-dividend session's close; the amount is credited before that pulse's valuation at R/fold-engine.R:458 and context at :506, so the dropped price and the cash land together. next_open remains an explicit alternative. A fact and every term the posting needs must be knowable by the cutoff under the declared knowledge policy; a fact known only afterwards posts at the first pulse at or after its knowledge time with the original entitled quantity and is counted in the fidelity summary. One existing CASHFLOW per admitted fact carrying source-fact, amount-policy and posting-policy identity. The amount is gross; no payment-date, withholding, investor-tax or broker-net claim. Gate cases 2, 3, 12 and the dividend half of 11."
    acceptance: ["table-driven: with the entitlement clock and the generic effective clock on different sessions, a holder selling on the ex-date is credited and a buyer entering on it is not, and using the effective clock fails the block", "exact cash, equity and strategy-context values at the ex-date pulse and the next under both conventions; cash posted after valuation or after the strategy has run fails the block", "a fact with knowledge time after the cutoff posts at its first eligible pulse with the pre-boundary quantity, is not backdated, and increments the late-arrival count", "a dividend across a later parent split normalizes to the snapshot unit basis", "a dividend-only snapshot with no session calendar and no valuation policy posts cash", "on a split-adjusted basis each supplied distribution posts exactly once; a second posting of the same source-fact identity fails validation", "the gross cash posted and the late-arrival count appear with exact values in the ordinary summary, not only in internal state", "the CASHFLOW carries all three identities and is applied once through resume and reopen"]

