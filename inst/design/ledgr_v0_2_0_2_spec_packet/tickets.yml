  - id: 16
    name: "Strategy authoring helpers"
    cut: "2026-09-27"
    opening: "The maintainer accepted the reviewed cut and instructed implementation on 2026-09-27. This cut entry, its recorded decisions and the ticket acceptance criteria are the operative Workstream 23 brief; no duplicate brief artifact is created."
    cut_review: "Two independent Type 1 and Type 2 invocations by Codex on 2026-09-27 against one agent-drafted brief, both CHANGES_REQUIRED. They agreed that LDG-2869 is result-printing maintenance outside the workstream's claim, that the release-gate dependency had to change in the file rather than in prose, that LDG-2873 takes an explicit `missing` policy on the context entrance, and that the acceptance lists of LDG-2868 and LDG-2870 to LDG-2874 admitted plausible wrong implementations. They split on routing. The first read context-surface synthesis lines 199-204 ('this cut adds no partial-rebalance engine or richer missing-intent object') as requiring an RFC amendment for LDG-2872 and LDG-2873, and recommended scheduling after the tag. The second read Pass 2 as authorizing both as direct tickets, and found pre-tag scheduling coherent once the dependency moved. The maintainer decided the split as recorded in `decisions`, and the tickets were patched in place. At the maintainer's request a third invocation, a usability and API-design Type 2 review by Codex on 2026-09-27, returned PASS_AFTER_PATCHES: the `missing` refusal and the partial-selection warning must name their opt-outs and what those opt-outs do, `keep` needs a pinned `NULL` default and should accept already-preserved held nonmembers, and the pulse print hides the fields LDG-2868 corrects. Those patches were applied in place (decisions 8 and 9). Three cut-review invocations plus the planned close review make 4 over 7 active tickets, 0.571, above the 0.5 gate. The maintainer accepted that breach in advance on 2026-09-27 as warranted by the usability evidence, recorded here as Cut 2 recorded its own; the threshold is unchanged, and any focused re-review after the close review adds to the breach."
    authority: "the strategy-authoring-helpers synthesis `inst/design/rfc/rfc_strategy_authoring_helpers_v0_1_8_x_synthesis.md`, whose final review bound Pass 2 as design (sections Q2, Q3 and 'v0.1.9 Pass 2') and left the first subset to the ticket writer. Pass 2 was never implemented. Its Q1 unprefixed naming is superseded by the accepted API naming-consistency synthesis, so new helpers carry the `ledgr_` prefix. `inst/design/vignette_styleguide.md` section 5, which routes clutter in a worked example to an API gap, as Cut 9 did. The context-surface synthesis behind Cut 13 is respected: no scheduler state, no alias planes, no change to preflight for user-defined helpers. The maintainer decisions of 2026-09-27 in `decisions`, including a scheduling override of that synthesis's recommendation to implement after the release gate, recorded here as Cut 13 recorded its own."
    decisions: "Maintainer, 2026-09-27, after both cut reviews. (1) LDG-2872 and LDG-2873 are direct Pass 2 tickets: the context-surface synthesis sentence bounds what Cut 13 took on and does not bar later stage helpers, and Pass 2 requires extending `contracts.md` in place. (2) The cut lands before the tag; workstream 15 now depends on workstream 23, so LDG-2858 and LDG-2859 audit the final helper and teaching surface once. (3) `keep` belongs on `ledgr_target_rebalance()`, which already owns positions, marks, equity and the residual-capital calculation; a separate target-edit helper could preserve a quantity but not undo oversizing. (4) `ledgr_pulse_snapshot()`'s `initial_cash` is renamed `cash`: it is the cash held alongside `positions`, not an initial value, and the naming-consistency synthesis binds function names, not argument names. (5) LDG-2873 uses `missing = c('error', 'exclude')` with `'error'` as the default; LDG-2871 uses `partial = c('warn', 'allow')` with `'warn'` as the default. (6) LDG-2869 is deferred to a maintenance cut. (7) One-pulse testing of stateful strategies gets a dense-only `state_prev` input on `ledgr_pulse_snapshot()` inside LDG-2868, rather than routing to the inspection-boundary seed: it completes the article's own testing technique, and a dense mock input stays within context-surface synthesis section 5, which treats pulse snapshots as mock state rather than a substitute for availability-aware callback state. Assigning `pulse$state_prev` works today only because the pulse is an environment; that is not a supported path. (8) After the usability review, a held nonmember named in `keep` is accepted and reserved once instead of rejected, reversing the second cut review's recommendation: rejecting it would make the natural `keep = held` pattern fail only in availability-aware runs, for no economic benefit, because the helper already preserves held nonmembers. (9) The pulse print change the usability review raised as a new ticket is folded into LDG-2868, because the corrected equity is invisible without it."
    source_table: "the 2026-09-27 rewrite of `vignettes/strategy-authoring-tools.qmd`, where each gap below forced hand-written code into the worked example; executed probes of the current helpers against that article's four-instrument, six-month sample; the `contracts.md` lines cited per ticket; both cut reviews' runtime probes"
