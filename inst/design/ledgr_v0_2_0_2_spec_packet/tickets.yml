    evidence:
      - "All 49 audit merge rows have an outcome. Twenty-four of those rows were consolidated into twelve locally isolated blocks covering source/install boundaries; public navigation; browser-free help paths; package-help links; disclaimer/non-overclaiming; runnable cost examples/current cost API; feature teaching; public result/helper semantics; release-reference/platform gates; condition help/final-bar behavior; rendered-site integrity; and the survivorship workflow journey. The audit's delete_after_replacement row 'public site polish avoids stale public artifacts' was also consolidated into the rendered-site block because its executable ordering, ignored-artifact, and local-path witnesses remain useful there; twenty-five source rows were consolidated in total."
