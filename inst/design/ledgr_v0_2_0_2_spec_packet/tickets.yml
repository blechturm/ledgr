  - id: "LDG-2832"
    title: "Warn when a strategy loops a scalar accessor over the universe"
    workstream: 16
    status: "complete"
    priority: "P1"
    effort: "M"
    dependencies: []
    scope: "The measured scan on 2026-09-25 found the largest self-inflicted cost available to a strategy is calling a scalar accessor once per instrument instead of reading the plane. At two thousand instruments the per-pulse cost is tens of milliseconds against effectively nothing for the plane, and it is invisible in the result because the numbers are correct and only the clock moves. Nothing warns. Count scalar accessor calls per pulse inside the context and raise one classed warning, once per run rather than once per pulse, when a run's per-pulse count crosses a threshold proportional to the universe, naming the accessor, the count, and the plane to read instead. The warning is a diagnostic: it never changes targets, fills, identity or any stored value, and it must not fire for ordinary single-instrument use or for a strategy that touches a handful of names. Whether the threshold is configurable is part of the ticket; if it is, its value enters no hash."
    acceptance: ["a strategy that loops a scalar accessor over a universe of at least the threshold size raises the warning exactly once per run with its class, the accessor name, the observed per-pulse count, and the vector form to use instead", "a strategy that reads only planes, and a strategy that calls a scalar accessor for a small fixed set of instruments, raise nothing", "the warning changes no target, fill, equity row, run identity, config hash or stored artifact: a run with the warning and the same run with it suppressed produce byte-identical outputs", "the counting itself costs less than the thing it measures: an interleaved before-and-after clock on a plane-only strategy at the registered universe shape shows no regression outside noise", "vignettes/strategy-authoring-tools.qmd documents the warning in its planes section, and vignettes/strategy-development.qmd cross-links it; both rendered siblings are regenerated"]
    evidence: ["Decision: the threshold is internal and non-configurable, so it enters no hash. A scalar accessor warns when its per-pulse count reaches the current universe size and that universe has at least 100 instruments. LCL-0066 registers fast LTB-0067: one 100-name loop emits exactly one ledgr_scalar_accessor_loop condition over the run with accessor close, count 100 and ctx$vec$close; plane-only and five-name strategies emit none. The original combined evidence also compared warned and suppressed outputs. Cut 12 later split durable fill, equity, config-hash and strategy-hash neutrality into review LTB-0071 under LCL-0071; it is no longer claimed as fast evidence. The full-gate audit found tracked helper closures and tracking state below the 100-name threshold. The corrected path installs untracked scalar closures and carries no attached tracking state there. LTB-0067 poisons the tracking function through both a five-instrument public single-candidate sweep and a direct refreshed context, detecting restoration of either helper bundle or the per-pulse state advance. The one-time fold allocation guard is structurally retained but is not claimed as mutation-detected.", "At the article's registered 2,000-instrument by 30-pulse shape, alternating warm plane-only run clocks were before 3.38/3.33/3.44 seconds and after 3.58/3.39/3.41 seconds. Medians 3.38 and 3.41 differ by 0.03 seconds, smaller than both observed run ranges, so no regression is distinguishable from noise. The source and rendered strategy-authoring article documents the class and vector remedy; strategy-development cross-links it."]

  - id: "LDG-2844"
    title: "Prepare corporate-action composition evidence once"
    workstream: 16
    status: "complete"
    priority: "P1"
    effort: "S"
    dependencies: []
    scope: "The accepted Workstream 12 close review first identified a per-fact scan in ledgr_corporate_action_composition_report(). Follow-up runtime tracing found the material cost one level earlier: the report fetches the whole run ledger and decodes every event's meta_json through ledgr_corporate_action_past_quantities(), then decodes the same event collection again for source-fact cash attribution. At 100,000 ledger events one parse cost 0.33 seconds, so the duplicated work costs about 0.7 seconds per print() or summary(); at 300,000 events the two passes cost about 2.4 seconds. Prepare the required event fields and metadata once per report, reuse them for entitlement quantities and modeled-cash attribution, select only event kinds and columns required by those two contracts, and replace the per-source-fact which(source_fact_id == fact_id) scan with one grouped aggregation. This is a result-boundary optimization only. It changes no fold, posting, resume, settlement, schema, identity, policy, fidelity, event vocabulary or public result shape. LDG-2820 remains the separate deferred resume-path optimization."
