  # ------------------------------------------------ 13 Schema ceremony
  - id: "LDG-2819"
    title: "Read the catalogue once in schema create and validate"
    workstream: 13
    status: "complete"
    priority: "P0"
    effort: "M"
    dependencies: []
    scope: "schema_ceremony_note.md sections 5 through 7. ledgr_validate_schema() walks information_schema once per required table for existence, columns, primary key and unique constraints, 105 queries and 0.33 s on a 31-table schema; ledgr_create_schema() queries existence and columns per table before every CREATE IF NOT EXISTS, 92 queries and 32 DDL executes even when nothing is missing. Both run on every ledgr_run() open (R/backtest-runner.R:615-616 at ea22976) and every ledgr_db_init(). Two changes. First, fetch the schema's tables, columns and constraints from information_schema once per call into R frames and have the per-table helpers filter those frames; every loop and every check stays, so a dropped table or column is still detected. Second, a fast path for create on reopen only: when ledgr_schema_metadata holds the current experiment_store_schema_version, create returns after that one read. Validation keeps running in full because the marker cannot certify that nothing was dropped afterwards. The gut in the note showed that keying the skip on a table's presence breaks migration of an older store; the key is the stored version and nothing else. Healthy-store outputs remain exact; a current-marker store damaged by dropping a create-owned table now fails validation instead of silently recreating an empty table. No caller source, schema definition, migration rule or marker semantics changes. Priority P0 because Workstream 11 review runs had already put the fast lane above its 90-second bound and Workstream 10 added blocks to it."
    acceptance: ["a DBI-call trace shows ledgr_validate_schema issuing at most four catalogue queries and zero DDL executes on a complete schema, and ledgr_create_schema on a store whose stored schema version equals the current one issuing at most two catalogue queries and zero DDL executes; a registered detector that counts DBI calls fails if a per-table catalogue query returns inside either loop", "every existing schema, validation and migration block passes unchanged, including the three that drop a table or column and expect rejection and the two that migrate an older store, which are the five that failed under the gut recorded in schema_ceremony_note.md section 5", "the fast path never fires when the marker is absent or differs: a store one schema version behind migrates fully, with every added table and column present afterwards, and a store with the marker removed is validated in full", "before and after on the same fixtures: identical information_schema listings for a fresh store and a migrated store, identical error classes and messages for a dropped table and a dropped column, the pinned snapshot hash unchanged (LTB-0018), and identical run outputs on one registered run", "interleaved before-and-after clocks on ledgr_run open, ledgr_db_init, the fast lane and the review lane, three runs each with medians reported and named cold or warm per spike_protocol.md section 10; the fast lane median is stated against the 90-second bound", "a source guard fails if the fast path tests a table's presence rather than the stored schema version, or if a caller, the schema definition, a migration rule or the marker's write site changes"]
    evidence: ["LCL-0034 registers LTB-0039 through LTB-0041. Validation performs four catalogue reads plus one marker read and zero DDL; current-version creation performs two reads total and zero DDL. A reintroduced per-table columns query produced 36 catalogue reads and two detector failures; a table-presence shortcut produced three failures. The close-review correction added a create-owned-table migration witness and tightened the exact-version guard; replacing exact equality with schema_version > 0 then produced six failures across LTB-0040 and LTB-0041. Fresh and migrated schema shapes share SHA-256 4f2a099ad5ddc3b205e54ae0d9e5bd435047c7df18cda7fa67c5d9e6457f79e0 before and after, exact dropped-table and dropped-column errors match, LTB-0018 passes, and the registered public run retained final equity 1003 with one fill. A current-marker store missing create-owned bars now fails closed instead of silently recreating the empty table. Interleaved clocks: db_init 0.72 to 0.28 seconds; warm ledgr_run 1.79 to 1.21; the fast profile's unmatched three-run medians are not an effect estimate, while the matched quiet-end pair is 87.82 to 70.77 seconds. All 447 corrected fast blocks passed in 70.40 seconds against the 90-second ordinary gate; review profile 418.8 to 305.2 with the same pre-existing schema-115 frozen-reference failure on every run. Focused Type 1 re-review returned PASS at 82fcfce; the maintainer accepted Workstream 13 and recorded Cut 7's honest historical 2.00 review ratio on 2026-09-25."]

