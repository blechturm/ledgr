  - id: "LDG-2864"
    title: "Stop the strategy context carrying future feature values"
    workstream: 20
    status: "complete"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2850"]
    scope: "`contracts.md:113` binds strategy contexts to decision-time information only, and today a strategy can read a future pulse's feature value from the context. The runtime feature projection holds one instruments-by-all-pulses matrix per registered feature and is attached to the callback as a directly indexable member, so `ctx$.feature_projection$feature_values[[1]][, 12]` returns future values at pulse 1. Two authors reproduced this independently in dense and availability-aware folds: a 3 x 12 matrix at pulse 1, the future column read there equal to the public plane later observed at pulse 12, and a pure target-returning strategy containing that read passing preflight as tier 1, because the tier system classifies reproducibility and not causality. The boundary this ticket enforces, per the maintainer direction of 2026-09-26: the full prepared dataset stays engine-owned; strategies obtain current values or requested historical slices only through accessors bounded by the invoking decision time; the context exposes no directly indexable full projection. An accessor may retain the full projection internally provided its supported operations enforce the cutoff, so this ticket does not require accessors to hold a bounded slice and does not require declared maximum lookbacks. A maximum lookback could still be justified separately by demonstrated resource needs; it is not a causality mechanism. Deliberate R introspection - extracting closure environments, inspecting call stacks, or modifying internal bindings - is outside the guarantee, and no field rename or closure arrangement is a sandbox against it. Two constraints bound the repair. Interactive inspection reads the private projection when the long table is empty (`R/feature-inspection.R:304`), and cut 13 deliberately retains that reader, so the repair gives it a bounded route preserving pulse and axis rather than removing it or rebuilding a full long table. And the guarantee is stated against supported operations rather than against hostile code. Feature values, warm-up semantics, alias behaviour and engine-side ownership are unchanged; this ticket removes supported reach, not capability. Because `contracts.md:113` does not currently say whether carrying decision-time information only is a claim about exposed operations or about internal state, LDG-2850 states that clarification explicitly rather than leaving this ticket to reinterpret the contract silently."
    acceptance: ["no member of a strategy context is a directly indexable projection or any alias of one: enumerating the context and following each member yields no object from which a feature value beyond the current pulse can be read without deliberate introspection", "every existing supported feature accessor remains bounded to the invoking decision time and its permitted axis, with a classed condition for an invalid request", "this ticket adds no public context member or accessor; if a new accessor proves necessary, implementation stops and the cut is amended so LDG-2850 owns its contract and LDG-2855 owns its documented surface", "a detector fails if a directly indexable raw projection is reattached or if a supported accessor returns a value beyond the invoking pulse; it must not fail solely because an accessor internally retains engine-owned data, and the closure-retention case is recorded as permitted rather than left as an implicit gap", "`ctx$feature()`, `ctx$features()` and `ctx$vec$feature()` return values identical to the pre-change run at every pulse of a full fold in dense and availability-aware execution, including warm-up `NA`, with feature ids and alias behaviour unchanged", "the interactive feature reader still returns its table when the long table is empty, through a bounded route preserving pulse and axis; no automatic full-long rebuild is introduced and no inspection surface is removed", "LDG-2850 records the contract clarification in `contracts.md`: the decision-time guarantee is a statement about supported operations, dot-prefixed context fields are not API and carry no guarantees, and deliberate introspection of engine-owned internal state is outside the guarantee", "no change to the fold, engine-side ownership of the projection, run identity, or per-pulse cost, and no declared-lookback requirement is introduced by this ticket"]
    evidence: ["LTB-0089 proves that a callback context contains no indexable `ledgr_runtime_projection` or former raw-projection fields, while scalar, plane, alias-bundle and lazy inspection routes expose only the invoking pulse and preserve a filtered axis. Its five-pulse dense and availability runs inspect top-level members plus one level of list and environment caches while reproducing the same literal SMA values, including warm-up `NA`, through all three supported access routes.", "Reattaching the three retired projection fields through the fast updater made the dense full-fold assertion fail on all five pulses. Nesting the projection under the existing `.pulse_lookup` environment also made all five dense pulses fail; the unmutated dense and availability folds remain green. A warm 505-instrument, 400-update interleaved hot-path clock measured medians of 0.095 seconds before and 0.090 seconds after. The final ordinary-fast profile ran 465 of 465 blocks with zero failures or skips in 84.130 seconds and passed the 112-second gate at `C:/tmp/ledgr-ws20-final-correction-fast`."]

