    review: {mode: "Type 1", point: "close of workstream 9", reason: "A reader substitution changes inferred types, accepted inputs and error timing, which OPT-L03 put on the RFC side of its line. The maintainer decided it directly, so the review carries the weight the cut review would have: it checks the registered compatibility matrix against the tree, that every behaviour change in it is intended rather than inherited from DuckDB's defaults, and that the pinned snapshot hash moved only where the old reader was wrong."}

