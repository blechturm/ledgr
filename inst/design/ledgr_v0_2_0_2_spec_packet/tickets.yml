  # ------------------------------------------------ 12 Disposition, composition and gate
  - id: "LDG-2814"
    title: "Canonical-R DISPOSITION with lot consumption"
    workstream: 12
    status: "open"
    priority: "P0"
    effort: "L"
    dependencies: []
    scope: "Synthesis 3.4. A new top-level DISPOSITION event type: the ledger_events CHECK in R/db-schema-create.R admits it, which is a table-recreation migration on existing stores per lines 382 through 427; a new operation in ledgr_prepare_accounting_events(); lot consumption under canonical FIFO with realized model PnL through the same realization the fill path uses, position removal and cash movement. The payload carries source-fact and policy identity, quantity, mark, source timestamp, age, before and after position and realized model PnL, and no equity or vendor subtype. Marks: last_permissible (preset), last_mark (explicit opt-in, beyond the staleness horizon, age reported), refuse. No finite qualifying mark means refusal with an intentional class and no mutation; never ledgr_config_non_finite. Strict mode retains terminal_settlement_unsupported and preserves the holding. Modeled terminal proceeds are a figure in the ordinary summary. Gate cases 4, 5 and 6."
    acceptance: ["a held terminal under the research preset disposes at the current mark, realizes model PnL through the fill-path realization, reaches zero position with zero live lots rather than opposing lots, and moves cash", "current, permitted-stale and opt-in beyond-horizon marks each dispose with source age recorded, and last_mark is not what the preset selects", "with no finite qualifying mark: no event appended, no mutation, no fabricated price, an intentional refusal class, and never ledgr_config_non_finite", "the strict preset on the same fixture stops with terminal_settlement_unsupported and the holding preserved", "the CHECK rejects an unknown event type and accepts DISPOSITION; the migration recreates an existing store without loss", "modeled terminal proceeds, positions disposed and realized model PnL appear with exact values in the ordinary summary", "the payload carries neither an equity subtype field nor a vendor subtype field; a payload containing either is rejected by the preparer"]

  - id: "LDG-2815"
    title: "Composition rule and the four-quantity omitted-value report"
    workstream: 12
    status: "open"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2814"]
    scope: "Synthesis 3.4 composition table and 3.5. One source-fact identity governs a transaction that raises both a terminal and a quantity effect; a supplied cash leg credited alongside modeled disposition proceeds for the same source identity is a validation failure. report_only changes no account state and raises fidelity to unsupported; strict mode stops when the affected parent is held. The summary reports, where terms permit: modeled cash credited; estimated contractual consideration as entitled parent quantity times the sum of cash per parent unit and the normalized recipient ratio times a named recipient mark at a named timestamp, in one currency; the difference at a common timestamp; successor exposure not represented. Each is an effective-date estimate, never the eventual return bias; unavailable where an observation does not exist. Retrospective only; never in the strategy context. Gate cases 8 and 13."
    acceptance: ["a four-row witness (cash acquisition, stock acquisition, mixed acquisition with both legs nonzero, spin-off with the parent surviving) asserts per row the exact event count, the exact final cash proving no supplied leg was credited beside modeled proceeds, the fidelity value, and the four quantities reconciled numerically to the formula including sign, ratio, common timestamp and total; field presence is not an assertion", "report_only on a held spin-off: zero account mutation, fidelity unsupported, omitted child value reported; the same fact under strict mode stops", "a supplied cash leg credited alongside disposition proceeds for one source identity fails validation with a named class", "the unsupported-fact count and aggregate affected marked exposure appear with exact values in the ordinary summary", "no reported estimate appears in the strategy context"]

  - id: "LDG-2816"
    title: "Recovery: durable resume and reopen, memory failure containment"
    workstream: 12
    status: "open"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-2814"]
    scope: "Gate cases 7 and 14. Durable: interruption after a DISPOSITION is recorded; resume applies it once; replay, results and reopen match an uninterrupted control after run and event identity exclusions. Relies on the fold transaction at R/backtest-runner.R:265, accounting before persisted strategy state at R/fold-engine.R:957, and resume restarting after the last state and deleting only the replaceable tail at R/run-resume.R:53. Memory: failure injected after the disposition has entered the memory buffer; a failed candidate with no final equity and no retained artifacts; an unaffected sibling candidate. No memory reopen or rollback guarantee is added; the passthrough at R/sweep.R:1670 stays by design. The terminal-disposition spike's interruption fired before the terminal pulse and its event was a FILL, so neither half is inherited from that evidence."
    acceptance: ["the interrupted and resumed durable run equals the uninterrupted control on events, equity, diagnostics and availability after identity exclusions, with exactly one disposition", "memory: a failed candidate row, no final equity, no retained artifact, and an unaffected sibling; a block that asserts only that an error occurred fails review", "a source guard fails if a transaction or reopen is introduced on the memory handler"]

