    scope: "`ledgr_pulse_snapshot()` accepts `positions` but sets both `cash` and `equity` to `initial_cash` (`R/pulse-snapshot.R:91-93`), so a pulse built with holdings reports the equity of an account that holds nothing. Both cut reviews reproduced it; with one opening state the pulse reported cash and equity of 100 and 100, while the first real fold pulse reported 100 and 283.0439, which is 100 plus 2 times 91.52196. `ledgr_target_rebalance()` sizes from that equity, so a one-pulse check of a strategy that starts from `ctx$hold()` sizes against the wrong account value. Rename this function's `initial_cash` argument to `cash` (decision 4); the run-configuration `initial_cash` used elsewhere in the package means starting cash and is untouched. Define `ctx$cash` as `cash` and `ctx$equity` as `cash` plus the sum of each position times its current close, the fold's decision-time valuation (`R/fold-engine.R:605`). A missing bar already aborts pulse construction with `ledgr_invalid_args` (`R/pulse-snapshot.R:224-228`); keep that failure and do not present it as new behavior. Also add `state_prev`, default `NULL`, exposed as `ctx$state_prev` (decision 7), so a stateful strategy's later-state branches can be tested on one pulse; today a pulse can only show the first-pulse branch. Validate it as the fold validates returned state. It is dense-only: the pulse does not simulate availability-aware state normalization such as `asset_state`, and the help says so. Make the corrected fields visible: `print.ledgr_pulse_context()` shows cash, equity, the number of nonzero positions and whether a previous state was supplied, without dumping positions or state (decision 9)."
