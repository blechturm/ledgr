    scope: "The 49 test-documentation-contracts.R rows the audit marks merge, across seven claim families (13 run lifecycle and persistence, 9 metrics, 7 documentation and governance, 6 execution and accounting, 6 identity and configuration, 5 features and indicators, 3 snapshot trust and ingestion). Executable journeys, runnable examples, installed help paths, and public result semantics keep a detecting block with an executable oracle in their claim family. A row that pins only wording, a version-stamped sentence, or a link is deleted with an individually stated reason; it is not merged into a prose check. The audit's MERGE-01 rule applies: merge on demonstrated overlap, not on the CSV's description score."
