    evidence: ["`ledgr_signal_feature(ctx, feature_id)` now reads one registered plane, projects current members, masks target-inadmissible scores and leaves admissible-but-unpriced scores intact. Empty membership returns without a plane read. `ledgr_signal_return()` delegates to it.", "LTB-0095 independently fixes the membership, restriction, pricing and feature planes. It distinguishes the raw unmasked entrance, the admissibility-only feature entrance, dense and availability return parity, unknown-feature failure and the no-read empty-member path.", "The contract, cross-referenced help and namespace export describe the shared policy. The focused strategy-context-entrance and strategy-reference suites passed after implementation."]
