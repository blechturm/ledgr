    scope: "`ledgr_signal_return()` is the only signal helper, and the only signal entrance that marks inadmissible members' scores as missing in availability-aware runs (`R/strategy-helpers.R:81-101`, masking at `:97`). A score from any other registered feature goes through `ledgr_signal(ctx, values = ...)`, which deliberately does not mask (`contracts.md:673-676`). A strategy that ranks on a moving-average gap or an RSI can therefore select a member it cannot trade in an availability run unless its author masks by hand, and the rewritten article has to warn readers about exactly that. Add `ledgr_signal_feature(ctx, feature_id)` with the return helper's policy: it reads one registered feature plane, never registers a feature, returns an empty signal for empty membership without reading the plane, and masks exactly the inadmissible members, not the unpriced ones. Re-express `ledgr_signal_return()` through it so the two cannot drift. Both cut reviews found this consistent with `contracts.md:673-676`: the raw `values` entrance keeps its documented difference, and the contract sentence is extended, not reversed."
