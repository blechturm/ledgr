    status: "complete"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-3135"]
    scope: >-
      Freeze timing/protocol inputs and executable runner before promotion.
      This is the accepted five-process descriptive current-tree baseline, not
      a paired before/after regression gate. The shared harness in
      dev/bench/timing/ therefore does not own its process plan, ratio or
      checker. The WS3 driver is limited to the external process-start clock,
      the cold-then-warm lifecycle, phase reconciliation and the exact result
      controls below. The driver loads dev/bench/timing/host.R by
      repository-relative path and calls that file's timing_host_probe() with
      dev/bench/timing/ as harness_dir; that shared function is the route that
      executes host.ps1. Host probes and calculation or verification of their
      commit/file identities occur outside both cold and warm timer intervals.
      The record names the harness commit and the identities of the actual
      host.R and host.ps1 bytes used. The driver does not copy, fork or
      reimplement either file, the parser, or a generic paired runner/checker.
      Apply this baseline's declared host policy to those shared observations.
      Two new-transition SMA5/10 rows: the 12x90 correctness fixture and the
      decided 500x1260 daily anchor, deterministic public simulation with seed
      20260530, opening cash 1e7, fixed one-share positions, zero costs/no risk.
      Verify affordability and completion; this differs from the historical
      peer record and cannot inherit its parity or ratios. Use a temporary
      installation of the pinned product revision; installation is outside
      both clocks, package import inside cold. Five isolated R processes per
      row, each with one cold public run then one independently reset warm
      public run on its unchanged sealed native snapshot. Cold includes process
      launch/import, raw common input IO, snapshot preparation/sealing,
      experiment construction, run and required result materialization;
      warm includes new experiment/book, run and materialization, excluding
      only truly reusable snapshot preparation and completed first-use work.
      No precomputed-feature payload crosses from cold to warm: feature
      hydration remains inside each run's clock. Record configured/observed R
      compiler JIT level and disclose first-use compilation versus warm state.
      Required results: fills, equity, cash and asset holdings; any native
      reconstruction/materialization is timed. Record exact timer endpoints,
      cleanup/record-writing treatment and the installed-source identity.
      Each process records full-precision controls from those actual results:
      fill count, terminal cash/equity, terminal quantities keyed by asset,
      plus native snapshot/config hashes. Check cold/warm and all five processes
      against the first baseline's immutable controls. This baseline is not a
      future ratio arm. Each post-WS4/WS8 same-engine regression gate belongs
      to its receiving cut, adds one proportional protocol folder under
      dev/bench/timing/protocols/ and checks economic controls before any
      ratio; native identity changes must be explicitly declared under that
      receiving cut, never silently ignored. Cross-engine peer clocks and the
      peer synthesis D8 per-row child-tree peak-memory records remain
      peer-suite work. Macro WS9's phase-level ledgr memory and worker
      baselines, budgets and final memory evidence remain WS9 work; this
      amendment changes neither owner.
      These are result columns, not a new hash registry or a claim of full-path
      parity for the large timing-only shape.
      High performance, inherited 0xFFFF P-core affinity, threads and background
      load are recorded; each arm's phase clocks reconcile or are unavailable
      with reasons. Record instrument-bars and observed callback/pulse counts;
      use a labelled untimed validation pass if counting perturbs timing.
      Engine-only clocks remain diagnostic. No forced 1.03 gate:
      this cut measures a baseline, not an optimization. No automatic retries.
      Limits: 20 minutes per attempt, 90 minutes total measured host time;
      keep censored/invalid attempts and stop for disposition rather than
      replace a slow or invalid row with a smaller one. Implement the fresh
      timing driver against these boundaries; old timing methods inform it,
      but the driver does not execute/source A0 or the old peer driver and
      does not copy or fork dev/bench/timing/.
