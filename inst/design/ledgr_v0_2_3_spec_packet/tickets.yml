      The maintainer waived a separate cut review; one clean-context Claude
      Type 1 code review remains required before closure.
    opening: >-
      Cut 9 correctly retired eager context frames, but retained inspection
      helpers still package prepared pulse primitives inefficiently. A bounded
      spike compared exact-output alternatives and showed that direct typed
      construction is smaller and faster than the current long-then-wide path
      and than generic pivoting. This cut changes only those two explicit
      inspection boundaries and does not reopen Cut 9 semantics.
    authority: >-
      Cut 9 accepted helper behavior and exact-output tests; contracts.md
      contract-context-inspection and contract-context-feature-resolution;
      optimization_coding_style.qmd; the 2026-11-03 maintainer instruction to
      implement the bounded direct-materialization result immediately.
    measured_input: >-
      On Windows 11, R 4.6.1 and collapse 2.1.8, the 600-instrument,
      three-feature spike measured ledgr_pulse_features() at about 868
      microseconds, direct construction with its existing character timestamp
      parse at 331 microseconds, and direct construction from cutoff_num at
      120 microseconds. At the same shape ledgr_pulse_wide() measured 11.32
      milliseconds and 1.29 MB allocated, direct construction 0.72
      milliseconds and 640 KB, and collapse::pivot() 0.99 milliseconds and
      948 KB. All compared values were identical to the current output.
    decisions: >-
      Preserve the public helpers, signatures, values, column types, tibble
      classes, aliases, concrete IDs, declared/map/radix ordering, typed empty
      results and refusal classes. Reuse the lookup's prepared numeric cutoff;
      do not parse the pulse timestamp. Construct long output directly from
      final vectors. Construct wide output directly from aligned bar and
      feature vectors; it must not call ledgr_pulse_features(), create a long
      table or invoke a generic pivot. The accepted no-callback-cost-promise
      remains unchanged; performance evidence verifies this implementation,
      not a new public SLA.
    identity_and_release_impact: >-
      No snapshot, store, run, strategy, result or configuration identity
      changes. No schema version, compatibility path, dependency or public
      signature changes. Inspection outputs must remain identical; only their
      transient construction and allocation behavior changes.
    sequencing: >-
      One workstream with two serial tickets: optimize the long helper first,
      then make the wide helper independent of it and close integrated
      evidence. LDG-3198 -> LDG-3199.
    out_of_scope: >-
      Context or history redesign; callback-grade helper guarantees; a new
      bars helper; caching manifested frames; changing alias, order, empty or
      error semantics; generic collapse adoption; fold, execution, accounting,
      persistence or schema work.
    workstreams: [22]
    review_lifecycle: >-
