    measured_input: >-
      The mandatory cut-entry record is produced by LDG-3200 before any
      reader or writer changes. Existing registered inputs include the A0 and
      frozen v0.2.2 public-result records; the Cut 7 fill-heavy profile at
      500 instruments x 1,260 pulses and about 54 fills per pulse (9.7 s run,
      1.7 s fills read, about 2.2 s P apply and about 1.8 s combined durable
      writes); the JSON hot-path audit showing quadratic terminal recovery;
      and the 2026-11-03 10 x 7,200 quiet-run profile showing about 360-460 us
      per pulse in diagnostic staging/flushing and about 3 us in the resume
      cursor. LDG-3200 reruns the existing A0, dense and real-data checkers on
      the unchanged base and registers one shared protocol folder under
      dev/bench/timing/protocols/; that discharges macro rule 11 for this cut.
      These numbers are attribution inputs, not acceptance clocks.
    decisions: >-
      (1) The final physical accounting authority is one ordered wide typed
      ledger_events table with no meta_json, the synthesis field matrix, one
      grouped validator at append and read, canonical lots as position
      authority and cash_delta as cash authority. (2) WS23 may temporarily
      extract typed evidence from current JSON, but that extraction and every
      accounting JSON encode/decode are deleted by WS24. Memory-sink auxiliaries
      move with the WS24 producer rewrite because that is where their replacement
      typed columns first exist. (3) The raw public
      ledger remains SELECT * and therefore gains the bound typed columns;
      every other public table, print and summary is exact except the decided
      INCOMPLETE correction: for the A0 avail_incomplete candidates, the sweep
      annualized_return becomes NA_real_, equal to the durable run metrics
      table at avail_incomplete/run/metrics.csv; no other surface changes and
      audit S2-014 stays out of scope. (4) The
      final store format uses schema-version 125 plus a new diagnostic-codec
      store-format rule binding. Together they cover the typed ledger, exact
      diagnostic codec, summaries, association evidence and removal of
      strategy_state. Every
      older, unmarked or mismatched store refuses; there is no migration,
      compatibility reader, alias or missing-marker fallback. (5) Full
      logical diagnostics remain the default public result. Physical omission
      is allowed only through a certified exact encoding; scheduled skips
      remain physical rows and exact sizing evidence remains irreducible.
      (6) Pulse-level resume, intermediate checkpoints, the restore reader and
      ledgr.interrupt are removed. Nonterminal attempts restart at pulse one;
      DONE/INCOMPLETE idempotence and completion-based publication recovery
      remain. (7) The compiled execution envelope is untouched. (8) Under
      macro rule 16, clocks and memory are measured once at the completed-cut
      milestone and attributed, but correctness and exactness are the workstream
      gates; this supersedes typed-accounting synthesis Section 6 item 11's
      no-regression clocks and macro WS8's named allocation gate. The one
      exception is contracts.md's paired H1 history resource gate: it must pass
      1.10x or receive an explicit maintainer exception. Any other material miss
      is routed to WS14 rather than hidden or retiered.
    identity_and_release_impact: >-
      Snapshot content identity and run-configuration identity do not change.
      Store format identity changes once through schema 125, the diagnostic-codec
      rule binding and the final DDL/fingerprint;
      development uses fresh fixtures and the private lake is rebuilt only at
      the later final format/data freeze. Cut evidence may use a disposable
      candidate-format private rebuild after reproducing the registered snapshot
      hash and fact digests; it is not the final lake rebuild. Release impact: product tests,
      schema/identity, result documentation, metrics vignette, NEWS, contracts,
      private aggregate evidence and performance/memory records. No package
      dependency or strategy/economic policy changes.
    sequencing: >-
      Three serial workstreams and nine operative serial tickets. LDG-3203 was
      retired during cut review because changing DDL before producers would
      leave a red tree; its ownership is merged into LDG-3204 and its ID is not
      reused. LDG-3200 freezes the
      shared baseline before LDG-3201 changes a reader. Workstream 23
      (LDG-3200 -> LDG-3201 -> LDG-3202) leaves one typed accounting
      preparation/replay and exact result projections. Workstream 24
      (LDG-3204 -> LDG-3205) changes the store and every producer atomically
      to direct typed publication, deleting the temporary extraction and JSON.
      Workstream 25 (LDG-3206 -> LDG-3207 -> LDG-3208 -> LDG-3209) retires
      pulse resume, implements exact diagnostic encoding/decoding and closes
      the one final schema/rebuild record. WS23 -> WS24 -> WS25 is binding.
    out_of_scope: >-
      Fill timing, costs, lot arithmetic, terminal/corporate-action policy,
      strategy behavior, execution ordering, snapshot or configuration
      identity, a second execution engine, a sparse public diagnostics API,
      strategy replay, richer factor/rank/weight recording, live/paper progress
      checkpoints, compiled-envelope changes, companion accounting tables
      without contrary measured evidence, migrations or backward-compatible
      readers, the final private-lake rebuild, release-wide performance repair
      owned by WS14, and any weakening or retiering of a correctness oracle.
    workstreams: [23, 24, 25]
    review_lifecycle: >-
      A fresh clean-context Claude CLI cut review first challenges necessity,
      completeness, ticket grain, hidden product choices, the one-version
      boundary and whether every acceptance item can fail. Each workstream then
      receives one independent Type 1 close review. WS23 reviews the field
      matrix, chunk state, replay ownership, public parity and seven shapes;
      WS24 reviews every producer/write path, DDL/refusal, absence of accounting
      JSON and cold-read clarity; WS25 reviews exact trace reconstruction,
      restart/recovery, all proof families, filtered-read bounds and final
      integrated records. Finding-bearing reviews write packet files. A design
      concern returns NEEDS_TYPE_2; a third correction round stops for maintainer
      disposition.
    cut_review: "CHANGES_REQUIRED in cut_review_11.md (independent clean-context Claude CLI, Opus/high): R1-R12 required ticket ordering, fingerprint, evidence, census and documentation patches. Focused confirmation returned PASS_AFTER_PATCHES; N1-N2's exact memory-gate and contract-ownership wording is applied and needs no further review. The maintainer accepted R13 as NA_real_ in the A0 avail_incomplete sweep/candidate annualized_return, matching the durable run metrics table; Cut 11 is operative."
review_gate:
  status: "retired"
  authority: "inst/design/rfc/rfc_governance_lifecycle_v0_2_2_synthesis.md Section 5, accepted 2026-10-14"
  accounting: "For each open cut, record once at cut close the independent verdicts over completed tickets; dropped tickets enter neither count. The ratio is measured, not gated."
  independence: "An invocation is one verdict at cut review, workstream close, focused re-review or final review from a session other than the implementing agent."
  findings_home: "A review returning findings writes a file in this packet named for its review point; its tickets.yml result holds verdict, link and one line on what changed."
  escalation: "A third correction round on one workstream stops for maintainer disposition."
sequencing: >-
  Each cut entry states whether its workstreams are serial or independent.
  Ticket dependencies bind within a workstream. tickets.yml is the sole
  sequencing authority.
review_obligations: >-
  Each workstream receives one Type 1 close review against its recorded claim.
  Work on fold, hydration, finalisation or result-reader paths walks, verbatim,
  the seven shapes in inst/design/manual/optimization_coding_style.qmd, The
  Seven Shapes And Their Replacements, and records an end-to-end timing.
  Hosted CI never uses wall clocks as a gate; the registered local host does.
