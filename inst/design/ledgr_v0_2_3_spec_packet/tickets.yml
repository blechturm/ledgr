      choice and the maintainer selected option A. The remaining findings
      were Type 1. Three maintainer decision turns changed the outcome: the
      option-A cursor/checkpoint choice, authorization of WS15's final bounded
      correction, and acceptance of the functional fast lane while retaining
      the 112-second timing result as a recorded miss. The retired review
      ratio is not used as a gate.
    cut_review: "Initial NEEDS_TYPE_2 in cut_review_7.md (independent clean-context Claude Opus, 2026-11-01). Maintainer decision accepts option A: one cursor row per completed pulse and a typed payload only on change; the split progress/checkpoint architecture is parked as the preferred future direction. Focused re-review PASS_AFTER_PATCHES in cut_review_7_rereview_1.md: all original items resolved or corrected; its ten bounded patches are applied. Final confirmation CHANGES_REQUIRED in cut_review_7_confirmation_1.md for four exact acceptance/status patches and one wording nit; all are applied verbatim. A final narrow clean-context Claude Opus check at ec5fe2be returned PASS. The maintainer accepted Cut 7 on 2026-11-01; workstreams 15-18 and LDG-3179 through LDG-3190 are operative."
    opening: >-
      Written by Codex after accepted Cut 6 merged at 14252ffb. This cut
      implements the accepted strategy-authoring synthesis on the one surviving
      execution path. It resolves the synthesis's bounded Section 6 questions,
      registers every Section 4 detector, and owns the flat lazy context,
      canonical position facts, selection and target verbs, typed declared
      state, experiment inputs, scheduling predicate, rounding disclosure and
      executed pattern teaching. It does not implement WS6 frame retirement or
      WS7/WS8 accounting storage. The maintainer accepted this entry on
      2026-11-01; workstreams 15-18 and LDG-3179 through LDG-3190 are
      operative, and tickets.yml remains the sole sequencing authority.
    authority: >-
      inst/design/rfc/rfc_strategy_authoring_api_v0_2_3_synthesis.md, accepted
      2026-10-28, Sections 2-4 and 6-8; its final review and
      rfc_strategy_authoring_api_v0_2_3_decisions.md; macro_plan.md revision 7,
      rules 2, 4-6 and 10-16, WS5 and the WS4b milestone disposition;
      contracts.md rule groups named by synthesis Section 3; the accepted Cut
      6 one-execution-path product and evidence; the shape, JSON and PMwR
      performance audits cited by macro WS5; optimization_coding_style.qmd and
      benchmark_methodology.qmd. Accepted RFC choices are not reopened here.
    measured_input: >-
      The final Cut 6 product at 14252ffb has one prepared substrate and one
      E/P1-P5 fold. Its matched installed-package record locates the remaining
      fixed-basket premium in the fold loop: no-fill loop 1.27 to 5.46 seconds,
      preparation 0.58 to 0.80 seconds. The shape audit attributes about 19%
      of the earlier no-fill floor to eager ctx$vec/bar_index construction. P5
      still normalizes state and writes canonical JSON on every processed
      pulse. The PMwR audit found list-per-ID state near 20% of a wide run. The
      JSON audit identifies per-decision intent encoding. These are inputs and
      attribution evidence, not promises that WS5 alone meets WS14 targets.
    decisions: >-
      Accepted by the maintainer on 2026-11-01. (1) The public state
      declaration is supplied to ledgr_experiment() as asset_state = list(...)
      and portfolio_state = list(...). This release supports scalar numeric,
      integer, logical and character defaults only. Asset scalars become
      instrument-ID-named typed vectors over the decision axis; portfolio
      scalars remain length one. Each normalized declaration records scope,
      field name, atomic type, scalar shape and an explicit typed missing or
      concrete default. Asset and portfolio fields share one namespace and the
      synthesis's result-role names are reserved. No arbitrary array or nested
      state shape is admitted. (2) Runtime state is one prepared typed field
      table, not a list per instrument. Helper returns are field patches; raw
      state_update is complete replacement; reset_state restores all defaults.
      One durable cursor row is written to the existing strategy_state table
      for every completed pulse. An unchanged pulse writes one constant marker
      without encoding state; a changed pulse writes the complete declared
      state once through the typed codec, and any decision-axis ID-set change
      counts as a state change. Resume advances from the latest cursor and
      restores the latest preceding payload aligned by instrument ID. This
      keeps schema 124 and current transactional resume semantics. The changed-
      state encoding cost is measured; a separate progress carrier plus typed
      checkpoint store is the preferred future architecture parked in
      horizon.md, not work in this cut. (3) D8 uses one typed run_diagnostics sizing row per sized
      instrument and decision. Requested, post-guard pre-floor and rounded
      quantities use target_before_risk, target and quantity; the accepted mark
      uses price and held quantity uses position_before. Typed reason_code
      values distinguish ordinary rounding, rounded-to-zero addition,
      rounded-to-zero liquidation and unavailable sizing; detail_json is the
      constant empty object and intent_reason uses reasons. A named sizing-rule
      binding makes old stores refuse. Summary reports evidenced/unavailable
      decision counts, total rounded-to-zero instructions, an exposure-weighted
      pooled coverage ratio, minimum decision coverage and last-decision
      coverage. Cross-decision requested/post-guard/rounded value sums and their
      difference are labelled decision-exposure diagnostics, never portfolio
      exposure or P&L. Raw quantity returns print one unavailable-intent notice
      per run. Final actual invested exposure comes from native execution and
      valuation and is separate. Undefined coverage stays NA, never 100%. (4)
      The flat context is a pulse-frozen lazy view. Its service, bar/feature
      indices and feature resolver are prepared once per candidate; each named
      column is built at most once per view. Internal adapters may bridge old
      helper implementation until the last target helper migrates. WS5 removes
      public ctx$vec, ctx$feature(), ctx$features(), open/high/low/close/volume
      scalar reads, position(id), idx(id) and tradable(); tradable becomes the
      buyable column. Prepared ctx$bars, feature_table, features_wide and
      ctx$bar(id) remain unchanged until WS6 supplies and reviews replacements.
      ctx$state is introduced by LDG-3185, which retires state_prev. (5) Exact
      public spellings are the synthesis spellings: ledgr_select_top(),
      ledgr_select_lowest(), ledgr_weight_equal(),
      ledgr_target_rebalance(ctx, ...), ledgr_target_adjust(ctx, ...),
      ledgr_strategy_result() and ledgr_schedule_due().
      ledgr_passed_warmup() remains the readiness predicate and
      ledgr_align_weights() remains the causal-history alignment helper; both
      join the public-name allowlist. Other live exports retain their meaning
      and move onto the flat context; broader pruning is WS11b. Retired helpers,
      including public ledgr_strategy_schedule(), receive no aliases. (6)
      opening and cost_model are required at public experiment construction.
      Existing extracted/resumed book provenance is not reconstructed or asked
      for again. schedule = accepts the existing classed schedule declaration;
      the mixed-cadence predicate delegates to the same compiled calendar and
      never creates a second scheduler. (7) Timing is milestone evidence under
      macro rule 16, not a workstream gate. Before edits LDG-3179 registers
      eight alternating pairs for fixed-basket and declared-session no-fill,
      sparse and wide cells, plus fixed-basket-wide state-change and unchanged
      cells. Both 14252ffb and the post-WS4a attribution base are recorded;
      t_ctx and t_state shares locate the known premium for WS14. An
      experiment-construction cell is required before any warm-iteration claim.
      A ratio above 1.10 against 14252ffb or failure to remove the named costs
      requires attribution and routing, not weakened acceptance. Hosted clocks
      are advisory. (8) Snapshot identity is unchanged. Normalized declared
      state is a new configuration-identity input; supplied investor inputs and
      effective schedule remain identity inputs. Store schema stays 124 under
      the accepted cursor/checkpoint design. The cut unconditionally
      adds ledgr_strategy_state_rule_version and
      ledgr_sizing_evidence_rule_version to the format fingerprint; old or
      missing markers refuse under the current-only policy, with no migration
      or fallback.
    section_4_ownership: >-
      Synthesis Section 4 item 1 belongs to LDG-3180; item 2 to LDG-3181;
      item 3 to LDG-3183; item 4 to LDG-3185 and LDG-3186; item 5 to LDG-3188
      and LDG-3189; item 6 to LDG-3179 (paired timing preregistration),
      LDG-3184 (default disclosure) and LDG-3187 (rounding and coverage
      disclosure). LDG-3179 freezes the
      complete detector, export, contract, identity, source and timing matrix;
      LDG-3190 reruns and reconciles it. Every listed mutation must fail a
      registered block; a source census alone is not detecting evidence.
    section_3_ownership: >-
      Synthesis Section 3 rows map to implementing tickets as follows. Pulse
      data, feature resolution and strict features: LDG-3180. Prepared views
      and inspection: no Cut 7 amendment; WS6 owns frame retirement and
      LDG-3190 records the inspection handoff. Context and state: buyable and
      flat columns LDG-3180, D2 facts LDG-3181, D5 declared state,
      patch/replacement/reset and axis rules LDG-3185 and LDG-3186. Strategy
      outputs and target semantics: LDG-3183. Decision axis: LDG-3182. Fold
      core, accounting events and reconstruction: LDG-3181. Walk-forward folds
      and window start: fact carry LDG-3181, strategy-state reset and candidate
      isolation LDG-3186. Construction, identity and durable JSON: investor
      inputs LDG-3184, typed declarations, identity and the state codec
      LDG-3185. Preflight: LDG-3184. Standard metrics and result reads:
      LDG-3187. Strategy teaching, example style and public names: LDG-3189.
      LDG-3190 verifies the consolidated text but does not first implement any
      contract amendment.
    condition_contract: >-
      Invalid selection/weight value types use ledgr_invalid_strategy_type;
      invalid helper call shapes use ledgr_invalid_strategy_helper with
      ledgr_invalid_args; contradictory or invalid returned targets use
      ledgr_invalid_strategy_result; declared/runtime state failures use
      ledgr_invalid_strategy_state; and a sizing request that cannot be valued
      uses the existing ledgr_target_sizing_unavailable class and the common
      sizing_unavailable diagnostic. Tickets pin exact messages only where the
      wording teaches the corrective public call.
    pre_acceptance_gate: >-
      Before maintainer acceptance, run three bounded probes on
      14252ffb: round-trip every proposed declared-state atomic type including
      typed missing values and a non-alphabetical asset axis; resume a strategy
      after an unchanged-state tail and after finalisation-only pulses; and
      count current context builds, state encodes and strategy_state writes.
      Record the scripts and results in the packet. A failure changes the cut;
      it is not deferred to implementation.
    pre_acceptance_evidence: >-
      PASS as an input gate, with the expected design failures recorded in
      dev/bench/v0_2_3_strategy_authoring_preflight/README.md. On product source
      14252ffb, canonical config JSON rejects numeric missing state and loses
      atomic missing positions/order for the other declared types; sparse
      change-only rows resume at pulse 2 rather than 4 and miss finalisation-
      only resume; and a five-pulse unchanged-state public run performs five
      context builds, five state encodes and five strategy_state writes. These
      observations directly bind the typed codec and option-A cursor rules.
      The round-trip and resume probes call internal functions on synthetic
      strategy_state rows; only the call-count probe is a public run, and its
      frame-based encode counter is exact only for this no-fill fixture. The
      probe measures whatever tree it loads: it is input evidence for
      14252ffb, not product acceptance evidence.
    identity_and_release_impact: >-
      Snapshot content identity: none. Run/configuration identity intentionally
      gains normalized declared state and explicitly supplied opening/cost
      inputs; schedule identity remains the accepted scheduler identity. Store
      schema stays 124: existing strategy_state rows become explicit cursor or
      typed-checkpoint records. The format fingerprint unconditionally gains the strategy-state and
      sizing-evidence rule bindings, with current-only refusal and no reader for
      a missing or old rule. Public API: flat ctx, new selection/target/state
      helpers, required investor inputs and the bounded retired-reader/helper
      list in decision (4). Persisted evidence: typed sizing diagnostics, one
      small cursor record per completed pulse and a complete typed checkpoint
      only on state change.
      Release impact: R, tests, contracts, NAMESPACE, reference, articles,
      NEWS, benchmark and identity records; no dependency change is planned.
    sequencing: >-
      Four serial workstreams. Workstream 15 freezes the implementation matrix,
      then ships the flat lazy context and canonical book facts. Workstream 16
      ships plain selection, strict weights, two target verbs, required investor
      inputs and the schedule predicate. Workstream 17 ships declared typed
      state and change/checkpoint persistence. Workstream 18 adds sizing and
      rounding disclosure, migrates strategies and the executed pattern
      article, removes retired exports, reruns the integrated evidence and
      hands the accepted flat layout to WS6. Ticket dependencies bind; WS6 may
      design against the accepted cut but cannot remove frames before LDG-3190.
      Cut 7 closes the WS5 implementation. Full macro-WS5 acceptance occurs at
      macro join J after the merged WS7 result reader consumes and exposes the
      D8 facts; LDG-3190 records that handoff rather than claiming join J.
    out_of_scope: >-
      WS6 history/frame helper design and removal beyond the public context
      readers expressly retired here; WS7/WS8 result-reader consolidation,
      schema 125 and accounting-event storage; fractional quantities; cash
      shortfall allocation; separate-capital sleeves; a decision graph or
      general recording layer; arbitrary/nested state shapes; a new scheduler;
      execution, cost, risk, fill or affordability policy changes; a compiled
      default; compatibility aliases, migrations or fallback readers; changing
      a frozen oracle except for an enumerated accepted API/identity/result
      difference with one owner.
    workstreams: [15, 16, 17, 18]
    review_lifecycle: >-
      A fresh clean-context Claude CLI cut review challenges necessity first,
      then verifies every synthesis decision, Section 3 contract amendment and
      Section 4 detector has one owner; it attacks decisions (2), (3), (5), (7)
      and (8), ticket grain, schema-125 coordination and whether every gate can
      fail. Each workstream receives one independent Type 1 close review.
      Reviews of fold, state, persistence or result paths walk the seven
      optimization shapes and report timing. A Type 1 design concern returns
      NEEDS_TYPE_2. Finding-bearing reviews get packet files; a third correction
      round on one workstream stops for maintainer disposition.
  - id: 9
