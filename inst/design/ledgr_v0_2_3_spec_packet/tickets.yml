    status: "closed"
    closed: "2026-11-01 by the maintainer, accepting workstream 13 on product 15ea966a after its checkpoint chain (ws13_checkpoint_review.md, re-reviews 1 and 2: PASS on 167dc947) and close chain (ws13_close_review.md NEEDS_TYPE_2, decided as amendment_valuation; ws13_close_review_rereview_1.md PASS_AFTER_PATCHES, applied verbatim in 15ea966a). Workstream 12 was accepted on 2026-10-31. Identity: snapshot content, run configuration and store format fingerprint unchanged (ws12_disposition.md). Accepted refusal changes: amendment_overflow and amendment_valuation. Open, routed: coverage not obtained (horizon.md, before release certification); overflowing openings and dispositions (typed-accounting work); speed and deep-forward memory at the WS4b milestone check (macro plan rule 16)."
    accepted: "2026-10-30 by the maintainer, revision 5, after LDG-3162 and LDG-3163 completed and the prepared-cut review (cut_review_5_prepared.md, PASS_AFTER_PATCHES, patches applied verbatim). Decisions (1)-(13) and the shape changes listed in ws4a_carrier_design.md Section 9 are accepted with the cut. Implementation starts with LDG-3164 (workstream 12)."
    amendment: "2026-10-30 by the maintainer, during LDG-3164 (stop rule of decision (1)): the synthesis Section 4 state invariant 'positions equal lot-derived net' (design note F4.01) is not enforced at import. The base admits an execution spec holding positions without lots and carried walk-forward positions that differ from the re-summed carried lots in the last bits; enforcing equality at E would add a refusal or change carried results. Imported positions are kept as given; positions of instruments a fill or disposition touches come from the book (O2.02, D11). The divergence is parked in horizon.md (2026-10-30, imported positions versus the lot-derived net) for the typed-accounting work (WS7/WS8). No identity or result change."
    amendment_performance: "2026-10-31 by the maintainer (macro plan rule 16): timing and memory are no longer gates in this cut; performance is checked against v0.2.2 after big milestones, first after core unification (WS4b). Decisions (4) and (5) set no pass/fail criterion; protocol ws4a-timing-1, its thresholds, timing_absolute.R and the memory method stay registered as tools for the milestone check. Decision (6) stands as settled on blocks at LDG-3164 by attempt 1 of dev/bench/timing/records/ws4a-timing-1/ldg3164-gate (candidate a6b3643e: read_fills 0.408, read_trades 0.405) and the replay memory record (0.88-0.92 of base); attempt 2 on f4c47b8b was stopped unfinished and is not evidence. Decision (8): LDG-3164 through LDG-3169 end with their correctness gates only, and the real-data oracle still runs at LDG-3164 and LDG-3169. LDG-3169 runs no timing matrix or memory script. Decision (7)'s question, whether the per-pulse lot copy dominates, moves to the milestone check after WS4b. Correctness oracles, cases, guts, detectors and injections are unchanged."
    amendment_budget: "2026-10-31 by the maintainer: decision (12)'s budget for new maintained R under dev/bench/v0_2_3_ws4a/ and the protocol folder is raised from 2,000 to 2,500 lines, pre-approved for workstream 13 (it stood at 1,995 after workstream 12). A plan above 2,500 stops for maintainer disposition."
    amendment_overflow: "2026-10-31 by the maintainer (refusal change, raised by LDG-3167's base probe): a fill whose lot accounting overflows to a non-finite value, for example buying 1e308 units at price 10 from finite public inputs, is refused at the fill with the existing ledgr_invalid_lot_fill condition and message 'Invalid fill input for lot accounting.', the refusal ledgr already raises for an overflowing fee. Runs and sweeps both refuse. The base accepted such a fill (a durable run failed later at metadata encoding with ledgr_config_non_finite; a sweep completed with infinite values); workstream 12's typed kernel refused it as ledgr_lot_state_invariant. This is an accepted refusal change, implemented before LDG-3169 with base-vs-candidate controls; no result with finite accounting changes. A base run that completed with non-finite accounting, for example a fill with realized P&L of Inf from selling a 1e308-unit lot held at a negative basis, now refuses the same way (clarified 2026-10-31 after implementation)."
    amendment_valuation: "2026-10-31 by the maintainer (Type 2 on ws13_close_review.md F1): valuation overflow is not a fill refusal. When an admitted portfolio's run-order valuation becomes non-finite (for example holding 1e308 units marked at 10), the typed decision packet carries the non-finite positions_value and the run reaches the base refusal point and condition (ledgr_config_non_finite on runs and sweeps), as on 953338df, unless a fill overflows first, which amendment_overflow refuses (for example selling a 1e308-unit long at basis 1 for 10 overflows its realized P&L; clarified 2026-10-31 after correction round 1); where the base completed with non-finite equity, the candidate completes the same way. Primitive position and mark checks stay finite. Design note F4.15 and the promoted fold-carrier contract are revised accordingly. amendment_overflow stays limited to fills and, per its own text, covers runs and sweeps on every accounting path, including the compiled spot_fifo path (ws13_close_review.md F2)."
    opening: >-
