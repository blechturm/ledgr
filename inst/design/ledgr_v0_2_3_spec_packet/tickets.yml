    decisions: >-
      Proposed for acceptance with the cut; revision 2 applies
      cut_review_5.md F1-F10. (1) Authority: the synthesis binds the design.
      A design question the synthesis does not settle stops work for a Type 2
      checkpoint before acceptance; the implementer does not decide it. (2)
      Oracles, all exact: the Cut 4 A0 successor gate (295 checks); the dense
      native oracle at cbf25359 (nine arms, through dense/check.R); the
      pre-WS4a real-data reference of measured_input, compared exactly with
      the unchanged compare.R (ref_dir
      E:/ledgr-data/reference/v0.2.3-base-953338df, the candidate installed
      into a fresh library, the base-built snapshot reused because WS4a
      changes no store format), so no predicate is needed; and the case
      records LDG-3163 adds on the base for synthesis Section 5 rows and
      Section 9 scenarios that no existing oracle or test covers. No economic
      oracle, fixture value, canonicalisation or expected byte changes. Only
      the representation and structural-test migrations individually
      approved under decision (10) are permitted; they preserve the old
      logical and economic witnesses. Synthesis Section 5's logical-FIFO
      comparison replaces raw container comparison only where the book
      layout changed. (3) Identity, per macro rule 5: snapshot content
      identity none; run configuration identity none; store format
      fingerprint none. Release impact, per macro rule 6: product tests,
      performance records, internal contract rule groups at close and one
      NEWS line; no public API, taught behaviour, documentation page or
      dependency change. (4) Timing gate: protocol ws4a-timing-1 on the
      shared harness (dev/bench/timing/protocols/ws4a-timing-1/), paired
      base/candidate, with every cell, workload and bound frozen before cut
      acceptance. Workloads: the probe's 500 x 1260 SMA 5/10 transition on
      complete facts for availability and on dense bars for dense; the same
      bars with flat targets for no-fill; and a sparse monthly top-20
      rebalance whose rebalance calendar, selection and tie order, costs,
      recording policy, warmup and returned-output materialisation are
      frozen in the workload. Ratio cells: availability and dense wide
      all-fill durable runs, 0.60 each; a dense wide sweep, 1.03; an
      availability wide sweep as a fixed relative cell, 1.00; availability
      and dense no-fill runs and sweeps, 1.03 each; availability and dense
      sparse-rebalance runs and sweeps, 1.00 each; warm public fills reads and
      warm public trades reads on a completed wide durable run (the replay
      path), 1.03 each, each with recorded nonzero replayed rows and a fixed
      number of complete invocations; warm public equity reads, 1.03, as a
      result-reader cell and not a replay witness. Absolute cell: the
      availability wide sweep's candidate median marginal time per executed
      fill must be at most 40e-6 seconds, where the marginal is that
      process's wide sweep time minus its matched no-fill sweep time, divided
      by the repetition count and by the actual executed-fill count. The
      unchanged shared checker validates the record and the ratio cells; a
      small WS4a checker reads its per-cell results and fails separately when
      the candidate median marginal exceeds 40e-6. A nonfinite or
      nonpositive marginal fails measurement validity and is never clamped,
      omitted or replaced. Before acceptance the WS4a checker is shown to
      reject a 45 us candidate with a 240 us paired base, and to accept a
      30 us one. The shared harness is reused; its collection and validation
      machinery is not copied. Any numeric revision needs baseline and noise
      evidence before acceptance. The recorded timing deviations in
      ws4a_carrier_design.md Section 7 are incorporated: the matched untimed
      durable run supplies the fill denominator, with the registered
      repetition checks; wide_total and nofill_total are returned clocks but
      are not persisted by the unchanged shared harness; reader cells use the
      availability run; run and sweep cells perform their registered untimed
      warm-up; and the marginal cell also has a 1.00 ratio bound. The frozen
      base record is the functional and quiet marginal smoke, not an A/A
      window. These details do not change any bound. (5) Memory: both
      producers' 500 x 1260 wide sweeps must allocate no more cumulative
      explicit-size Rprofmem bytes per actual fill than their recorded base.
      The 5,000 x 252 wide and deep-book workloads measure forward execution
      and replay separately; the deep case has 250 instruments consuming 15
      live lots. The gated metric, settled by the maintainer on 2026-10-30,
      is peak R heap, sum(gc()[, "max used"] * c(56, 8)) in a fresh child
      after gc(reset = TRUE) at the phase boundary, at most 1.10 x the
      matched base median. It covers only the R heap and includes garbage
      awaiting collection; it is not peak live memory. The five repetitions,
      default collection policy, phase boundaries, frozen control sizes and
      base values are registered in dev/bench/v0_2_3_ws4a/records/memory/
      and memory.R. Validation found spread at most 0.6%, every
      independently allocated live-storage control breached (1.18-1.44 x),
      and pointer aliases did not breach. The earlier process peak-commit
      method failed validation (range/median up to 0.15; one unchanged run at
      1.13 x its median) and remains observational only; method.md preserves
      the rejection. The frozen replay memory budget applies at LDG-3164 and
      LDG-3169. (6) Replay: singleton replay calls are kept only if the
      replay timing cells and the replay memory budget pass at LDG-3164's
      end; otherwise the replay groups consecutive conflict-free blocks
      through the same implementation in that ticket. (7) The canonical lot
      kernel uses base copy-on-modify. By-reference lot writes are out of
      this cut; if the LDG-3169 scale record shows the per-pulse lot copy
      dominates, they go to a later cut with an ownership proof. (8)
      LDG-3164 through LDG-3168 each end with A0, dense and their applicable
      case and detector gates exact and the full suite green. The real-data
      oracle runs at LDG-3164 and LDG-3169. LDG-3164 also gates replay timing
      and replay memory to settle decision (6); this is an explicit exception
      to postponing the timing matrix. Other timing cells may regress
      between tickets. LDG-3169 gates every oracle, timing cell and memory
      workload on the final candidate. (9) Drafting gate: LDG-3162 and
      LDG-3163 are pre-acceptance preparation and change no product code.
      This cut stays draft until both are complete, every proposed oracle and
      checker has been exercised on the unchanged base with its expected
      baseline outcome recorded, thresholds and detector controls are frozen,
      and every surprise is settled in this cut. A subsequent independent
      cut review must pass before acceptance, and LDG-3164 starts only after
      acceptance. An open Type 2 question blocks acceptance. (10) Test
      migration: registered-test migration is limited to the pre-acceptance,
      per-block list in LDG-3162. Each entry states the representation change
      the synthesis authorises, the old semantic assertion, its replacement
      and a demonstrated violation that fails the replacement. Permitted
      mechanical edits: constructing typed books, positions and equity
      records instead of removed containers; comparing the same logical FIFO
      witness; and replacing source predicates that name removed helpers or
      list traversal with predicates that enforce the same ownership or order
      claim on columns. This covers test-fold-phase-contract.R's constructor,
      accumulator and position checks and test-execution-spec.R's old P4
      source assertions. All economic input values, expected outputs,
      conditions, fault boundaries and allocation bounds are preserved. No
      entry may mask a product failure; a semantic or fault-boundary change
      needs a separately stated, accepted reason before implementation. (11)
      Contracts: at LDG-3169 the implemented carrier rules enter contracts.md
      (fold core and event staging rule groups, and a carrier-contract rule
      group holding synthesis Section 4 as implemented); nothing is promoted
      before it is implemented. (12) Budget: new maintained R under
      dev/bench/v0_2_3_ws4a/ and the protocol folder totals at most 2,000
      lines (raised from 1,500 by the maintainer on 2026-10-30, when the
      full case set of the LDG-3162 register needed 962 lines;
      spike_protocol.md Section 4); a plan above it stops for maintainer
      disposition. (13) Release evidence: the LDG-3163 base
      records, the ws4a-timing-1 gate record and the memory record are the
      named heavyweight records.
    sequencing: >-
      Two serial workstreams (revision 4, maintainer 2026-10-30): workstream
      12, the typed lot book, owns LDG-3162 through LDG-3164; workstream 13,
      the typed stage carrier, owns LDG-3165 through LDG-3169 and starts only
      after workstream 12's close review is accepted. Pre-acceptance
      preparation (decision 9) is complete: LDG-3162 fixes the reviewed
      design and obligation register; LDG-3163 supplies the frozen protocol,
      reproduced case records, validated memory method and exercised
      detector controls. The subsequent prepared-cut review and maintainer
      acceptance remain the implementation gate. The serial product sequence after acceptance: LDG-3164
      introduces the typed lot book and the one accounting implementation
      for every consumer and closes workstream 12; LDG-3165 types the
      observation and the decision; LDG-3166
      types the plan; LDG-3167 batches application and publication; LDG-3168
      types diagnostics, equity and the fold-state validator; LDG-3169
      verifies the final candidate, runs the gates, promotes the contract
      text and closes workstream 13. Ticket dependencies bind. WS4b inherits
      nothing until both workstreams are accepted.
    out_of_scope: >-
      Dense-mode removal, the implied-calendar and execution-stamp decisions,
      the final-bar disclosure and ledgr_backtest() (WS4b); provider and
      valuation internals, selective diagnostic materialisation, the H5
      reconciliation JSON, state normalisation and serialisation, and the
      canonical_json() cache (WS4b, WS5); the flat ctx, intent JSON and typed
      declared state (WS5); context frames (WS6); reader and replay
      architecture, metadata preparation and terminal recovery's per-pulse
      replay (WS7); schema 125, meta_json, the memory meta list and non-fill
      evidence columns (WS8); C++ changes, native-resident lot state and any
      compiled default (compiled-envelope RFC); by-reference lot writes
      (decision 7); D2 position-fact slots (WS5); any change to economics,
      event order, fill timing, cost semantics, diagnostics retained or event
      meaning; new execution-mode branches; compatibility code; new public
      API; weakening a test, timing threshold or oracle to obtain green.
