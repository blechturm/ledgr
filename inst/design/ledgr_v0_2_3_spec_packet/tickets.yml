packet: "v0.2.3"
cuts:
  - id: 1
    name: "One output handler"
    cut: "2026-10-28"
    status: "closed"
    closed: "2026-10-29 by the maintainer, accepting workstream 1 after its Type 1 close review (ws1_close_review.md: CHANGES_REQUIRED with F1 timing-host departure and F2 governance-count classification; F1 resolved by maintainer disposition option A, F2 corrected; focused re-review PASS). Disposition: ws1_disposition.md."
    accepted: "2026-10-28 by the maintainer, revision 3, after independent cut review (cut_review_1.md CHANGES_REQUIRED; cut_review_1_rereview_1.md PASS_AFTER_PATCHES, patches applied verbatim). The proposed decisions (1)-(7) are accepted with the cut."
    opening: "Written by Claude on 2026-10-28; revision 2 applies cut_review_1.md F1-F7 and revision 3 the re-review patches. The accepted v0.2.3 macro plan makes WS1 (one output handler) the first cut, after measurement step A0 froze today's native outputs of both handlers. This cut entry, its workstream claim and LDG-3126 through LDG-3132 are the operative implementation brief once accepted. tickets.yml is the sole ticket and sequencing authority. Implementation starts with LDG-3126."
    cut_review: "Round 1: CHANGES_REQUIRED in cut_review_1.md (independent clean-context Codex): A0 harness migration allowance too narrow (F1), constructor-only test migration impossible (F2), final tree not re-verified after R3 (F3), timing protocol incomplete (F4), R3 owned after its trigger and unscoped (F5), retirement by name only (F6), compiled-dispatch capability consumer omitted (F7). All seven applied in revision 2. Round 2: PASS_AFTER_PATCHES in cut_review_1_rereview_1.md (independent clean-context Codex): F1, F3, F4, F5 and F7 resolved; P1 (worker native-buffer witness) and P2 (predicate-appropriate demonstrations for relocated structural assertions) applied verbatim in revision 3, with the optional dispatch-guard citation correction; the review states no further cut review is needed for those exact patches."
    authority: "inst/design/ledgr_v0_2_3_spec_packet/macro_plan.md (accepted 2026-10-28) Section 3 WS1, Section 1 rules 2, 4, 5 and 6, and Section 4; inst/design/ledgr_roadmap.md 'One output handler (maintainer, 2026-10-20)'; inst/design/ledgr_v0_2_3_spec_packet/inventory_reconciliation.md rows C6, H6 and R3; inst/design/rfc/rfc_fold_execution_phase_ownership_v0_2_2_synthesis.md Sections 5.6 and 11 (the R3 obligation); inst/design/contracts.md rule groups contract-execution-fold-core and contract-execution-accounting-events; inst/design/manual/benchmark_methodology.qmd; dev/bench/v0_2_3_output_freeze/closeout.md (A0, three independent Codex reviews, final PASS)."
    source_table: "release/v0.2.3 at 5bd52cda. Two output handlers are injected into ledgr_execute_fold(execution, output_handler) (R/fold-engine.R:1573): ledgr_persistent_output_handler (R/backtest-runner.R:252-599, 21 methods, constructed at :793 for ledgr_run in audit_log or db_live mode) and ledgr_memory_output_handler (R/sweep.R:1982-2603, 27 methods, constructed at :1706 for ledgr_sweep); 19 method names are shared, 2 are persistent-only and 8 memory-only. The fold references 17 handler members; record_equity_fact and record_accounting_fact are reached through is.function() guards (R/fold-engine.R:584, :1370) and inline_summary and typed_events through guards in the sweep (R/sweep.R:1884-1891), while completion and diagnostics are called directly (R/sweep.R:1919-1920). The compiled spot-FIFO path admits a handler when ledgr_require_compiled_spot_fifo_dispatch() (R/compiled-spot-fifo.R:54-83) finds a callable append_compiled_spot_batch; the fold selects and calls that dispatch guard at R/fold-engine.R:1668-1669 and calls append_compiled_spot_batch directly at :1336. Both handlers duplicate the event column buffer, pulse fill staging, capacity growth and diagnostic sequence numbering. Fill cash and position deltas for row publication are computed in ledgr_fill_event_payload (R/backtest-runner.R:132-137) and again in ledgr_write_fill_events for db_live (R/ledger-writer.R:73-78); planner and fold state arithmetic (R/availability-economics.R:326-350, R/fold-engine.R:1382-1393) and the compiled batch's typed deltas are separate. The memory handler splits leg fees in record_accounting_fact. contract-execution-accounting-events says output handlers must not compute cash deltas. Direct constructor calls: 2 in R/, 38 in tests/ (14 in test-ledger-writer.R, 9 in test-risk-fold.R, 7 in test-sweep.R, 6 in test-execution-spec.R, 2 in test-research-cycle-scale.R), 1 in the active peer benchmark (dev/bench/peer_benchmark/peer_benchmark.R:702), plus historical dev/spikes and dev/bench records. Other test references: factory captures, mocked bindings, body inspections (LTB-0188) and an export pin in test-ledger-writer.R:207 and :293-307, test-risk-fold.R:412-458, test-availability-economics.R:1066-1086, test-corporate-action-recovery.R:157-160 and :202-207, test-api-exports.R:199. Handler-equality tests: test-sweep-parity.R, test-sweep-persistence-parity.R and test-availability-parity.R, which also carry promotion, reproduction, feature-warmup, metric-context, retention and recovery claims. A0 (dev/bench/v0_2_3_output_freeze/) records 8 workloads through both handlers with 17 failing corruptions; two of them (interrupted_telemetry, wf_warning) patch ledgr_persistent_output_handler and the memory corruptions reach handler state through environment(handler$events). A0's timing medians are descriptive (run/sweep ratio 1.47 on the 20x252 workload)."
    decisions: "Accepted by the maintainer with this cut on 2026-10-28. (1) WS1 changes no output: every A0 record stays byte-identical. The A0 harness may migrate only its attachment points: the memory observer a0_observe_memory(), the memory-state observation and mutation adapter used by the memory corruptions, and the attachment points of the interrupted_telemetry and wf_warning corruptions. The 17 corruption identities, injected changes, expected tables and messages, the control, canonicalization, fixtures and recorded bytes do not change, and no old-constructor alias is kept to make the harness work. (2) One metric difference between the handlers (for an INCOMPLETE run the sweep row reports annualized_return = 0 where the run's metrics report NA) is not fixed here; it is routed to macro WS7 (one result reader). Claude recommends NA there. A0's other documented differences (diagnostic retention, failure-ID wording, compiled assumptions) are sink policy or wording and stay as recorded. (3) Identity, per macro rule 5: snapshot content identity none; run configuration identity none; store format fingerprint none. Release impact, per macro rule 6: product tests and performance records; one NEWS line; no taught behavior, documentation or dependency change. (4) The documentation-roles RFC (rfc/README.md row documentation-roles-pin-reset) opens with this cut as its row requires; it has no ticket here. (5) Test migration is limited to: constructor invocations and their arguments; factory captures and mocked-binding names; the implementation owner inspected by structural source assertions; and the private-export pin. Fixtures, fault locations, expected conditions, numeric oracles and allocation bounds do not change. Each relocated structural assertion inspects the new owner of the operation and retains its original predicate and semantic claim. Demonstrate failure with a violation appropriate to that predicate: environment-held staging assignment for LTB-0188's forbidden-storage checks, loss of the required local staging write for its positive checks, a forbidden MAX(diagnostic_seq) query in the diagnostic owner, and a forbidden transaction or recovery operation in the memory owner. State owner relocation as the test-change reason; preserve fixtures, fault locations, expected conditions, numeric oracles and allocation bounds. Tests that compare the two handlers are retired only claim by claim (LDG-3131). (6) Historical dev/spikes and frozen dev/bench records are evidence and are not edited; the A0 harness and the active peer benchmark are maintained consumers and migrate. (7) Release evidence: the A0 records (dev/bench/v0_2_3_output_freeze/records) and this cut's timing record are the named heavyweight records."
    sequencing: "One workstream, serial tickets: LDG-3126 activates the packet; LDG-3127 freezes the timing protocol and measures the base tree; LDG-3128 fixes the sink boundary and the R3 contract sentence in writing; LDG-3129 discharges R3 (one publication delta computation, leg-fee projection) on the current handlers, before any handler replacement; LDG-3130 implements the single handler; LDG-3131 retires the mutual parity suite claim by claim; LDG-3132 verifies the final candidate, runs the timing gate and closes the workstream. Ticket dependencies bind."
    out_of_scope: "Execution-core consolidation and dense-mode removal (macro WS4); the result-reader merge and the INCOMPLETE annualized_return fix (macro WS7); the typed P3-P5 batch (macro WS8); planner, fold-state or compiled-batch arithmetic; compiled-envelope expansion, including admitting a DuckDB handler to the compiled path; any change to fold semantics, pulse order, fill timing, costs, state transitions or event meaning; new public API; schema, identity or persisted-format changes; changes to which diagnostics a sweep keeps; editing historical spike or bench records; weakening a test, timing threshold or oracle to obtain green."
    workstreams: [1]
    review_lifecycle: "An independent clean-context Codex cut review first challenges whether the sink boundary is the right seam, whether the ticket grain is honest and whether every gate can fail. The workstream receives one Type 1 close review that walks the seven optimization shapes over the shared handler and every moved sink or projection helper, checks A0 byte identity and the 17 corruptions, the enumerated test migrations, the claim-level retirement map, the final-candidate verification and the timing record. A Type 1 design concern returns NEEDS_TYPE_2. Finding-bearing reviews write a file in this packet; a third correction round stops for maintainer disposition."
  - id: 2
    name: "WS3 dense oracle and current-tree timing"
    cut: "2026-10-28"
    status: "closed"
    closed: "2026-10-30 by the maintainer, accepting workstream 3 after its independent Type 1 close review and focused confirmation (ws3_close_review.md: PASS after patches). The C1 prerequisite is discharged by accepted dense-oracle freeze cbf25359 and the accepted descriptive current-tree record at dev/bench/peer_benchmark/records/20261030-current-tree/. Product deletion remains macro WS4 and needs its own accepted cut. M1 accounting: nine independent verdicts over six completed tickets (1.500): five cut-level verdicts and four workstream-close verdicts; one CHANGES_REQUIRED and five PASS_AFTER_PATCHES verdicts changed specification, evidence boundaries, detectors, documentation or records, while three focused PASS verdicts confirmed the corrections. Maintainer decision turns chose the fresh peer harness and independent A0, accepted revisions 3.1 and 3.2, accepted workstream 2, and accepted workstream 3 with cut close. No ticket was added, dropped or padded for review accounting. The legacy-driver retirement and all-peers/report obligations remain open."
    accepted: "2026-10-30 by the maintainer, revision 3.2, after revision 3.1's independent Claude reviews and the post-Cut-4 focused review in cut_review_2_amendment.md (PASS after exact patches). Acceptance keeps the fresh peer harness/independent A0 direction and binds the descriptive-versus-paired timing boundary, live shared-host call and separate peer-suite/WS9 memory ownership. Implementation begins with LDG-3138."
    opening: >-
      Written by Codex at the maintainer's request, 2026-10-28. This cut owns
      only the accepted peer-suite synthesis's C1 prerequisite: a frozen exact
      dense oracle and ledgr's current-tree runtime baseline. It does not
      implement the rest of WS3. Cut 1 and its accepted tickets are unchanged.
      Accepted 2026-10-28: this entry, workstreams 2-3 and LDG-3133 through
      LDG-3138 are now the operative implementation brief. Implementation
      starts with LDG-3138; no implementation is claimed by this acceptance.
    cut_review: "Revision 3.1 green after reviewed patches. Initial review: CHANGES_REQUIRED in cut_review_2.md; F1-F8 addressed. Re-review: PASS_AFTER_PATCHES in cut_review_2_rereview_1.md. The maintainer then directed a fresh peer harness and independent A0. The direction review, cut_review_2_fresh_harness.md, returns PASS_AFTER_PATCHES: prior fixes retained; required N1 (implementer A0 invocation plus independent reviewer rerun) and N2 (plan-stage budget stop) applied verbatim, with no further Claude review required for those patches. Optional fixture/feature-map/reference-pointer precision added. The maintainer accepted revision 3.1 and N1's primary executor variant on 2026-10-28; cut 1 is unchanged. Revision 3.2 review: PASS_AFTER_PATCHES then focused PASS in cut_review_2_amendment.md; F1 binds the live shared-host call outside both clocks and F2 preserves separate peer-suite and WS9 memory ownership. Exact patches applied and accepted by the maintainer on 2026-10-30."
    revision: "3.2, accepted 2026-10-30 after the focused amendment review's exact F1/F2 patches and PASS confirmation."
    amendment: >-
      Accepted 2026-10-30 by maintainer direction after cut 4 closed. Cut 4
      established dev/bench/timing/ as the one shared mechanism for paired
      before/after regression gates and expressly left this cut's accepted
      five-process descriptive baseline and peer policies unchanged. This
      amendment therefore does not force the current-tree baseline through a
      two-arm ratio runner: its cold clock must still include external process
      launch and package import, which the paired harness performs before a
      workload starts. The WS3-specific driver is narrowed to those irreducible
      cold/warm lifecycle, phase-clock and exact-control duties. The WS3 driver
      loads dev/bench/timing/host.R by repository-relative path and calls that
      file's timing_host_probe() with dev/bench/timing/ as harness_dir; that
      shared function is the route that executes host.ps1. Host probes and
      calculation or verification of their commit/file identities occur
      outside both cold and warm timer intervals. The record names the harness
      commit and the identities of the actual host.R and host.ps1 bytes used.
      The driver does not copy, fork or reimplement either file, the parser, or
      any paired runner/checker. The declared descriptive host policy is
      applied to the shared observations. Every later same-engine before/after gate belongs
      to its receiving cut and uses one proportional protocol folder under
      dev/bench/timing/protocols/. The current-tree baseline is descriptive
      evidence, never an arm in such a ratio. Cross-engine peer clocks and the
      peer synthesis D8 per-row child-tree peak-memory records remain
      peer-suite work. Macro WS9's phase-level ledgr memory and worker
      baselines, budgets and final memory evidence remain WS9 work; this
      amendment changes neither owner.
    maintainer_direction: >-
      The maintainer directed a fresh harness and retirement of the old one
      once replaced, then explicitly confirmed that the peer harness is the
      replacement target and A0 remains independent. The new peer harness
      also supplies C1's dense regression reference. This dispositions the
      earlier budget/reuse dispute and authorizes a focused review of the new
      direction without resetting review counts. The later acceptance recorded
      above accepts this implementation cut; the construction direction alone
      did not authorize implementation.
    authority: >-
      inst/design/rfc/rfc_peer_benchmark_suite_v0_2_3_synthesis.md, accepted
      2026-10-28, D1-D11 and Sections 4-6, with Amendment 1 (fresh peer harness,
      independent A0, legacy peer-harness retirement); macro_plan.md WS3/WS4, rules 2/4/5/6;
      contracts.md#contract-execution-fold-core and
      #contract-execution-window-start; inst/design/manual/benchmark_methodology.qmd;
      inst/design/spike_protocol.md. tickets.yml alone sequences implementation.
    measured_input: >-
      Product source at c5b34a3c78d35c6cea2d0b78d601bba681dcaa1d on
      release/v0.2.3 has no textual R/src diff (generated binding line endings
      were already dirty). HEAD has since moved to 31c546b9 (dev/spikes only,
      no product diff). Before this cut, peer_suite_response/check.R was
      rerun: recorded CSVs reproduced and its transition-rule gut was detected.
      The 12x90 probe supplies current-path and warmup evidence, not timing or
      new peer parity. A0 already freezes cost/risk/state/refusal outputs,
      including existing compiled coverage. No new expected numbers are claimed.
    identity_and_release_impact: >-
      Snapshot content identity: none. Run-configuration identity: none.
      Store format fingerprint: none. No compatibility reader or package-runtime edit.
      Impact: tooling (open-cut evidence scan and focused tests), benchmark
      sources, public synthetic records and measurement
      documentation; update the benchmark README/manual and one NEWS line in
      this cut. No package dependency, public API or taught strategy change.
    scope_and_budget: >-
      New maintained sources live under dev/bench/peer_benchmark/dense/; full
      native oracle files under dense/oracles/<record-id>/, compact timing
      records under dev/bench/peer_benchmark/records/<record-id>/. Build a fresh
      peer harness: no source(), copied infrastructure, automatic invocation
      or private-handler dependency on either old harness. A historical
      strategy body may be retained verbatim as an attributed fixture.
      Use public ledgr execution/native facts and a new lossless recorder,
      checker and timing driver. At most four recipe families: seven fresh
      runnable configurations (six recipes/windows and one controlled
      cost/final-pulse case) plus three separate A0 reference controls.
      The normal 1500-line allowance is available to the new harness, counting
      all its R files, helpers and subprocess scripts. There is no 299/533-line
      inherited-code reserve. A0 stays a separately owned regression gate,
      not an imported or subprocess component of the new peer harness; no
      new logic may be hidden in A0 to evade the new harness's budget.
      LDG-3133 lists planned files, responsibilities and estimated sizes before
      implementation. No line packing. An LDG-3133 plan whose estimated sizes
      exceed the allowance stops there for maintainer disposition rather than
      mid-ticket. Stop/recharter at actual budget breach,
      unavailable native evidence, vacuous witness or unexplained difference.
    decisions: >-
      Full native records remain immutable. A0's harness, fixtures,
      canonicalization, records and WS1 migration allowance stay unchanged.
      A0 is not deprecated by this cut. Preserve its checks under their own
      authority rather than porting or weakening them to simplify peer work.
      New economic projections compare exactly by lossless identity, not
      all.equal or peer_equity_parity. Stamps, diagnostics, conditions and
      event order remain observed. This cut records today's dense and
      fact-bearing behavior; it does not accept a post-C1 timestamp/calendar,
      diagnostic or late-opening change. C1 owns each decided difference.
      No WS1 completion dependency is added: freeze/run on a named pre-change
      product revision, using a separate checkout if concurrent work requires
      it; never mix product revisions within a record. Existing timing methods
      and serialization contracts may inform the fresh implementation, but
      there is no executable dependency on A0 or LDG-3127. Deprecate the old
      peer driver only in the later replacement cut after equivalent/improved
      coverage and consumers are reviewed; old reports/records remain evidence.
      Cut 4's shared timing harness does not replace this cut's descriptive
      cold/warm baseline. The baseline reuses its host observation facilities
      by reference and contains no copied or competing paired-gate machinery.
      Later same-engine ratios use the shared harness in their receiving cuts.
      Cross-engine peer clocks and the peer synthesis D8 per-row child-tree
      peak-memory records remain peer-suite work. Macro WS9's phase-level ledgr
      memory and worker baselines, budgets and final memory evidence remain WS9
      work; this amendment changes neither owner.
    sequencing: >-
      Workstream 2: LDG-3138 -> LDG-3133 -> LDG-3134 -> LDG-3135, then independent Type 1
      close review before its records can discharge C1's oracle prerequisite.
      Workstream 3: LDG-3136 -> LDG-3137 after LDG-3135, then its own Type 1
      close review. Both accepted close reviews discharge this cut's C1
      prerequisite. Product deletion remains WS4 and needs its own accepted cut.
    workstreams: [2, 3]
    acceptance_record_requirement: >-
      Cut acceptance binds LDG-3138 to commit peer_suite_seed/ and
      peer_suite_response/ unchanged with their runners, checks and recorded
      evidence. Record the resulting SHA before LDG-3133 starts; historical source
      IDs in that evidence are not rewritten to the new commit. Until LDG-3138
      fixes selection, a zero-findings scan is not proof cut 1 was checked.
      This acceptance commit preserves the accepted synthesis with Amendment 1,
      companion RFC artifacts, both prerequisite probe directories and this
      cut's reviews. LDG-3138 verifies and records that commit before LDG-3133;
      committing this evidence does not complete its tooling/test work.
    out_of_scope: >-
      Peer installation/qualification or cross-engine timing, the remaining
      lanes, the Quarto renderer, process-tree memory sampling, WS9a memory
      baselines, handler/core/reader changes, the WS5 API migration, economics,
      new execution-mode branches, compatibility code, custom hash registries
      and any public speed/parity claim. None is a C1 prerequisite added here.
    review_lifecycle: >-
      Claude cut review first checks accepted requirement ownership (Type 1),
      then challenges workstream grain, dependencies, oracle and measurement
      boundaries (Type 2). Execution reviews are per workstream, not per batch.
      A design concern during Type 1 returns NEEDS_TYPE_2. Preserve findings
      and rejection reasons in this packet; a third correction round stops for
      maintainer disposition. Reviews are measured, never ratio-gated.
    release_gate_obligations:
      - id: "WS3-legacy-peer-harness-retirement"
        owner: "Maintainer until the final WS3 replacement/retirement cut takes ownership"
        status: "open"
        source: "Peer-suite synthesis Amendment 1"
        requirement: >-
          Inventory the legacy peer driver, commands and consumers; map each
          useful comparison/measurement to the new suite or an explicit
          reviewed retirement reason. Once the replacement is accepted,
          retire the old active peer commands and redirect maintained callers
          and documentation. Preserve historical reports/records and A0.
        gate: "Later suite replacement gate, not a C1 prerequisite. No retirement merely because the first dense runner exists; accepted cut 1's maintained-consumer duties remain intact meanwhile."
      - id: "WS3-all-peers-and-report"
        owner: "Maintainer until the remaining WS3 lane cuts take named ownership"
        status: "open"
        source: "Peer-suite synthesis D1/D5/D10 and Section 6 items 2-5"
        requirement: >-
          All six selected peers have a completed informative native row and
          reproducible provisioning; full-suite reruns follow WS4 and WS8;
          WS5 migrates recipe generation with economics checked; clocks/labels
          update the manual when first implemented; complete accepted suite
          and reproducible self-contained Quarto report precede external claims.
        gate: "Release-wide and publication gate, not cut-2 closure or a C1 prerequisite. Remaining lane work is uncut; this is ownership, not an executable implementation ticket."
  - id: 4
    name: "RNG reproducibility and cheap pulse seeds"
    cut: "2026-10-29"
    status: "closed"
    closed: "2026-10-30 by the maintainer, accepting workstream 11 after its Type 1 close review (ws11_close_review.md: PASS, no required finding). Identity: snapshot content none; seeded run configuration changes (engine.pulse_seed_rule); store format fingerprint changes by ledgr_pulse_seed_rule_version (ws11_disposition.md). Review count 11/7, recorded."
    accepted: "2026-10-29 by the maintainer, revision 3, after independent cut review (cut_review_3.md CHANGES_REQUIRED; cut_review_3_rereview_1.md PASS_AFTER_PATCHES, patches applied verbatim). Decisions (1)-(13) are accepted with the cut. Implementation has not started; LDG-3156 needs a quiet machine."
    amendment: "2026-10-29 by the maintainer, after acceptance. (a) Renumbered: the peer-suite branch codex/ws3-peer-oracle accepted its own cut 3 on 2026-10-28 with workstreams 4-10 and LDG-3139..3154, so this cut, accepted a day later as cut 3 with workstream 4 and LDG-3139..3144, became cut 4 with workstream 11; LDG-3139..3144 became LDG-3156..3161 in order. cut_review_3.md and cut_review_3_rereview_1.md keep their original names and IDs as history. (b) Shared timing harness: a read-only inventory found the paired before/after gate rebuilt per cut (about 15 pair-alternation copies, 14 checkers, 10 record formats), and the first LDG-3156 draft copied WS1's harness. New ticket LDG-3155 writes one fresh shared harness in dev/bench/timing/ that LDG-3156 and later regression gates use; the peer-suite session confirmed it has no generic two-tree gate, prefers this workstream to own the shared mechanics, and will adopt them only through its own cut amendment. LDG-3156 keeps its thresholds and matrix and now supplies only the cut-specific protocol folder. LDG-3157 (the design note) was written ahead of LDG-3156 by maintainer direction; it changes no product code."
    opening: "Written by Claude on 2026-10-29; revision 2 applies cut_review_3.md F1-F9 and the maintainer's three decisions of 2026-10-29. Combines macro WS2 (RNG reproducibility, inventory X1 absorbing H8) with C4 (cheap, versioned pulse-seed derivation), as macro plan Section 4 allows, plus two defects the RNG baseline probe found. The probe (dev/bench/v0_2_3_rng_baseline/, commits f16254ae and 403d9b1e) is the measurement step. This cut entry, its workstream claim and LDG-3156 through LDG-3161 become the operative implementation brief once accepted; tickets.yml is the sole ticket and sequencing authority. Type 2 at cut review because it deliberately changes seeded stochastic results and records a seed-rule identity change."
    cut_review: "Round 1: CHANGES_REQUIRED in cut_review_3.md (independent clean-context Codex): A0 changes economically, not by one field (F1); static widening refuses the taught recipe (F2); runtime state comparison is not certification and resume can evade it (F3); restoring .Random.seed and kind cannot restore a pending Box-Muller normal (F4); re-freezing from the candidate can bless a defect (F5); the timing checker needs a versioned threshold map (F6); the mixer gate can ignore the execution seed (F7); simulators, LSopt and exported surfaces were unowned (F8); old candidates could be promoted under the new rule (F9). Revision 2 applies F1 and F5-F9 and resolves F2-F4 by maintainer decisions (11)-(13). Round 2: PASS_AFTER_PATCHES in cut_review_3_rereview_1.md (independent clean-context Codex): F1-F9 resolved; P1 (oracle allowance attributes economic changes to kind pinning, RNG-neutral storage or the v2 pulse rule) and P2 (Windows and Linux golden-table execution) applied verbatim in revision 3, with optional items on the default-seed sentence, the article's sample.int recipe, an actual-draw resume/window witness and the classification count; the review states no further cut review is needed."
    authority: "inst/design/ledgr_v0_2_3_spec_packet/macro_plan.md (accepted 2026-10-28) WS2, the C4 bullet of WS4, Section 1 rules 2, 5, 6 and 7, Section 4; inst/design/ledgr_roadmap.md 'Pulse-seed hot path (maintainer, 2026-10-21)' and 'RNG reproducibility bug (2026-10-27)'; inventory_reconciliation.md rows X1, H8 and C4; dev/spikes/nmof-probe/probe_findings.md; dev/bench/v0_2_3_rng_baseline/findings.md and inventory.md; inst/design/contracts.md rule groups contract-strategy-reproducibility and contract-execution-fold-core; inst/design/horizon.md 'Cheap, versioned pulse-seed derivation' (promoted, H074); cut_review_3.md."
    source_table: "release/v0.2.3 at 5d6ca940. Seeding: ledgr_fold_envelope calls set.seed(as.integer(execution$seed)) without a kind (R/fold-engine.R:1629); the public simulators do the same (R/sim-bars.R:42, R/sim-pit-inputs.R:417); no file in R/ calls RNGkind; mirai daemons run L'Ecuyer-CMRG (R/parallel-workers.R:331), so the contract's recipe (withr::with_seed(ctx$pulse_seed, ...)) gives 38 trades with 1 worker and 40 with 2. Pulse seeds: ledgr_derive_pulse_seed (R/rng.R:33-57) hashes canonical JSON with SHA-256 on every decision-due pulse (R/fold-engine.R:766); about 160 us per call in context and 2.2-6.6% of seeded runs and sweeps on the WS1 fixtures, descriptive probe measurements under load_all; candidate and walk-forward seeds use ledgr_derive_seed once per candidate (R/sweep.R:1294, R/walk-forward-identity.R:97). Execution entry points default to seed = NULL; promotion uses the stored candidate seed, and both simulators default to seed = 1L (R/sim-bars.R:21, R/sim-pit-inputs.R:61). Caller RNG is saved and restored only when a seed is given (R/fold-engine.R:1615-1628, R/backtest-runner.R:386-399, R/sweep.R:157-174, R/walk-forward.R:99-114); ledgr_run(seed = NULL) and two-worker sweeps advance or create the caller's .Random.seed. Store writes: duckdb 2.0.0's nonempty dbAppendTable names a temporary view with sample(letters, 10, replace = TRUE), so appends inside a seeded fold draw from the fold's stream; ambient-RNG strategies diverge between ledgr_run and ledgr_sweep after the first checkpoint, and unseeded results change with checkpoint_every. Defect: ledgr_walk_forward(seed = NULL) aborts with ledgr_invalid_args. Version marker: sweeps carry seed_contract = ledgr_seed_v1 (R/sweep.R:469, :2179), copied into sweep persistence and promotion context (R/sweep-persistence.R:584, R/promotion-context.R:133); promotion runs a candidate's integer seed without checking its seed contract; committed runs carry no seed-rule version. A0's dense_risk_features fixture uses ctx$pulse_seed %% 2L (dev/bench/v0_2_3_output_freeze/fixtures.R:58-78), so a new pulse rule changes its economic outputs. Tests pin ledgr_derive_seed (tests/testthat/test-rng.R:12) and ledgr_seed_v1 (tests/testthat/test-sweep.R:549, :573, :755); existing parallel and promotion pulse_seed tests use modular arithmetic and never draw."
    decisions: "Accepted with the cut on maintainer acceptance. (1) RNG kind: the fold envelope and the public simulators set RNGkind('Mersenne-Twister', 'Inversion', 'Rejection') whenever they seed, and workers set it at start; the fold envelope is the enforcing point. Kind pinning alone preserves sequential results under R's default kind; RNG-neutral storage and the v2 pulse rule have their separately declared result changes; two-worker results change to match sequential; simulated inputs change only for callers whose session uses a non-default kind, and the content identity of an identical snapshot is unchanged. (2) Pulse-seed rule v2: the integer mixer measured by the probe (fmix32, xor with the pulse index, fmix32), or another rule frozen and reviewed in LDG-3157 before implementation, computed once per run as an integer vector over the run's absolute pulse axis and read by index; platform-independent arithmetic with every intermediate below exact-double limits; no per-pulse SHA-256 or JSON. One named seed-rule constant feeds sweep attributes, candidate provenance, committed-run configuration and validation; seed_contract becomes ledgr_seed_v2. ledgr_derive_seed and the walk-forward seed derivation version are unchanged. (3) Store writes are RNG-neutral: every ledgr-owned write that can consume R's RNG goes through one helper that preserves .Random.seed; the strategy and fold themselves are not wrapped. (4) Every exported entry point that can consume RNG, including wrappers, windows, ledgr_backtest and storage-facing APIs, saves and restores the caller's RNG for every seed value, on success, error and interrupt, with restoration outside all cleanup so worker stop and store closing happen first. (5) Restoration scope (maintainer decision 12): ledgr restores the caller's RNGkind and .Random.seed, or its absence; a pending Box-Muller normal variate is not part of that state and is not preserved; this limitation is documented. (6) ledgr_walk_forward(seed = NULL) works. (7) Identity, per macro rule 5: snapshot content identity none; run configuration identity changes for seeded runs (seed-rule version in configuration); store format fingerprint changes through the new seed-rule version constant; executable candidates and promotion inputs carry the seed rule and an old or missing marker is refused with a classed condition before a run is created, with no compatibility path; the private lake rebuild waits for the final freeze. (8) Oracles: the original A0 and RNG baseline records stay unchanged as history; each gets a separately named successor record recorded on the candidate, compared field by field against the original under frozen change predicates, with every other field required identical and every changed economic row causally explained by a named accepted change: kind pinning, RNG-neutral storage, or the v2 pulse rule; LDG-3157 freezes the affected rows and their cause, with no blanket economic-table allowance; fix-shaped guts are replaced by regressions that undo the shipped fixes. (9) One documented, executed recipe for stochastic strategies, with a seed-required guard. (10) Release evidence: the successor RNG baseline and A0 records and this cut's timing record are the named heavyweight records. (11) Ambient-RNG detection, both widening the static lists and runtime state comparison, is removed from this cut and from v0.2.3 WS2 and routed to the horizon (maintainer, 2026-10-29), because static widening refuses the taught with_seed recipe and runtime comparison cannot certify determinism or survive resume without its own design. (12) Restoration scope as in decision (5) (maintainer, 2026-10-29). (13) Simulators are pinned as in decision (1) (maintainer, 2026-10-29). (14) Caller-isolation boundary (maintainer, 2026-10-29, Type 2 checkpoint on ws2_rng_design_review.md F1, option B): ledgr restores the caller's RNG kind and state around its own work (store writes, seeding, worker start and stop) and around user code it evaluates as part of its service: strategies, indicator and feature callbacks, ranking or selection expressions such as ledgr_sweep_review's rank_by, and callables it returns for later use, which restore on their own calls (for example the test and test_dates functions of ledgr_indicator_dev). Ordinary argument promises and user-defined S3 methods that ledgr dispatches to are the caller's own code: their draws advance the caller's stream as if run directly, and this boundary is documented. Decision (5) is unchanged. (15) Argument evaluation (maintainer, 2026-10-29, ws2_rng_design.md Section 5.4 case A-1, option b): a wrapped export evaluates its ordinary arguments as its first step, before saving the caller's RNG state, so draws in arguments are the caller's own and advance the stream (two calls of ledgr_run(exp, seed = sample.int(1e6, 1)) get different seeds); captured service expressions such as rank_by and .filter are not forced early, and user S3 methods ledgr dispatches to after entry fall inside the restore. The same entry step applies to the helpers ledgr returns for the user to call (ledgr_indicator_dev()'s test and test_dates force their supplied arguments before saving; follow-up point B-1, maintainer 2026-10-29). (16) Callables ledgr builds and itself runs (maintainer, 2026-10-29, case A-2, option 1): the strategy returned by ledgr_signal_strategy() and the indicator function built by ledgr_adapter_r() are parts of ledgr's machinery and do not restore; a direct call by the user is the caller's own code. Decision (14)'s returned callables are only helpers built for the user to call, such as ledgr_indicator_dev()'s test and test_dates. (17) A0 clock field (maintainer, 2026-10-29, option A, raised by ldg3158_review.md Section 5): the A0 field walk_forward/wf_folds selected_at_utc comes from the wall clock (R/walk-forward.R, ledgr_normalize_ts_utc(Sys.time())) and was missed by the A0 harness's existing wall-clock exclusions (dev/bench/v0_2_3_output_freeze/lib.R), so the original checker fails on any later day even on the base. The LDG-3161 successor comparison adds exactly this field to the wall-clock exclusions, with a test that it is the only field added; the original A0 records and checker stay unchanged. Lesson recorded: a cut runs every oracle it relies on against the unchanged base before acceptance."
    sequencing: "One workstream. LDG-3155 writes the shared timing harness and passes its own review; LDG-3156 adds this cut's protocol folder on it and measures the base on a quiet machine; LDG-3157 fixes the design in writing and may proceed beside LDG-3155 and LDG-3156 because it changes no product code; LDG-3158 starts only after both LDG-3156 and LDG-3157; LDG-3158 pins the kind, isolates the caller's RNG, makes store writes RNG-neutral, fixes walk-forward and owns the NMOF LSopt gate; LDG-3159 replaces the pulse-seed rule with versioning and candidate validation; LDG-3160 updates contract, documentation and NEWS; LDG-3161 records the successor oracles, verifies the final candidate and runs the timing gate. Independent of cut 2 and of the peer-suite cut on codex/ws3-peer-oracle, which may run concurrently but pause during this cut's timing sessions."
    out_of_scope: "Ambient-RNG detection, static or runtime (decision 11, horizon); changing ledgr_derive_seed or candidate and walk-forward seed derivation; a compiled seed kernel; certifying ambient RNG for parallel or resume; preserving a pending Box-Muller normal; the peer suite (cut 2); any economic, fill, cost or state change other than the precisely declared effects of kind pinning, RNG-neutral storage and the v2 pulse rule; the INCOMPLETE annualized_return fix (WS7); compatibility readers or fallbacks for the old seed rule (pre-CRAN policy); rewriting the original A0 or RNG baseline records or cut 1's historical byte-identity claim; weakening a test, timing threshold or oracle to obtain green; migrating the peer-suite, baseline or test-profile timers onto the shared harness (their owners' own amendments); editing or moving WS1's timing directory or any historical bench record."
    workstreams: [11]
    review_lifecycle: "An independent clean-context Codex cut review challenges the design choices as Type 2, the ticket grain and whether every gate can fail. LDG-3157 is a manual design gate; if it leaves a Type 2 question open, implementation stops for a Type 2 checkpoint. LDG-3155 receives its own independent clean-context Codex review before LDG-3156 measures anything, because the shared harness becomes the gate instrument for later cuts. The workstream receives one Type 1 close review covering the successor oracles and their predicates, the isolation and RNG-neutrality witnesses, candidate validation, identity declarations, the seven shapes on touched hot paths and the timing record. A Type 1 design concern returns NEEDS_TYPE_2. Finding-bearing reviews write a file in this packet; a third correction round stops for maintainer disposition."
