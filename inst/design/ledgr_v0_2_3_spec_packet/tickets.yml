packet: "v0.2.3"
cuts:
  - id: 1
    name: "One output handler"
    cut: "2026-10-28"
    status: "open"
    accepted: "2026-10-28 by the maintainer, revision 3, after independent cut review (cut_review_1.md CHANGES_REQUIRED; cut_review_1_rereview_1.md PASS_AFTER_PATCHES, patches applied verbatim). The proposed decisions (1)-(7) are accepted with the cut."
    opening: "Written by Claude on 2026-10-28; revision 2 applies cut_review_1.md F1-F7 and revision 3 the re-review patches. The accepted v0.2.3 macro plan makes WS1 (one output handler) the first cut, after measurement step A0 froze today's native outputs of both handlers. This cut entry, its workstream claim and LDG-3126 through LDG-3132 are the operative implementation brief once accepted. tickets.yml is the sole ticket and sequencing authority. Implementation starts with LDG-3126."
    cut_review: "Round 1: CHANGES_REQUIRED in cut_review_1.md (independent clean-context Codex): A0 harness migration allowance too narrow (F1), constructor-only test migration impossible (F2), final tree not re-verified after R3 (F3), timing protocol incomplete (F4), R3 owned after its trigger and unscoped (F5), retirement by name only (F6), compiled-dispatch capability consumer omitted (F7). All seven applied in revision 2. Round 2: PASS_AFTER_PATCHES in cut_review_1_rereview_1.md (independent clean-context Codex): F1, F3, F4, F5 and F7 resolved; P1 (worker native-buffer witness) and P2 (predicate-appropriate demonstrations for relocated structural assertions) applied verbatim in revision 3, with the optional dispatch-guard citation correction; the review states no further cut review is needed for those exact patches."
    authority: "inst/design/ledgr_v0_2_3_spec_packet/macro_plan.md (accepted 2026-10-28) Section 3 WS1, Section 1 rules 2, 4, 5 and 6, and Section 4; inst/design/ledgr_roadmap.md 'One output handler (maintainer, 2026-10-20)'; inst/design/ledgr_v0_2_3_spec_packet/inventory_reconciliation.md rows C6, H6 and R3; inst/design/rfc/rfc_fold_execution_phase_ownership_v0_2_2_synthesis.md Sections 5.6 and 11 (the R3 obligation); inst/design/contracts.md rule groups contract-execution-fold-core and contract-execution-accounting-events; inst/design/manual/benchmark_methodology.qmd; dev/bench/v0_2_3_output_freeze/closeout.md (A0, three independent Codex reviews, final PASS)."
    source_table: "release/v0.2.3 at 5bd52cda. Two output handlers are injected into ledgr_execute_fold(execution, output_handler) (R/fold-engine.R:1573): ledgr_persistent_output_handler (R/backtest-runner.R:252-599, 21 methods, constructed at :793 for ledgr_run in audit_log or db_live mode) and ledgr_memory_output_handler (R/sweep.R:1982-2603, 27 methods, constructed at :1706 for ledgr_sweep); 19 method names are shared, 2 are persistent-only and 8 memory-only. The fold references 17 handler members; record_equity_fact and record_accounting_fact are reached through is.function() guards (R/fold-engine.R:584, :1370) and inline_summary and typed_events through guards in the sweep (R/sweep.R:1884-1891), while completion and diagnostics are called directly (R/sweep.R:1919-1920). The compiled spot-FIFO path admits a handler when ledgr_require_compiled_spot_fifo_dispatch() (R/compiled-spot-fifo.R:54-83) finds a callable append_compiled_spot_batch; the fold selects and calls that dispatch guard at R/fold-engine.R:1668-1669 and calls append_compiled_spot_batch directly at :1336. Both handlers duplicate the event column buffer, pulse fill staging, capacity growth and diagnostic sequence numbering. Fill cash and position deltas for row publication are computed in ledgr_fill_event_payload (R/backtest-runner.R:132-137) and again in ledgr_write_fill_events for db_live (R/ledger-writer.R:73-78); planner and fold state arithmetic (R/availability-economics.R:326-350, R/fold-engine.R:1382-1393) and the compiled batch's typed deltas are separate. The memory handler splits leg fees in record_accounting_fact. contract-execution-accounting-events says output handlers must not compute cash deltas. Direct constructor calls: 2 in R/, 38 in tests/ (14 in test-ledger-writer.R, 9 in test-risk-fold.R, 7 in test-sweep.R, 6 in test-execution-spec.R, 2 in test-research-cycle-scale.R), 1 in the active peer benchmark (dev/bench/peer_benchmark/peer_benchmark.R:702), plus historical dev/spikes and dev/bench records. Other test references: factory captures, mocked bindings, body inspections (LTB-0188) and an export pin in test-ledger-writer.R:207 and :293-307, test-risk-fold.R:412-458, test-availability-economics.R:1066-1086, test-corporate-action-recovery.R:157-160 and :202-207, test-api-exports.R:199. Handler-equality tests: test-sweep-parity.R, test-sweep-persistence-parity.R and test-availability-parity.R, which also carry promotion, reproduction, feature-warmup, metric-context, retention and recovery claims. A0 (dev/bench/v0_2_3_output_freeze/) records 8 workloads through both handlers with 17 failing corruptions; two of them (interrupted_telemetry, wf_warning) patch ledgr_persistent_output_handler and the memory corruptions reach handler state through environment(handler$events). A0's timing medians are descriptive (run/sweep ratio 1.47 on the 20x252 workload)."
    decisions: "Accepted by the maintainer with this cut on 2026-10-28. (1) WS1 changes no output: every A0 record stays byte-identical. The A0 harness may migrate only its attachment points: the memory observer a0_observe_memory(), the memory-state observation and mutation adapter used by the memory corruptions, and the attachment points of the interrupted_telemetry and wf_warning corruptions. The 17 corruption identities, injected changes, expected tables and messages, the control, canonicalization, fixtures and recorded bytes do not change, and no old-constructor alias is kept to make the harness work. (2) One metric difference between the handlers (for an INCOMPLETE run the sweep row reports annualized_return = 0 where the run's metrics report NA) is not fixed here; it is routed to macro WS7 (one result reader). Claude recommends NA there. A0's other documented differences (diagnostic retention, failure-ID wording, compiled assumptions) are sink policy or wording and stay as recorded. (3) Identity, per macro rule 5: snapshot content identity none; run configuration identity none; store format fingerprint none. Release impact, per macro rule 6: product tests and performance records; one NEWS line; no taught behavior, documentation or dependency change. (4) The documentation-roles RFC (rfc/README.md row documentation-roles-pin-reset) opens with this cut as its row requires; it has no ticket here. (5) Test migration is limited to: constructor invocations and their arguments; factory captures and mocked-binding names; the implementation owner inspected by structural source assertions; and the private-export pin. Fixtures, fault locations, expected conditions, numeric oracles and allocation bounds do not change. Each relocated structural assertion inspects the new owner of the operation and retains its original predicate and semantic claim. Demonstrate failure with a violation appropriate to that predicate: environment-held staging assignment for LTB-0188's forbidden-storage checks, loss of the required local staging write for its positive checks, a forbidden MAX(diagnostic_seq) query in the diagnostic owner, and a forbidden transaction or recovery operation in the memory owner. State owner relocation as the test-change reason; preserve fixtures, fault locations, expected conditions, numeric oracles and allocation bounds. Tests that compare the two handlers are retired only claim by claim (LDG-3131). (6) Historical dev/spikes and frozen dev/bench records are evidence and are not edited; the A0 harness and the active peer benchmark are maintained consumers and migrate. (7) Release evidence: the A0 records (dev/bench/v0_2_3_output_freeze/records) and this cut's timing record are the named heavyweight records."
    sequencing: "One workstream, serial tickets: LDG-3126 activates the packet; LDG-3127 freezes the timing protocol and measures the base tree; LDG-3128 fixes the sink boundary and the R3 contract sentence in writing; LDG-3129 discharges R3 (one publication delta computation, leg-fee projection) on the current handlers, before any handler replacement; LDG-3130 implements the single handler; LDG-3131 retires the mutual parity suite claim by claim; LDG-3132 verifies the final candidate, runs the timing gate and closes the workstream. Ticket dependencies bind."
    out_of_scope: "Execution-core consolidation and dense-mode removal (macro WS4); the result-reader merge and the INCOMPLETE annualized_return fix (macro WS7); the typed P3-P5 batch (macro WS8); planner, fold-state or compiled-batch arithmetic; compiled-envelope expansion, including admitting a DuckDB handler to the compiled path; any change to fold semantics, pulse order, fill timing, costs, state transitions or event meaning; new public API; schema, identity or persisted-format changes; changes to which diagnostics a sweep keeps; editing historical spike or bench records; weakening a test, timing threshold or oracle to obtain green."
    workstreams: [1]
    review_lifecycle: "An independent clean-context Codex cut review first challenges whether the sink boundary is the right seam, whether the ticket grain is honest and whether every gate can fail. The workstream receives one Type 1 close review that walks the seven optimization shapes over the shared handler and every moved sink or projection helper, checks A0 byte identity and the 17 corruptions, the enumerated test migrations, the claim-level retirement map, the final-candidate verification and the timing record. A Type 1 design concern returns NEEDS_TYPE_2. Finding-bearing reviews write a file in this packet; a third correction round stops for maintainer disposition."
review_gate:
  status: "retired"
  authority: "inst/design/rfc/rfc_governance_lifecycle_v0_2_2_synthesis.md Section 5, accepted 2026-10-14"
  accounting: "For each open cut, record once at cut close the independent verdicts over completed tickets; dropped tickets enter neither count. The ratio is measured, not gated."
  independence: "An invocation is one verdict at cut review, workstream close, focused re-review or final review from a session other than the implementing agent."
  findings_home: "A review returning findings writes a file in this packet named for its review point; its tickets.yml result holds verdict, link and one line on what changed."
  escalation: "A third correction round on one workstream stops for maintainer disposition."
sequencing: >-
  Each cut entry states whether its workstreams are serial or independent.
  Ticket dependencies bind within a workstream. tickets.yml is the sole
  sequencing authority.
review_obligations: >-
  Each workstream receives one Type 1 close review against its recorded claim.
  Work on fold, hydration, finalisation or result-reader paths walks, verbatim,
  the seven shapes in inst/design/manual/optimization_coding_style.qmd, The
  Seven Shapes And Their Replacements, and records an end-to-end timing.
  Hosted CI never uses wall clocks as a gate; the registered local host does.
workstreams:
  - id: 1
    name: "One output handler (macro WS1)"
    cut: 1
    status: "open"
    depends_on_workstream: null
    requires_review_acceptance: true
    review: {mode: "Type 1", point: "close of workstream 1", reason: "One claim joins LDG-3126 through LDG-3132: ledgr has one output handler whose storage differs only by sink (DuckDB audit_log, DuckDB db_live, memory) and whose shared mechanisms are not duplicated inside the sinks; every A0 record is byte-identical and all 17 corruptions still fail; fill-row publication deltas are computed once; the compiled path admits exactly the handlers it admitted before; no test oracle was weakened and every retired parity claim has matching coverage; the final candidate passes full tests and package check; and committed runs and sweeps meet the timing bound. The review reruns check.R and gut.R on the final candidate, reads every migrated test diff against the enumerated allowance, checks the claim-level retirement map, compares store bindings, walks the seven shapes over the handler and its sink and projection helpers, and audits the timing record and checker."}
tickets:
  - id: "LDG-3126"
    title: "Activate the v0.2.3 ticket authority"
    workstream: 1
    status: "complete"
    priority: "P1"
    effort: "S"
    dependencies: []
    scope: "Make the governance report treat inst/design/ledgr_v0_2_3_spec_packet/ as the current packet: change both default current_packet values in tools/governance-report.R (about lines 1445 and 1583, still ledgr_v0_2_2_spec_packet) and any test that pins the old default. Add a regression test showing that a malformed completed ticket in a v0.2.3 fixture is detected through each report entry point without a current_packet override. Record the documentation-roles RFC opening in its rfc/README.md row."
    acceptance: ["both report entry points default to the v0.2.3 packet, and the new regression test fails if either default is reverted", "the governance report exits with no structural finding on this cut", "the documentation-roles-pin-reset pipeline row names its next stage"]
    evidence:
      - "tests/testthat/test-governance-report.R#LTB-0514 (claim LCL-0505, commit eb51c156): governance_report() and governance_main() both report the malformed completed-ticket evidence of a fixture packet at the v0.2.3 path without a current_packet override; dev/governance_guard/default_packet_revert_demo.R shows the block passing unchanged and failing when either default is reverted (line 1445: input error, no tickets; line 1583: 4 failed expectations)."
      - "Empirical: input tracked design and governance population with the default packet; environment Windows 11 x64 with R 4.6.1; source commit eb51c156 plus this evidence update to tickets.yml; reproduction command Rscript tools/governance-report.R --root=<worktree>; reviewed range 07f91bcf..eb51c156; result exit 0 over 335 sources with zero findings sourced at inst/design/ledgr_v0_2_3_spec_packet/tickets.yml (no incomplete, malformed or empirical evidence-form finding for this cut); the 905 new structural findings are pre-existing header and link debt elsewhere, plus 79 unclassified_horizon_open because this packet has no horizon_open_classification.md (routed to the maintainer in the phase A report); clock 76.275 seconds wall; inst/design/ledgr_v0_2_3_spec_packet/tickets.yml."
      - "inst/design/rfc/README.md#documentation-roles-pin-reset (commit eb51c156): the row is Active, records its opening with Cut 1 decision (4) without a ticket, and names its next stage, a seed for the Type 2 page-role decision."
  - id: "LDG-3127"
    title: "Freeze the timing protocol and measure the base tree"
    workstream: 1
    status: "planned"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-3126"]
    scope: "Before any handler code changes, freeze and commit the timing protocol and runner: the complete workload and path matrix (the A0 timing workloads, the 20x252 workload and one larger dense workload chosen and named here, each through ledgr_run and ledgr_sweep), their inputs, seeds, candidate counts, retained result surface and clock endpoints. Each measurement is one fresh R process; base and candidate alternate in at least five pairs; both arms use the same declared untimed warmup and warm-snapshot policy; raw seconds are kept at full precision; the statistic is the ratio of medians per workload and path. The runner records both source trees (commit or source digest), toolchain and the actual inherited power plan and affinity (High performance, P-core mask 0xFFFF). A checker rejects missing, duplicate, non-finite or non-positive measurements, failed or incomplete executions where completion is expected and unexpected skips, and evaluates the 1.03 bound per cell; its failure on a missing row and on a ratio above 1.03 is demonstrated. No automatic retries. Then measure the base tree and report the committed-run versus sweep gap (inventory H6)."
    acceptance: ["the protocol, runner and checker are committed before any handler change", "the checker's failures on a missing row and on a ratio above 1.03 are demonstrated", "a base-tree record names commit, toolchain, verified power plan and affinity, the full matrix with raw seconds and the H6 gap per workload"]
    evidence: []
  - id: "LDG-3128"
    title: "Fix the sink boundary and the R3 contract sentence in writing"
    workstream: 1
    status: "planned"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-3127"]
    scope: "Write ws1_output_handler_design.md in this packet: every method of both handlers and every consumer (fold, ledgr_run, ledgr_sweep, walk-forward, ledgr_require_compiled_spot_fifo_dispatch(), tests, the A0 harness, the active peer benchmark) mapped to shared handler logic (event column buffer, pulse fill staging, capacity growth, status and completion bookkeeping, diagnostic numbering) or to a named sink capability (transaction and interrupt re-raise, durable append, db_live immediate write, diagnostic sequence seeding and post-rollback refresh, telemetry, strategy-state persistence, diagnostic retention policy, inline accounting and equity projections, typed events, compiled spot batch). For each capability and sink state whether the method exists, its return value, side effects and failure behavior; an unsupported capability is absent, never a callable no-op, so the compiled-dispatch guard admits exactly the handlers it admits today. State the constructor names, how the three storage modes are selected, how the A0 attachment points of decision (1) reach the new owners, and the identity statement of decision (3). Choose and state the R3 resolution: one canonical computation of fill-row publication deltas shared by the buffered, db_live and memory consumers, distinct from unchanged planner, fold-state and compiled arithmetic; leg-fee allocation as a projection of already resolved fee and lot quantities; and the contract sentence (either the code now satisfies the existing clause, or a row-materialization clarification that keeps the prohibition on resolving or reinterpreting economics in handlers)."
    acceptance: ["every method of both current handlers and every listed consumer has exactly one row in the mapping, including the compiled-dispatch guard", "every capability states existence, return, side effects and failure per sink, and no unsupported capability is a callable no-op", "the R3 computation, its scope boundary and the contract sentence are stated before implementation"]
    evidence: []
  - id: "LDG-3129"
    title: "Compute fill-row publication deltas once and name the leg-fee projection (R3)"
    workstream: 1
    status: "planned"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-3128"]
    scope: "On the current handlers, before their replacement, discharge the R3 part of the fold-phase synthesis Section 11 obligation as LDG-3128 decided: one canonical computation of fill-row publication cash and position deltas consumed by ledgr_fill_event_payload, ledgr_write_fill_events and the memory path; leg-fee splitting as a projection of resolved fee and lot quantities with unchanged operation order and bytes. Planner, fold-state and compiled arithmetic do not change. Apply the chosen contract sentence to contract-execution-accounting-events if one is needed. Add focused tests for BUY, SELL, fees and NO_OP rows and for the db_live writer's validation and transaction behavior. Record the R3 portion of the fold-execution-phase-ownership pipeline row as discharged by this ticket; its other consumers stay open."
    acceptance: ["one function computes fill-row publication deltas and all three publication consumers call it", "A0 check.R exits 0 and gut.R reports the control passing and all 17 corruptions failing", "the focused delta and db_live writer tests pass and fail when the shared computation is perturbed", "the contract clause and the code agree, and only the R3 portion of the pipeline row is closed"]
    evidence: []
  - id: "LDG-3130"
    title: "Implement one output handler behind DuckDB and memory sinks"
    workstream: 1
    status: "planned"
    priority: "P0"
    effort: "L"
    dependencies: ["LDG-3129"]
    scope: "Implement the design of LDG-3128: one handler with a DuckDB sink (audit_log and db_live) and a memory sink, sharing the duplicated mechanisms rather than renaming two implementations as sinks. Delete ledgr_persistent_output_handler and ledgr_memory_output_handler with no alias. Migrate the R/ call sites, the active peer benchmark and the tests within decision (5)'s allowance, and the A0 attachment points within decision (1)'s allowance. Add a negative test that a buffered DuckDB handler is refused by the compiled dispatch guard, and keep the positive memory and live-mode refusal tests. Add one NEWS line. Do not add a per-element loop over events, fills, diagnostics or pulses, and do not make every sink populate every representation."
    acceptance: ["A0 check.R exits 0 and gut.R reports the control passing and all 17 corruptions failing, each corruption shown to reach and alter its intended raw product surface", "ledgr_store_format_bindings() returns the same names and values as on the base commit", "the buffered DuckDB compiled-dispatch refusal test passes and the memory and live-mode tests still pass", "every migrated test diff stays within decision (5)'s enumerated allowance, and each relocated structural assertion is shown to fail on a violation of its own original predicate, as specified in decision (5)", "no reference to either deleted constructor remains in R/, tests/, the A0 harness or the active peer benchmark"]
    evidence: []
  - id: "LDG-3131"
    title: "Retire the mutual handler parity suite claim by claim"
    workstream: 1
    status: "planned"
    priority: "P1"
    effort: "M"
    dependencies: ["LDG-3130"]
    scope: "Inventory every test block in test-sweep-parity.R, test-sweep-persistence-parity.R and test-availability-parity.R: its distinct claims, and whether it is retained or retired. A retired claim needs the exact replacement assertions or A0 record tables with matching input conditions; a name alone is not enough. Keep the promotion-provenance, reproduction-key, non-default metric-context, candidate-varying feature and warmup, retention and recovery claims unless equivalent coverage is identified. Keep the finalization-failure recovery tests (test-availability-parity.R near lines 276 and 347) and the event-buffer growth test (test-ledger-writer.R near line 559), described as in-process. For worker-side evidence, require a named test that executes the production memory sink in a separate worker process and checks its native event columns and typed attributes, retained diagnostics and numbering, and completion against the same declared inputs in-process. Identify the worker execution and the asserted surfaces. Existing tests of public sweep rows or compact completion alone do not satisfy this requirement; add a focused worker test if no existing test covers these native surfaces. Demonstrate that changing a daemon-native event ID fails this witness even when public status and completion remain unchanged. Keep at least one cross-sink equivalence test that runs a persisted run and a sweep candidate with nonzero fills and compares event semantics."
    acceptance: ["a coverage map in this packet lists every test block in the three files with its claims, disposition and exact replacement with matching inputs", "the promotion, reproduction-key, metric-context, feature-warmup, retention and recovery claims remain covered", "the named worker-executed native-buffer witness covers those surfaces and detects the daemon-native event-ID corruption; a skip is missing evidence", "the retained cross-sink equivalence test executes nonzero fills and compares event semantics", "no retained test's assertion or oracle changed"]
    evidence: []
  - id: "LDG-3132"
    title: "Verify the final candidate, run the timing gate and close the workstream"
    workstream: 1
    status: "planned"
    priority: "P0"
    effort: "M"
    dependencies: ["LDG-3131"]
    scope: "On the final candidate, after all product and test changes, record its commit or source digest and rerun: full package tests, R CMD check --no-manual --no-build-vignettes, A0 check.R and gut.R, the deleted-constructor reference inventory, and the store binding comparison. Earlier evidence is reused only where its declared inputs are unchanged. A skip of a required recovery or worker witness is missing evidence. Then run the LDG-3127 runner and checker unchanged against base and candidate. Write a short workstream disposition with the identity and release-impact declarations of decision (3), the coverage map link, the timing record and open points for macro WS4 and WS7."
    acceptance: ["the final-candidate record names its digest and the exit code of each listed command, all passing", "the timing checker passes: every workload and path ratio of medians is at most 1.03, or that cell has an explicit, linked maintainer exception", "the H6 gap is reported before and after", "the disposition records snapshot, run-configuration and store-fingerprint identity as unchanged, with evidence"]
    evidence: []
