  - id: 10
    name: "Pulse inspection materialization"
    cut: "2026-11-03"
    status: "closed"
    closed: >-
      2026-11-03 after Workstream 22 completed and its independent review
      cycle ended PASS. Two independent verdicts were recorded over two
      completed tickets (1.000, measured rather than gated): the initial
      CHANGES_REQUIRED changed the timestamp detector and evidence provenance
