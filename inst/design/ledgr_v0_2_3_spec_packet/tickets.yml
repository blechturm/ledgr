  - id: 6
    name: "One execution path (macro WS4b)"
    cut: "2026-11-01"
    status: "accepted"
    accepted: "2026-11-01 by the maintainer, revision 4, after the independent clean-context cut review (cut_review_6.md: NEEDS_TYPE_2), the maintainer's Option B decision, the focused re-review (cut_review_6_rereview_1.md: PASS_AFTER_PATCHES) and the reuse-first evidence reconciliation. Decisions (1)-(9) are accepted with the cut. Implementation starts with LDG-3170 in workstream 14."
    revision: "4, applying cut_review_6.md RP1-RP10 and S1-S12 under the maintainer's 2026-11-01 Option B decision, cut_review_6_rereview_1.md P1-P12, and the maintainer's reuse-first disposition of P9"
    opening: >-
      Written by Codex on 2026-11-01 after Cut 5 merged at b5622f09 and the
      maintainer resolved WS4b's four bounded product choices and then chose
      Option B after the first independent cut review: fixed baskets adopt the
      canonical execution semantics rather than keeping a dense profile. This is the
      decision-bearing Type 2 spec cut authorized by macro-plan WS4b. It does
      not reopen the typed carrier: it makes every supported run prepare one
      execution substrate, routes that substrate through the accepted E and
      P1-P5 carrier, removes the old dense branch and records the first
      post-unification performance milestone. This entry, workstream 14 and
      LDG-3170 through LDG-3178 become operative only after maintainer
      acceptance. tickets.yml remains the sole sequencing authority.
    cut_review: >-
      Round 1: NEEDS_TYPE_2 in cut_review_6.md (independent clean-context
      Claude); the maintainer chose Option B on 2026-11-01 and revision 2
      applied RP1-RP10 and S1-S12. Round 2: PASS_AFTER_PATCHES in
      cut_review_6_rereview_1.md; P1-P8 and P10-P12 are applied in revision 3.
      The maintainer narrowed P9 in revision 4 after observing that it reran
      already accepted evidence: cut_6_evidence_reconciliation.md maps every
      decision to its existing source and leaves candidate-only checks to their
      tickets. No further cut review is required for this reduction in
      machinery or the exact remaining patches.
    authority: >-
      macro_plan.md revision 7, Section 1 rules 2, 4-6, 10-16, Section 2
      WS4a -> WS4b edge and Section 3 WS4b including the 2026-11-01 amendment;
      inst/design/contracts.md rule groups contract-execution-entry-points,
      contract-execution-fold-core, contract-execution-fold-carrier,
      contract-execution-window-start, contract-execution-walk-forward-folds,
      contract-execution-identity, contract-execution-compiled-accounting,
      contract-execution-decision-and-fill-contexts,
      contract-availability-activation-and-calendar,
      contract-availability-provider-and-timing,
      contract-availability-context-and-state, contract-availability-targets,
      contract-availability-affordability, contract-result-read-surfaces,
      contract-result-completion-and-valuation and
      contract-verification-store-and-codebase-gates;
      rfc/rfc_typed_fold_carrier_v0_2_3_synthesis.md Sections 3-5 and 8-9;
      dev/spikes/one_execution_mode/probe_findings.md and its checked evidence;
      Cut 2's accepted dense oracle, A0, and Cut 5's accepted final-candidate
      records; inst/design/manual/optimization_coding_style.qmd and
      manual/benchmark_methodology.qmd; dev/bench/timing/ shared harness.
    source_table: >-
      Base release/v0.2.3 at b5622f09. The accepted carrier is shared, but
      mode selection still reaches the hot path: availability_active occurs
      140 times across 14 production files, including R/fold-engine.R (45),
      R/backtest-runner.R (30) and R/run-snapshot.R (3),
      but the LDG-3170 census owns the complete literal and equivalent-predicate
      inventory rather than treating those three files as the whole surface.
      ledgr_execute_fold() derives the mode from a
      nullable provider, builds separate history readers, valuation state,
      static dense views, fast context and dense eligibility planes, and P1-P5
      branch on it. Dense coverage is a run-snapshot guard; availability uses
      declared sessions, provider decision views and valuation. The accepted
      one-execution-mode probe found equal economic results on complete dense
      fixtures but different fill timestamps, missing-bar behavior and a
      material availability-path floor; it identified the three decisions now
      resolved here. The exported ledgr_backtest() duplicates experiment and
      config construction, accepts raw data, and refuses availability-active
      snapshots; ledgr_run() already returns the same ledgr_backtest result
      handle. P5 serializes strategy state every pulse, reconciliation builds
      detail JSON on the success path, and availability refreshes context and
      valuation per pulse. Cut 5 records the final typed carrier and exact
      reference product; no Cut 5 timing threshold is inherited.
    decisions: >-
      Accepted by the maintainer in the 2026-11-01 WS4b design discussion and
      subject to this cut's independent review. (1) A fixed-basket snapshot
      with no sessions, membership, trading-status or lifetime facts derives a
      run-local bar-native pulse clock from its ordered distinct bar
      timestamps. It invents no venue open or close, changes no snapshot
      content, and next-pulse execution keeps the next bar timestamp. Declared
      sessions remain authoritative. The experiment plan and print, result
      summary() and print() disclose the substrate clock as implied bar-native
      or declared beside the price-basis disclosure. Membership,
      trading-status or lifetime
      facts without sessions still refuse; corporate-action evidence alone may
      use the bar-native clock. (2) The implied-clock input is strictly
      rectangular over the requested instruments and executable range. Any
      missing bar keeps the current dense coverage refusal before the fold,
      irrespective of holdings or prospective trades. Carry, skip, freeze and
      typed incomplete outcomes require declared sessions and their policies;
      no public coverage knob is added. (3) The exported ledgr_backtest()
      constructor is removed. ledgr_snapshot_from_df(), ledgr_experiment() and
      ledgr_run() are the sole data, experiment and single-run workflow. The
      ledgr_backtest result class, its methods and ledgr_run_open() remain in
      this cut. No ignored argument, alias or compatibility wrapper is kept.
      (4) The final pulse is observed and decided normally. Under next-pulse
      timing, a target requiring a later pulse posts no fill or accounting
      event, retains final strategy state and equity, and records one
      structured final_pulse_no_execution diagnostic for each affected
      instrument. It does not warn or refuse by default. A final target
      requiring no trade records no such diagnostic. (5) The diagnostic
      change is execution evidence, so
      ledgr_identity_rule_version becomes 5L before it can ship. New configs,
      run IDs, sweep IDs and walk-forward identities use rule 5. Rule-4
      artifacts receive no migration, fallback or compatibility reader: a
      rule-4 store refuses at open with ledgr_store_rebuild_required, and a
      rule-4 config, saved sweep object or walk-forward result held outside a
      store refuses at the existing identity validators. Snapshot content
      identity and the store schema version do not change; the store
      fingerprint changes through the identity binding. (6) One prepared
      substrate and one E/P1-P5 path are the
      invariant. Fixed-basket constants are compiled during preparation, not
      rediscovered with per-pulse mode branches. Optimizing a prepared constant
      plane is allowed; preserving a second dense fold, provider, context or
      guard path is not. A specialization keyed on a prepared constant must
      produce byte-identical carrier, evidence and results to the general path
      on the same input; LDG-3173 adds a witness that forces the general path
      on every fixed-basket fixture and compares, and a specialization that
      skips a canonical rule or evidence row fails it. (7) The shared timing
      harness and all peer-suite lanes are milestone evidence, not acceptance
      clocks, with LDG-3178's reuse rule for unchanged peer engines. Every result
      is reported, attributed and dispositioned; no threshold or oracle is
      weakened to obtain green. (8) Test migration may replace assertions
      naming deleted dense internals with assertions on the unified owner only
      when the same fixture, semantic oracle, fault boundary and failure
      sensitivity remain. An oracle changes only for a row of the frozen
      expected-difference record, in the ticket that owns that row, and the
      ticket evidence names the row and its cause. LCL-0300 and LTB-0306 are
      retired by LDG-3172, with LCL-0298 owning the data-start rule for every
      entry point; the overlapping_evidence notes at claims.yml LCL-0197 and
      its neighbor are edited in the same ticket. The short-admission tests
      move to the refusal oracle in LDG-3173. Other registered claims flipped
      by decision (9) are listed in the LDG-3170 census with their owning
      ticket. Removal of ledgr_backtest() deletes tests unique to
      that removed surface; their underlying execution and result claims must
      already exist on ledgr_run() or move there in the same ticket. Frozen
      oracle records (dense oracle cbf25359, A0 and its Cut 3 successor, and
      the real-data reference) are never edited. LDG-3170 writes one WS4b
      difference record naming, per workload and table, the only admitted
      differences: config_hash and config-derived IDs (rule 5), removed
      LEDGR_LAST_BAR_NO_FILL conditions, added final_pulse_no_execution rows,
      and decision (9). Every other cell stays identical. The dense-oracle gut
      final_pulse_warning_suppressed is replaced by a gut suppressing the typed
      row. A0's run_db_live fixture migrates only its attachment to
      ledgr_experiment(execution_mode = "db_live") plus ledgr_run() with the
      same inputs, and LDG-3170 proves the base record stays byte-identical.
      The peer driver's internal-oracle lane
      (peer_run_ledgr_internal_oracle) migrates its attachment to the
      prepared-substrate constructor in LDG-3176, or is retired there once its
      replacement coverage is accepted, so LDG-3178's peer rerun excludes no
      lane silently. The RNG baseline probe is history: its records stay
      unchanged and it is not rerun.
      Real-data controls reseal candidate snapshot stores from source and pin
      the unchanged snapshot content hash. (9) A fixed basket is a
      full-membership, always-tradable, never-stale instance of the canonical
      prepared execution substrate. It adopts the declared-session path's
      history-from-data-start rule, continuous carry semantics, affordability
      reconciliation, supported-target boundary (new or enlarged shorts
      refuse), typed completion and corporate-action failures, segmented
      feature engine, common strategy context and helper eligibility, fold
      equity source and explicit non-finite valuation refusal. It does not
      retain a dense policy profile or a stage-time mode switch. The compiled
      spot-FIFO capability is restated as no declared sessions and no runtime
      fact families. The now-constant ctx$availability_active field is removed
      from the public strategy context; helpers stop reading it, and the
      context contract, first-pulse state wording and examples change in
      LDG-3173. Each changed dense result is a named row of the
      expected-difference record; declared-session results do not change.
      Each row has one owner and a positive fixed-basket witness: history from
      data start and continuous carry, LDG-3172; common ctx, empty-target rule,
      eligible-only helpers and the new/enlarged-short refusal
      (ledgr_short_exposure_unsupported), LDG-3173; affordability rejection
      (insufficient_cash with its reconciliation row), the decision trace,
      reconciliation and completion evidence, the corporate-action INCOMPLETE
      stop, the fold-record equity source and the explicit non-finite refusal
      (ledgr_config_non_finite), LDG-3174.
    identity_and_release_impact: >-
      Snapshot content identity: unchanged
      (ledgr_snapshot_content_hash_rule_version stays 4). Run/configuration
      identity: rule 4 -> 5, intentionally changing config-derived run, sweep
      and walk-forward IDs. Store format fingerprint: changes, because
      ledgr_identity_rule_version is a store-format binding
      (R/store-gate.R:3-12). Every store written before rule 5, including
      sealed snapshot stores, refuses at open with
      ledgr_store_rebuild_required; snapshots are resealed from their sources
      with unchanged content hashes. Store schema version: unchanged. Public
      surface: ledgr_backtest() removed; the result class stays. Persisted
      evidence: final-pulse warnings become structured diagnostics, and fixed
      baskets gain the common decision, affordability, completion and state
      evidence described by decision (9). Fixed-basket feature-engine and
      walk-forward outputs may change only through that decision. Release
      impact: R code, tests, contracts, reference/help/vignettes, NAMESPACE,
      one NEWS entry, benchmark records and identity fixtures. No dependency
      change and no migration.
    sequencing: >-
      One serial workstream. LDG-3170 freezes the current-base semantic,
      deletion and measurement controls. LDG-3171 builds the common prepared
      substrate and implied-clock/coverage rules. LDG-3172 routes every run,
      sweep, walk-forward, promotion and pulse-inspection preparation through
      it. LDG-3173 removes P1/P2 mode branching and consolidates context and
      valuation services. LDG-3174 unifies final-pulse P3-P5 behavior and bumps
      identity rule 5. LDG-3175 removes ledgr_backtest(). LDG-3176 removes the
      remaining dense path and its owners. LDG-3177 removes the named per-pulse
      floor without changing retained evidence. LDG-3178 runs every oracle,
      the milestone measurements, contracts/docs and closes workstream 14.
      Dependencies bind; no deletion precedes its replacement and detector.
    pre_acceptance_gate: >-
      Complete. cut_6_evidence_reconciliation.md maps every Cut 6 decision to
      accepted dense-oracle, A0, Cut 5, one-execution-mode, contract and
      registered-test evidence. No design question lacks input, so macro rule
      10 forbids replaying those workloads merely to accept this cut. Exact
      candidate differences, real-data comparison, strict-TTR remeasurement,
      timing-arm execution and milestone clocks remain with LDG-3170 through
      LDG-3178, where a candidate exists and the checks can fail. A product
      change after b5622f09 requires a focused input-delta check rather than an
      automatic full replay.
    out_of_scope: >-
      Redesigning the accepted carrier or lot book; changing the canonical
      declared-session rules for membership, lifetime, trading status,
      valuation, corporate actions, affordability, fills, costs, risk or
      accounting; fixed-basket economics change only through the rows of
      decision (9) recorded in the expected-difference record; a public
      missing-data or clock policy knob; inferred exchange calendars; an
      intraday session model beyond preserving arbitrary ordered bar pulses;
      renaming or deleting the ledgr_backtest result class; WS5 flat ctx and
      typed declared state; WS6 frame retirement; WS7/WS8 readers, replay,
      schema 125 and accounting JSON; worker batching; a compiled default;
      peer-harness redesign; compatibility code; weakening an oracle, detector
      or timing record.
    workstreams: [14]
    review_lifecycle: >-
      A fresh Claude CLI cut review first verifies decisions (1)-(9) against
      code, contracts, Cut 5 and the one-execution-mode evidence, then
      adversarially challenges ticket grain, dependencies, identity, deletion
      witnesses and whether every acceptance item can fail. Implementation
      begins only after maintainer acceptance. Workstream 14 receives one Type
      1 close review over the final candidate, the seven optimization shapes,
      cold readability of the surviving core, exact oracles, deletion census,
      identity refusal, documentation and both milestone records. A design
      concern returns NEEDS_TYPE_2; finding-bearing reviews get a packet file;
      a third correction round stops for maintainer disposition.
