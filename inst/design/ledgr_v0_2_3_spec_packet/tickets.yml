    cut_review: >-
      CHANGES_REQUIRED in cut_review_9.md (independent clean-context Claude
      Opus Type 1 plus ticket-grain challenge): F1-F2 and F4-F9 require bounded
      ownership, detector, expected-difference, migration and record patches;
