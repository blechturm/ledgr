      test-migration rule. This cut entry, workstreams 12 and 13 and LDG-3162
      through LDG-3169 become the operative implementation brief once accepted;
      tickets.yml is the sole ticket and sequencing authority. The cut is
      Type 1 against the synthesis and Type 2 on ticket grain and gates.
