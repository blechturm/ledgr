      cut_review_9_rereview_1.md returned PASS_AFTER_PATCHES with five bounded
      ownership and record patches; those patches were applied. A final fresh
      Claude Opus focused confirmation returned PASS with no further finding.
    authority: >-
      inst/design/rfc/rfc_context_frame_retirement_v0_2_3_synthesis.md,
      accepted 2026-11-03, Sections 1 and 4-7; its Type 1 final review and
      maintainer acceptance; macro_plan.md rules 2, 4-6, 10-16, amended rule
      17 and WS6;
      Cut 7 LDG-3190's flat-layout handoff; contracts.md rule groups
      contract-context-pulse-data, contract-context-feature-resolution,
      contract-context-prepared-views, contract-context-inspection,
      contract-strategy-reproducibility and
      contract-documentation-strategy-context, plus
      contract-strategy-decision-axis for the accepted reason-vocabulary
      routing; optimization_coding_style.qmd.
      Accepted RFC choices are not reopened here.
    measured_input: >-
      The durable response probe at e3bb4cec reports the two old view builders
      absent and the current inspection helpers present. At its 600-instrument,
      three-feature shape it records about 423 microseconds for P2's frame
      block versus 1.8 microseconds for primitive binding, about 487
      microseconds for an on-demand bars frame, 171 microseconds for a flat
      feature matrix, 60-223 milliseconds for ledgr_pulse_features() and about
      850 milliseconds for ledgr_pulse_wide(). These clocks are descriptive,
      not gates. A separate unpreserved session A/B observed roughly 5-7% run
      wall savings; the synthesis correctly makes no whole-run speed claim.
      Source inspection at 74015f96 finds P2 constructing bars_current,
      features_current and features_wide_current, the synthesis's 35 direct
      test-constructor calls plus current product definition/call sites, direct
      maintained benchmark uses of ctx$features_wide, and stale contract/manual
      references.
    decisions: >-
      Accepted synthesis semantics govern. Spec-cut calibration is resolved as
      follows. (1) Workstream 20 owns one coherent runtime claim: one frozen
      primitive lookup feeds flat reads and both inspection helpers, and P2
      stores no current bar, long-feature or wide-feature frame. Workstream 20
      also rewrites the tests its removal breaks; workstream 21 migrates
      maintained non-test consumers, contracts and teaching and closes
      integrated evidence. The peer recipes already read flat columns (Cut 7);
      only the shared benchmark grid migrates, outside the field-removal
      ticket. (2) Reuse the existing private .pulse_lookup rather than adding
      a carrier. Its bars member becomes a named list of atomic aligned OHLCV
      columns, never a data frame. Keep universe, availability, position_facts,
      feature_lookup and feature_vector; add only projection_idx, cutoff_num
      and readable_feature_names as the prepared ordinal, numeric cutoff and
      once-prepared readable-name set. Existing positions, cache, counts and
      alignment members remain unchanged. Private spelling has no public
      guarantee. (3) Detect eager frames with
      counted constructor witnesses on a real run; detect inspection shape
      regressions by rejecting nested instrument-by-feature loops, rbind,
      repeated growth, per-row timestamp formatting and repeated ID scans in
      the two helpers and every package function they call; detect
      readable-name rebuilding by counting preparation and
      repeated reads; detect an explicit-map memo by forbidding persistent
      assignment/cache state anywhere in that call closure and mutating in a
      last-map reuse branch. Runtime value/parity tests remain the semantic
      oracle. (4) The targeted refusal template is: "`ctx$<name>` is retired;
      read flat named columns for current-pulse values, use
      `ledgr_pulse_features()` or `ledgr_pulse_wide()` for current-pulse
      inspection, and use `ledgr_history_frame()` for causal history." The
      condition classes are API; exact prose is guidance and is not pinned.
      (5) Maintainer decision 2026-11-03: Cut 9 preserves the current
      `target_restricted` history-selection reason. Restoring more specific
      current-axis restriction subtypes requires a focused availability/history
      disclosure decision and is routed to the `availability-follow-ups` RFC
      pipeline row; it is not inferred from context-frame retirement.
    identity_and_release_impact: >-
      Snapshot content identity, store format fingerprint, result schema and
      execution/accounting semantics do not change. No compatibility alias,
      migration or fallback is added. Rewritten strategy and benchmark-grid
      source receives ordinary new configuration/source identity; targets,
      fills and public results remain equal, with source identity the only
      allowed peer-oracle difference. Public context surface removes four
      experimental names and retains the two exported inspection helpers. The
      cut changes R, tests, contracts, reference, internal manuals, maintained
      benchmark source and NEWS; no dependency change is planned.
    sequencing: >-
      Two serial workstreams. Workstream 20 freezes the source/evidence matrix,
      then atomically removes eager frames and rebases both inspection helpers
      on the primitive lookup. Workstream 21 migrates maintained consumers,
      contracts and teaching, then reruns integrated parity and package gates.
      LDG-3194 -> LDG-3195 -> LDG-3196 -> LDG-3197 binds the order. The product
      switch stays in one ticket so no commit leaves the helpers without their
      data source. Cut 9 has no merge or runtime dependency on the withdrawn
      Cut 8; the numbering gap is intentional.
    out_of_scope: >-
      A ledgr_pulse_bars() helper; generic frame/layout DSL; feature-matrix
      successor; callback-grade performance contract for inspection helpers;
      manifested-frame cache; context persistence or serialization; hashing,
      sealing, database queries or provenance inside P2/helpers; history-panel
      semantics; external-helper preflight; WS7/WS8 result/accounting work;
      restoring current-axis restriction subtypes in
      `ledgr_history_frame()`'s `admissibility_reason` (the Cut 7 handoff now
      routed to `availability-follow-ups` for a focused decision);
      deletion of the synthesis-named general accessors
      (`ledgr_feature_accessor()`, `ledgr_feature_bundle_accessor()` and
      `ledgr_features_wide()`) reserved for WS14a; re-recording the frozen peer
      oracle; store, snapshot or result-format changes.
    workstreams: [20, 21]
    review_lifecycle: >-
      A fresh clean-context Claude CLI cut review first challenges necessity,
      ticket grain, calibration decisions and whether every synthesis duty has
      one owner and a failing gate. Each workstream receives one independent
