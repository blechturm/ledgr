project:
  render:
    - "vignettes/*.qmd"
    - "vignettes/articles/*.qmd"

format:
  html:
    theme: cosmo
    code-copy: true

execute:
  echo: true
  # Warnings are part of the teaching record. Suppress one only on a chunk
  # whose prose explains why that warning is irrelevant to its lesson.
  warning: true
  freeze: false

# `message` is a knitr chunk option, not a Quarto execute option, so it is set
# here; under `execute:` it is silently ignored. This keeps package attach and
# masking messages out of every article.
knitr:
  opts_chunk:
    message: false
