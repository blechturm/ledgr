    oracle_independence: "The block removes the field from persisted config JSON, recomputes the historical hash, reopens through the public API, and rereads the stored bytes."
    smallest_failing_change: "Normalize a missing corporate_actions field to the research preset during config validation or run reopen."
    cheapest_adequate_lane: "One tiny real run and reopen is the smallest detector for persistence-time default injection; store creation keeps it in review."
    overlapping_evidence: "LCL-0027 proves new identity behavior but cannot observe historical stored config bytes or reopen semantics."
  - id: "LCL-0029"
