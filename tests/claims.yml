    oracle_independence: "The expected values are produced by the retained pre-cut scalar resolver one label at a time; the structural counter wraps that resolver independently of the vector helper."
    smallest_failing_change: "Restore scalar per-label resolution, alter an offset sign, or collapse an ambiguous or nonexistent wall time into one instant."
    cheapest_adequate_lane: "One 20-date family spanning leap day and spring DST plus six adversarial labels; fast, because the 10,473-date benchmark carries long-horizon parity and Linux CI runs the same semantic block."
    overlapping_evidence: "The existing DST tests pin the public errors for one ambiguous and one nonexistent time but do not compare all resolved rows or detect scalar iteration."
  - id: "LCL-0146"
    source: "Cut 2 LDG-2944"
    scope: "Membership resolution preserves complete-set, later-change and set-less precedence"
    oracle_class: "literal results and evidence IDs across unsorted partial, complete, later and earlier-dated set-less assertions, including before-first and unknown requests"
