  - id: "LCL-0209"
    source: "Cut 11 LDG-2983 (finding F1)"
    scope: "The availability results plane reads positions from one ledger replay and equals replaying the ledger up to each recorded time"
    oracle_class: "exact equality with the per-time replay at every recorded time"
    detecting_blocks: ["LTB-0209"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "F1: ledgr_backtest_availability_active() and ledgr_backtest_availability_dense() replayed the whole ledger from the database once per pulse. Results readers must be byte-identical to the per-time replay while doing one read and one replay."
    oracle_independence: "The reference is the retained per-time reader ledgr_availability_positions_asof(); the run trades on most pulses and disposes a delisted holding."
    smallest_failing_change: "Read positions after the last event before a time instead of at or before it, use cumulative sums instead of the replay's sequential positions, or drop instruments without an event yet."
