  - id: "LCL-0022"
    source: "Equity-settlement synthesis: section 3.7"
    scope: "Compiled spot-FIFO rejects every non-FILL pulse event before accounting"
    oracle_class: "negative witness"
    detecting_blocks: ["LTB-0026"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A completed pulse plan must not lose an economic event when the compiled arm handles only fills."
    oracle_independence: "The test injects three event kinds into the completed plan without using the production kind predicate."
    smallest_failing_change: "Remove the envelope guard, narrow it to CASHFLOW, or let either accounting arm read pulse_plan directly."
    cheapest_adequate_lane: "One tiny in-memory fold per table row exercises the real dispatch boundary in the fast lane."
    overlapping_evidence: "LCL-0006 proves compiled fill parity but contains no non-FILL event."
  - id: "LCL-0023"
    source: "Equity-settlement synthesis: sections 3.2 and 3.8"
    scope: "Corporate-action facts are validated, sealed, identity-bearing, and runtime-inert"
    oracle_class: "invariant and negative witness"
    detecting_blocks: ["LTB-0027", "LTB-0028", "LTB-0029"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Vendor-neutral corporate-action evidence must retain only validated terms, survive schema migration, move snapshot identity, and not activate availability by itself."
    oracle_independence: "The tests construct canonical rows directly, inspect persisted DuckDB state, compare snapshot hashes, migrate a schema-115 store, and query activation without using an adapter or settlement policy."
    smallest_failing_change: "Accept one unvalidated term, copy a missing clock, weaken a provenance tier, omit the new table from hash identity or migration, or add the family to availability activation."
    cheapest_adequate_lane: "Tiny two-instrument snapshots cover constructor, storage, identity, migration, and activation in the fast lane."
    overlapping_evidence: "LCL-0017 covers existing availability fact persistence; LCL-0018 pins rule-1 snapshot identity, but neither knows this fact family."
  - id: "LCL-0024"
    source: "Equity-settlement synthesis: section 3.8, gate case 1"
    scope: "A vendor-neutral fictional adapter produces the canonical sealed facts"
    oracle_class: "cross-implementation parity"
    detecting_blocks: ["LTB-0030"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "The canonical fact contract must be usable without a Sharadar package symbol, source field, or conversion formula."
    oracle_independence: "The expected family is hand-constructed while the adapter translates differently named fictional columns and codes before both outputs are sealed."
    smallest_failing_change: "Reference a forbidden vendor token or mistranslate one fictional code, field, clock, term, validation flag, or provenance value."
    cheapest_adequate_lane: "Two two-row snapshots prove exact family and sealed-hash parity in one fast block."
    overlapping_evidence: "LCL-0023 proves the canonical constructor and seal; it does not prove an independently shaped adapter can satisfy them."
  - id: "LCL-0025"
    source: "Equity-settlement synthesis: section 4"
    scope: "Declared bar price basis prevents distribution double counting before execution"
    oracle_class: "negative witness and identity assertion"
    detecting_blocks: ["LTB-0031"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Distribution-adjusted execution bars must never combine with ledgr settlement, while a split-adjusted declaration or its absence remains readable in experiment identity."
    oracle_independence: "The test constructs four sealed snapshots from the same bars, varies facts and the public declaration independently, and inspects construction outcomes without running a strategy."
    smallest_failing_change: "Admit distribution_adjusted, condition refusal on corporate-action facts, drop the declaration from experiment identity, or accept an unknown basis."
    cheapest_adequate_lane: "Four tiny two-instrument snapshots exercise the public seal and experiment-construction boundary in one fast block; no completed run or result artifact is needed."
    overlapping_evidence: "LCL-0023 seals corporate-action facts and LCL-0024 proves adapter neutrality; neither declares the economic basis of the bars or detects double counting."
