    smallest_failing_change: "Restore equity equal to cash, multiply positions and closes positionally, drop supplied previous state, accept initial_cash, reveal state contents, or validate previous state differently from the fold."
    cheapest_adequate_lane: "One tiny two-instrument run and two public snapshots cover the real callback boundary without a sweep, availability fixture or large store, so the detector belongs in fast."
    overlapping_evidence: "Existing pulse-context tests protect accessors and existing opening-position tests protect accounting; neither compares an interactive snapshot with the first dense fold pulse or carries previous state into inspection."
  - id: "LCL-0095"
