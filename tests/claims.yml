    oracle_class: "literal values and condition classes or messages for concrete, rebuilt-identical, reordered, unresolved, tampered, swapped-alias, unknown-feature, character and non-map inputs, plus validation and lookup-call counters"
    detecting_blocks: ["LTB-0141"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A run-local bundled accessor reuses any successfully resolved explicit map only for identical content. Non-identical and failed inputs clear the memo, and malformed maps retain their conditions."
    oracle_independence: "Values come from the literal Workstream 7 projection; invalid objects are modified independently after construction; counters wrap the retained full validator and common explicit-map resolver."
    smallest_failing_change: "Use set equality instead of identical() and reordered output is wrong; retain a failed map and a counter falls; restore concrete-only memoization and equal character maps resolve repeatedly; restore ledgr_feature_id() after full validation and the validation count rises."
    cheapest_adequate_lane: "One two-by-two in-memory projection and ten map shapes; fast, because the repeated validation was the measured dominant cost."
    overlapping_evidence: "The paired current-tree benchmark proves exact public run and sweep outputs and materiality at 500 by 1,260; this block protects the memo boundary and error behavior."
  - id: "LCL-0142"
    source: "Cut 2 LDG-2941"
    scope: "Canonical ledgr SMA and returns preserve exact values and missingness on their declared required field"
    oracle_class: "literal per-window means and returns over seven gap shapes under explicit no-carry and default carry, a hostile 1,200-row floating-point witness and a short history"
    detecting_blocks: ["LTB-0142"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "SMA remains bit-identical to mean(window$close); only close gates either built-in, so an open, high or low gap leaves values unchanged; default carry fills SMA inputs but never returns inputs; explicit no-carry keeps the strict values. Required-field admission and default carry replaced the all-OHLC mask under historical projection synthesis v12 Sections 5-6 (Cut 16 LDG-3066)."
    oracle_independence: "Every expected value is rebuilt with one base mean or ratio per window from the literal close vector, carried inputs are rebuilt with collapse::na_locf, and the 1,200-row case proves rowMeans(embed()) changes summation semantics."
    smallest_failing_change: "Use rowMeans(embed()) for SMA, admit on all price fields or let returns consume a carried close; LTB-0142 fails (source-copy mutations, Cut 16 LDG-3066)."
    cheapest_adequate_lane: "One twelve-row series in seven gap shapes under two policies, one seeded 1,200-row arithmetic witness and a short history; fast, because exact construction over an in-memory substrate rather than a public workflow is the load-bearing semantic boundary."
    overlapping_evidence: "The paired public record covers exact run and sweep surfaces at 50 instruments by 500 pulses; it does not localize a one-bit feature or mask change."
  - id: "LCL-0143"
    source: "Cut 2 LDG-2941"
    scope: "Built-in certification recognizes only canonical identities and computes them with the package constructor's functions"
    oracle_class: "certification classes for five definitions, a tampered built-in claim and a per-segment call counter"
    detecting_blocks: ["LTB-0143"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Canonical SMA and returns are certified and computed with their constructor functions; definitions imitating a built-in id, params or source label stay custom and use their own functions; a definition claiming a built-in identity never executes replaced functions."
    oracle_independence: "Five separately constructed definitions fix the expected certification classes; the impersonator changes its function while keeping the tempting id, params and source, and the tampered claim replaces both functions with code that stops."
    smallest_failing_change: "Certify without matching the claimed canonical identity or compute a certified definition with its own functions; LTB-0143 fails (source-copy mutations, Cut 16 LDG-3066)."
    cheapest_adequate_lane: "Five definitions over twelve bars; fast, because it observes the exact internal dispatch boundary without a timing threshold."
    overlapping_evidence: "LTB-0142 proves values and masks; the source-fork benchmark proves scale and public parity but cannot prove excluded families never enter the vector helper."
  - id: "LCL-0144"
    source: "Cut 2 LDG-2941"
