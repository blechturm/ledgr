    oracle_independence: "The expected maps are the literal sma_2 and sma_3 resolutions requested by the two-row feature grid; environment identity is observed at the run-local preparation boundary."
    smallest_failing_change: "Hoist and reuse the first prepared object across candidates; the second alias map is absent and the prepared environments are identical."
    cheapest_adequate_lane: "One six-pulse, one-instrument, two-candidate sweep; review, because it exercises the real candidate lifecycle."
    overlapping_evidence: "LTB-0139 proves one factory prepares once; it does not cross a candidate boundary."
  - id: "LCL-0141"
    source: "Cut 2 LDG-2939"
