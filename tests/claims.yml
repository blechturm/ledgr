    cheapest_adequate_lane: "One five-pulse public run covers the disputed axis and both missing and observed branches; a unit helper cannot prove which prepared feature values reach a real strategy context."
    overlapping_evidence: "Existing strict-window tests protect venue closures, ordinary missing bars and source parity, while lifetime tests protect trading and terminal restrictions; none previously combines lifetime facts with an asserted feature value."
  - id: "LCL-0094"
