  - id: "LCL-0039"
    source: "Equity-settlement synthesis section 3.4; LDG-2814"
    scope: "DISPOSITION is a first-class canonical-R accounting event with lossless schema migration and exact FIFO lot consumption"
    oracle_class: "literal accounting replay and destructive schema-migration witness"
    detecting_blocks: ["LTB-0050"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A modeled terminal disposition must move cash, remove the position and every live lot, realize model P&L through canonical FIFO, reject subtype leakage, and preserve existing ledger rows while admitting only the new event kind."
    oracle_independence: "Literal opening lots and expected cash, position and realized values are checked through both the fold-facing plan and the independent accounting replay; an old two-kind DuckDB table is constructed directly before migration."
    smallest_failing_change: "Treat DISPOSITION as cash-only, leave one live lot, compute realization outside FIFO, admit a subtype field, omit DISPOSITION from the CHECK, or recreate the table without copying its old row."
    cheapest_adequate_lane: "One in-memory plan/replay and one in-memory DuckDB migration exercise the complete core contract without a sealed snapshot or public run."
    overlapping_evidence: "LCL-0023 protects accounting-core parity for FILL and CASHFLOW; it neither admits DISPOSITION nor proves exact lot exhaustion or the schema migration."
  - id: "LCL-0040"
