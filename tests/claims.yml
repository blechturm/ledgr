    oracle_class: "literal dense and availability feature-engine digests, literal built-in fingerprints and source membership for every new semantic helper"
    detecting_blocks: ["LTB-0144"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Every helper capable of changing strict cached values participates in the availability engine digest; the dense engine and public indicator fingerprints stay unchanged."
    oracle_independence: "The expected digests are computed from the full function payload, while the source membership assertions independently fail if one helper is omitted from that payload. Literal engine and public-indicator fingerprints are asserted outside covr, whose tracing deliberately changes closure bodies."
    smallest_failing_change: "Change any helper hashed into the availability feature-engine identity; LTB-0144's literal fails (observed under every Cut 16 LDG-3066 source mutation of those helpers), while the dense literals stay fixed."
    cheapest_adequate_lane: "Pure fingerprint construction with no snapshot; fast, because provenance changes are deterministic and independent of execution scale."
    overlapping_evidence: "Existing fingerprint stability tests pin the public indicators and older cache helpers; they predate the strict vector helper set."
  - id: "LCL-0145"
    source: "Cut 2 LDG-2943"
