    oracle_independence: "Expected members, reasons and evidence IDs are literal consequences of four deliberately unequal facts and three headers supplied out of order."
    smallest_failing_change: "Choose the first complete set, fail to seed the earlier ID, order set-less facts with sets by date, or drop the later partial change."
    cheapest_adequate_lane: "Four in-memory facts and five requested instruments; fast, because it isolates the full precedence contract without persistence."
    overlapping_evidence: "Existing inspection tests distinguish complete omission from unknown and exercise intervals separately; they do not combine all precedence cases."
  - id: "LCL-0147"
    source: "Cut 2 LDG-2944"
