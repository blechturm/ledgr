  - id: "LCL-0132"
    source: "Cut 23 LDG-2917"
    scope: "ledgr opens a store the user holds open with their own DuckDB connection"
    oracle_class: "two committed runs against a store while a connection with its own instance settings holds it open, read back through that connection; DuckDB's real settings-mismatch refusal and three errors that are not one, handed to the join"
    detecting_blocks: ["LTB-0132"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "On duckdb 1.5.6, which ledgr requires, a driver whose instance settings differ from those of a database already open in the session is refused, so while a user held their own connection to a store with different settings, every ledgr open of that store failed. ledgr now joins the open instance through DuckDB's registry, only when every refused setting is one of the storage directories ledgr sets, so the join never creates an instance and a read-only or other mismatch still fails. It returns no driver, because the registry's driver is the user's and shutting it down would unregister their database; ledgr can therefore join again. It does not suppress DuckDB's messages (Persistence Contract). The runs commit, read back, and are visible through the user's connection, which stays valid."
    oracle_independence: "The block opens the user's connection with its own storage directories under the session's temporary directory, so the refusal happens on every platform, and checks the runs through that connection, not through ledgr."
    smallest_failing_change: "Returning to the old failure instead of joining (1 error), joining on any refusal whatever settings it names (2 failures), dropping the check for DuckDB's refusal phrasing (2 failures: an error that only names a storage setting is joined and creates a file), returning the registry's driver so ledgr shuts it down (1 error: the second run cannot open the store), or suppressing messages around the join's driver (1 failure)."
    cheapest_adequate_lane: "One small temporary store and one tiny run; fast, because every open takes this path."
    overlapping_evidence: "The two resume tests in test-runner.R hold their own connection the same way, unregistered; LTB-0131 covers opens and lifetimes of ledgr's own connections."
