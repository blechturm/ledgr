    oracle_independence: "The block builds separate bars-only and fact-bearing runs, then compares the derived object and captured public output with literal expected values."
    smallest_failing_change: "Collapse not_supplied into none, admit a fifth fidelity value, hide the undeclared basis, change one identity, omit one field, or render a zero as unavailable."
    cheapest_adequate_lane: "Two tiny durable runs are required to prove the public result boundary; repeated snapshot and run setup belongs in review."
    overlapping_evidence: "LCL-0027 binds policy identity and LCL-0023 binds fact activation, but neither observes ordinary run output or fidelity."
  - id: "LCL-0030"
    source: "Equity-settlement synthesis: section 3.4, gate cases 2, 3, 11, and 12"
    scope: "The cash plan binds entitlement once and emits exactly one identified event under the selected clock"
    oracle_class: "exact unit oracle and temporal negative"
