    oracle_independence: "Namespace spies count the old row-payload seam and the canonical and timestamp helpers over two independently sealed populations differing tenfold."
    smallest_failing_change: "Restore a per-row slice, timestamp conversion or JSON encoding inside the fact-payload construction used by rule 4."
    cheapest_adequate_lane: "Twenty and two hundred facts expose row-proportional calls without putting a scale benchmark into the ordinary suite. Moved to review by Cut 11 LDG-2981 to restore fast-profile headroom; the protected shape is structural and its materiality belongs to the maintained benchmarks."
    overlapping_evidence: "LCL-0035 covers in-memory family preparation; it never reads the persisted DuckDB tables used by rule-4 snapshot identity."
  - id: "LCL-0038"
    source: "Cut 6 Workstream 14, LDG-2822"
    scope: "The full snapshot adapter validates one fact bundle while standalone ingest and persistence boundaries still fail closed"
    oracle_class: "exact call count and independently corrupted input"
    detecting_blocks: ["LTB-0047"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "A public seal must not recompute the same row-wise bundle assertion three times, and private boundary reuse must not let unvalidated bundles cross standalone entry points."
    oracle_independence: "A namespace spy counts the complete public path; a separately corrupted bundle is passed directly to ingest and to a CREATED snapshot persistence boundary."
    smallest_failing_change: "Pass the raw bundle from the adapter to either helper, or make either helper unwrap without validating an ordinary facts object."
    cheapest_adequate_lane: "One small quarantine seal and one CREATED store exercise all three boundaries; real DuckDB state places it in review."
    overlapping_evidence: "LCL-0037 bounds rule-4 fact rendering calls but cannot detect repeated bundle assertions before persistence."
  - id: "LCL-0039"
    source: "Equity-settlement synthesis section 3.4; LDG-2814"
    scope: "DISPOSITION is a first-class canonical-R accounting event admitted by the current schema with exact FIFO lot consumption"
    oracle_class: "literal accounting replay and destructive schema-migration witness"
    detecting_blocks: ["LTB-0050"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A modeled terminal disposition must move cash, remove the position and every live lot, realize model P&L through canonical FIFO, reject subtype leakage, and be the only additional event kind admitted by the current schema."
    oracle_independence: "Literal opening lots and expected cash, position and realized values are checked through both the fold-facing plan and the independent accounting replay; the current table constraint is exercised directly."
    smallest_failing_change: "Treat DISPOSITION as cash-only, leave one live lot, compute realization outside FIFO, admit a subtype field, or omit DISPOSITION from the current CHECK."
    cheapest_adequate_lane: "One in-memory plan/replay and one in-memory DuckDB migration exercise the complete core contract without a sealed snapshot or public run."
    overlapping_evidence: "LCL-0023 protects accounting-core parity for FILL and CASHFLOW; it neither admits DISPOSITION nor proves exact lot exhaustion or the schema migration."
  - id: "LCL-0040"
    source: "Equity-settlement synthesis sections 3.3 and 3.4; gate cases 4 and 6"
    scope: "Terminal mark policy distinguishes bounded permissible marks, explicit expired marks and a typed no-mark stop"
    oracle_class: "policy-bound state-transition and no-mutation witness"
    detecting_blocks: ["LTB-0051"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "last_mark may use an expired finite reference only by explicit opt-in and must record its age, while the research preset must turn a missing qualifying mark into a typed terminal_mark_unavailable stop signal, never an abort, before appending an event or mutating account state (LDG-2955)."
    oracle_independence: "The block supplies literal valuation planes separately from the plan, snapshots the complete account state before refusal, and observes emitted rows independently through a handler spy."
    smallest_failing_change: "Use the permissible mark for last_mark, hide the source age, fabricate a missing price, append before validation, or mutate cash, positions or lots before the refusal."
    cheapest_adequate_lane: "Direct plan execution isolates the policy boundary and avoids a full availability run; the broader public-path case belongs to the fourteen-case gate."
    overlapping_evidence: "LCL-0039 proves the accounting operation after a mark is chosen; it does not choose among current, stale, expired and unavailable marks."
  - id: "LCL-0041"
    source: "Equity-settlement synthesis sections 3.4 and 3.5; LDG-2815"
    scope: "Acquisition composition reports the contractual comparison without crediting a supplied leg beside modeled disposition proceeds"
