    scope: "Terminal mark policy distinguishes bounded permissible marks, explicit expired marks and intentional no-mark refusal"
    oracle_class: "policy-bound state-transition and no-mutation witness"
    detecting_blocks: ["LTB-0051"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "last_mark may use an expired finite reference only by explicit opt-in and must record its age, while the research preset must refuse a missing qualifying mark before appending an event or mutating account state."
