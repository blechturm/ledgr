    oracle_independence: "The block replaces quantmod::getSymbols with a known xts object, then inspects the independently sealed snapshot metadata under both the omitted and explicit-NULL arguments."
    smallest_failing_change: "Restore a NULL default, fail to forward the resolved default, or ignore an explicit NULL override."
    cheapest_adequate_lane: "Two five-row network-free seals are the smallest public adapter-boundary detector; optional quantmod and DuckDB setup place it in review."
