    smallest_failing_change: "Make a chunk non-executing, replace either preset, change the research default, stop posting cash, stop refusing strict mode, or leave the rendering stale."
    cheapest_adequate_lane: "Reading two small text artifacts is sufficient continuously because the public execution is recorded in the rendered sibling and independently covered by LTB-0036."
