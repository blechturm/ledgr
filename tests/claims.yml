  - id: "LCL-0034"
    source: "LDG-2819 schema ceremony"
    scope: "Schema creation and validation prepare catalogue state once without weakening migration or damage detection"
    oracle_class: "bounded-call integration and structural boundary witness"
    detecting_blocks: ["LTB-0039", "LTB-0040", "LTB-0041"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A current store must avoid repeated schema creation work, while validation still detects out-of-band damage and old or unmarked stores still migrate instead of taking the shortcut."
    oracle_independence: "The blocks trace DBI calls at the public schema functions, mutate the persisted version marker and both migration-owned and create-owned required tables, and inspect the source boundary independently of the catalogue helpers."
    smallest_failing_change: "Restore a catalogue query inside a per-table loop, execute DDL for a current marker, weaken the exact-version predicate, skip an older marker, silently recreate a create-owned table under a current marker, remove validation from a caller, or move the marker write before the migration failure point."
    cheapest_adequate_lane: "Two in-memory catalog traces, one tiny persisted migration and source inspection directly cover the regression without a run or sealed market-data fixture."
    overlapping_evidence: "Existing schema tests cover individual damage and migrations but neither bound catalogue calls nor prove that the reopen shortcut depends only on the exact stored version."
  - id: "LCL-0035"
    source: "Cut 6 Workstream 14, LDG-2821"
    scope: "Set-wise fact preparation preserves canonical identity, duplicate outcomes and constructor error precedence"
