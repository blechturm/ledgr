    smallest_failing_change: "Writing through `buffer_event()` before the pulse flush, reversing the staged rows, shifting any one staged column, or replaying an empty flush changes a literal count or exact row comparison."
    cheapest_adequate_lane: "Two in-memory handlers, one in-memory DuckDB database and two fill intents; fast, because this is the ordinary canonical fill-write boundary."
    overlapping_evidence: "The fill-event block spike compares public run and sweep surfaces at scale; the existing growth tests cover direct `buffer_event()` writes but not pulse staging or pre-flush invisibility."
  - id: "LCL-0136"
    source: "Cut 2 LDG-2935"
    scope: "The fold calls the pulse-event flush once per pulse rather than once per fill"
    oracle_class: "independent counters around the production memory handler's fill-write and pulse-flush methods during a three-pulse, two-fill fold"
    detecting_blocks: ["LTB-0136"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A three-pulse fold invokes `flush_pulse_events()` exactly three times while writing two same-pulse fills, the events remain ordered AAA then BBB, and a two-pulse run publishes fills produced on its final processed pulse."
    oracle_independence: "The expected flush count is the literal three-entry pulse fixture; the expected write count and order come from the strategy's two named targets."
    smallest_failing_change: "Moving the flush before event production drops the final-pulse rows, moving it inside the per-fill loop or omitting no-fill pulse flushes changes the counter, and dropping it empties the event surface."
    cheapest_adequate_lane: "One internal three-pulse fold with the production memory handler; fast, because it proves call placement without a timing threshold."
    overlapping_evidence: "LTB-0135 proves handler staging and ordering; it does not prove where or how often the fold invokes the flush."
  - id: "LCL-0137"
    source: "Cut 2 LDG-2935"
    scope: "A second-fill exception publishes no durable prefix and cannot contaminate a later sweep candidate"
    oracle_class: "a real public run and two-candidate sweep under a one-shot second-fill failure, with durable status and ledger counts read from DuckDB and the surviving candidate compared with a separate reference sweep"
    detecting_blocks: ["LTB-0137"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "When the second fill in one pulse fails, `ledgr_run()` records FAILED with zero ledger rows for the invocation; in a sweep the failed candidate retains its error class and the next candidate's semantic result is identical to an isolated reference candidate."
    oracle_independence: "The injected failure counts calls to the retained lot kernel, durable rows are queried directly, and the unaffected candidate is compared with a separately executed one-candidate sweep."
    smallest_failing_change: "Running the durable fold outside its transaction preserves the first appended row after the second-fill exception; sharing staged rows across handlers or candidates changes the successful candidate's registered output."
    cheapest_adequate_lane: "One three-pulse, two-instrument snapshot; review, because it opens a public durable run and executes three sweep candidates."
    overlapping_evidence: "Existing transaction tests cover one invalid direct insert and ordinary candidate failures; neither fails after an earlier valid fill in the same pulse."
  - id: "LCL-0138"
    source: "Cut 2 LDG-2936"
    scope: "Durable diagnostic sequence allocation is initialized once per handler and then advanced in memory"
    oracle_class: "a pre-existing durable diagnostic at sequence seven, two subsequent diagnostic blocks, a count around the sequence initializer, and a source guard against a MAX query inside the handler"
    detecting_blocks: ["LTB-0138"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A new or resumed persistent handler reads the next durable diagnostic sequence once, emits later blocks as one contiguous ordered sequence, and does not rescan prior diagnostics for each block."
    oracle_independence: "The expected sequences and reason order are literal values derived from a durable row at seven and independent blocks of two and one rows; the query counter wraps the dedicated initializer rather than the writer under test."
    smallest_failing_change: "Calling the initializer for each of the two blocks changes the count from one to two; restoring the inline MAX query makes the handler source guard fail."
    cheapest_adequate_lane: "One in-memory DuckDB handler and three appended rows; fast, because the long-window clock already established materiality and this block protects exact behavior and query shape."
    overlapping_evidence: "The file-backed long-window probe measures the removed query shape at scale; availability resume tests protect broader persisted semantics but do not count sequence scans."
  - id: "LCL-0139"
    source: "Cut 2 LDG-2938"
    scope: "Scalar and bundled feature accessors prepare run-local lookup state once"
    oracle_class: "literal scalar and bundled values, literal conditions, counters around preparation, alias normalization and singular resolution, and source assertions for hashed membership inside both returned accessor closures"
    detecting_blocks: ["LTB-0139"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "One run-local context factory prepares instrument, universe and feature-ID indexes and its active alias map once; availability reuses the immutable alias-and-ID name table while rebuilding its changing axis membership; scalar reads resolve one authored name, while bundled reads consume their already-resolved concrete IDs directly."
    oracle_independence: "Expected values come from a literal two-instrument matrix and failures name literal invalid inputs; counters wrap preparation, normalization and singular resolution, while source assertions independently require prepared-environment reads and reject `%in%` in either returned accessor closure."
    smallest_failing_change: "Shift an instrument row, restore old `%in%` membership, send each already-resolved bundle ID through singular resolution, rebuild the name table per availability pulse, restore alias normalization there, or build separate prepared states for ctx$feature and ctx$features."
    cheapest_adequate_lane: "A two-by-two in-memory projection; fast, because every feature-reading strategy takes this path."
    overlapping_evidence: "The current-tree WS7 benchmark covers public run and sweep parity at 500 by 1,260; this block protects exact call behavior and construction shape."
  - id: "LCL-0140"
    source: "Cut 2 LDG-2938"
    scope: "Prepared feature lookup state is owned by one sweep candidate"
    oracle_class: "two real sequential sweep candidates with different resolved active alias maps and distinct prepared environments"
    detecting_blocks: ["LTB-0140"]
    promised_profile: "review"
    owner: "maintainer"
