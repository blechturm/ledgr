    overlapping_evidence: "dev/bench/v0_2_2_real_data_continuity group wfgap records the pre-cut PARTIAL session with a delisting in the gap and the flat_test_state invariance arm."
  - id: "LCL-0205"
    source: "Cut 11 LDG-2980"
    scope: "Rerunning an interrupted walk-forward resumes its unfinished test run and reproduces the uninterrupted session; finished test runs are reopened, not re-executed"
    oracle_class: "exact fold, selection and test-equity digest against an uninterrupted reference session, plus unchanged run telemetry stamps"
    detecting_blocks: ["LTB-0205"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "After Cut 10 an interrupted test run is FAILED, and ledgr_walk_forward_run_or_open() opened every existing run with ledgr_run_open(), which refuses non-DONE runs, so the rerun failed that fold. Walk-forward, Test-run resume: DONE and INCOMPLETE test runs are opened, any other existing run resumes through the ordinary run path, and a configuration mismatch refuses with ledgr_run_hash_mismatch."
    oracle_independence: "The reference is the same session on its own copy of the data without the interrupt; the resumed session must equal it exactly and the reference test equity must move."
    smallest_failing_change: "Open every existing test run, rerun DONE test runs, or resume a run without its stored configuration check."
    cheapest_adequate_lane: "Three walk-forward sessions over six months of two instruments; review, because each session runs a sweep per fold."
    overlapping_evidence: "dev/bench/v0_2_2_real_data_continuity groups wfresume and invariance11 record the same over a full year."
  - id: "LCL-0206"
    source: "Cut 11 LDG-2991"
    scope: "Window and precompute boundaries on the first or last sealed date resolve to that session; dates outside the range refuse and name it"
    oracle_class: "exact resolved timestamps, condition classes and message text"
    detecting_blocks: ["LTB-0206"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Stop S1 of the 1998-2026 Sharadar run: fold boundaries at UTC midnight on the snapshot first date were refused because the sealed range starts at the first close, and the refusal did not name the range. Walk-forward, Sealed-date boundaries: compare by calendar date, resolve first- and last-date boundaries to the sealed start and end, keep in-range boundaries as given, and name the range when refusing."
    oracle_independence: "Resolved timestamps are the fixture's literal first and last session closes; in-range boundaries are the literal inputs."
    smallest_failing_change: "Compare full timestamps again, clamp boundaries already inside the range, or drop the range from the message."
    cheapest_adequate_lane: "One availability snapshot and window and precompute range construction; fast."
    overlapping_evidence: "dev/bench/v0_2_2_real_data_continuity group bounds runs a full walk-forward from the first date."
  - id: "LCL-0207"
    source: "Cut 11 Workstream 21 close-review correction"
    scope: "A resumed row with no ledger event posts its configured opening positions before execution"
    oracle_class: "exact opening CASHFLOW count, positions value and status after resuming empty CREATED, RUNNING and FAILED rows"
    detecting_blocks: ["LTB-0207"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Opening-position events were written only when is_resume was false, so a row left CREATED, RUNNING or FAILED before its opening append resumed with no opening positions; LDG-2980 made this reachable from walk-forward, whose carried test runs open with positions. Persistence Contract, Early exit: such a row posts its opening positions before execution."
    oracle_independence: "Positions values are the literal opening quantity 5 times the fixture closes 10 to 13; the opening CASHFLOW count is one."
    smallest_failing_change: "Post opening positions only on a first attempt, or skip them whenever the row already exists."
    cheapest_adequate_lane: "Three four-bar dense runs and resumes; review, to keep the fast lane under its bound."
    overlapping_evidence: "LTB-0205 covers a FAILED walk-forward test run that already committed its opening and part of its fold."
