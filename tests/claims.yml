    oracle_class: "identity mutation and negative witness"
    detecting_blocks: ["LTB-0032"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "New experiments must resolve a closed policy whose versioned behavior identifiers, rather than short user spellings, participate in config identity."
    oracle_independence: "The block evaluates the public default, enumerates each one-field mutation, hashes independent identity payloads, and tampers with an identifier directly."
    smallest_failing_change: "Accept a partial or callback value, hash a short spelling, omit one policy axis, change the default, or let a one-axis mutation retain the baseline hash."
    cheapest_adequate_lane: "Pure constructors and small hash payloads exercise the identity boundary without a snapshot or fold in the fast lane."
    overlapping_evidence: "LCL-0025 checks bar-basis identity and LCL-0026 checks fact identity; neither binds settlement policy identity."
