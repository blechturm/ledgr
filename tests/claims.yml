    smallest_failing_change: "Move indexing into the header loop or restore `rows$set_id == current_set` full-table scans."
    cheapest_adequate_lane: "Four rows and three headers; fast, because the counter proves the asymptotic shape without a timing threshold."
    overlapping_evidence: "The public scaling record establishes materiality and exponent; it cannot localize a future reintroduced scan."
  - id: "LCL-0148"
    source: "Cut 2 LDG-2943"
