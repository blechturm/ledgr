  - id: "LCL-0022"
    source: "Execution Contract; equity-settlement synthesis section 3.7"
    scope: "Canonical and compiled accounting reject every unhandled pulse event kind"
    oracle_class: "negative witness"
    detecting_blocks: ["LTB-0026"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A completed pulse plan must not lose an economic event when either accounting arm lacks a handler for its declared kind."
