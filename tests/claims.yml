    smallest_failing_change: "Remove either envelope guard, narrow one to CASHFLOW, or let either accounting arm read pulse_plan directly."
    cheapest_adequate_lane: "Two tiny in-memory folds per table row exercise both real dispatch boundaries in the fast lane."
    overlapping_evidence: "LCL-0006 proves compiled fill parity but contains no non-FILL event and cannot detect a silent canonical drop."
  - id: "LCL-0023"
    source: "Equity-settlement synthesis: sections 3.2 and 3.8"
    scope: "Corporate-action facts validate independently and remain runtime-inert"
    oracle_class: "invariant and negative witness"
    detecting_blocks: ["LTB-0027", "LTB-0029"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Vendor-neutral corporate-action evidence must retain only independently validated terms and declaring it alone must not activate availability requirements."
    oracle_independence: "The tests construct canonical rows directly and query activation without using an adapter or settlement policy."
    smallest_failing_change: "Accept one unvalidated term, copy a missing clock, weaken a provenance tier, or add the family to availability activation."
    cheapest_adequate_lane: "Constructor negatives and one tiny activation snapshot provide the cheapest continuous boundary check in the fast lane."
    overlapping_evidence: "LCL-0017 covers existing availability fact persistence, but does not know this fact family or its runtime exclusion."
  - id: "LCL-0024"
    source: "Equity-settlement synthesis: section 3.8, gate case 1"
    scope: "A vendor-neutral fictional adapter produces the canonical sealed facts"
    oracle_class: "cross-implementation parity"
    detecting_blocks: ["LTB-0030"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "The canonical fact contract must be usable without a Sharadar package symbol, source field, or conversion formula."
    oracle_independence: "The expected family is hand-constructed while the adapter translates differently named fictional columns and codes before both outputs are sealed."
    smallest_failing_change: "Reference a forbidden vendor token or mistranslate one fictional code, field, clock, term, validation flag, or provenance value."
    cheapest_adequate_lane: "Two two-row snapshots prove exact family and sealed-hash parity in one review block; repeated sealing makes it inappropriate for the bounded fast lane."
    overlapping_evidence: "LCL-0023 proves the canonical constructor and seal; it does not prove an independently shaped adapter can satisfy them."
  - id: "LCL-0025"
    source: "Equity-settlement synthesis: section 4"
    scope: "Declared bar price basis prevents distribution double counting before execution"
    oracle_class: "negative witness and identity assertion"
    detecting_blocks: ["LTB-0031"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Distribution-adjusted execution bars must never combine with ledgr settlement, while a split-adjusted declaration or its absence remains readable in experiment identity."
    oracle_independence: "The test constructs four sealed snapshots from the same bars, varies facts and the public declaration independently, and inspects construction outcomes without running a strategy."
    smallest_failing_change: "Admit distribution_adjusted, condition refusal on corporate-action facts, drop the declaration from experiment identity, or accept an unknown basis."
    cheapest_adequate_lane: "Four tiny two-instrument snapshots exercise the public seal and experiment-construction boundary in one review block; repeated sealing and construction cost about 2.85 seconds and do not belong in the bounded fast lane."
    overlapping_evidence: "LCL-0023 seals corporate-action facts and LCL-0024 proves adapter neutrality; neither declares the economic basis of the bars or detects double counting."
  - id: "LCL-0026"
    source: "Equity-settlement synthesis: sections 3.2 and 3.6"
    scope: "Corporate-action fact persistence, migration, and snapshot identity"
    oracle_class: "persistence mutation and identity relation"
    detecting_blocks: ["LTB-0028"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Validated corporate-action terms must persist, survive a schema-115 migration, and participate in rule-2 snapshot identity without moving rule-1 snapshots."
    oracle_independence: "The block reads and corrupts persisted DuckDB rows, compares independently sealed hashes, and migrates a constructed legacy store."
    smallest_failing_change: "Drop or mistranslate a stored field, omit the table from rule-2 hashing, move a rule-1 hash, or make the migration non-convergent."
    cheapest_adequate_lane: "One review block combines the table, hash, corruption, and migration witnesses; its repeated seals and migration cost about 3.8 seconds and do not belong in the fast lane."
    overlapping_evidence: "LCL-0018 covers rule-1 identity and LCL-0023 covers construction and activation; neither detects this table's persistence or migration failures."
  - id: "LCL-0027"
