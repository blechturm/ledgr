  - id: "LCL-0034"
    source: "LDG-2819 schema ceremony"
    scope: "Schema creation and validation prepare catalogue state once while the marker-pair gate and validator keep distinct refusal boundaries"
    oracle_class: "bounded-call integration and structural boundary witness"
    detecting_blocks: ["LTB-0039", "LTB-0040", "LTB-0041"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A current store must avoid repeated schema creation work; missing and old markers refuse without repair, while the validator still detects out-of-band catalogue damage under current markers."
    oracle_independence: "The blocks trace DBI calls, mutate the persisted version marker, drop a required table and inspect the create/open source boundary independently of the catalogue helpers."
    smallest_failing_change: "Restore a catalogue query inside a per-table loop, repair a missing or older marker, silently recreate a missing table under current markers, remove validation from a caller, or write the fingerprint before the schema version."
    cheapest_adequate_lane: "Two in-memory catalog traces, one tiny persisted migration and source inspection directly cover the regression without a run or sealed market-data fixture."
    overlapping_evidence: "Existing schema tests cover individual damage and migrations but neither bound catalogue calls nor prove that the reopen shortcut depends only on the exact stored version."
  - id: "LCL-0035"
    source: "Cut 6 Workstream 14, LDG-2821"
    scope: "Set-wise fact preparation preserves canonical identity, duplicate outcomes and constructor error precedence"
    oracle_class: "frozen identity and exact negative matrix"
    detecting_blocks: ["LTB-0042", "LTB-0043", "LTB-0044"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Removing per-row fact preparation must not move any v1 identity, change which duplicate survives, or reorder validation and identity failures."
    oracle_independence: "Literal af5bdc6 hashes and identities form the expected side; duplicate and invalid inputs are constructed independently of the new renderer, and call spies observe scale shape rather than output alone."
    smallest_failing_change: "Move one canonical byte, choose a later duplicate, restore a per-row slice or encoding, or move deduplication ahead of an existing constructor validator."
    cheapest_adequate_lane: "Five tiny registered families, two bounded row-count probes and five invalid constructors complete in the fast lane without a store."
    overlapping_evidence: "LCL-0026 protects the corporate-action fact contract but does not freeze every family hash, shared deduplication behavior or preparation complexity."
  - id: "LCL-0036"
    source: "Cut 6 Workstream 14, LDG-2822"
    scope: "Rule-4 identity remains byte-exact, insertion-order independent and derived from all current persisted fact tables"
    oracle_class: "frozen snapshot identity and public corruption mutations"
    detecting_blocks: ["LTB-0045", "LTB-0048", "LTB-0049"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Set-wise persisted rendering must retain the deliberately re-pinned rule-4 hashes and public run-start detection of every hashed-table mutation without making physical insertion order significant."
    oracle_independence: "Three rule-4 scale hashes and one quarantine-matrix hash are decision-authorized literals; direct SQL mutations leave the stored hash untouched, then clear the seal-established process proof before the public run; physical rows are independently deleted and reinserted in reverse order."
    smallest_failing_change: "Omit one table or identity field, trust the stored hash, change one rendered byte, or remove one persisted-table ordering key."
    cheapest_adequate_lane: "The frozen 100,000-row hash and eight public corruption runs require real stores and belong in review; one combined block per claim avoids duplicating setup."
    overlapping_evidence: "The rule-4 corpus protects exact encoder bytes, but does not enumerate mutations across every current fact table or the registered fact-population hashes."
  - id: "LCL-0037"
    source: "Cut 6 Workstream 14, LDG-2822"
    scope: "Rule-4 fact projection performs fixed column-and-table work rather than row-wise R preparation"
    oracle_class: "tenfold call-count scaling detector"
    detecting_blocks: ["LTB-0046"]
    promised_profile: "review"
    owner: "maintainer"
