    source: "Cut 12 LDG-2845"
    scope: "An incomplete walk-forward test run keeps its terminal evidence when prefix metrics fail"
    oracle_class: "real terminal evidence plus injected metric failure"
    detecting_blocks: ["LTB-0069"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Metric failure while scoring an already incomplete test run preserves INCOMPLETE status and its real completion evidence instead of manufacturing a successful or unrelated terminal result."
    oracle_independence: "A real ledgr_run produces the terminal evidence before only ledgr_compute_metrics is mocked to raise the classed prefix failure; literal status, class and unchanged completion JSON are asserted."
    smallest_failing_change: "Replace the propagated metric error class, overwrite INCOMPLETE status, or rebuild rather than preserve the terminal completion JSON."
    cheapest_adequate_lane: "The existing availability-aware run is the smallest public integration that has real incomplete terminal evidence; because it exercises a rare recovery path, it runs nightly and at release in review."
    overlapping_evidence: "Metric unit tests cover ordinary calculation failures but do not combine a real incomplete run with prefix scoring."
  - id: "LCL-0070"
    source: "Cut 12 LDG-2845"
    scope: "Walk-forward terminal cleanup closes completed test handles without masking the original error"
    oracle_class: "real close state plus injected close failure"
    detecting_blocks: ["LTB-0070"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "After a terminal interruption, every completed test handle is closed and a close failure cannot replace the original terminal condition."
    oracle_independence: "The mock delegates to the real close method before capturing its state and then raises a distinct probe error; the block separately asserts the original interrupt, exact handle count and real closed state."
    smallest_failing_change: "Remove the cleanup call so no closed state is captured, or remove its error suppression so the injected close failure masks the interrupt."
    cheapest_adequate_lane: "One completed fold followed by an injected interruption is the smallest public orchestration witness; its rare terminal path runs nightly and at release in review."
    overlapping_evidence: "Ordinary walk-forward completion closes handles but cannot show that cleanup runs after an error or that a cleanup failure is suppressed."
  - id: "LCL-0071"
    source: "Cut 12 LDG-2846"
    scope: "Scalar-loop warning emission changes no durable output or identity"
    oracle_class: "public durable-run differential"
    detecting_blocks: ["LTB-0071"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Emitting rather than suppressing the scalar-loop warning leaves fills, equity, configuration identity and strategy identity unchanged."
    oracle_independence: "Two scalar public runs differ only in condition handling and compare persisted hashes; an independently authored vector-plane strategy expresses the same targets and compares fills and equity without entering scalar accounting."
    smallest_failing_change: "Let condition handling change a config or strategy hash, or let scalar accounting alter a target, fill or equity row relative to the vector-plane control."
    cheapest_adequate_lane: "Three tiny durable runs are required to separate condition-handling identity from scalar-path semantic effects, but do not belong in per-edit feedback once warning behavior has its own fast detector."
    overlapping_evidence: "LCL-0066 catches warning and false-positive regressions but deliberately performs no second full-universe run solely for persisted identity parity."
  - id: "LCL-0072"
    source: "Cut 12 LDG-2849"
    scope: "Low-level state reconstruction rebuilds persisted derived artifacts"
    oracle_class: "literal derived-state and persisted-row witness"
    detecting_blocks: ["LTB-0072"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "The low-level recovery helper reconstructs positions, cash, PnL and one equity row per bar timestamp, and persists the rebuilt equity curve."
    oracle_independence: "Literal bars and an empty ledger determine two zero positions and three equity timestamps; a direct SQL count independently verifies the persisted rows."
    smallest_failing_change: "Skip reconstruction, omit one derived artifact, drop one timestamp, or return positions for only one instrument."
    cheapest_adequate_lane: "The block constructs a schema and exercises the low-level recovery boundary rather than ordinary run execution; nightly and release review preserve the guarantee without charging every edit for recovery integration."
    overlapping_evidence: "Ordinary public-result tests consume already materialized run outputs and do not rebuild deleted derived state from the ledger."
  - id: "LCL-0073"
    source: "Cut 10 LDG-2834"
    scope: "Strict expected-session feature identity survives every execution route"
    oracle_class: "public strategy observation against a literal expected-session matrix"
    detecting_blocks: ["LTB-0073"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Direct, sequential and parallel sweep, interrupted resume, and cold and warm cache execution preserve the strict-window contract, including closed dates, missing open-session observations, recovery and late starts; the user-facing calendar table matches that executable oracle."
    oracle_independence: "A literal two-instrument matrix is derived from the declared calendar and source bars, while a public strategy reports the values it actually receives at each pulse; stale valuation is inspected separately from the feature plane."
    smallest_failing_change: "Drop gap_contract during precompute or parameterized resolution, compress expected windows to observed rows, admit the closed date as a pulse, use a stale mark as a feature, fail to restore the contract on resume, or change one documented calendar row away from the literal oracle."
    cheapest_adequate_lane: "The six-session fixture is the smallest one containing all four semantic boundaries; the route matrix belongs in review because it opens durable runs and optional mirai workers."
    overlapping_evidence: "The earlier strict-feature block covered one direct concrete run and cache reuse but did not execute sweep, parameterized, parallel, resume, closed-date or late-start paths."
  - id: "LCL-0074"
    source: "Cut 10 LDG-2835"
    scope: "Public TTR SMA is certified by mathematical shape rather than source"
    oracle_class: "three-source expected-session differential plus exact certification matrix"
    detecting_blocks: ["LTB-0074"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Only single-output TTR SMA over close with one positive-integer n and matching requires_bars and stable_after joins built-in and custom finite-window SMA under the strict-window availability contract; the published support matrix is derived from those constructors."
    oracle_independence: "Built-in, public TTR and scalar custom SMA are compared with the literal calendar-derived matrix; a separate literal predicate table covers every excluded certification field and unsupported EMA and RSI fail before strategy execution."
    smallest_failing_change: "Remove the TTR SMA certification, certify another function, input, output, argument or warmup shape, certify a bundle, lose the contract in direct, sweep, parameterized, resume or cache execution, or let the published support matrix disagree with the executable constructors."
    cheapest_adequate_lane: "The LDG-2834 six-session fixture is reused without resealing per route; TTR construction plus durable and sweep routes belong in review rather than charging every edit."
    overlapping_evidence: "LCL-0073 proves route propagation with built-in SMA but cannot detect an over-broad external certification predicate or source-specific numerical divergence."
  - id: "LCL-0075"
    source: "Cut 10 LDG-2836"
    scope: "Published peer SMA rows use public adapters and isolated process clocks"
    oracle_class: "source-boundary guard plus order-reversal differential"
    detecting_blocks: ["LTB-0075"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Every TTR-labelled peer row uses ledgr_ind_ttr, while durable public TTR and built-in SMA execute in separate fresh processes whose R and package-library metadata agree."
    oracle_independence: "The block searches the harness source for the retired private wrapper, launches both durable rows in each order, and compares their public outputs and independently precomputed feature planes."
    smallest_failing_change: "Restore peer_sma_ttr, execute either durable row in the parent process, resolve different libraries, let launch order alter an output, or exceed the registered feature/equity tolerance."
    cheapest_adequate_lane: "Four tiny fresh-process runs are the minimum order-reversal witness; subprocess startup and repeated sealing place it in review rather than per-edit fast feedback."
    overlapping_evidence: "LCL-0074 certifies TTR SMA semantics inside package execution but does not constrain the peer harness boundary, process isolation or published comparison clocks."
