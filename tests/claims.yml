    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "On duckdb 1.5.6, which ledgr requires, a driver whose instance settings differ from those of a database already open in the session is refused, so while a user held their own connection to a store with different settings, every ledgr open of that store failed. ledgr now joins the open instance through DuckDB's registry, only when every refused setting is one of the storage directories ledgr sets, so the join never creates an instance and a read-only or other mismatch still fails. It returns no driver, because the registry's driver is the user's and shutting it down would unregister their database; ledgr can therefore join again. It does not suppress DuckDB's messages (Persistence Contract). The runs commit, read back, and are visible through the user's connection, which stays valid."
