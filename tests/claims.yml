    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A validated ordinary dividend must use the pre-boundary holding, respect posting and knowledge clocks, retain source and policy identity, and reject a duplicate source event."
    oracle_independence: "The block drives the plan with literal positions, clocks, expected metadata, and a separately constructed duplicate event stream."
    smallest_failing_change: "Bind at posting, use effective_time, post twice, ignore knowledge_time, admit a duplicate source fact, or change either policy identity."
    cheapest_adequate_lane: "Pure plan timing and event validation require no sealed snapshot and finish in the fast lane."
    overlapping_evidence: "LCL-0022 checks handler coverage and LCL-0029 checks zero-valued reporting; neither executes a dividend or distinguishes entitlement from posting."
  - id: "LCL-0031"
    source: "Equity-settlement synthesis: section 3.4, gate cases 3 and 11"
    scope: "Public run, resume and sweep paths preserve ex-date entitlement, compiled refusal, posting order and exact dividend evidence"
    oracle_class: "exact public integration witness"
