  - id: "LCL-0022"
    source: "Execution Contract; equity-settlement synthesis section 3.7"
    scope: "Canonical and compiled accounting reject every unhandled pulse event kind"
    oracle_class: "negative witness"
    detecting_blocks: ["LTB-0026"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A completed pulse plan must not lose an economic event when either accounting arm lacks a handler for its declared kind."
    oracle_independence: "The test injects three event kinds into the completed plan without using either production supported-kind predicate."
    smallest_failing_change: "Remove either envelope guard, narrow one to CASHFLOW, or let either accounting arm read pulse_plan directly."
    cheapest_adequate_lane: "Two tiny in-memory folds per table row exercise both real dispatch boundaries in the fast lane."
    overlapping_evidence: "LCL-0006 proves compiled fill parity but contains no non-FILL event and cannot detect a silent canonical drop."
  - id: "LCL-0023"
    source: "Equity-settlement synthesis: sections 3.2 and 3.8"
    scope: "Corporate-action facts validate independently and remain runtime-inert"
    oracle_class: "invariant and negative witness"
    detecting_blocks: ["LTB-0027", "LTB-0029"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Vendor-neutral corporate-action evidence must retain only independently validated terms and declaring it alone must not activate availability requirements."
    oracle_independence: "The tests construct canonical rows directly and query activation without using an adapter or settlement policy."
    smallest_failing_change: "Accept one unvalidated term, copy a missing clock, weaken a provenance tier, or add the family to availability activation."
    cheapest_adequate_lane: "Constructor negatives and one tiny activation snapshot provide the cheapest continuous boundary check in the fast lane."
    overlapping_evidence: "LCL-0017 covers existing availability fact persistence, but does not know this fact family or its runtime exclusion."
  - id: "LCL-0024"
    source: "Equity-settlement synthesis: section 3.8, gate case 1"
    scope: "A vendor-neutral fictional adapter produces the canonical sealed facts"
    oracle_class: "cross-implementation parity"
    detecting_blocks: ["LTB-0030"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "The canonical fact contract must be usable without a Sharadar package symbol, source field, or conversion formula."
    oracle_independence: "The expected family is hand-constructed while the adapter translates differently named fictional columns and codes before both outputs are sealed."
    smallest_failing_change: "Reference a forbidden vendor token or mistranslate one fictional code, field, clock, term, validation flag, or provenance value."
    cheapest_adequate_lane: "Two two-row snapshots prove exact family and sealed-hash parity in one review block; repeated sealing makes it inappropriate for the bounded fast lane."
    overlapping_evidence: "LCL-0023 proves the canonical constructor and seal; it does not prove an independently shaped adapter can satisfy them."
  - id: "LCL-0025"
    source: "Equity-settlement synthesis: section 4"
    scope: "Declared bar price basis prevents distribution double counting before execution"
    oracle_class: "negative witness and identity assertion"
    detecting_blocks: ["LTB-0031"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Distribution-adjusted execution bars must never combine with ledgr settlement, while a split-adjusted declaration or its absence remains readable in experiment identity."
    oracle_independence: "The test constructs four sealed snapshots from the same bars, varies facts and the public declaration independently, and inspects construction outcomes without running a strategy."
    smallest_failing_change: "Admit distribution_adjusted, condition refusal on corporate-action facts, drop the declaration from experiment identity, or accept an unknown basis."
    cheapest_adequate_lane: "Four tiny two-instrument snapshots exercise the public seal and experiment-construction boundary in one review block; repeated sealing and construction cost about 2.85 seconds and do not belong in the bounded fast lane."
    overlapping_evidence: "LCL-0023 seals corporate-action facts and LCL-0024 proves adapter neutrality; neither declares the economic basis of the bars or detects double counting."
  - id: "LCL-0026"
    source: "Equity-settlement synthesis: sections 3.2 and 3.6"
    scope: "Corporate-action fact persistence, migration, and snapshot identity"
    oracle_class: "persistence mutation and identity relation"
    detecting_blocks: ["LTB-0028"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Validated corporate-action terms must persist, survive a schema-115 migration, and participate in rule-2 snapshot identity without moving rule-1 snapshots."
    oracle_independence: "The block reads and corrupts persisted DuckDB rows, compares independently sealed hashes, and migrates a constructed legacy store."
    smallest_failing_change: "Drop or mistranslate a stored field, omit the table from rule-2 hashing, move a rule-1 hash, or make the migration non-convergent."
    cheapest_adequate_lane: "One review block combines the table, hash, corruption, and migration witnesses; its repeated seals and migration cost about 3.8 seconds and do not belong in the fast lane."
    overlapping_evidence: "LCL-0018 covers rule-1 identity and LCL-0023 covers construction and activation; neither detects this table's persistence or migration failures."
  - id: "LCL-0027"
    source: "Equity-settlement synthesis: section 3.3"
    scope: "Corporate-action policy choices are closed, versioned, and part of new experiment identity"
    oracle_class: "identity mutation and negative witness"
    detecting_blocks: ["LTB-0032"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "New experiments must resolve a closed policy whose versioned behavior identifiers, rather than short user spellings, participate in config identity."
    oracle_independence: "The block evaluates the public default, enumerates each one-field mutation, hashes independent identity payloads, and tampers with an identifier directly."
    smallest_failing_change: "Accept a partial or callback value, hash a short spelling, omit one policy axis, change the default, or let a one-axis mutation retain the baseline hash."
    cheapest_adequate_lane: "Pure constructors and small hash payloads exercise the identity boundary without a snapshot or fold in the fast lane."
    overlapping_evidence: "LCL-0025 checks bar-basis identity and LCL-0026 checks fact identity; neither binds settlement policy identity."
  - id: "LCL-0028"
    source: "Equity-settlement synthesis: section 3.3"
    scope: "Historical run configs remain absent-policy records when reopened"
    oracle_class: "legacy persistence witness"
    detecting_blocks: ["LTB-0033"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "A stored run created before corporate-action policy existed must not silently acquire today's default when reopened."
    oracle_independence: "The block removes the field from persisted config JSON, recomputes the historical hash, reopens through the public API, and rereads the stored bytes."
    smallest_failing_change: "Normalize a missing corporate_actions field to the research preset during config validation or run reopen."
    cheapest_adequate_lane: "One tiny real run and reopen is the smallest detector for persistence-time default injection; store creation keeps it in review."
    overlapping_evidence: "LCL-0027 proves new identity behavior but cannot observe historical stored config bytes or reopen semantics."
  - id: "LCL-0029"
    source: "Equity-settlement synthesis: section 3.5"
    scope: "Ordinary results distinguish absent corporate-action evidence from supplied but unused facts"
    oracle_class: "exact public-output witness"
    detecting_blocks: ["LTB-0034"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "The ordinary result must not reassure a bars-only user, and its detailed summary must expose exact policy identity and zero-valued settlement evidence."
    oracle_independence: "The block builds separate bars-only and fact-bearing runs, then compares the derived object and captured public output with literal expected values."
    smallest_failing_change: "Collapse not_supplied into none, admit a fifth fidelity value, hide the undeclared basis, change one identity, omit one field, or render a zero as unavailable."
    cheapest_adequate_lane: "Two tiny durable runs are required to prove the public result boundary; repeated snapshot and run setup belongs in review."
    overlapping_evidence: "LCL-0027 binds policy identity and LCL-0023 binds fact activation, but neither observes ordinary run output or fidelity."
  - id: "LCL-0030"
    source: "Equity-settlement synthesis: section 3.4, gate cases 2, 3, 11, and 12"
    scope: "The cash plan binds entitlement once and emits exactly one identified event under the selected clock"
    oracle_class: "exact unit oracle and temporal negative"
    detecting_blocks: ["LTB-0035"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A validated ordinary dividend must use the pre-boundary holding, respect posting and knowledge clocks, retain source and policy identity, and reject a duplicate source event."
    oracle_independence: "The block drives the plan with literal positions, clocks, expected metadata, and a separately constructed duplicate event stream."
    smallest_failing_change: "Bind at posting, use effective_time, post twice, ignore knowledge_time, admit a duplicate source fact, or change either policy identity."
    cheapest_adequate_lane: "Pure plan timing and event validation require no sealed snapshot and finish in the fast lane."
    overlapping_evidence: "LCL-0022 checks handler coverage and LCL-0029 checks zero-valued reporting; neither executes a dividend or distinguishes entitlement from posting."
  - id: "LCL-0031"
    source: "Equity-settlement synthesis: section 3.4, gate cases 3 and 11"
    scope: "Public run, resume and sweep paths preserve ex-date entitlement, compiled refusal, posting order and exact dividend evidence"
    oracle_class: "exact public integration witness"
    detecting_blocks: ["LTB-0036"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "A dividend-only snapshot must execute without availability setup, bind entitlement before ex-date fills on direct and resumed runs, refuse the compiled arm, persist one CASHFLOW, expose cash before strategy context, and derive exact modeled totals from the ledger."
    oracle_independence: "Literal seller and buyer strategies create real ex-date fills; a persisted interrupted run reconstructs the boundary independently; the strategy records cash while the test separately reads fills, ledger rows and the public summary."
    smallest_failing_change: "Bind after ex-date fills, include equal-time ordinary fills on resume, remove compiled CASHFLOW refusal, post after valuation or strategy, duplicate the event, or report a wrong exact amount or count."
    cheapest_adequate_lane: "Tiny direct seller and buyer runs, one interrupted durable run, and one compiled sweep are the minimum public-path detectors; repeated snapshot and run setup belongs in review."
    overlapping_evidence: "LCL-0030 proves plan semantics without the public run boundary; LCL-0029 proves only zero-valued output."
  - id: "LCL-0032"
    source: "Equity-settlement synthesis: section 3.8 quick path"
    scope: "The cash-distribution vignette executes research settlement and strict refusal"
    oracle_class: "rendered public-example contract"
    detecting_blocks: ["LTB-0037"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "The quick path must use both public presets in real executable chunks and show modeled gross cash plus strict refusal in its checked-in rendering."
    oracle_independence: "The detector compares source calls and literal rendered results; the rendering itself was produced by executing the public snapshot, experiment, and run workflow."
    smallest_failing_change: "Make a chunk non-executing, replace either preset, change the research default, stop posting cash, stop refusing strict mode, or leave the rendering stale."
    cheapest_adequate_lane: "Reading two small text artifacts is sufficient continuously because the public execution is recorded in the rendered sibling and independently covered by LTB-0036."
    overlapping_evidence: "LCL-0031 executes the same economic path but does not protect the public explanation, explicit timing limitation, or strict-mode example."
  - id: "LCL-0033"
    source: "LDG-2812 focused close-review correction"
    scope: "Yahoo snapshot construction declares split-adjusted bars by default while retaining an explicit undeclared override"
    oracle_class: "mocked adapter-boundary witness"
    detecting_blocks: ["LTB-0038"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "The Yahoo quick path must not silently discard the known split-adjusted basis and thereby disable distribution double-counting detection."
    oracle_independence: "The block replaces quantmod::getSymbols with a known xts object, then inspects the independently sealed snapshot metadata under both the omitted and explicit-NULL arguments."
    smallest_failing_change: "Restore a NULL default, fail to forward the resolved default, or ignore an explicit NULL override."
    cheapest_adequate_lane: "Two five-row network-free seals are the smallest public adapter-boundary detector; optional quantmod and DuckDB setup place it in review."
    overlapping_evidence: "LCL-0025 validates an explicit price-basis declaration and LCL-0032 exercises corporate-action presets; neither binds Yahoo's default or its override."
  - id: "LCL-0034"
    source: "LDG-2819 schema ceremony"
    scope: "Schema creation and validation prepare catalogue state once without weakening migration or damage detection"
    oracle_class: "bounded-call integration and structural boundary witness"
    detecting_blocks: ["LTB-0039", "LTB-0040", "LTB-0041"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A current store must avoid repeated schema creation work, while validation still detects out-of-band damage and old or unmarked stores still migrate instead of taking the shortcut."
    oracle_independence: "The blocks trace DBI calls at the public schema functions, mutate the persisted version marker and both migration-owned and create-owned required tables, and inspect the source boundary independently of the catalogue helpers."
    smallest_failing_change: "Restore a catalogue query inside a per-table loop, execute DDL for a current marker, weaken the exact-version predicate, skip an older marker, silently recreate a create-owned table under a current marker, remove validation from a caller, or move the marker write before the migration failure point."
    cheapest_adequate_lane: "Two in-memory catalog traces, one tiny persisted migration and source inspection directly cover the regression without a run or sealed market-data fixture."
    overlapping_evidence: "Existing schema tests cover individual damage and migrations but neither bound catalogue calls nor prove that the reopen shortcut depends only on the exact stored version."
