    oracle_independence: "Namespace spies count the old row-payload seam and the canonical and timestamp helpers over two independently sealed populations differing tenfold."
    smallest_failing_change: "Restore a per-row slice, timestamp conversion or JSON encoding inside rule-2 payload construction."
    cheapest_adequate_lane: "Twenty and two hundred facts expose row-proportional calls without putting a scale benchmark into the ordinary suite."
    overlapping_evidence: "LCL-0035 covers in-memory family preparation; it never reads persisted DuckDB tables or executes snapshot hash rule 2."
  - id: "LCL-0038"
    source: "Cut 6 Workstream 14, LDG-2822"
