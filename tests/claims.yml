    oracle_independence: "Literal seller and buyer strategies create real ex-date fills; a persisted interrupted run reconstructs the boundary independently; the strategy records cash while the test separately reads fills, ledger rows and the public summary."
    smallest_failing_change: "Bind after ex-date fills, include equal-time ordinary fills on resume, remove compiled CASHFLOW refusal, post after valuation or strategy, duplicate the event, or report a wrong exact amount or count."
    cheapest_adequate_lane: "Tiny direct seller and buyer runs, one interrupted durable run, and one compiled sweep are the minimum public-path detectors; repeated snapshot and run setup belongs in review."
