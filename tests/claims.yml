    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "A dividend-only snapshot must execute without availability setup, bind entitlement before ex-date fills on direct and resumed runs, refuse the compiled arm, persist one CASHFLOW, expose cash before strategy context, and derive exact modeled totals from the ledger."
    oracle_independence: "Literal seller and buyer strategies create real ex-date fills; a persisted interrupted run reconstructs the boundary independently; the strategy records cash while the test separately reads fills, ledger rows and the public summary."
    smallest_failing_change: "Bind after ex-date fills, include equal-time ordinary fills on resume, remove compiled CASHFLOW refusal, post after valuation or strategy, duplicate the event, or report a wrong exact amount or count."
    cheapest_adequate_lane: "Tiny direct seller and buyer runs, one interrupted durable run, and one compiled sweep are the minimum public-path detectors; repeated snapshot and run setup belongs in review."
    overlapping_evidence: "LCL-0030 proves plan semantics without the public run boundary; LCL-0029 proves only zero-valued output."
  - id: "LCL-0032"
    source: "Equity-settlement synthesis: section 3.8 quick path"
    scope: "The cash-distribution vignette executes research settlement and strict refusal"
    oracle_class: "rendered public-example contract"
    detecting_blocks: ["LTB-0037"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "The quick path must use both public presets in real executable chunks and show modeled gross cash plus strict refusal in its checked-in rendering."
    oracle_independence: "The detector compares source calls and literal rendered results; the rendering itself was produced by executing the public snapshot, experiment, and run workflow."
    smallest_failing_change: "Make a chunk non-executing, replace either preset, change the research default, stop posting cash, stop refusing strict mode, or leave the rendering stale."
    cheapest_adequate_lane: "Reading two small text artifacts is sufficient continuously because the public execution is recorded in the rendered sibling and independently covered by LTB-0036."
    overlapping_evidence: "LCL-0031 executes the same economic path but does not protect the public explanation, explicit timing limitation, or strict-mode example."
  - id: "LCL-0033"
    source: "LDG-2812 focused close-review correction"
    scope: "Yahoo snapshot construction declares split-adjusted bars by default while retaining an explicit undeclared override"
    oracle_class: "mocked adapter-boundary witness"
    detecting_blocks: ["LTB-0038"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "The Yahoo quick path must not silently discard the known split-adjusted basis and thereby disable distribution double-counting detection."
    oracle_independence: "The block replaces quantmod::getSymbols with a known xts object, then inspects the independently sealed snapshot metadata under both the omitted and explicit-NULL arguments."
    smallest_failing_change: "Restore a NULL default, fail to forward the resolved default, or ignore an explicit NULL override."
    cheapest_adequate_lane: "Two five-row network-free seals are the smallest public adapter-boundary detector; optional quantmod and DuckDB setup place it in review."
    overlapping_evidence: "LCL-0025 validates an explicit price-basis declaration and LCL-0032 exercises corporate-action presets; neither binds Yahoo's default or its override."
  - id: "LCL-0034"
    source: "LDG-2819 schema ceremony"
    scope: "Schema creation and validation prepare catalogue state once without weakening migration or damage detection"
    oracle_class: "bounded-call integration and structural boundary witness"
    detecting_blocks: ["LTB-0039", "LTB-0040", "LTB-0041"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A current store must avoid repeated schema creation work, while validation still detects out-of-band damage and old or unmarked stores still migrate instead of taking the shortcut."
    oracle_independence: "The blocks trace DBI calls at the public schema functions, mutate the persisted version marker and both migration-owned and create-owned required tables, and inspect the source boundary independently of the catalogue helpers."
    smallest_failing_change: "Restore a catalogue query inside a per-table loop, execute DDL for a current marker, weaken the exact-version predicate, skip an older marker, silently recreate a create-owned table under a current marker, remove validation from a caller, or move the marker write before the migration failure point."
    cheapest_adequate_lane: "Two in-memory catalog traces, one tiny persisted migration and source inspection directly cover the regression without a run or sealed market-data fixture."
    overlapping_evidence: "Existing schema tests cover individual damage and migrations but neither bound catalogue calls nor prove that the reopen shortcut depends only on the exact stored version."
  - id: "LCL-0035"
    source: "Cut 6 Workstream 14, LDG-2821"
    scope: "Set-wise fact preparation preserves canonical identity, duplicate outcomes and constructor error precedence"
    oracle_class: "frozen identity and exact negative matrix"
    detecting_blocks: ["LTB-0042", "LTB-0043", "LTB-0044"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "Removing per-row fact preparation must not move any v1 identity, change which duplicate survives, or reorder validation and identity failures."
    oracle_independence: "Literal af5bdc6 hashes and identities form the expected side; duplicate and invalid inputs are constructed independently of the new renderer, and call spies observe scale shape rather than output alone."
    smallest_failing_change: "Move one canonical byte, choose a later duplicate, restore a per-row slice or encoding, or move deduplication ahead of an existing constructor validator."
    cheapest_adequate_lane: "Five tiny registered families, two bounded row-count probes and five invalid constructors complete in the fast lane without a store."
    overlapping_evidence: "LCL-0026 protects the corporate-action fact contract but does not freeze every family hash, shared deduplication behavior or preparation complexity."
  - id: "LCL-0036"
    source: "Cut 6 Workstream 14, LDG-2822"
    scope: "Rule-2 identity remains byte-exact, insertion-order independent and derived from all eight persisted fact tables"
    oracle_class: "frozen snapshot identity and public corruption mutations"
    detecting_blocks: ["LTB-0045", "LTB-0048", "LTB-0049"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Set-wise persisted rendering must retain old rule-2 hashes and public run-start detection of every hashed-table mutation without making physical insertion order significant."
    oracle_independence: "Three af5bdc6 scale hashes and one quarantine-matrix hash are literals; eight direct SQL mutations leave the stored hash untouched; physical rows are independently deleted and reinserted in reverse order."
    smallest_failing_change: "Omit one table or identity field, trust the stored hash, change one rendered byte, or remove one persisted-table ordering key."
    cheapest_adequate_lane: "The frozen 100,000-row hash and eight public corruption runs require real stores and belong in review; one combined block per claim avoids duplicating setup."
    overlapping_evidence: "Snapshot hash suites protect bars and selected historical rule-2 cases, but none enumerates all eight current tables or the registered fact-population hashes."
  - id: "LCL-0037"
    source: "Cut 6 Workstream 14, LDG-2822"
    scope: "Rule-2 rendering performs fixed column-and-table work rather than row-wise R preparation"
    oracle_class: "tenfold call-count scaling detector"
    detecting_blocks: ["LTB-0046"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "The corruption guard stays linear in data transfer while R-side timestamp conversion and JSON rendering remain fixed by table shape, not fact rows."
    oracle_independence: "Namespace spies count the old row-payload seam and the canonical and timestamp helpers over two independently sealed populations differing tenfold."
    smallest_failing_change: "Restore a per-row slice, timestamp conversion or JSON encoding inside rule-2 payload construction."
    cheapest_adequate_lane: "Twenty and two hundred facts expose row-proportional calls without putting a scale benchmark into the ordinary suite."
    overlapping_evidence: "LCL-0035 covers in-memory family preparation; it never reads persisted DuckDB tables or executes snapshot hash rule 2."
  - id: "LCL-0038"
    source: "Cut 6 Workstream 14, LDG-2822"
    scope: "The full snapshot adapter validates one fact bundle while standalone ingest and persistence boundaries still fail closed"
    oracle_class: "exact call count and independently corrupted input"
    detecting_blocks: ["LTB-0047"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "A public seal must not recompute the same row-wise bundle assertion three times, and private boundary reuse must not let unvalidated bundles cross standalone entry points."
    oracle_independence: "A namespace spy counts the complete public path; a separately corrupted bundle is passed directly to ingest and to a CREATED snapshot persistence boundary."
    smallest_failing_change: "Pass the raw bundle from the adapter to either helper, or make either helper unwrap without validating an ordinary facts object."
    cheapest_adequate_lane: "One small quarantine seal and one CREATED store exercise all three boundaries; real DuckDB state places it in review."
    overlapping_evidence: "LCL-0037 bounds rule-2 rendering calls but cannot detect repeated bundle assertions before persistence."
  - id: "LCL-0039"
    source: "Equity-settlement synthesis section 3.4; LDG-2814"
    scope: "DISPOSITION is a first-class canonical-R accounting event with lossless schema migration and exact FIFO lot consumption"
    oracle_class: "literal accounting replay and destructive schema-migration witness"
    detecting_blocks: ["LTB-0050"]
    promised_profile: "fast"
    owner: "maintainer"
    protected_contract_or_defect: "A modeled terminal disposition must move cash, remove the position and every live lot, realize model P&L through canonical FIFO, reject subtype leakage, and preserve existing ledger rows while admitting only the new event kind."
    oracle_independence: "Literal opening lots and expected cash, position and realized values are checked through both the fold-facing plan and the independent accounting replay; an old two-kind DuckDB table is constructed directly before migration."
    smallest_failing_change: "Treat DISPOSITION as cash-only, leave one live lot, compute realization outside FIFO, admit a subtype field, omit DISPOSITION from the CHECK, or recreate the table without copying its old row."
    cheapest_adequate_lane: "One in-memory plan/replay and one in-memory DuckDB migration exercise the complete core contract without a sealed snapshot or public run."
    overlapping_evidence: "LCL-0023 protects accounting-core parity for FILL and CASHFLOW; it neither admits DISPOSITION nor proves exact lot exhaustion or the schema migration."
  - id: "LCL-0040"
    source: "Equity-settlement synthesis sections 3.3 and 3.4; gate cases 4 and 6"
    scope: "Terminal mark policy distinguishes bounded permissible marks, explicit expired marks and intentional no-mark refusal"
    oracle_class: "policy-bound state-transition and no-mutation witness"
    detecting_blocks: ["LTB-0051"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "last_mark may use an expired finite reference only by explicit opt-in and must record its age, while the research preset must refuse a missing qualifying mark before appending an event or mutating account state."
    oracle_independence: "The block supplies literal valuation planes separately from the plan, snapshots the complete account state before refusal, and observes emitted rows independently through a handler spy."
    smallest_failing_change: "Use the permissible mark for last_mark, hide the source age, fabricate a missing price, append before validation, or mutate cash, positions or lots before the refusal."
    cheapest_adequate_lane: "Direct plan execution isolates the policy boundary and avoids a full availability run; the broader public-path case belongs to the fourteen-case gate."
    overlapping_evidence: "LCL-0039 proves the accounting operation after a mark is chosen; it does not choose among current, stale, expired and unavailable marks."
  - id: "LCL-0041"
    source: "Equity-settlement synthesis sections 3.4 and 3.5; LDG-2815"
    scope: "Acquisition composition reports the contractual comparison without crediting a supplied leg beside modeled disposition proceeds"
    oracle_class: "four-row public-path arithmetic witness"
    detecting_blocks: ["LTB-0052"]
    promised_profile: "review"
    owner: "maintainer"
    protected_contract_or_defect: "Cash, stock and mixed acquisitions and a surviving-parent spin-off must produce their distinct event counts, final cash, fidelity and four signed effective-date quantities without exposing those estimates to the strategy."
    oracle_independence: "Literal parent quantities, cash terms, recipient ratios and parent and recipient marks independently calculate every expected amount; final cash and event counts are read from persisted run tables rather than from the report helper."
    smallest_failing_change: "Credit a supplied cash leg beside disposition proceeds, omit either mixed-consideration leg, reverse the difference sign, mutate the spin-off account, classify a security leg as modeled, or place a retrospective field in the strategy context."
    cheapest_adequate_lane: "Four three-pulse public runs are the smallest evidence that joins accounting, persisted events, ordinary results and context isolation; their snapshot work belongs in review."
    overlapping_evidence: "LCL-0040 proves mark selection and no-mark refusal for disposition but does not cover transaction composition or unsupported quantity reporting."
  - id: "LCL-0042"
    source: "Equity-settlement synthesis sections 3.4 and 3.5; gate case 8"
    scope: "Unsupported quantity policy refuses before mutation or records a report-only effect under one source-fact identity"
