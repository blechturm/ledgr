name: R-CMD-check

on:
  push:
  pull_request:
  schedule:
    # Nightly full matrix, so drift on the platforms we cannot run locally
    # surfaces within a day instead of at release.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run"
        type: choice
        options: [full, quick]
        default: full

# Supersede an in-flight run when the same branch is pushed again. Never cancel
# main or a release tag: those runs are the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Decides, in one readable place, whether this event needs a run at all and
  # which tier it gets. Tiering is by what only CI can prove: a branch push
  # gets the ubuntu fast lane and R CMD check, while windows, the isolated
  # CRAN library and coverage wait for main, a release tag, a pull request or
  # the nightly schedule.
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.tier.outputs.run }}
      tier: ${{ steps.tier.outputs.tier }}
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide tier
        id: tier
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DISPATCH_TIER: ${{ github.event.inputs.tier }}
        run: |
          set -euo pipefail
          tier=quick
          run=true

          case "$EVENT" in
            schedule|pull_request) tier=full ;;
            workflow_dispatch)     tier="${DISPATCH_TIER:-full}" ;;
            push)
              if [ "$REF" = "refs/heads/main" ] || [ "${REF#refs/tags/v}" != "$REF" ]; then
                tier=full
              fi
              ;;
          esac

          # A branch push that touches only design records or the generated
          # site needs no run. main, tags and every non-push event are never
          # skipped, so the release path cannot be filtered away.
          if [ "$EVENT" = "push" ] && [ "$tier" = "quick" ]; then
            range=""
            if [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              range="${BEFORE}..${SHA}"
            elif git rev-parse -q --verify "${SHA}^" >/dev/null; then
              range="${SHA}^..${SHA}"
            fi
            if [ -n "$range" ]; then
              changed="$(git diff --name-only "$range")"
              if [ -n "$changed" ] \
                 && ! printf '%s\n' "$changed" | grep -qvE '^(inst/design/|docs/)'; then
                run=false
              fi
            fi
          fi

          if [ "$tier" = "full" ]; then
            matrix='[{"os":"ubuntu-latest","coverage":true,"cran":true},{"os":"windows-latest","coverage":false,"cran":true}]'
          else
            matrix='[{"os":"ubuntu-latest","coverage":false,"cran":false}]'
          fi

          {
            echo "run=$run"
            echo "tier=$tier"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "event $EVENT, ref $REF, tier $tier, run $run" >> "$GITHUB_STEP_SUMMARY"

  R-CMD-check:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      LEDGR_COVERAGE_THRESHOLD: "80"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::covr
            any::pkgload
            any::knitr
            any::quarto
            any::rmarkdown
            any::DT
            any::htmltools
          needs: check

      - name: Run README cold-start check
        run: |
          Rscript --vanilla tools/check-readme-example.R

      - name: Run v0.1.x acceptance tests first
        run: |
          Rscript -e "pkgload::load_all('.', quiet = TRUE); testthat::test_local('.', filter = 'acceptance-v0.1', reporter = 'summary', load_package = 'none')"

      - name: Run ordinary fast profile
        id: ordinary_fast_1
        run: |
          Rscript --vanilla tools/run-test-profile.R --profile=fast --mode=ordinary --records=test-profile-artifacts/ordinary --run-index=1

      - name: Confirm ordinary fast profile (run 2)
        if: steps.ordinary_fast_1.outputs.exceeded == 'true'
        run: |
          Rscript --vanilla tools/run-test-profile.R --profile=fast --mode=ordinary --records=test-profile-artifacts/ordinary --run-index=2

      - name: Confirm ordinary fast profile (run 3)
        if: steps.ordinary_fast_1.outputs.exceeded == 'true'
        run: |
          Rscript --vanilla tools/run-test-profile.R --profile=fast --mode=ordinary --records=test-profile-artifacts/ordinary --run-index=3

      - name: Check ordinary fast-profile gate
        run: |
          Rscript --vanilla tools/check-test-gate.R --profile=fast --mode=ordinary --records=test-profile-artifacts/ordinary

      - name: Prepare isolated CRAN library
        if: matrix.config.cran
        run: |
          Rscript --vanilla tools/prepare-cran-test-library.R --library=.ledgr-cran-test-library

      - name: Run isolated CRAN fast profile
        id: cran_fast_1
        if: matrix.config.cran
        run: |
          Rscript --vanilla tools/run-test-profile.R --profile=fast --mode=cran --library=.ledgr-cran-test-library --records=test-profile-artifacts/cran --run-index=1

      - name: Confirm isolated CRAN fast profile (run 2)
        if: matrix.config.cran && steps.cran_fast_1.outputs.exceeded == 'true'
        run: |
          Rscript --vanilla tools/run-test-profile.R --profile=fast --mode=cran --library=.ledgr-cran-test-library --records=test-profile-artifacts/cran --run-index=2

      - name: Confirm isolated CRAN fast profile (run 3)
        if: matrix.config.cran && steps.cran_fast_1.outputs.exceeded == 'true'
        run: |
          Rscript --vanilla tools/run-test-profile.R --profile=fast --mode=cran --library=.ledgr-cran-test-library --records=test-profile-artifacts/cran --run-index=3

      - name: Check isolated CRAN-profile gate
        if: matrix.config.cran
        run: |
          Rscript --vanilla tools/check-test-gate.R --profile=fast --mode=cran --records=test-profile-artifacts/cran

      - name: Run nightly and release review profile
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule'
        run: |
          Rscript --vanilla tools/run-test-profile.R --profile=review --mode=ordinary --reporter=summary --census=test-profile-artifacts/review/census.csv --summary=test-profile-artifacts/review/summary.csv

      - name: Require fast and review evidence at release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Rscript --vanilla tools/check-release-test-profiles.R --fast-summary=test-profile-artifacts/ordinary/run-1-summary.csv --review-summary=test-profile-artifacts/review/summary.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-profile-evidence-${{ runner.os }}
          path: test-profile-artifacts

      - name: Run R CMD check
        run: |
          Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--no-build-vignettes'), error_on = 'warning', check_dir = 'check')"

      - name: Run coverage threshold
        if: matrix.config.coverage
        run: |
          rm -f coverage.html
          Rscript tools/check-coverage.R

      - uses: actions/upload-artifact@v4
        if: matrix.config.coverage
        with:
          name: coverage-report
          path: coverage.html
